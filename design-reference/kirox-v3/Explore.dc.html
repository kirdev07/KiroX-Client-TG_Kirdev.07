<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Найти каналы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
input::placeholder{color:#8A958F}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kxDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,6px)}}
@keyframes kxPop{0%{transform:scale(.7)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <div style="flex: 1; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; gap: 8px; padding: 0 14px">
      <span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">search</span>
      <input aria-label="Поиск каналов" placeholder="Каналы и группы" value="{{q}}" onInput="{{onQ}}" style="flex: 1; font-size: 15px">
    </div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 0 30px">
    <!-- Featured -->
    <sc-if value="{{noQuery}}" hint-placeholder-val="{{true}}">
      <div style="margin: 4px 16px 0; position: relative; height: 150px; border-radius: 26px; overflow: hidden; background: linear-gradient(140deg, #23523B, #0F2A1E)">
        <div aria-hidden="true" style="position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(143,211,172,.35), transparent 65%); animation: kxDrift 8s ease-in-out 2"></div>
        <div style="position: absolute; left: 18px; top: 18px; right: 18px">
          <div style="display: inline-flex; height: 24px; padding: 0 10px; border-radius: 12px; background: rgba(0,0,0,.25); font-size: 11px; font-weight: 800; color: #8FD3AC; align-items: center; gap: 4px"><span class="ms fill" style="font-size: 14px" aria-hidden="true">auto_awesome</span>Похожие на ваши каналы</div>
          <div style="margin-top: 10px; font-size: 20px; font-weight: 800">Наука простыми словами</div>
          <div style="margin-top: 4px; font-size: 13px; color: #C9E6D4">Каждый день одно удивительное открытие</div>
        </div>
        <button onClick="{{joinFeat}}" style="position: absolute; left: 18px; bottom: 16px; height: 34px; padding: 0 14px; border-radius: 17px; background: {{featBg}}; color: {{featInk}}; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 4px; transition: all .2s"><span class="ms" style="font-size: 17px" aria-hidden="true">{{featIcon}}</span>{{featText}}</button>
        <span style="position: absolute; right: 18px; bottom: 22px; font-size: 12px; color: #C9E6D4">84 тыс. подписчиков</span>
      </div>
    </sc-if>

    <!-- Categories -->
    <div class="scroll" style="padding: 14px 16px 6px; display: flex; gap: 6px; overflow-x: auto">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="7"><button onClick="{{c.tap}}" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; background: {{c.bg}}; color: {{c.ink}}; border: 1px solid {{c.border}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px; transition: all .2s"><span class="ms" style="font-size: 17px" aria-hidden="true">{{c.icon}}</span>{{c.label}}</button></sc-for>
    </div>

    <div style="padding: 10px 20px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">{{listTitle}}</div>
    <div style="padding: 0 10px">
      <sc-for list="{{chans}}" as="c" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 12px; padding: 9px 8px; animation: kxIn .3s ease {{c.d}} both">
          <span style="position: relative; flex-shrink: 0"><span style="width: 52px; height: 52px; border-radius: 17px; background: {{c.av}}; color: #fff; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 26px" aria-hidden="true">{{c.icon}}</span></span><sc-if value="{{c.isGroup}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: -3px; bottom: -3px; width: 20px; height: 20px; border-radius: 10px; background: #1E2622; border: 2px solid #0A0C0B; color: #C9D2CC; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 12px" aria-hidden="true">group</span></span></sc-if></span>
          <span style="flex: 1; min-width: 0">
            <span style="display: flex; align-items: center; gap: 4px"><span style="font-size: 15px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{c.name}}</span><sc-if value="{{c.verified}}" hint-placeholder-val="{{false}}"><span class="ms fill" style="font-size: 15px; color: #8FD3AC" aria-hidden="true">verified</span></sc-if></span>
            <span style="display: block; margin-top: 2px; font-size: 12px; color: #8A958F; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{c.desc}}</span>
            <span style="display: block; margin-top: 2px; font-size: 11px; color: #8A958F">{{c.subs}}</span>
          </span>
          <button onClick="{{c.toggle}}" style="height: 34px; padding: 0 12px; border-radius: 17px; background: {{c.btnBg}}; color: {{c.btnInk}}; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 4px; flex-shrink: 0; transition: all .2s; animation: {{c.btnAnim}}"><sc-if value="{{c.joined}}" hint-placeholder-val="{{false}}"><span class="ms" style="font-size: 15px" aria-hidden="true">check</span></sc-if>{{c.btn}}</button>
        </div>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div style="padding: 40px 0; text-align: center; font-size: 14px; color: #8A958F">Ничего не нашлось</div></sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CATS = [['all', 'apps', 'Все'], ['tech', 'devices', 'Технологии'], ['news', 'newspaper', 'Новости'], ['edu', 'school', 'Учёба'], ['fun', 'mood', 'Юмор'], ['food', 'restaurant', 'Еда'], ['travel', 'flight', 'Путешествия']];
const CH = [
  { name: 'Android изнутри', cat: 'tech', icon: 'android', av: 'linear-gradient(140deg,#3F9A6C,#1F4D36)', desc: 'Разбираем новинки и баги системы', subs: 120400, v: true },
  { name: 'Kotlin-клуб', cat: 'tech', icon: 'code', av: 'linear-gradient(140deg,#6A4C9C,#2A2240)', desc: 'Группа для вопросов и код-ревью', subs: 18200, g: true },
  { name: 'Главное за день', cat: 'news', icon: 'newspaper', av: 'linear-gradient(140deg,#2F6E9E,#14243A)', desc: 'Пять новостей каждое утро', subs: 540000, v: true },
  { name: 'Английский за 5 минут', cat: 'edu', icon: 'translate', av: 'linear-gradient(140deg,#B07A2E,#3A2A14)', desc: 'Одна фраза и пример в день', subs: 76100 },
  { name: 'Мемы про код', cat: 'fun', icon: 'sentiment_very_satisfied', av: 'linear-gradient(140deg,#A8456A,#2E1420)', desc: 'Когда тесты прошли с первого раза', subs: 230000 },
  { name: 'Быстрые рецепты', cat: 'food', icon: 'skillet', av: 'linear-gradient(140deg,#C98A3A,#6E4214)', desc: 'Ужин за 20 минут', subs: 98300 },
  { name: 'Куда поехать', cat: 'travel', icon: 'travel_explore', av: 'linear-gradient(140deg,#2E8A86,#143A38)', desc: 'Недорогие маршруты и лайфхаки', subs: 64500 },
  { name: 'Физика для всех', cat: 'edu', icon: 'science', av: 'linear-gradient(140deg,#3A6E7A,#14303A)', desc: 'Сложное — понятным языком', subs: 41200 }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { cat: 'all', q: '', joined: [], feat: false, popAt: 0, popI: -1 }; }
renderVals() {
  const s = this.state;
  const q = s.q.trim().toLowerCase();
  const fmt = n => n >= 1000000 ? (n / 1000000).toFixed(1).replace('.0', '') + ' млн' : n >= 1000 ? Math.round(n / 1000) + ' тыс.' : String(n);
  const list = CH.map((c, i) => ({ c, i })).filter(({ c }) => (s.cat === 'all' || c.cat === s.cat) && (!q || (c.name + ' ' + c.desc).toLowerCase().includes(q)));
  const catName = CATS.find(c => c[0] === s.cat)[2];
  return {
    q: s.q, onQ: e => this.setState({ q: e.target.value }), noQuery: !q,
    featBg: s.feat ? 'rgba(0,0,0,.25)' : '#8FD3AC', featInk: s.feat ? '#8FD3AC' : '#06150D', featIcon: s.feat ? 'check' : 'add', featText: s.feat ? 'Вы подписаны' : 'Подписаться',
    joinFeat: () => this.setState({ feat: !s.feat }),
    cats: CATS.map(([id, icon, label]) => ({ icon, label, bg: s.cat === id ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.05)', ink: s.cat === id ? '#8FD3AC' : '#EEF3EF', border: s.cat === id ? 'rgba(143,211,172,.45)' : 'transparent', tap: () => this.setState({ cat: id }) })),
    listTitle: q ? 'Результаты поиска' : s.cat === 'all' ? 'Популярное' : catName,
    chans: list.map(({ c, i }, k) => {
      const joined = s.joined.includes(i);
      return { name: c.name, icon: c.icon, av: c.av, desc: c.desc, verified: !!c.v, isGroup: !!c.g,
        subs: fmt(c.subs + (joined ? 1 : 0)) + (c.g ? ' участников' : ' подписчиков'),
        d: (k * 0.04) + 's', joined, btn: joined ? (c.g ? 'В группе' : 'Подписан') : (c.g ? 'Вступить' : 'Подписаться'),
        btnBg: joined ? 'rgba(143,211,172,.12)' : 'linear-gradient(140deg, #6FC497, #3F9A6C)', btnInk: joined ? '#8FD3AC' : '#06150D',
        btnAnim: s.popI === i && Date.now() - s.popAt < 500 ? 'kxPop .35s ease both' : 'none',
        toggle: () => this.setState({ joined: joined ? s.joined.filter(x => x !== i) : [...s.joined, i], popAt: Date.now(), popI: i }) };
    }),
    empty: list.length === 0
  };
}
}
</script>
</body>
</html>
