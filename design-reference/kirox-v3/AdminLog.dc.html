<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Недавние действия</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes kxIn2{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,16px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,16px)}}
@keyframes kxToast2{0%{opacity:0;transform:translate(-50%,16px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,16px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px; display: flex; align-items: center; gap: 10px">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <div style="flex: 1"><div style="font-size: 20px; font-weight: 800">Недавние действия</div><div style="font-size: 12px; color: #9AA59F">Kotlin-клуб · за последние 48 часов</div></div>
  </header>

  <div class="scroll" style="padding: 2px 12px 8px; display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="6"><button onClick="{{c.tap}}" aria-pressed="{{c.on}}" style="flex-shrink: 0; height: 34px; padding: 0 12px; border-radius: 17px; background: {{c.bg}}; color: {{c.ink}}; border: 1px solid {{c.bd}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span class="ms" style="font-size: 16px" aria-hidden="true">{{c.i}}</span>{{c.t}}</button></sc-for>
  </div>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 14px 16px; position: relative">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: {{r.dayShow}}; margin: 12px 0 6px; text-align: center"><span style="padding: 3px 10px; border-radius: 10px; background: rgba(255,255,255,.06); font-size: 11px; font-weight: 700; color: #9AA59F">{{r.day}}</span></div>
      <div style="display: flex; gap: 10px; padding: 6px 0; animation: {{r.anim}}">
        <div style="display: flex; flex-direction: column; align-items: center; width: 36px; flex-shrink: 0">
          <span style="width: 36px; height: 36px; border-radius: 12px; background: {{r.ibg}}; color: {{r.ic}}; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 19px" aria-hidden="true">{{r.i}}</span></span>
          <span style="flex: 1; width: 2px; margin-top: 4px; background: rgba(255,255,255,.06); border-radius: 1px"></span>
        </div>
        <div style="flex: 1; min-width: 0; padding-bottom: 6px">
          <div style="font-size: 14px; line-height: 1.4"><span style="font-weight: 800">{{r.who}}</span> <span style="color: #C9D2CC">{{r.what}}</span></div>
          <div style="display: {{r.quoteShow}}; margin-top: 6px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.05); border-left: 3px solid {{r.ic}}; font-size: 13px; color: #C9D2CC; line-height: 1.4"><span style="display: {{r.oldShow}}; color: #8A958F; text-decoration: line-through">{{r.old}}</span><span style="display: {{r.oldShow}}"> → </span>{{r.quote}}</div>
          <div style="margin-top: 4px; display: flex; align-items: center; gap: 8px"><span style="font-size: 11px; color: #8A958F">{{r.t}}</span><button onClick="{{r.act}}" style="display: {{r.actShow}}; height: 28px; padding: 0 10px; border-radius: 14px; background: {{r.abg}}; color: {{r.aink}}; font-size: 12px; font-weight: 800">{{r.actText}}</button></div>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="padding: 60px 20px; text-align: center; color: #9AA59F"><span class="ms" style="font-size: 44px; color: #8A958F" aria-hidden="true">history</span><div style="margin-top: 8px; font-size: 15px; font-weight: 700; color: #C9D2CC">Ничего за 48 часов</div></div>
    </sc-if>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 26px; padding: 12px 16px; border-radius: 18px; background: rgba(40,48,44,.96); border: 1px solid rgba(255,255,255,.12); font-size: 13px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: {{toastAnim}}"><span class="ms fill" style="font-size: 18px; color: #8FD3AC" aria-hidden="true">check_circle</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const F = [['all', 'apps', 'Все'], ['del', 'delete', 'Удаления'], ['ban', 'block', 'Ограничения'], ['edit', 'edit', 'Правки'], ['pin', 'push_pin', 'Закрепы'], ['join', 'group_add', 'Участники']];
const C = { del: ['#FF8A80', 'rgba(255,138,128,.14)'], ban: ['#E8B04A', 'rgba(232,176,74,.14)'], edit: ['#7FB8E0', 'rgba(127,184,224,.14)'], pin: ['#8FD3AC', 'rgba(143,211,172,.14)'], join: ['#C9D2CC', 'rgba(255,255,255,.08)'] };
const L = [
  { id: 1, k: 'del', i: 'delete', day: 'Сегодня', who: 'Дмитрий', what: '· удалено сообщение · Гость_8812', quote: 'Заработок от 5000 в день, пиши в личку!!!', t: '18:12', act: 'report' },
  { id: 2, k: 'ban', i: 'block', day: 'Сегодня', who: 'Дмитрий', what: '· блокировка навсегда · Гость_8812', quote: '', t: '18:12', act: 'unban' },
  { id: 3, k: 'pin', i: 'push_pin', day: 'Сегодня', who: 'Айгерим', what: '· закреплено сообщение', quote: 'Встреча в субботу в 12:00, коворкинг на Абая', t: '15:40', act: '' },
  { id: 4, k: 'edit', i: 'edit', day: 'Сегодня', who: 'Вы', what: 'изменили описание группы', old: 'Обсуждаем Kotlin', quote: 'Обсуждаем Kotlin, Compose и KMP', t: '11:05', act: '' },
  { id: 5, k: 'join', i: 'group_add', day: 'Вчера', who: 'Сергей', what: '· вступление по ссылке «Для митапа»', quote: '', t: '21:30', act: '' },
  { id: 6, k: 'ban', i: 'timer', day: 'Вчера', who: 'Айгерим', what: '· ограничение · Олег: без медиа на 1 день', quote: '', t: '19:02', act: '' },
  { id: 7, k: 'edit', i: 'speed', day: 'Вчера', who: 'Вы', what: 'включили медленный режим — 1 минута', quote: '', t: '10:15', act: '' }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { f: 'all', k: 0, done: {}, toast: '', tk: 0 }; }
componentWillUnmount() { clearTimeout(this.tt); }
renderVals() {
  const s = this.state;
  const say = (t) => { clearTimeout(this.tt); this.setState({ toast: t, tk: s.tk + 1 }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2000); };
  const list = L.filter(r => s.f === 'all' || r.k === s.f);
  let lastDay = '';
  return {
    chips: F.map(([k, i, t]) => { const on = s.f === k; return { i, t, on: on ? 'true' : 'false', bg: on ? 'rgba(143,211,172,.16)' : 'rgba(255,255,255,.05)', ink: on ? '#8FD3AC' : '#C9D2CC', bd: on ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', tap: () => this.setState({ f: k, k: s.k + 1 }) }; }),
    rows: list.map(r => { const show = r.day !== lastDay; lastDay = r.day; const d = !!s.done[r.id]; const col = C[r.k];
      return { ...r, dayShow: show ? 'block' : 'none', ic: col[0], ibg: col[1], quoteShow: r.quote ? 'block' : 'none', oldShow: r.old ? 'inline' : 'none', old: r.old || '',
        anim: (s.k % 2 ? 'kxIn2' : 'kxIn') + ' .25s ease both',
        actShow: r.act ? 'inline-block' : 'none',
        actText: d ? (r.act === 'report' ? 'Отправлено' : 'Снято') : (r.act === 'report' ? 'Сообщить о спаме' : 'Снять блокировку'),
        abg: d ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.08)', aink: d ? '#8FD3AC' : '#EEF3EF',
        act: () => { if (d) return; this.setState({ done: { ...s.done, [r.id]: true } }); say(r.act === 'report' ? 'Жалоба на спам отправлена' : 'Блокировка снята'); } }; }),
    empty: !list.length,
    toast: !!s.toast, toastText: s.toast, toastAnim: (s.tk % 2 ? 'kxToast2' : 'kxToast') + ' 2s ease both'
  };
}
}
</script>
</body>
</html>
