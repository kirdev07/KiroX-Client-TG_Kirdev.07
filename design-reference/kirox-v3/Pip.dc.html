<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Картинка в картинке</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
@keyframes kxSun{0%,100%{transform:translateX(0)}50%{transform:translateX(24px)}}
@keyframes kxWave{from{background-position:0 0}to{background-position:-120px 0}}
@keyframes kxIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <!-- Background: chat list -->
  <div style="position: absolute; inset: 0; padding: 12px 12px 0; opacity: {{bgOp}}; transition: opacity .3s" aria-hidden="true">
    <div style="padding: 0 4px 10px; display: flex; align-items: center; gap: 10px"><span style="font-size: 24px; font-weight: 800; flex: 1">Чаты</span><span class="ms" style="color: #9AA59F">search</span></div>
    <sc-for list="{{chats}}" as="c" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
        <span style="width: 50px; height: 50px; border-radius: 25px; background: {{c.c}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px">{{c.l}}</span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 700">{{c.name}}</span><span style="display: block; font-size: 13px; color: #9AA59F; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{c.msg}}</span></span>
        <span style="font-size: 12px; color: #8A958F">{{c.t}}</span>
      </div>
    </sc-for>
  </div>

  <!-- Full player -->
  <sc-if value="{{full}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; animation: kxIn .3s ease both">
      <div style="padding: 12px; display: flex; align-items: center; gap: 8px">
        <button onClick="{{toPip}}" aria-label="Свернуть в окошко" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">picture_in_picture_alt</span></button>
        <div style="flex: 1"><div style="font-size: 14px; font-weight: 700">Android Weekly</div><div style="font-size: 12px; color: #9AA59F">Обзор Compose 1.9 · видео</div></div>
      </div>
      <div style="flex: 1; display: flex; align-items: center">
        <div style="position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: {{sky}}">
          <span style="position: absolute; left: 40%; top: 18%; width: 50px; height: 50px; border-radius: 25px; background: radial-gradient(circle, #FFE3A3, #F2B866 60%, transparent 70%); animation: kxSun 6s ease-in-out 2"></span>
          <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: repeating-linear-gradient(90deg, #1F4A5E 0 60px, #24566C 60px 120px); animation: kxWave 2s linear infinite; opacity: .9"></span>
          <button onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 32px; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; opacity: {{playOp}}"><span class="ms fill" style="font-size: 38px" aria-hidden="true">{{playIcon}}</span></button>
        </div>
      </div>
      <div style="padding: 0 16px 30px">
        <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,.2)"><div style="height: 100%; width: {{prog}}; border-radius: 2px; background: #8FD3AC"></div></div>
        <div style="margin-top: 6px; display: flex; font-size: 12px; color: #9AA59F; font-variant-numeric: tabular-nums"><span style="flex: 1">{{time}}</span><span>4:12</span></div>
        <div style="margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: rgba(143,211,172,.08); border: 1px solid rgba(143,211,172,.2); font-size: 13px; color: #C9D2CC; display: flex; gap: 8px"><span class="ms" style="color: #8FD3AC; font-size: 18px" aria-hidden="true">info</span>Нажмите кнопку слева вверху — видео уменьшится и продолжит играть поверх чатов</div>
      </div>
    </div>
  </sc-if>

  <!-- PiP window -->
  <sc-if value="{{pip}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: {{px}}; top: {{py}}; width: {{pw}}; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; background: {{sky}}; box-shadow: 0 14px 40px rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.2); transition: left .35s cubic-bezier(.2,.8,.2,1), top .35s cubic-bezier(.2,.8,.2,1), width .3s; animation: kxIn .3s ease both">
      <span style="position: absolute; left: 40%; top: 18%; width: 22%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, #FFE3A3, #F2B866 60%, transparent 70%); animation: kxSun 6s ease-in-out 2"></span>
      <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: repeating-linear-gradient(90deg, #1F4A5E 0 40px, #24566C 40px 80px); animation: kxWave 2s linear infinite"></span>
      <sc-if value="{{ctrl}}" hint-placeholder-val="{{true}}">
        <div style="position: absolute; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; gap: 10px; animation: kxIn .15s ease both">
          <button onClick="{{expand}}" aria-label="Развернуть" style="width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 20px" aria-hidden="true">open_in_full</span></button>
          <button onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">{{playIcon}}</span></button>
          <button onClick="{{close}}" aria-label="Закрыть видео" style="width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 20px" aria-hidden="true">close</span></button>
        </div>
      </sc-if>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.2)"><div style="height: 100%; width: {{prog}}; background: #8FD3AC"></div></div>
      <button onClick="{{toggleCtrl}}" aria-label="Показать кнопки" style="position: absolute; inset: 0; display: {{tapLayer}}"></button>
    </div>
    <!-- move pad -->
    <div style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px; border-radius: 22px; background: rgba(20,26,23,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.12); display: flex; gap: 6px; align-items: center">
      <span style="font-size: 11px; color: #9AA59F; padding: 0 6px">Угол</span>
      <sc-for list="{{corners}}" as="k" hint-placeholder-count="4"><button onClick="{{k.tap}}" aria-label="{{k.label}}" style="width: 38px; height: 38px; border-radius: 12px; background: {{k.bg}}; color: {{k.ink}}; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 20px" aria-hidden="true">{{k.icon}}</span></button></sc-for>
      <button onClick="{{resize}}" aria-label="Размер окошка" style="width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 20px" aria-hidden="true">{{sizeIcon}}</span></button>
    </div>
  </sc-if>

  <sc-if value="{{closed}}" hint-placeholder-val="{{false}}">
    <button onClick="{{reopen}}" style="position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); height: 44px; padding: 0 18px; border-radius: 22px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap"><span class="ms fill" style="font-size: 18px" aria-hidden="true">play_circle</span>Открыть видео снова</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CH = [['Мама', 'М', '#B07A2E', 'Купи хлеб по дороге 🙂', '18:02'], ['Android Weekly', 'A', '#3F9A6C', 'Видео: обзор Compose 1.9', '17:40'], ['Анна', 'А', '#C0443C', 'Фото с дачи 📸', '17:12'], ['Kotlin-клуб', 'K', '#2F6E9E', 'Дмитрий: PR готов', '16:55'], ['Лиза', 'Л', '#6A4C9C', 'Сюрприз готов 🎁', '15:30'], ['Работа', 'Р', '#5C6661', 'Созвон в понедельник', 'вчера'], ['Олег', 'О', '#5C6661', 'Ок', 'вчера']];
const POS = { tr: ['auto', '64px'], tl: ['12px', '64px'], br: ['auto', '560px'], bl: ['12px', '560px'] };
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 'full', corner: 'tr', big: false, playing: true, sec: 34, ctrl: false }; }
componentDidMount() { this.iv = setInterval(() => { if (this.state.playing && this.state.mode !== 'closed') this.setState({ sec: (this.state.sec + 1) % 252 }); }, 1000); }
componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.tc); }
renderVals() {
  const s = this.state;
  const w = s.big ? 260 : 180;
  const left = s.corner.endsWith('r') ? (390 - 12 - w) + 'px' : '12px';
  const top = s.corner.startsWith('t') ? '64px' : (s.big ? '500px' : '560px');
  const p = s.sec / 252;
  return {
    chats: CH.map(([name, l, c, msg, t]) => ({ name, l, c, msg, t })),
    bgOp: s.mode === 'full' ? '0' : '1',
    full: s.mode === 'full', pip: s.mode === 'pip', closed: s.mode === 'closed',
    sky: 'linear-gradient(180deg, hsl(' + (200 - p * 170) + ',55%,' + (58 - p * 18) + '%), hsl(' + (30 + p * 10) + ',70%,62%))',
    prog: (p * 100) + '%', time: Math.floor(s.sec / 60) + ':' + String(s.sec % 60).padStart(2, '0'),
    playIcon: s.playing ? 'pause' : 'play_arrow', playLabel: s.playing ? 'Пауза' : 'Играть', playOp: s.playing ? '.3' : '1',
    togglePlay: () => this.setState({ playing: !s.playing }),
    toPip: () => this.setState({ mode: 'pip', ctrl: false }),
    px: left, py: top, pw: w + 'px',
    ctrl: s.ctrl, tapLayer: s.ctrl ? 'none' : 'block',
    toggleCtrl: () => { this.setState({ ctrl: true }); clearTimeout(this.tc); this.tc = setTimeout(() => this.setState({ ctrl: false }), 3000); },
    expand: () => this.setState({ mode: 'full' }), close: () => this.setState({ mode: 'closed', playing: false }),
    corners: [['tl', 'north_west', 'В левый верхний угол'], ['tr', 'north_east', 'В правый верхний угол'], ['bl', 'south_west', 'В левый нижний угол'], ['br', 'south_east', 'В правый нижний угол']].map(([k, icon, label]) => ({ icon, label, bg: s.corner === k ? 'rgba(143,211,172,.18)' : 'rgba(255,255,255,.06)', ink: s.corner === k ? '#8FD3AC' : '#C9D2CC', tap: () => this.setState({ corner: k }) })),
    resize: () => this.setState({ big: !s.big }), sizeIcon: s.big ? 'close_fullscreen' : 'open_in_full',
    reopen: () => this.setState({ mode: 'full', playing: true })
  };
}
}
</script>
</body>
</html>
