<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Избранное</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input::placeholder{color:#8A958F}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(70% 40% at 100% 15%, rgba(63,154,108,.16), rgba(0,0,0,0))"></div>

  <header style="position: absolute; left: 10px; right: 10px; top: 10px; display: flex; align-items: center; gap: 8px; z-index: 2">
    <button aria-label="Назад" style="width: 46px; height: 46px; border-radius: 23px; background: transparent; border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <div style="flex-grow: 1; height: 54px; border-radius: 27px; padding: 0 6px; display: flex; align-items: center; gap: 10px; background: transparent; border: 1px solid rgba(255,255,255,.16)">
      <span style="width: 42px; height: 42px; border-radius: 21px; background: linear-gradient(140deg, #2F6E4D, #173A28); color: #C8F0D8; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">bookmark</span></span>
      <span style="flex-grow: 1"><span style="display: block; font-size: 16px; font-weight: 700">Избранное</span><span style="display: block; font-size: 12px; color: #9AA59F">{{countLabel}}</span></span>
    </div>
    <button aria-label="Поиск" style="width: 46px; height: 46px; border-radius: 23px; background: transparent; border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">search</span></button>
  </header>

  <div style="position: absolute; left: 0; right: 0; top: 74px; padding: 0 12px; display: flex; gap: 6px; overflow: hidden; z-index: 1">
    <button onClick="{{toggleView}}" style="flex-shrink: 0; height: 34px; padding: 0 12px; border-radius: 17px; background: {{viewBg}}; color: {{viewInk}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px; transition: background .25s"><span class="ms" style="font-size: 17px" aria-hidden="true">forum</span>По чатам</button>
    <sc-for list="{{tags}}" as="t" hint-placeholder-count="4"><button onClick="{{t.pick}}" style="flex-shrink: 0; height: 34px; padding: 0 12px; border-radius: 17px; background: {{t.bg}}; color: {{t.color}}; font-size: 13px; font-weight: 700; transition: background .25s">{{t.e}} {{t.label}} <span style="opacity: .7">{{t.n}}</span></button></sc-for>
  </div>
  <div style="padding: 6px 16px 0; font-size: 11px; color: #8A958F">Теги в Избранном — функция Telegram Premium</div>

  <sc-if value="{{byChats}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; right: 0; top: 122px; padding: 0 12px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{sources}}" as="c" hint-placeholder-count="5">
        <button onClick="{{c.open}}" style="height: 66px; padding: 0 8px; border-radius: 18px; display: flex; align-items: center; gap: 12px; animation: kxIn .3s ease both; animation-delay: {{c.d}}">
          <span style="width: 48px; height: 48px; border-radius: 24px; background: {{c.avatar}}; color: {{c.ink}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.letter}}</span>
          <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600">{{c.name}}</span><span style="display: block; font-size: 13px; color: #8A958F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.preview}}</span></span>
          <span style="min-width: 24px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; background: rgba(143,211,172,.16); color: #8FD3AC; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.n}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{byList}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 0; right: 0; top: 118px; bottom: 96px; padding: 0 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; overflow: hidden">
      <sc-if value="{{fromLabel}}" hint-placeholder-val="{{false}}"><div style="align-self: center; padding: 4px 12px; border-radius: 12px; background: rgba(143,211,172,.12); font-size: 12px; font-weight: 700; color: #8FD3AC">Из чата «{{fromLabel}}»</div></sc-if>
      <sc-for list="{{items}}" as="m" hint-placeholder-count="4">
        <div style="align-self: flex-end; max-width: 84%; border-radius: 20px 20px 6px 20px; background: linear-gradient(160deg, #2E6B4B, #1F4D36); color: #E6F6EC; overflow: hidden; animation: kxIn .3s ease both">
          <sc-if value="{{m.fwd}}" hint-placeholder-val="{{false}}"><div style="padding: 8px 12px 0; font-size: 12px; color: #A6E3C1; display: flex; align-items: center; gap: 4px"><span class="ms" style="font-size: 14px" aria-hidden="true">forward</span>Переслано от {{m.fwd}}</div></sc-if>
          <sc-if value="{{m.img}}" hint-placeholder-val="{{false}}"><div style="margin: 6px 6px 0; height: 110px; border-radius: 14px; background: {{m.img}}"></div></sc-if>
          <div style="padding: 6px 12px 4px; font-size: 15px; line-height: 20px">{{m.text}}</div>
          <div style="padding: 0 10px 8px; display: flex; align-items: center; gap: 6px"><sc-if value="{{m.tag}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 8px; border-radius: 10px; background: rgba(0,0,0,.22); font-size: 11px; font-weight: 700">{{m.tag}}</span></sc-if><span style="flex-grow: 1"></span><span style="font-size: 11px; color: #A6E3C1">{{m.time}}</span></div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{byList}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 10px; right: 10px; bottom: 22px; display: flex; align-items: center; gap: 8px">
      <div style="flex-grow: 1; height: 56px; border-radius: 28px; padding: 0 6px; display: flex; align-items: center; background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,.16)">
        <button aria-label="Прикрепить" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #C9D2CC"><span class="ms" aria-hidden="true">add_circle</span></button>
        <input aria-label="Заметка" placeholder="Заметка себе…" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #EEF3EF; font: inherit; font-size: 15px">
      </div>
      <button aria-label="Голосовое" style="width: 56px; height: 56px; border-radius: 28px; background: #8FD3AC; color: #06150D; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">mic</span></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const PL = (n, a, b, c) => { const m = Math.abs(n) % 100, d = m % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d >= 2 && d <= 4 ? b : c; };

class Component extends DCLogic {
constructor(props) { super(props); this.state = { chats: false, tag: null, from: null }; }
renderVals() {
  const s = this.state;
  const T = [['important', '⭐', 'Важное'], ['idea', '💡', 'Идеи'], ['buy', '🛒', 'Купить'], ['read', '📚', 'Прочитать']];
  const msgs = [
    { text: 'Купить билеты на субботу и попкорн', tag: '🛒 Купить', key: 'buy', time: '22:26', from: 'Анна Ким', fwd: false, img: false },
    { text: 'Идея: тёмная тема с зелёным оттенком для kiroX', tag: '💡 Идеи', key: 'idea', time: '21:40', from: null, fwd: false, img: false },
    { text: 'Сборка прошла, проверить APK на телефоне', tag: '⭐ Важное', key: 'important', time: '19:02', from: 'Команда kiroX', fwd: 'Максим Ли', img: false },
    { text: 'Маршрут до озера', tag: false, key: null, time: 'вчера', from: 'Илья Петров', fwd: 'Илья Петров', img: 'linear-gradient(150deg,#3E7A5A,#0F1A14)' },
    { text: 'Статья про жидкое стекло в интерфейсах', tag: '📚 Прочитать', key: 'read', time: 'пн', from: 'Кино по пятницам', fwd: 'Кино по пятницам', img: false }
  ];
  const list = msgs.filter(m => (!s.tag || m.key === s.tag) && (!s.from || m.from === s.from));
  const tags = T.map(([k, e, label]) => ({ e, label, n: msgs.filter(m => m.key === k).length, bg: s.tag === k ? '#8FD3AC' : 'rgba(255,255,255,.07)', color: s.tag === k ? '#06150D' : '#C9D2CC', pick: () => this.setState({ tag: s.tag === k ? null : k, chats: false }) }));
  const P = {
    'Анна Ким': ['А', 'linear-gradient(140deg,#4B3F7A,#2A2240)', '#DCD0FF'],
    'Команда kiroX': ['K', 'linear-gradient(140deg,#2E6B66,#18403C)', '#BDEDE8'],
    'Илья Петров': ['И', 'linear-gradient(140deg,#D08A3C,#7A4A16)', '#FFE9C9'],
    'Кино по пятницам': ['К', 'linear-gradient(140deg,#C97A58,#3A2014)', '#FFE1CF']
  };
  const sources = Object.keys(P).map((name, i) => {
    const mine = msgs.filter(m => m.from === name);
    return { name, letter: P[name][0], avatar: P[name][1], ink: P[name][2], n: mine.length, preview: mine[0] ? mine[0].text : '', d: (i * 0.04) + 's', open: () => this.setState({ from: name, chats: false, tag: null }) };
  });
  return {
    tags, sources, items: list,
    byChats: s.chats, byList: !s.chats,
    fromLabel: s.from || false,
    countLabel: s.chats ? 'Сохранено из ' + sources.length + ' чатов' : (s.from || s.tag ? 'Найдено: ' + list.length : msgs.length + ' ' + PL(msgs.length, 'сохранённое', 'сохранённых', 'сохранённых')),
    viewBg: s.chats ? '#8FD3AC' : 'rgba(255,255,255,.07)', viewInk: s.chats ? '#06150D' : '#C9D2CC',
    toggleView: () => this.setState({ chats: !s.chats, tag: null, from: null })
  };
}
}
</script>
</body>
</html>
