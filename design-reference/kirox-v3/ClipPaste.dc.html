<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вставить скопированное</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
@keyframes kxUp{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes kxUp2{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes kxIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
@keyframes kxShine{0%{background-position:-120px 0}100%{background-position:240px 0}}
@keyframes kxSys{0%{opacity:0;transform:translate(-50%,-10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
@keyframes kxSys2{0%{opacity:0;transform:translate(-50%,-10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: #3F9A6C; display: flex; align-items: center; justify-content: center; font-weight: 800">Д</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Дмитрий</div><div style="font-size: 12px; color: #8FD3AC">в сети</div></div>
  </header>

  <div style="flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; overflow: hidden">
    <div style="align-self: flex-start; max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); font-size: 15px">Скинь, что там за ошибка в сборке?</div>
    <sc-for list="{{sent}}" as="m" hint-placeholder-count="0">
      <div style="align-self: flex-end; max-width: 80%; border-radius: 18px 18px 6px 18px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; overflow: hidden; animation: kxIn .3s cubic-bezier(.2,.8,.2,1) both">
        <div style="display: {{m.imgShow}}; width: 230px; height: 130px; background: {{m.img}}; position: relative"><span style="position: absolute; left: 10px; top: 10px; right: 10px; font: 11px/1.5 ui-monospace, monospace; color: #FF8A80; white-space: pre">{{m.code}}</span></div>
        <div style="display: {{m.linkShow}}; margin: 8px 8px 0; padding: 6px 10px; border-left: 3px solid #06150D; border-radius: 6px; background: rgba(6,21,13,.12); font-size: 12px"><b>developer.android.com</b><br>Gradle: устранение конфликтов зависимостей</div>
        <div style="padding: 8px 12px; font-size: 15px; font-family: {{m.font}}">{{m.text}}<span style="font-size: 11px; opacity: .7; margin-left: 8px">19:52</span></div>
      </div>
    </sc-for>
  </div>

  <!-- Clipboard suggestion -->
  <sc-if value="{{suggest}}" hint-placeholder-val="{{true}}">
    <div style="margin: 0 12px 8px; padding: 10px; border-radius: 20px; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.07)); backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; gap: 10px; animation: {{sugAnim}}">
      <span style="width: 52px; height: 52px; border-radius: 12px; background: {{clipThumb}}; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden"><span class="ms fill" style="font-size: 24px; color: {{clipIc}}" aria-hidden="true">{{clipIcon}}</span><span style="position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent); background-size: 120px 100%; background-repeat: no-repeat; animation: kxShine 2s linear 2"></span></span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 12px; color: #9AA59F">{{clipKind}}</span><span style="display: block; font-size: 14px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{clipText}}</span></span>
      <button onClick="{{paste}}" style="height: 38px; padding: 0 14px; border-radius: 19px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 13px; font-weight: 800">Вставить</button>
      <button onClick="{{dismiss}}" aria-label="Скрыть" style="width: 32px; height: 32px; border-radius: 16px; color: #9AA59F; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px" aria-hidden="true">close</span></button>
    </div>
  </sc-if>

  <div style="padding: 8px 12px 10px; border-top: 1px solid rgba(255,255,255,.06); display: flex; gap: 8px; align-items: flex-end">
    <div style="flex: 1; min-height: 48px; padding: 6px 8px 6px 14px; box-sizing: border-box; border-radius: 24px; background: rgba(255,255,255,.07); border: 1px solid rgba(143,211,172,.3); display: flex; flex-direction: column; gap: 6px; justify-content: center">
      <span style="display: {{attShow}}; align-items: center; gap: 8px; padding: 6px; border-radius: 14px; background: rgba(0,0,0,.25)"><span style="width: 36px; height: 36px; border-radius: 9px; background: {{clipThumb}}; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 18px; color: {{clipIc}}" aria-hidden="true">{{clipIcon}}</span></span><span style="flex: 1; font-size: 12px; color: #C9D2CC">{{attText}}</span><button onClick="{{unattach}}" aria-label="Убрать вложение" style="width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #9AA59F"><span class="ms" style="font-size: 16px" aria-hidden="true">close</span></button></span>
      <span style="font-size: 15px; color: {{dInk}}">{{draft}}</span>
    </div>
    <button onClick="{{send}}" aria-label="Отправить" style="width: 48px; height: 48px; border-radius: 24px; background: {{sBg}}; color: {{sInk}}; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">send</span></button>
  </div>

  <div style="padding: 0 12px 14px; display: flex; gap: 6px; justify-content: center">
    <sc-for list="{{demo}}" as="d" hint-placeholder-count="3"><button onClick="{{d.tap}}" style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); font-size: 12px; font-weight: 700; color: #C9D2CC; display: flex; align-items: center; gap: 4px"><span class="ms" style="font-size: 15px" aria-hidden="true">content_copy</span>{{d.t}}</button></sc-for>
  </div>

  <sc-if value="{{sys}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; top: 70px; padding: 8px 14px; border-radius: 16px; background: rgba(30,34,32,.97); border: 1px solid rgba(255,255,255,.12); font-size: 12px; color: #C9D2CC; white-space: nowrap; display: flex; align-items: center; gap: 6px; animation: {{sysAnim}}"><span class="ms" style="font-size: 16px" aria-hidden="true">content_paste</span>Вставлено из буфера обмена</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CLIPS = {
  shot: { kind: 'Скопирован скриншот · только что', text: 'Скриншот 19:51.png', thumb: 'linear-gradient(160deg, #1B201E, #0F1311)', ic: '#FF8A80', icon: 'image', att: 'Скриншот · 1,2 МБ', btn: 'Скриншот' },
  link: { kind: 'Скопирована ссылка', text: 'developer.android.com/build/dependencies', thumb: 'rgba(127,184,224,.16)', ic: '#7FB8E0', icon: 'link', att: 'developer.android.com', btn: 'Ссылку' },
  code: { kind: 'Скопирован текст', text: 'Duplicate class kotlin.collections…', thumb: 'rgba(232,176,74,.14)', ic: '#E8B04A', icon: 'code', att: 'Фрагмент текста · 2 строки', btn: 'Текст' }
};
class Component extends DCLogic {
constructor(props) { super(props); this.state = { clip: 'shot', sug: true, att: false, sk: 0, sent: [], sysk: 0, sys: false }; }
componentWillUnmount() { clearTimeout(this.ts); }
renderVals() {
  const s = this.state;
  const c = CLIPS[s.clip];
  const draftText = s.att ? (s.clip === 'code' ? 'Duplicate class kotlin.collections.jdk8…\nв :app:checkDebugDuplicateClasses' : s.clip === 'link' ? 'Похоже, вот в чём дело' : 'Вот, смотри 👇') : 'Сообщение';
  return {
    sent: s.sent.map(m => ({ imgShow: m.clip === 'shot' ? 'block' : 'none', img: 'linear-gradient(160deg, #1B201E, #0F1311)', code: '> Task :app:checkDebugDuplicateClasses FAILED\nDuplicate class kotlin.collections\n  .jdk8.CollectionsJDK8Kt found in…', linkShow: m.clip === 'link' ? 'block' : 'none', text: m.text, font: m.clip === 'code' ? 'ui-monospace, monospace' : 'inherit' })),
    suggest: s.sug && !s.att, sugAnim: (s.sk % 2 ? 'kxUp2' : 'kxUp') + ' .3s cubic-bezier(.2,.8,.2,1) both',
    clipThumb: c.thumb, clipIc: c.ic, clipIcon: c.icon, clipKind: c.kind, clipText: c.text,
    paste: () => { clearTimeout(this.ts); this.setState({ att: true, sys: true, sysk: s.sysk + 1 }); this.ts = setTimeout(() => this.setState({ sys: false }), 2000); },
    dismiss: () => this.setState({ sug: false }),
    attShow: s.att && s.clip !== 'code' ? 'flex' : 'none', attText: c.att,
    unattach: () => this.setState({ att: false, sug: false }),
    draft: draftText, dInk: s.att ? '#EEF3EF' : '#8A958F',
    sBg: s.att ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.07)', sInk: s.att ? '#06150D' : '#8A958F',
    send: () => { if (!s.att) return; this.setState({ sent: [...s.sent, { clip: s.clip, text: draftText }].slice(-2), att: false, sug: false }); },
    demo: Object.keys(CLIPS).map(k => ({ t: CLIPS[k].btn, tap: () => this.setState({ clip: k, sug: true, att: false, sk: s.sk + 1 }) })),
    sys: s.sys, sysAnim: (s.sysk % 2 ? 'kxSys2' : 'kxSys') + ' 2s ease both'
  };
}
}
</script>
</body>
</html>
