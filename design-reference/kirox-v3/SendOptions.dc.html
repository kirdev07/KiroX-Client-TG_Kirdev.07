<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Как отправить</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
@keyframes kxMenu{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes kxDim{from{opacity:0}to{opacity:1}}
@keyframes kxIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
@keyframes kxTick{0%,100%{transform:rotate(0)}50%{transform:rotate(20deg)}}
@keyframes kxGlow{0%,100%{box-shadow:0 0 0 0 rgba(143,211,172,0)}50%{box-shadow:0 0 0 6px rgba(143,211,172,.18)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span style="position: relative; width: 40px; height: 40px; border-radius: 20px; background: #C0443C; display: flex; align-items: center; justify-content: center; font-weight: 800">А<span style="position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 6px; background: {{dot}}; border: 2px solid #0A0C0B; transition: background .3s"></span></span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Анна</div><div style="font-size: 12px; color: {{stInk}}">{{status}}</div></div>
    <button onClick="{{goOnline}}" style="outline: 1px dashed rgba(143,211,172,.5); outline-offset: 2px; height: 32px; padding: 0 10px; border-radius: 16px; background: rgba(255,255,255,.06); font-size: 11px; font-weight: 700; color: #9AA59F; display: {{demoShow}}">Макет: Анна в сети</button>
  </header>

  <div style="flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; overflow: hidden">
    <div style="align-self: center; padding: 3px 10px; border-radius: 10px; background: rgba(255,255,255,.06); font-size: 11px; font-weight: 700; color: #9AA59F">Сегодня</div>
    <div style="align-self: flex-start; max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); font-size: 15px">Я уже сплю, завтра рано вставать 😴<span style="font-size: 11px; opacity: .6; margin-left: 8px">23:41</span></div>
    <sc-for list="{{sent}}" as="m" hint-placeholder-count="0">
      <div style="align-self: flex-end; max-width: 82%; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; animation: kxIn .3s cubic-bezier(.2,.8,.2,1) both">
        <div style="padding: 8px 12px; border-radius: 18px 18px 6px 18px; background: {{m.bg}}; color: {{m.ink}}; border: 1px {{m.bs}} {{m.bd}}; font-size: 15px">{{m.text}}<span style="font-size: 11px; opacity: .7; margin-left: 8px">{{m.t}}</span><span class="ms" style="font-size: 14px; margin-left: 3px; vertical-align: -2px" aria-hidden="true">{{m.tick}}</span></div>
        <span style="font-size: 11px; font-weight: 700; color: {{m.noteInk}}; display: flex; align-items: center; gap: 4px"><span class="ms fill" style="font-size: 14px; animation: {{m.noteAnim}}" aria-hidden="true">{{m.noteIcon}}</span>{{m.note}}</span>
      </div>
    </sc-for>
  </div>

  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06); display: flex; gap: 8px; align-items: center">
    <div style="flex: 1; min-height: 48px; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,.07); display: flex; align-items: center; font-size: 15px">{{draft}}</div>
    <button onClick="{{openMenu}}" aria-label="Варианты отправки" aria-expanded="{{menuOpen}}" style="width: 52px; height: 52px; border-radius: 26px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center; animation: kxGlow 2.2s ease-in-out 2"><span class="ms fill" aria-hidden="true">send</span></button>
  </div>
  <div style="position: absolute; right: 74px; bottom: 30px; font-size: 11px; color: #8A958F; display: {{hintShow}}">удерживайте, чтобы выбрать →</div>

  <sc-if value="{{menu}}" hint-placeholder-val="{{true}}">
    <button onClick="{{closeMenu}}" aria-label="Закрыть" style="position: absolute; inset: 0; background: rgba(0,0,0,.5); animation: kxDim .2s ease both"></button>
    <div style="position: absolute; right: 12px; bottom: 84px; width: 270px; padding: 6px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.07)); backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 16px 40px rgba(0,0,0,.5); transform-origin: bottom right; animation: kxMenu .25s cubic-bezier(.2,.8,.2,1) both">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="4"><button onClick="{{o.tap}}" style="width: 100%; min-height: 56px; padding: 6px 12px; border-radius: 18px; display: flex; align-items: center; gap: 12px"><span style="width: 38px; height: 38px; border-radius: 13px; background: {{o.bg}}; color: {{o.c}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms fill" style="font-size: 20px" aria-hidden="true">{{o.i}}</span></span><span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 700">{{o.t}}</span><span style="display: block; font-size: 12px; color: #9AA59F">{{o.s}}</span></span></button></sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const DRAFTS = ['Спокойной ночи! Завтра созвонимся 🌙', 'Не забудь зонт, обещают дождь ☔', 'Билеты уже в почте, глянь утром', 'Удачи на собеседовании! 💚'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { menu: true, sent: [], online: false, n: 0 }; }
renderVals() {
  const s = this.state;
  const text = DRAFTS[s.n % DRAFTS.length];
  const add = (kind) => this.setState({ menu: false, n: s.n + 1, sent: [...s.sent, { text, kind, done: kind !== 'online' }].slice(-4) });
  return {
    dot: s.online ? '#8FD3AC' : '#5C6661', status: s.online ? 'в сети' : 'в сети в 23:42', stInk: s.online ? '#8FD3AC' : '#9AA59F',
    demoShow: !s.online && s.sent.some(m => m.kind === 'online' && !m.done) ? 'inline-block' : 'none',
    goOnline: () => this.setState({ online: true, sent: s.sent.map(m => m.kind === 'online' ? { ...m, done: true } : m) }),
    draft: text,
    sent: s.sent.map(m => {
      const wait = m.kind === 'online' && !m.done;
      const sched = m.kind === 'later';
      return { text: m.text, t: sched ? '08:00' : '23:52',
        bg: wait || sched ? 'rgba(143,211,172,.08)' : 'linear-gradient(135deg, #6FC497, #3F9A6C)', ink: wait || sched ? '#EEF3EF' : '#06150D',
        bs: wait || sched ? 'dashed' : 'solid', bd: wait || sched ? 'rgba(143,211,172,.5)' : 'transparent',
        tick: wait || sched ? 'schedule' : 'done_all',
        noteIcon: m.kind === 'silent' ? 'notifications_off' : m.kind === 'later' ? 'event' : m.kind === 'online' ? (wait ? 'hourglass_top' : 'check_circle') : 'notifications_active',
        note: m.kind === 'silent' ? 'Без звука — Анну не разбудит' : m.kind === 'later' ? 'Уйдёт завтра в 08:00' : m.kind === 'online' ? (wait ? 'Уйдёт, когда Анна появится в сети' : 'Отправлено — Анна в сети') : 'Со звуком',
        noteInk: m.kind === 'normal' ? '#8A958F' : '#8FD3AC',
        noteAnim: wait ? 'kxTick 1.2s ease-in-out 2' : 'none' };
    }),
    openMenu: () => this.setState({ menu: true }), closeMenu: () => this.setState({ menu: false }), menuOpen: s.menu ? 'true' : 'false',
    hintShow: s.menu ? 'none' : 'block',
    menu: s.menu,
    opts: [
      { i: 'notifications_off', t: 'Без звука', s: 'Придёт тихо, без уведомления', c: '#8FD3AC', bg: 'rgba(143,211,172,.16)', tap: () => add('silent') },
      { i: 'event', t: 'Отложить', s: 'Выбрать дату и время', c: '#7FB8E0', bg: 'rgba(127,184,224,.16)', tap: () => add('later') },
      { i: 'person_check', t: 'Когда будет в сети', s: 'Отправим, как только Анна зайдёт', c: '#E8B04A', bg: 'rgba(232,176,74,.16)', tap: () => add('online') },
      { i: 'send', t: 'Отправить сейчас', s: 'Обычно, со звуком', c: '#C9D2CC', bg: 'rgba(255,255,255,.08)', tap: () => add('normal') }
    ]
  };
}
}
</script>
</body>
</html>
