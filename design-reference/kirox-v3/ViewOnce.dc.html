<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Одноразовое фото</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
@keyframes kxIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes kxSpoil{from{background-position:0 0}to{background-position:30px 30px}}
@keyframes kxBurn{0%{filter:none;opacity:1;transform:none}60%{filter:blur(6px) brightness(1.6);opacity:.7}100%{filter:blur(16px) brightness(2);opacity:0;transform:scale(1.08)}}
@keyframes kxEmber{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),-140px) scale(0);opacity:0}}
@keyframes kxWarn{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #050606; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px; display: flex; align-items: center; gap: 10px; position: relative; z-index: 3">
    <button onClick="{{reset}}" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="width: 38px; height: 38px; border-radius: 19px; background: linear-gradient(135deg, #C0443C, #6A4C9C); display: flex; align-items: center; justify-content: center; font-weight: 800">Л</span>
    <div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 800">Лиза</div><div style="font-size: 12px; color: #9AA59F">одноразовое фото · 21:40</div></div>
    <div style="position: relative; width: 44px; height: 44px">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.12)" stroke-width="3"></circle><circle cx="22" cy="22" r="18" fill="none" stroke="#8FD3AC" stroke-width="3" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="{{ringOff}}" transform="rotate(-90 22 22)" style="transition: stroke-dashoffset .1s linear"></circle></svg>
      <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums">{{secs}}</span>
    </div>
  </header>

  <!-- Photo area -->
  <div style="flex: 1; position: relative; margin: 0 12px; border-radius: 28px; overflow: hidden; background: #0E1211">
    <sc-if value="{{showPhoto}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; inset: 0; background: radial-gradient(60% 40% at 50% 30%, #FFE3A3, transparent 60%), linear-gradient(180deg, #F07A5A 0%, #7A3B6A 55%, #1E1530 100%); animation: {{photoAnim}}">
        <svg viewBox="0 0 366 560" width="100%" height="100%" preserveAspectRatio="none" style="position: absolute; inset: 0" aria-hidden="true"><path d="M0 420 L80 330 L140 380 L220 290 L300 360 L366 320 L366 560 L0 560 Z" fill="#2A1A3A"></path><circle cx="183" cy="190" r="46" fill="#FFD27A" opacity=".9"></circle></svg>
        <div style="position: absolute; left: 16px; bottom: 16px; font-size: 15px; font-weight: 700; text-shadow: 0 1px 8px rgba(0,0,0,.5)">Сюрприз для мамы готов 🎁</div>
      </div>
      <sc-if value="{{burning}}" hint-placeholder-val="{{false}}">
        <sc-for list="{{embers}}" as="e" hint-placeholder-count="10"><span style="position: absolute; left: {{e.x}}; bottom: {{e.y}}; width: 6px; height: 6px; border-radius: 3px; background: {{e.c}}; --dx: {{e.dx}}; animation: kxEmber .9s ease-out {{e.d}} both"></span></sc-for>
      </sc-if>
    </sc-if>
    <sc-if value="{{hidden}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background-color: #121816; background-image: radial-gradient(rgba(255,255,255,.35) 1px, transparent 1.5px); background-size: 10px 10px; animation: kxSpoil 3s linear infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 30px">
        <span style="width: 74px; height: 74px; border-radius: 37px; background: rgba(143,211,172,.14); border: 1px solid rgba(143,211,172,.4); display: flex; align-items: center; justify-content: center; animation: kxIn .3s ease both"><span class="ms fill" style="font-size: 38px; color: #8FD3AC" aria-hidden="true">looks_one</span></span>
        <div style="font-size: 18px; font-weight: 800">Фото можно посмотреть один раз</div>
        <div style="font-size: 13px; color: #9AA59F; line-height: 1.45">Нажмите кнопку внизу — у вас будет 10 секунд. Потом фото сгорит</div>
      </div>
    </sc-if>
    <sc-if value="{{gone}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 30px; animation: kxIn .4s ease .3s both">
        <span class="ms" style="font-size: 54px; color: #3A4540" aria-hidden="true">local_fire_department</span>
        <div style="font-size: 18px; font-weight: 800">Фото исчезло</div>
        <div style="font-size: 13px; color: #9AA59F">Лиза увидит, что вы его открыли</div>
      </div>
    </sc-if>
    <sc-if value="{{shotWarn}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; left: 12px; right: 12px; top: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(229,83,75,.88); color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; animation: kxWarn .6s ease-in-out 3"><span class="ms fill" style="font-size: 20px" aria-hidden="true">screenshot_monitor</span>Скриншоты одноразовых фото заблокированы</div>
    </sc-if>
  </div>

  <div style="padding: 16px 16px 22px; display: flex; gap: 8px; align-items: center">
    <button onClick="{{tryShot}}" aria-label="Сделать скриншот" style="width: 54px; height: 54px; border-radius: 27px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center; opacity: {{shotOp}}"><span class="ms" aria-hidden="true">screenshot</span></button>
    <button onClick="{{tapMain}}" style="flex: 1; height: 54px; border-radius: 27px; background: {{mainBg}}; color: {{mainInk}}; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .2s; user-select: none; -webkit-user-select: none"><span class="ms fill" aria-hidden="true">{{mainIcon}}</span>{{mainText}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const DUR = 100;
const EMB = ['#FFD27A', '#F07A5A', '#FFB36B', '#E8B04A'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { phase: 'hidden', left: DUR, warn: 0 }; }
componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.tb); clearTimeout(this.tw); }
start() {
  const s = this.state;
  if (s.phase === 'gone' || s.phase === 'burn') return;
  this.setState({ phase: 'view' });
  clearInterval(this.iv);
  this.iv = setInterval(() => { const l = this.state.left - 1; if (l <= 0) { this.burn(); } else this.setState({ left: l }); }, 100);
}
stop() { if (this.state.phase !== 'view') return; clearInterval(this.iv); this.burn(); }
burn() { clearInterval(this.iv); this.setState({ phase: 'burn', left: 0 }); clearTimeout(this.tb); this.tb = setTimeout(() => this.setState({ phase: 'gone' }), 900); }
renderVals() {
  const s = this.state;
  const view = s.phase === 'view', burn = s.phase === 'burn';
  return {
    ringOff: String(113.1 * (1 - s.left / DUR)), secs: String(Math.ceil(s.left / 10)),
    showPhoto: view || burn, burning: burn, hidden: s.phase === 'hidden', gone: s.phase === 'gone',
    photoAnim: burn ? 'kxBurn .9s ease-in both' : 'kxIn .25s ease both',
    embers: Array.from({ length: 14 }, (_, i) => ({ x: (8 + i * 6.5) + '%', y: (20 + (i * 37) % 60) + '%', c: EMB[i % 4], dx: ((i % 5) - 2) * 18 + 'px', d: (i % 6) * 0.05 + 's' })),
    shotWarn: s.warn > 0,
    tryShot: () => { if (!view) return; clearTimeout(this.tw); this.setState({ warn: s.warn + 1 }); this.tw = setTimeout(() => this.setState({ warn: 0 }), 2600); },
    shotOp: view ? '1' : '.35',
    tapMain: () => { if (s.phase === 'gone') { clearTimeout(this.tb); this.setState({ phase: 'hidden', left: DUR }); } else if (s.phase === 'hidden') this.start(); else if (view) this.stop(); },
    mainBg: view ? 'rgba(143,211,172,.18)' : s.phase === 'gone' ? 'rgba(255,255,255,.07)' : 'linear-gradient(135deg, #6FC497, #3F9A6C)',
    mainInk: view ? '#8FD3AC' : s.phase === 'gone' ? '#C9D2CC' : '#06150D',
    mainIcon: view ? 'close' : s.phase === 'gone' ? 'replay' : 'visibility',
    mainText: view ? 'Закрыть сейчас' : burn ? 'Исчезает…' : s.phase === 'gone' ? 'Показать пример ещё раз' : 'Открыть фото',
    reset: () => { clearInterval(this.iv); clearTimeout(this.tb); this.setState({ phase: 'hidden', left: DUR }); }
  };
}
}
</script>
</body>
</html>
