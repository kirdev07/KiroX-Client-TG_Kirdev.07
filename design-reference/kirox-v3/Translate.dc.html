<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Перевод сообщений</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxShimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes kxIn{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}
@keyframes kxDrop{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px">
    <button aria-label="Назад" style="width: 42px; height: 42px; border-radius: 21px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="width: 38px; height: 38px; border-radius: 19px; background: linear-gradient(140deg,#B07A2E,#3A2A14); color: #FFE2B8; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">L</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Lucía</div><div style="font-size: 12px; color: #8FD3AC">в сети</div></div>
  </header>

  <!-- Translate bar -->
  <sc-if value="{{showBar}}" hint-placeholder-val="{{true}}">
    <div style="margin: 0 12px 4px; height: 46px; padding: 0 6px 0 14px; border-radius: 16px; background: rgba(143,211,172,.08); border: 1px solid rgba(143,211,172,.22); display: flex; align-items: center; gap: 10px; animation: kxDrop .35s ease both">
      <span class="ms" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">translate</span>
      <button onClick="{{toggleAll}}" style="flex: 1; font-size: 13px; font-weight: 700; color: #DFF5E8">{{barText}}</button>
      <button onClick="{{openLang}}" style="height: 32px; padding: 0 10px; border-radius: 12px; background: rgba(255,255,255,.06); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px">{{target}}<span class="ms" style="font-size: 16px" aria-hidden="true">expand_more</span></button>
      <button onClick="{{hideBar}}" aria-label="Скрыть" style="width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #8A958F"><span class="ms" style="font-size: 18px" aria-hidden="true">close</span></button>
    </div>
  </sc-if>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 10px 12px 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; background: radial-gradient(120% 60% at 100% 0%, rgba(63,154,108,.12), #0A0C0B 60%)">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <div style="align-self: {{m.side}}; max-width: 82%">
        <div style="padding: 8px 12px 6px; border-radius: {{m.r}}; background: {{m.bg}}; color: {{m.ink}}; font-size: 15px; line-height: 1.38">
          <sc-if value="{{m.loading}}" hint-placeholder-val="{{false}}">
            <span style="display: block; height: 12px; width: 200px; border-radius: 6px; background: linear-gradient(90deg, rgba(255,255,255,.06) 0, rgba(255,255,255,.18) 60px, rgba(255,255,255,.06) 120px); background-size: 400px 100%; animation: kxShimmer 1s linear infinite"></span>
            <span style="display: block; margin-top: 6px; height: 12px; width: 130px; border-radius: 6px; background: linear-gradient(90deg, rgba(255,255,255,.06) 0, rgba(255,255,255,.18) 60px, rgba(255,255,255,.06) 120px); background-size: 400px 100%; animation: kxShimmer 1s linear infinite"></span>
          </sc-if>
          <sc-if value="{{m.ready}}" hint-placeholder-val="{{true}}"><span style="animation: {{m.anim}}">{{m.text}}</span></sc-if>
          <div style="margin-top: 4px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 11px; color: {{m.meta}}">
            <sc-if value="{{m.isTr}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 3px"><span class="ms" style="font-size: 13px" aria-hidden="true">translate</span>{{m.from}} → {{m.to}}</span></sc-if>
            <span>{{m.time}}</span>
          </div>
        </div>
        <sc-if value="{{m.canTr}}" hint-placeholder-val="{{true}}"><button onClick="{{m.tap}}" style="margin-top: 3px; height: 26px; padding: 0 8px; border-radius: 13px; font-size: 12px; font-weight: 700; color: #8FD3AC; display: flex; align-items: center; gap: 4px">{{m.btn}}</button></sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding: 6px 10px 18px; display: flex; align-items: center; gap: 8px">
    <div style="flex: 1; height: 46px; border-radius: 23px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; padding: 0 6px 0 14px; color: #8A958F; font-size: 15px"><span style="flex: 1">Сообщение</span><button onClick="{{toggleOut}}" aria-label="Переводить мои сообщения" style="height: 34px; padding: 0 10px; border-radius: 17px; background: {{outBg}}; color: {{outInk}}; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 4px"><span class="ms" style="font-size: 16px" aria-hidden="true">translate</span>{{outLabel}}</button></div>
    <button aria-label="Голосовое" style="width: 46px; height: 46px; border-radius: 23px; background: linear-gradient(140deg, #6FC497, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">mic</span></button>
  </div>

  <!-- Language sheet -->
  <sc-if value="{{langSheet}}" hint-placeholder-val="{{false}}">
    <button aria-label="Закрыть" onClick="{{closeLang}}" style="position: absolute; inset: 0; background: rgba(0,0,0,.5); animation: kxFade .25s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 26px; border-radius: 30px 30px 0 0; background: #121614; border-top: 1px solid rgba(255,255,255,.08); animation: kxSheet .32s cubic-bezier(.2,.9,.3,1) both">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A4540; margin: 0 auto 14px"></div>
      <div style="padding: 0 4px 10px; font-size: 18px; font-weight: 800">Переводить на</div>
      <sc-for list="{{langs}}" as="l" hint-placeholder-count="4">
        <button onClick="{{l.tap}}" style="width: 100%; height: 52px; padding: 0 12px; border-radius: 16px; background: {{l.bg}}; display: flex; align-items: center; gap: 12px">
          <span style="font-size: 22px">{{l.flag}}</span><span style="flex: 1; font-size: 15px; font-weight: 600">{{l.name}}</span>
          <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}"><span class="ms fill" style="color: #8FD3AC" aria-hidden="true">check_circle</span></sc-if>
        </button>
      </sc-for>
      <div style="padding: 8px 6px 0; font-size: 12px; line-height: 17px; color: #8A958F">Перевод делает Telegram. Для части функций нужен Premium.</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const MSG = [
  { mine: false, time: '14:02', src: 'ES', t: { orig: '¡Hola! ¿Qué tal tu viaje a Barcelona?', ru: 'Привет! Как твоя поездка в Барселону?', en: 'Hi! How was your trip to Barcelona?', kk: 'Сәлем! Барселонаға сапарың қалай?' } },
  { mine: true, time: '14:05', t: { orig: 'Отлично! Было очень тепло ☀️' } },
  { mine: false, time: '14:06', src: 'ES', t: { orig: 'Me alegro mucho. ¿Probaste la paella?', ru: 'Очень рада. Ты попробовал паэлью?', en: "I'm so glad. Did you try the paella?", kk: 'Өте қуаныштымын. Паэлья жеп көрдің бе?' } },
  { mine: false, time: '14:06', src: 'ES', t: { orig: 'Te mando la receta de mi abuela 😊', ru: 'Пришлю тебе рецепт моей бабушки 😊', en: "I'll send you my grandma's recipe 😊", kk: 'Әжемнің рецептін жіберемін 😊' } }
];
const L = [['ru', '🇷🇺', 'Русский'], ['en', '🇬🇧', 'Английский'], ['kk', '🇰🇿', 'Казахский'], ['es', '🇪🇸', 'Испанский']];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tr: [], loading: [], bar: true, lang: 'ru', langSheet: false, out: false }; }
componentWillUnmount() { (this.ts || []).forEach(clearTimeout); }
translate(ids) {
  this.setState({ loading: [...this.state.loading, ...ids] });
  this.ts = this.ts || [];
  ids.forEach((id, k) => this.ts.push(setTimeout(() => this.setState({ loading: this.state.loading.filter(x => x !== id), tr: [...this.state.tr.filter(x => x !== id), id] }), 600 + k * 250)));
}
renderVals() {
  const s = this.state;
  const foreign = MSG.map((m, i) => m.src ? i : -1).filter(i => i >= 0);
  const allOn = foreign.every(i => s.tr.includes(i));
  const lname = L.find(l => l[0] === s.lang);
  const msgs = MSG.map((m, i) => {
    const isTr = s.tr.includes(i) && !!m.t[s.lang];
    const loading = s.loading.includes(i);
    return {
      side: m.mine ? 'flex-end' : 'flex-start', r: m.mine ? '18px 18px 5px 18px' : '18px 18px 18px 5px',
      bg: m.mine ? 'linear-gradient(160deg, #2E6B4B, #1F4D36)' : '#161B18', ink: m.mine ? '#E6F6EC' : '#EEF3EF', meta: m.mine ? '#A9D9BF' : '#8A958F',
      text: isTr ? m.t[s.lang] : m.t.orig, time: m.time, isTr, from: m.src || '', to: s.lang.toUpperCase(),
      loading, ready: !loading, anim: isTr ? 'kxIn .4s ease both' : 'none',
      canTr: !!m.src && !loading, btn: isTr ? 'Показать оригинал' : 'Перевести',
      tap: () => isTr ? this.setState({ tr: s.tr.filter(x => x !== i) }) : this.translate([i])
    };
  });
  return {
    msgs, showBar: s.bar,
    barText: allOn ? 'Показать оригинал' : 'Перевести чат с испанского',
    toggleAll: () => allOn ? this.setState({ tr: [] }) : this.translate(foreign.filter(i => !s.tr.includes(i))),
    hideBar: () => this.setState({ bar: false }),
    target: lname[2],
    langSheet: s.langSheet, openLang: () => this.setState({ langSheet: true }), closeLang: () => this.setState({ langSheet: false }),
    langs: L.filter(l => l[0] !== 'es').map(([id, flag, name]) => ({ flag, name, on: id === s.lang, bg: id === s.lang ? 'rgba(143,211,172,.08)' : 'transparent', tap: () => this.setState({ lang: id, langSheet: false }) })),
    outLabel: s.out ? 'RU → ES' : 'Без перевода', outBg: s.out ? 'rgba(143,211,172,.16)' : 'rgba(255,255,255,.06)', outInk: s.out ? '#8FD3AC' : '#8A958F',
    toggleOut: () => this.setState({ out: !s.out })
  };
}
}
</script>
</body>
</html>
