<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Набор стикеров</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.92)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@keyframes kxWob{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.05)}}
@keyframes kxBig{0%{opacity:0;transform:scale(.4)}60%{transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@keyframes kxBounce{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes kxIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes kxToast{0%{opacity:0;transform:translateY(16px)}12%,85%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <!-- chat behind -->
  <div style="position: absolute; inset: 0; padding: 70px 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; background: radial-gradient(120% 60% at 100% 0%, rgba(63,154,108,.14), #0A0C0B 60%)">
    <div style="align-self: flex-start; font-size: 92px; line-height: 1; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5))">🦊</div>
    <button onClick="{{open}}" style="align-self: flex-start; height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(143,211,172,.12); color: #8FD3AC; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span class="ms" style="font-size: 18px" aria-hidden="true">style</span>Открыть набор «Лис»</button>
  </div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{true}}">
    <button aria-label="Закрыть" onClick="{{close}}" style="position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: kxFade .25s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 620px; border-radius: 30px 30px 0 0; background: #121614; border-top: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; animation: kxSheet .35s cubic-bezier(.2,.9,.3,1) both">
      <div style="padding: 10px 16px 0">
        <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A4540; margin: 0 auto 12px"></div>
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 48px; height: 48px; border-radius: 16px; background: rgba(232,176,74,.12); font-size: 30px; display: flex; align-items: center; justify-content: center">🦊</span>
          <div style="flex: 1; min-width: 0"><div style="font-size: 18px; font-weight: 800">Лис</div><div style="font-size: 12px; color: #9AA59F">{{stickerCount}} · анимированные</div></div>
          <button onClick="{{share}}" aria-label="Поделиться набором" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 20px" aria-hidden="true">ios_share</span></button>
        </div>
      </div>
      <div class="scroll" style="flex: 1; min-height: 0; padding: 14px 12px 12px">
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{stickers}}" as="s" hint-placeholder-count="20">
            <button onClick="{{s.tap}}" aria-label="{{s.label}}" style="height: 82px; border-radius: 18px; background: {{s.bg}}; font-size: 52px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); animation: kxIn .3s ease {{s.d}} both"><span style="display: inline-block; animation: {{s.anim}}">{{s.e}}</span></button>
          </sc-for>
        </div>
      </div>
      <div style="padding: 10px 16px 24px; border-top: 1px solid rgba(255,255,255,.06)">
        <button onClick="{{toggleAdd}}" style="width: 100%; height: 54px; border-radius: 18px; background: {{addBg}}; color: {{addInk}}; border: 1px solid {{addBorder}}; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .25s"><span class="ms" aria-hidden="true">{{addIcon}}</span>{{addText}}</button>
      </div>
    </div>
  </sc-if>

  <!-- Big preview -->
  <sc-if value="{{preview}}" hint-placeholder-val="{{false}}">
    <button aria-label="Закрыть просмотр" onClick="{{closePreview}}" style="position: absolute; inset: 0; background: rgba(5,6,6,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: kxFade .2s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; top: 190px; display: flex; flex-direction: column; align-items: center; pointer-events: none">
      <span style="font-size: 190px; line-height: 1; filter: drop-shadow(0 20px 40px rgba(0,0,0,.6)); animation: kxBig .4s cubic-bezier(.34,1.45,.5,1) both"><span style="display: inline-block; animation: kxBounce 1.6s ease-in-out .4s 2">{{pe}}</span></span>
      <span style="margin-top: 14px; font-size: 13px; color: #9AA59F">{{pTag}}</span>
    </div>
    <div style="position: absolute; left: 24px; right: 24px; bottom: 60px; display: flex; gap: 8px">
      <button onClick="{{sendPreview}}" style="flex: 1.3; height: 52px; border-radius: 18px; background: linear-gradient(100deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms fill" style="font-size: 20px" aria-hidden="true">send</span>Отправить</button>
      <button onClick="{{favPreview}}" style="flex: 1; height: 52px; border-radius: 18px; background: rgba(255,255,255,.1); color: {{favInk}}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" style="font-size: 20px; font-variation-settings: {{favFill}}" aria-hidden="true">star</span>{{favText}}</button>
    </div>
  </sc-if>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 24px; right: 24px; top: 70px; height: 46px; border-radius: 16px; background: #1E2622; border: 1px solid rgba(143,211,172,.25); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; animation: kxToast 2.2s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">check_circle</span>{{toastText}}</div>
  </sc-if>
  <sc-if value="{{cfOpen}}" hint-placeholder-val="{{false}}">
    <button aria-label="Отмена" onClick="{{cfNo}}" style="position: absolute; inset: 0; width: 100%; background: rgba(0,0,0,.6); z-index: 50"></button>
    <div role="dialog" aria-label="{{cfTitle}}" style="position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); padding: 20px; border-radius: 28px; background: linear-gradient(180deg, #232A26, #161B18); border: 1px solid rgba(255,255,255,.14); z-index: 51; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; color: #EEF3EF">
      <div style="font-size: 18px; font-weight: 800">{{cfTitle}}</div>
      <div style="margin-top: 8px; font-size: 14px; line-height: 20px; color: #C9D2CC">{{cfText}}</div>
      <div style="margin-top: 16px; display: flex; gap: 8px"><button onClick="{{cfNo}}" style="flex: 1; height: 48px; border-radius: 24px; background: rgba(255,255,255,.08); font-size: 15px; font-weight: 700; text-align: center">Отмена</button><button onClick="{{cfYes}}" style="flex: 1; height: 48px; border-radius: 24px; background: #E5534B; color: #fff; font-size: 15px; font-weight: 800; text-align: center">{{cfYesText}}</button></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const PL = (n, a, b, c) => { const m = Math.abs(n) % 100, d = m % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d >= 2 && d <= 4 ? b : c; };

const ST = [['🦊', 'привет'], ['😏', 'хитро'], ['🍂', 'осень'], ['🔥', 'огонь'], ['🌙', 'спокойной ночи'], ['🎒', 'в путь'], ['☕', 'кофе'], ['📚', 'учёба'], ['🎸', 'музыка'], ['👋', 'пока'], ['🧣', 'холодно'], ['🏕️', 'поход'], ['😴', 'спать'], ['🥳', 'праздник'], ['🤔', 'хмм'], ['❤️', 'люблю'], ['😭', 'плачу'], ['👍', 'класс'], ['🙈', 'стыдно'], ['🫶', 'спасибо']];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sheet: true, added: false, preview: -1, fav: [], toast: 0, toastText: '' }; }
componentWillUnmount() { clearTimeout(this.tt); }
say(t) { clearTimeout(this.tt); this.setState({ toast: Date.now(), toastText: t }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2200); }
ask(title, text, yes, fn) { this._cf = fn; this.setState({ cf: { title, text, yes } }); }
renderVals() {
  const s = this.state;
  const p = s.preview >= 0 ? ST[s.preview] : null;
  const isFav = s.fav.includes(s.preview);
  return {
    cfOpen: !!this.state.cf, cfTitle: this.state.cf ? this.state.cf.title : '', cfText: this.state.cf ? this.state.cf.text : '', cfYesText: this.state.cf ? this.state.cf.yes : '', cfNo: () => this.setState({ cf: null }), cfYes: () => { const fn = this._cf; this._cf = null; this.setState({ cf: null }); if (fn) fn(); },
    
    sheet: s.sheet, open: () => this.setState({ sheet: true }), close: () => this.setState({ sheet: false }),
    stickerCount: ST.length + ' ' + PL(ST.length, 'стикер', 'стикера', 'стикеров'),
    stickers: ST.map(([e, tag], i) => ({ e, label: 'Стикер ' + tag, bg: s.fav.includes(i) ? 'rgba(232,176,74,.08)' : 'rgba(255,255,255,.03)', anim: i % 4 === 0 ? 'kxWob 2.4s ease-in-out 2' : 'none', d: (i * 0.02) + 's', tap: () => this.setState({ preview: i }) })),
    share: () => this.say('Ссылка на набор скопирована'),
    addText: s.added ? 'Удалить набор' : 'Добавить ' + ST.length + ' ' + PL(ST.length, 'стикер', 'стикера', 'стикеров'),
    addIcon: s.added ? 'delete' : 'add',
    addBg: s.added ? 'rgba(255,138,128,.08)' : 'linear-gradient(100deg, #6FC497, #3F9A6C)', addInk: s.added ? '#FF8A80' : '#06150D', addBorder: s.added ? 'rgba(255,138,128,.3)' : 'transparent',
    toggleAdd: () => { const run = () => { this.setState({ added: !s.added }); this.say(s.added ? 'Набор удалён' : 'Набор «Лис» добавлен'); }; s.added ? this.ask('Удалить набор?', 'Набор «Лис» пропадёт из ваших стикеров. Добавить его можно снова по ссылке.', 'Удалить', run) : run(); },
    preview: !!p, pe: p ? p[0] : '', pTag: p ? p[0] + ' ' + p[1] : '',
    closePreview: () => this.setState({ preview: -1 }),
    sendPreview: () => { this.setState({ preview: -1, sheet: false }); this.say('Стикер отправлен'); },
    favPreview: () => this.setState({ fav: isFav ? s.fav.filter(x => x !== s.preview) : [...s.fav, s.preview] }),
    favText: isFav ? 'В избранном' : 'В избранное', favInk: isFav ? '#E8B04A' : '#EEF3EF', favFill: isFav ? "'FILL' 1" : "'FILL' 0",
    toast: !!s.toast, toastText: s.toastText
  };
}
}
</script>
</body>
</html>
