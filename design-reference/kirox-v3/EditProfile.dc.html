<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мой профиль</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;resize:none}
input::placeholder,textarea::placeholder{color:#8A958F}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxGlow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes kxSpin{to{transform:rotate(360deg)}}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@keyframes kxPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes kxToast{0%{opacity:0;transform:translateY(16px)}12%,85%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 22px; font-weight: 800">Мой профиль</h1>
    <button onClick="{{save}}" style="height: 40px; padding: 0 16px; border-radius: 20px; background: {{saveBg}}; color: {{saveInk}}; font-size: 14px; font-weight: 700; transition: background .2s, color .2s; text-align: center">Готово</button>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 0 16px 30px">
    <!-- Avatar -->
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding: 14px 0 18px">
      <div aria-hidden="true" style="position: absolute; top: 0; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, {{glow}}, rgba(0,0,0,0) 65%); animation: kxGlow 4s ease-in-out 2"></div>
      <button onClick="{{openPhoto}}" aria-label="Изменить фото" style="position: relative; width: 116px; height: 116px; border-radius: 58px; background: {{avBg}}; color: {{avInk}}; font-size: 44px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 40px rgba(0,0,0,.5); transition: background .4s; text-align: center">
        {{initials}}
        <span style="position: absolute; right: 0; bottom: 0; width: 38px; height: 38px; border-radius: 19px; background: #8FD3AC; color: #06150D; border: 3px solid #0A0C0B; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 20px" aria-hidden="true">photo_camera</span></span>
      </button>
      <div style="position: relative; margin-top: 12px; font-size: 20px; font-weight: 800">{{fullName}}</div>
      <div style="position: relative; margin-top: 2px; font-size: 13px; color: #8FD3AC">{{handle}}</div>
    </div>

    <div style="padding: 0 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Имя</div>
    <div style="border-radius: 22px; background: rgba(255,255,255,.045); overflow: hidden">
      <label style="display: flex; align-items: center; height: 54px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.06)"><input aria-label="Имя" placeholder="Имя (обязательно)" value="{{first}}" onInput="{{onFirst}}" style="flex: 1; font-size: 16px"></label>
      <label style="display: flex; align-items: center; height: 54px; padding: 0 16px"><input aria-label="Фамилия" placeholder="Фамилия" value="{{last}}" onInput="{{onLast}}" style="flex: 1; font-size: 16px"></label>
    </div>

    <div style="padding: 16px 4px 6px; display: flex; align-items: baseline"><span style="flex: 1; font-size: 13px; font-weight: 800; color: #8FD3AC">О себе</span><span style="font-size: 12px; color: {{bioInk}}">{{bioLeft}}</span></div>
    <div style="border-radius: 22px; background: rgba(255,255,255,.045); padding: 14px 16px">
      <textarea aria-label="О себе" rows="2" maxlength="70" placeholder="Пару слов о себе" onInput="{{onBio}}" style="width: 100%; font-size: 15px; line-height: 21px">{{bio}}</textarea>
    </div>

    <div style="padding: 16px 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Имя пользователя</div>
    <div style="border-radius: 22px; background: rgba(255,255,255,.045); border: 1px solid {{userBorder}}; transition: border-color .2s">
      <label style="display: flex; align-items: center; gap: 2px; height: 54px; padding: 0 12px 0 16px">
        <span style="font-size: 16px; color: #8A958F">@</span>
        <input aria-label="Имя пользователя" placeholder="username" value="{{user}}" onInput="{{onUser}}" style="flex: 1; font-size: 16px">
        <sc-if value="{{checking}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(143,211,172,.25); border-top-color: #8FD3AC; animation: kxSpin .8s linear infinite"></span></sc-if>
        <sc-if value="{{showMark}}" hint-placeholder-val="{{true}}"><span class="ms fill" style="font-size: 20px; color: {{markInk}}; animation: kxPop .3s ease both" aria-hidden="true">{{markIcon}}</span></sc-if>
      </label>
    </div>
    <div style="padding: 6px 6px 0; font-size: 12px; line-height: 17px; color: {{userNoteInk}}">{{userNote}}</div>

    <div style="padding: 16px 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Ещё</div>
    <div style="border-radius: 22px; background: rgba(255,255,255,.045); overflow: hidden">
      <sc-for list="{{more}}" as="r" hint-placeholder-count="4">
        <button onClick="{{r.tap}}" style="width: 100%; min-height: 58px; padding: 10px 16px; display: flex; align-items: center; gap: 14px; border-top: {{r.line}}">
          <span class="ms" style="color: #8FD3AC" aria-hidden="true">{{r.icon}}</span>
          <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">{{r.label}}</span><span style="display: block; margin-top: 2px; font-size: 13px; color: #9AA59F">{{r.value}}</span></span>
          <span class="ms" style="color: #8A958F" aria-hidden="true">chevron_right</span>
        </button>
      </sc-for>
    </div>
    <div style="padding: 8px 6px 0; font-size: 12px; line-height: 17px; color: #8A958F">Кто видит номер и день рождения, настраивается в разделе «Конфиденциальность».</div>
  </div>

  <!-- Photo sheet -->
  <sc-if value="{{photoSheet}}" hint-placeholder-val="{{false}}">
    <button aria-label="Закрыть" onClick="{{closePhoto}}" style="position: absolute; inset: 0; background: rgba(0,0,0,.5); animation: kxFade .25s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 26px; border-radius: 30px 30px 0 0; background: #121614; border-top: 1px solid rgba(255,255,255,.08); animation: kxSheet .32s cubic-bezier(.2,.9,.3,1) both">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A4540; margin: 0 auto 14px"></div>
      <div style="padding: 0 4px 10px; font-size: 18px; font-weight: 800">Фото профиля</div>
      <div style="padding: 0 4px 6px; font-size: 13px; color: #9AA59F">Цвет без фото</div>
      <div style="display: flex; gap: 10px; padding: 4px 4px 14px">
        <sc-for list="{{swatches}}" as="w" hint-placeholder-count="6"><button onClick="{{w.pick}}" aria-label="{{w.label}}" style="width: 44px; height: 44px; border-radius: 22px; background: {{w.bg}}; box-shadow: {{w.ring}}; transition: box-shadow .2s"></button></sc-for>
      </div>
      <sc-for list="{{photoActs}}" as="a" hint-placeholder-count="3">
        <button onClick="{{a.tap}}" style="width: 100%; height: 52px; padding: 0 12px; border-radius: 16px; display: flex; align-items: center; gap: 14px; color: {{a.ink}}">
          <span class="ms" aria-hidden="true">{{a.icon}}</span><span style="font-size: 15px; font-weight: 600">{{a.label}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <!-- Birthday sheet -->
  <sc-if value="{{bdSheet}}" hint-placeholder-val="{{false}}">
    <button aria-label="Закрыть" onClick="{{closeBd}}" style="position: absolute; inset: 0; background: rgba(0,0,0,.5); animation: kxFade .25s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 26px; border-radius: 30px 30px 0 0; background: #121614; border-top: 1px solid rgba(255,255,255,.08); animation: kxSheet .32s cubic-bezier(.2,.9,.3,1) both">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A4540; margin: 0 auto 14px"></div>
      <div style="padding: 0 4px 12px; font-size: 18px; font-weight: 800">День рождения</div>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{wheels}}" as="c" hint-placeholder-count="2">
          <div style="flex: 1; border-radius: 20px; background: rgba(255,255,255,.045); padding: 6px; display: flex; flex-direction: column; align-items: center">
            <button onClick="{{c.up}}" aria-label="Больше" style="width: 100%; height: 34px; display: flex; align-items: center; justify-content: center; color: #8A958F"><span class="ms" aria-hidden="true">expand_less</span></button>
            <span style="font-size: 13px; color: #8A958F">{{c.prev}}</span>
            <span style="margin: 4px 0; font-size: 22px; font-weight: 800; color: #8FD3AC">{{c.cur}}</span>
            <span style="font-size: 13px; color: #8A958F">{{c.next}}</span>
            <button onClick="{{c.down}}" aria-label="Меньше" style="width: 100%; height: 34px; display: flex; align-items: center; justify-content: center; color: #8A958F"><span class="ms" aria-hidden="true">expand_more</span></button>
          </div>
        </sc-for>
      </div>
      <button onClick="{{closeBd}}" style="margin-top: 14px; width: 100%; height: 52px; border-radius: 16px; background: linear-gradient(100deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; font-weight: 700; text-align: center">Сохранить</button>
    </div>
  </sc-if>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 24px; right: 24px; bottom: 30px; height: 46px; border-radius: 16px; background: #1E2622; border: 1px solid rgba(143,211,172,.25); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; animation: kxToast 2.2s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">check_circle</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const SW = [
  ['Зелёный', 'linear-gradient(140deg,#3F9A6C,#1F4D36)', '#DFF5E8', 'rgba(70,160,110,.25)'],
  ['Фиолетовый', 'linear-gradient(140deg,#4B3F7A,#2A2240)', '#DCD0FF', 'rgba(120,100,200,.25)'],
  ['Синий', 'linear-gradient(140deg,#2F6E9E,#14243A)', '#CFE6FF', 'rgba(70,130,200,.25)'],
  ['Розовый', 'linear-gradient(140deg,#9E3F5C,#2E1420)', '#FFD0DD', 'rgba(200,80,120,.25)'],
  ['Янтарный', 'linear-gradient(140deg,#B07A2E,#3A2A14)', '#FFE2B8', 'rgba(200,150,70,.25)'],
  ['Бирюзовый', 'linear-gradient(140deg,#3A8E8A,#143A38)', '#CFFAF5', 'rgba(70,180,170,.25)']
];
const TAKEN = ['admin', 'telegram', 'kirox', 'support', 'alex'];
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { first: 'Алекс', last: 'Миронов', bio: 'Люблю горы и хороший кофе ☕', user: 'alex_m', userState: 'ok', sw: 0, photo: false, bd: false, day: 14, month: 2, dirty: false, toast: 0, toastText: '' }; }
componentWillUnmount() { clearTimeout(this.ct); clearTimeout(this.tt); }
say(t) { clearTimeout(this.tt); this.setState({ toast: Date.now(), toastText: t }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2200); }
checkUser(v) {
  clearTimeout(this.ct);
  if (!v) { this.setState({ userState: 'empty' }); return; }
  if (!/^[a-zA-Z][a-zA-Z0-9_]*$/.test(v)) { this.setState({ userState: 'bad' }); return; }
  if (v.length < 5) { this.setState({ userState: 'short' }); return; }
  this.setState({ userState: 'checking' });
  this.ct = setTimeout(() => this.setState({ userState: TAKEN.includes(v.toLowerCase()) ? 'taken' : 'ok' }), 700);
}
renderVals() {
  const s = this.state;
  const sw = SW[s.sw];
  const us = s.userState;
  const notes = {
    ok: ['Свободно. Вас найдут по ссылке t.me/' + s.user, '#8FD3AC'],
    checking: ['Проверяем…', '#9AA59F'],
    taken: ['Это имя уже занято', '#FF8A80'],
    short: ['Минимум 5 символов', '#E8B04A'],
    bad: ['Только латиница, цифры и _, начинать с буквы', '#FF8A80'],
    empty: ['Без имени пользователя вас найдут только по номеру', '#9AA59F']
  };
  const canSave = s.dirty && s.first.trim() && (us === 'ok' || us === 'empty');
  const initials = ((s.first[0] || '') + (s.last[0] || '')).toUpperCase() || '?';
  const wheel = (val, max, fmt, set) => ({
    prev: fmt(((val - 2 + max) % max) + 1), cur: fmt(val), next: fmt((val % max) + 1),
    up: () => set(((val - 2 + max) % max) + 1), down: () => set((val % max) + 1)
  });
  const more = [
    { icon: 'call', label: 'Номер телефона', value: '+7 ••• ••• •• 00', tap: () => {} },
    { icon: 'cake', label: 'День рождения', value: s.day + ' ' + MONTHS[s.month - 1], tap: () => this.setState({ bd: true }) },
    { icon: 'link', label: 'Ссылка на канал', value: 'Не указана', tap: () => {} },
    { icon: 'palette', label: 'Цвет имени и профиля · Premium', value: sw[0], tap: () => this.setState({ photo: true }) }
  ].map((r, i) => ({ ...r, line: i ? '1px solid rgba(255,255,255,.06)' : '0' }));
  return {
    first: s.first, last: s.last, bio: s.bio, user: s.user,
    onFirst: e => this.setState({ first: e.target.value, dirty: true }),
    onLast: e => this.setState({ last: e.target.value, dirty: true }),
    onBio: e => this.setState({ bio: e.target.value.slice(0, 70), dirty: true }),
    onUser: e => { const v = e.target.value.trim(); this.setState({ user: v, dirty: true }); this.checkUser(v); },
    fullName: (s.first + ' ' + s.last).trim() || 'Без имени', handle: s.user ? '@' + s.user : 'без имени пользователя',
    initials, avBg: sw[1], avInk: sw[2], glow: sw[3],
    bioLeft: String(70 - s.bio.length), bioInk: 70 - s.bio.length < 10 ? '#E8B04A' : '#8A958F',
    checking: us === 'checking', showMark: us === 'ok' || us === 'taken' || us === 'bad',
    markIcon: us === 'ok' ? 'check_circle' : 'cancel', markInk: us === 'ok' ? '#8FD3AC' : '#FF8A80',
    userBorder: us === 'taken' || us === 'bad' ? 'rgba(255,138,128,.5)' : us === 'ok' ? 'rgba(143,211,172,.35)' : 'transparent',
    userNote: notes[us][0], userNoteInk: notes[us][1],
    more,
    saveBg: canSave ? '#8FD3AC' : 'rgba(255,255,255,.07)', saveInk: canSave ? '#06150D' : '#5C6661',
    save: () => { if (canSave) { this.setState({ dirty: false }); this.say('Профиль сохранён'); } },
    photoSheet: s.photo, openPhoto: () => this.setState({ photo: true }), closePhoto: () => this.setState({ photo: false }),
    swatches: SW.map((w, i) => ({ label: w[0], bg: w[1], ring: i === s.sw ? '0 0 0 2px #121614, 0 0 0 4px #8FD3AC' : 'none', pick: () => this.setState({ sw: i, dirty: true }) })),
    photoActs: [
      { icon: 'photo_camera', label: 'Сделать фото', ink: '#EEF3EF', tap: () => this.setState({ photo: false }) },
      { icon: 'photo_library', label: 'Выбрать из галереи', ink: '#EEF3EF', tap: () => this.setState({ photo: false }) },
      { icon: 'add_reaction', label: 'Эмодзи вместо фото', ink: '#EEF3EF', tap: () => this.setState({ photo: false }) }
    ],
    bdSheet: s.bd, closeBd: () => this.setState({ bd: false, dirty: true }),
    wheels: [
      wheel(s.day, 31, v => String(v), v => this.setState({ day: v })),
      wheel(s.month, 12, v => MONTHS[v - 1], v => this.setState({ month: v }))
    ],
    toast: !!s.toast, toastText: s.toastText
  };
}
}
</script>
</body>
</html>
