<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>За рулём</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
@keyframes kxIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes kxWave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes kxRoad{from{background-position:0 0}to{background-position:0 80px}}
@keyframes kxRing{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #000; color: #F2F5F3; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <!-- road strip -->
  <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background-image: linear-gradient(180deg, rgba(143,211,172,.12) 0 40px, transparent 40px 80px); background-size: 4px 80px; animation: kxRoad 1.2s linear 2; opacity: {{roadOp}}" aria-hidden="true"></div>

  <header style="position: relative; padding: 14px 16px; display: flex; align-items: center; gap: 10px">
    <span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(143,211,172,.16); color: #8FD3AC; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 28px" aria-hidden="true">directions_car</span></span>
    <div style="flex: 1"><div style="font-size: 20px; font-weight: 800">За рулём</div><div style="font-size: 13px; color: #9AA59F">{{speedText}}</div></div>
    <button onClick="{{exit}}" style="height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(255,255,255,.1); font-size: 15px; font-weight: 700">Выйти</button>
  </header>

  <!-- Main card -->
  <div style="position: relative; margin: 6px 16px 0; padding: 22px 18px; border-radius: 30px; background: linear-gradient(180deg, #141A17, #0B0F0D); border: 1px solid rgba(143,211,172,.2); min-height: 300px; display: flex; flex-direction: column; align-items: center; text-align: center">
    <sc-if value="{{idle}}" hint-placeholder-val="{{false}}">
      <div style="margin: auto 0; animation: kxIn .3s ease both">
        <span class="ms fill" style="font-size: 64px; color: #3F9A6C" aria-hidden="true">check_circle</span>
        <div style="margin-top: 10px; font-size: 24px; font-weight: 800">Новых нет</div>
        <div style="margin-top: 6px; font-size: 16px; color: #9AA59F">Следите за дорогой 🙂</div>
      </div>
    </sc-if>
    <sc-if value="{{msg}}" hint-placeholder-val="{{true}}">
      <div style="width: 100%; animation: kxIn .3s ease both">
        <div style="position: relative; width: 96px; height: 96px; margin: 0 auto">
          <sc-if value="{{reading}}" hint-placeholder-val="{{false}}"><span style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid #8FD3AC; animation: kxRing 1.4s ease-out infinite" aria-hidden="true"></span></sc-if>
          <span style="position: absolute; inset: 0; border-radius: 50%; background: {{av}}; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800">{{l}}</span>
        </div>
        <div style="margin-top: 14px; font-size: 28px; font-weight: 800">{{name}}</div>
        <div style="margin-top: 4px; font-size: 16px; color: #9AA59F">{{countText}}</div>
        <sc-if value="{{reading}}" hint-placeholder-val="{{false}}">
          <div style="margin-top: 18px; height: 40px; display: flex; align-items: center; justify-content: center; gap: 4px" aria-hidden="true">
            <sc-for list="{{bars}}" as="b" hint-placeholder-count="16"><span style="width: 6px; height: 40px; border-radius: 3px; background: #8FD3AC; animation: kxWave .9s ease-in-out {{b}} infinite"></span></sc-for>
          </div>
          <div style="margin-top: 10px; font-size: 18px; line-height: 1.4; color: #E2E9E4">«{{text}}»</div>
        </sc-if>
        <sc-if value="{{listening}}" hint-placeholder-val="{{false}}">
          <div style="margin-top: 18px; font-size: 18px; color: #8FD3AC; font-weight: 700">Говорите ответ…</div>
          <div style="margin-top: 8px; font-size: 22px; font-weight: 800">«{{draft}}»</div>
        </sc-if>
        <sc-if value="{{sent}}" hint-placeholder-val="{{false}}"><div style="margin-top: 18px; font-size: 20px; font-weight: 800; color: #8FD3AC; display: flex; align-items: center; justify-content: center; gap: 8px"><span class="ms fill" style="font-size: 28px" aria-hidden="true">done_all</span>Отправлено</div></sc-if>
      </div>
    </sc-if>
  </div>

  <!-- Big buttons -->
  <div style="position: relative; margin: 14px 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
    <button onClick="{{listen}}" style="height: 110px; border-radius: 28px; background: rgba(255,255,255,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 800; opacity: {{btnOp}}"><span class="ms fill" style="font-size: 40px" aria-hidden="true">volume_up</span>Прочитать</button>
    <button onClick="{{reply}}" style="height: 110px; border-radius: 28px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 800; opacity: {{btnOp}}"><span class="ms fill" style="font-size: 40px" aria-hidden="true">mic</span>Ответить</button>
    <button onClick="{{call}}" style="height: 84px; border-radius: 24px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; opacity: {{btnOp}}"><span class="ms fill" style="font-size: 30px" aria-hidden="true">call</span>Позвонить</button>
    <button onClick="{{skip}}" style="height: 84px; border-radius: 24px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; opacity: {{btnOp}}"><span class="ms fill" style="font-size: 30px" aria-hidden="true">skip_next</span>Дальше</button>
  </div>

  <!-- Auto reply -->
  <button onClick="{{toggleAuto}}" style="position: relative; margin: 14px 16px 0; padding: 14px 16px; border-radius: 22px; background: rgba(255,255,255,.05); display: flex; align-items: center; gap: 12px">
    <span class="ms" style="color: #9AA59F" aria-hidden="true">smart_toy</span>
    <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 700">Отвечать «Я за рулём»</span><span style="display: block; font-size: 12px; color: #8A958F">Тем, кто пишет второй раз за 10 минут</span></span>
    <span style="width: 52px; height: 30px; border-radius: 15px; background: {{autoTrack}}; position: relative; transition: background .2s; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{autoKnob}}; width: 24px; height: 24px; border-radius: 12px; background: {{autoKnobBg}}; transition: left .2s"></span></span>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const Q = [
  { name: 'Мама', l: 'М', av: 'linear-gradient(135deg, #B07A2E, #6A4C9C)', text: 'Позвони, как доедешь', reply: 'Хорошо, позвоню через полчаса' },
  { name: 'Kotlin-клуб', l: 'K', av: 'linear-gradient(135deg, #6FA9D8, #2F6E9E)', text: 'Дмитрий: митап переносится на 12:00', reply: 'Принято, спасибо' },
  { name: 'Анна', l: 'А', av: 'linear-gradient(135deg, #C0443C, #6A4C9C)', text: 'Купишь молоко по пути?', reply: 'Да, куплю' }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0, phase: 'new', auto: true, speed: 62 }; }
componentDidMount() { this.iv = setInterval(() => this.setState({ speed: 58 + Math.round(Math.random() * 10) }), 1500); }
componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.t1); clearTimeout(this.t2); }
next() { const i = this.state.i + 1; this.setState(i >= Q.length ? { phase: 'idle', i } : { i, phase: 'new' }); }
renderVals() {
  const s = this.state;
  const m = Q[Math.min(s.i, Q.length - 1)];
  const left = Q.length - s.i;
  const idle = s.phase === 'idle';
  return {
    speedText: s.speed + ' км/ч · экран упрощён', roadOp: '1',
    idle, msg: !idle, reading: s.phase === 'read', listening: s.phase === 'listen', sent: s.phase === 'sent',
    name: m.name, l: m.l, av: m.av, text: m.text, draft: m.reply,
    countText: left > 1 ? 'Новое сообщение · ещё ' + (left - 1) + ' ждут' : 'Новое сообщение',
    bars: Array.from({ length: 16 }, (_, i) => (i * 0.07) + 's'),
    btnOp: idle ? '.35' : '1',
    listen: () => { if (idle) return; this.setState({ phase: 'read' }); clearTimeout(this.t1); this.t1 = setTimeout(() => this.setState({ phase: 'new' }), 3200); },
    reply: () => { if (idle) return; clearTimeout(this.t1); this.setState({ phase: 'listen' }); this.t1 = setTimeout(() => { this.setState({ phase: 'sent' }); clearTimeout(this.t2); this.t2 = setTimeout(() => this.next(), 1400); }, 1800); },
    call: () => {}, skip: () => { if (!idle) this.next(); },
    exit: () => this.setState({ i: 0, phase: 'new' }),
    toggleAuto: () => this.setState({ auto: !s.auto }),
    autoTrack: s.auto ? '#3F9A6C' : 'rgba(255,255,255,.18)', autoKnob: s.auto ? '25px' : '3px', autoKnobBg: s.auto ? '#F2F5F3' : '#9AA59F'
  };
}
}
</script>
</body>
</html>
