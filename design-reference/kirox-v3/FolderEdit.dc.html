<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настроить папку</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxPop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes kxPop2{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,16px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,16px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px; display: flex; align-items: center; gap: 10px">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">close</span></span>
    <span style="flex: 1; font-size: 20px; font-weight: 800">Папка</span>
    <button onClick="{{save}}" style="height: 38px; padding: 0 16px; border-radius: 19px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 14px; font-weight: 800">Сохранить</button>
  </header>

  <!-- Preview -->
  <div style="margin: 0 16px; padding: 12px; border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08)">
    <div style="font-size: 11px; font-weight: 700; color: #8A958F">ТАК БУДЕТ В СПИСКЕ ЧАТОВ</div>
    <div style="margin-top: 8px; display: flex; gap: 6px">
      <span style="height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,255,255,.05); font-size: 13px; font-weight: 700; color: #9AA59F; display: flex; align-items: center">Все</span>
      <span style="height: 34px; padding: 0 12px 0 8px; border-radius: 17px; background: {{tagBg}}; color: {{tagInk}}; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; animation: {{pop}}"><span class="ms fill" style="font-size: 18px" aria-hidden="true">{{icon}}</span>{{name}}<span style="min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: {{tagInk}}; color: #0A0C0B; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{count}}</span></span>
      <span style="height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,255,255,.05); font-size: 13px; font-weight: 700; color: #9AA59F; display: flex; align-items: center">Личные</span>
    </div>
    <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px">
      <span style="width: 42px; height: 42px; border-radius: 21px; background: #3F9A6C; display: flex; align-items: center; justify-content: center; font-weight: 800">K</span>
      <div style="flex: 1"><div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 14px; font-weight: 700">Kotlin-клуб</span><span style="display: {{chipShow}}; height: 18px; padding: 0 6px; border-radius: 9px; background: {{tagBg}}; color: {{tagInk}}; font-size: 11px; font-weight: 800; line-height: 18px">{{name}}</span></div><div style="font-size: 12px; color: #9AA59F">Дмитрий: PR готов</div></div>
    </div>
  </div>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px 16px 20px">
    <div style="font-size: 13px; font-weight: 700; color: #8FD3AC">Название</div>
    <div style="margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap">
      <sc-for list="{{names}}" as="n" hint-placeholder-count="4"><button onClick="{{n.tap}}" aria-pressed="{{n.on}}" style="height: 34px; padding: 0 12px; border-radius: 17px; background: {{n.bg}}; color: {{n.ink}}; border: 1px solid {{n.bd}}; font-size: 13px; font-weight: 700">{{n.t}}</button></sc-for>
    </div>

    <div style="margin-top: 14px; font-size: 13px; font-weight: 700; color: #8FD3AC">Значок</div>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px">
      <sc-for list="{{icons}}" as="i" hint-placeholder-count="16"><button onClick="{{i.tap}}" aria-label="{{i.i}}" aria-pressed="{{i.on}}" style="aspect-ratio: 1; border-radius: 12px; background: {{i.bg}}; color: {{i.ink}}; display: flex; align-items: center; justify-content: center"><span class="{{i.cls}}" style="font-size: 20px" aria-hidden="true">{{i.i}}</span></button></sc-for>
    </div>

    <div style="margin-top: 14px; display: flex; align-items: center"><span style="flex: 1; font-size: 13px; font-weight: 700; color: #8FD3AC">Цвет метки</span><span style="font-size: 12px; color: #9AA59F">{{colorHint}}</span></div>
    <div style="margin-top: 8px; display: flex; gap: 10px; align-items: center">
      <sc-for list="{{colors}}" as="c" hint-placeholder-count="7"><button onClick="{{c.tap}}" aria-label="{{c.name}}" aria-pressed="{{c.on}}" style="width: 36px; height: 36px; border-radius: 18px; background: {{c.c}}; border: 3px solid {{c.bd}}; box-shadow: {{c.sh}}; display: flex; align-items: center; justify-content: center; color: #0A0C0B"><span class="ms" style="font-size: 18px; font-weight: 700; display: {{c.tick}}" aria-hidden="true">{{c.icon}}</span></button></sc-for>
    </div>

    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC">Что входит</div>
    <div style="margin-top: 6px; border-radius: 18px; background: rgba(255,255,255,.04); padding: 0 12px">
      <sc-for list="{{inc}}" as="o" hint-placeholder-count="4"><button onClick="{{o.tap}}" role="switch" aria-checked="{{o.on}}" style="width: 100%; min-height: 50px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{o.line}}"><span class="ms" style="color: #9AA59F" aria-hidden="true">{{o.i}}</span><span style="flex: 1; font-size: 15px; font-weight: 600">{{o.t}}</span><span style="width: 42px; height: 26px; border-radius: 13px; background: {{o.tr}}; position: relative; flex-shrink: 0; transition: background .2s"><span style="position: absolute; top: 3px; left: {{o.x}}; width: 20px; height: 20px; border-radius: 10px; background: {{o.kn}}; transition: left .2s"></span></span></button></sc-for>
    </div>
    <div style="margin-top: 14px; font-size: 13px; font-weight: 700; color: #8FD3AC">Не показывать</div>
    <div style="margin-top: 6px; border-radius: 18px; background: rgba(255,255,255,.04); padding: 0 12px">
      <sc-for list="{{exc}}" as="o" hint-placeholder-count="3"><button onClick="{{o.tap}}" role="switch" aria-checked="{{o.on}}" style="width: 100%; min-height: 50px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{o.line}}"><span class="ms" style="color: #9AA59F" aria-hidden="true">{{o.i}}</span><span style="flex: 1; font-size: 15px; font-weight: 600">{{o.t}}</span><span style="width: 42px; height: 26px; border-radius: 13px; background: {{o.tr}}; position: relative; flex-shrink: 0; transition: background .2s"><span style="position: absolute; top: 3px; left: {{o.x}}; width: 20px; height: 20px; border-radius: 10px; background: {{o.kn}}; transition: left .2s"></span></span></button></sc-for>
    </div>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 26px; padding: 12px 16px; border-radius: 18px; background: rgba(40,48,44,.96); border: 1px solid rgba(255,255,255,.12); font-size: 13px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2s ease both"><span class="ms fill" style="font-size: 18px; color: #8FD3AC" aria-hidden="true">check_circle</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const ICONS = ['code', 'work', 'home', 'school', 'favorite', 'sports_esports', 'flight', 'shopping_cart', 'groups', 'campaign', 'smart_toy', 'star', 'music_note', 'pets', 'fitness_center', 'restaurant'];
const COLORS = [['Без цвета', 'rgba(255,255,255,.12)', '#C9D2CC'], ['Зелёный', '#8FD3AC', '#8FD3AC'], ['Голубой', '#7FB8E0', '#7FB8E0'], ['Фиолетовый', '#C9A0E0', '#C9A0E0'], ['Розовый', '#F5A3C0', '#F5A3C0'], ['Янтарный', '#E8B04A', '#E8B04A'], ['Красный', '#FF8A80', '#FF8A80']];
const NAMES = ['Код', 'Работа', 'Учёба', 'Хобби'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { name: 0, icon: 0, color: 1, inc: { groups: true, channels: true, contacts: false, bots: true }, exc: { muted: false, read: true, arch: true }, pk: 0, toast: '', tk: 0 }; }
componentWillUnmount() { clearTimeout(this.tt); }
renderVals() {
  const s = this.state;
  const col = COLORS[s.color];
  const sw = (on) => ({ tr: on ? '#3F9A6C' : 'rgba(255,255,255,.14)', kn: on ? '#EEF3EF' : '#9AA59F', x: on ? '19px' : '3px', on: on ? 'true' : 'false' });
  const pop = (s.pk % 2 ? 'kxPop2' : 'kxPop') + ' .3s ease both';
  const count = (s.inc.groups ? 4 : 0) + (s.inc.channels ? 3 : 0) + (s.inc.contacts ? 6 : 0) + (s.inc.bots ? 1 : 0) - (s.exc.read ? 2 : 0) - (s.exc.muted ? 1 : 0);
  return {
    name: NAMES[s.name], icon: ICONS[s.icon], pop: s.pk ? pop : 'none', count: Math.max(0, count),
    tagBg: s.color === 0 ? 'rgba(255,255,255,.08)' : col[1] + '26', tagInk: col[2],
    chipShow: s.color === 0 ? 'none' : 'inline-block',
    colorHint: s.color === 0 ? 'метки в чатах не будет' : 'метка видна у чатов в «Все»',
    names: NAMES.map((t, i) => { const on = s.name === i; return { t, on: on ? 'true' : 'false', bg: on ? 'rgba(143,211,172,.16)' : 'rgba(255,255,255,.05)', ink: on ? '#8FD3AC' : '#C9D2CC', bd: on ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', tap: () => this.setState({ name: i, pk: s.pk + 1 }) }; }),
    icons: ICONS.map((i, k) => { const on = s.icon === k; return { i, on: on ? 'true' : 'false', bg: on ? (s.color === 0 ? 'rgba(255,255,255,.12)' : col[1] + '30') : 'rgba(255,255,255,.04)', ink: on ? col[2] : '#9AA59F', cls: on ? 'ms fill' : 'ms', tap: () => this.setState({ icon: k, pk: s.pk + 1 }) }; }),
    colors: COLORS.map(([name, c], k) => { const on = s.color === k; return { name, c, on: on ? 'true' : 'false', bd: on ? '#EEF3EF' : 'transparent', sh: on ? '0 0 0 3px ' + (k ? c + '55' : 'rgba(255,255,255,.2)') : 'none', tick: on ? 'inline-block' : (k === 0 ? 'inline-block' : 'none'), icon: k === 0 ? 'block' : 'check', tap: () => this.setState({ color: k, pk: s.pk + 1 }) }; }),
    inc: [['groups', 'groups', 'Группы'], ['channels', 'campaign', 'Каналы'], ['contacts', 'person', 'Личные чаты с контактами'], ['bots', 'smart_toy', 'Боты']].map(([k, i, t], n, a) => ({ i, t, ...sw(s.inc[k]), line: n < a.length - 1 ? 'rgba(255,255,255,.06)' : 'transparent', tap: () => this.setState({ inc: { ...s.inc, [k]: !s.inc[k] }, pk: s.pk + 1 }) })),
    exc: [['muted', 'notifications_off', 'Без звука'], ['read', 'done_all', 'Прочитанные'], ['arch', 'archive', 'Архивные']].map(([k, i, t], n, a) => ({ i, t, ...sw(s.exc[k]), line: n < a.length - 1 ? 'rgba(255,255,255,.06)' : 'transparent', tap: () => this.setState({ exc: { ...s.exc, [k]: !s.exc[k] }, pk: s.pk + 1 }) })),
    save: () => { clearTimeout(this.tt); this.setState({ toast: 'Папка «' + NAMES[s.name] + '» сохранена', tk: s.tk + 1 }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2000); },
    toast: !!s.toast, toastText: s.toast
  };
}
}
</script>
</body>
</html>
