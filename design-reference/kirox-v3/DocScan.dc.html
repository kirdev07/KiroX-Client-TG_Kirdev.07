<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сканер документов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94)}
@keyframes kxScan{0%{top:6%}100%{top:90%}}
@keyframes kxFlash{0%{opacity:.9}100%{opacity:0}}
@keyframes kxSnap{0%{transform:scale(1)}100%{transform:translate(-120px,330px) scale(.18);opacity:.6}}
@keyframes kxIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes kxHint{0%,100%{opacity:.6}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #050606; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px; display: flex; align-items: center; gap: 8px; position: relative; z-index: 3">
    <button aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">close</span></button>
    <div style="flex: 1; text-align: center; font-size: 15px; font-weight: 800">Сканер документов</div>
    <button onClick="{{toggleAuto}}" style="height: 36px; padding: 0 12px; border-radius: 18px; background: {{autoBg}}; color: {{autoInk}}; font-size: 12px; font-weight: 800">{{autoText}}</button>
  </header>

  <!-- Viewfinder -->
  <div style="position: relative; flex: 1; min-height: 0; margin: 0 12px; border-radius: 26px; overflow: hidden; background: radial-gradient(80% 60% at 40% 30%, #3A2E22, #14100C)">
    <!-- desk & paper -->
    <div style="position: absolute; left: 50%; top: 50%; width: 230px; height: 310px; margin: -155px 0 0 -115px; transform: rotate({{tilt}}); background: {{paper}}; border-radius: 4px; box-shadow: 0 20px 40px rgba(0,0,0,.6); transition: transform .4s, background .3s; animation: {{snap}}; padding: 22px 18px; box-sizing: border-box">
      <div style="height: 10px; width: 60%; border-radius: 3px; background: {{ink}}"></div>
      <div style="margin-top: 14px; height: 6px; width: 90%; border-radius: 3px; background: {{ink2}}"></div>
      <div style="margin-top: 8px; height: 6px; width: 84%; border-radius: 3px; background: {{ink2}}"></div>
      <div style="margin-top: 8px; height: 6px; width: 70%; border-radius: 3px; background: {{ink2}}"></div>
      <div style="margin-top: 20px; height: 6px; width: 88%; border-radius: 3px; background: {{ink2}}"></div>
      <div style="margin-top: 8px; height: 6px; width: 92%; border-radius: 3px; background: {{ink2}}"></div>
      <div style="margin-top: 8px; height: 6px; width: 60%; border-radius: 3px; background: {{ink2}}"></div>
      <div style="position: absolute; right: 18px; bottom: 26px; width: 70px; height: 30px; border-radius: 50%; border: 2px solid {{ink}}; transform: rotate(-12deg); opacity: .7"></div>
    </div>
    <!-- detected frame -->
    <sc-if value="{{detected}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: 50%; top: 50%; width: 240px; height: 320px; margin: -160px 0 0 -120px; transform: rotate({{tilt}}); border: 3px solid #8FD3AC; border-radius: 6px; background: rgba(143,211,172,.08); box-shadow: 0 0 20px rgba(143,211,172,.4); transition: transform .4s; animation: kxIn .3s ease both">
        <span style="position: absolute; left: -7px; top: -7px; width: 12px; height: 12px; border-radius: 6px; background: #8FD3AC"></span><span style="position: absolute; right: -7px; top: -7px; width: 12px; height: 12px; border-radius: 6px; background: #8FD3AC"></span><span style="position: absolute; left: -7px; bottom: -7px; width: 12px; height: 12px; border-radius: 6px; background: #8FD3AC"></span><span style="position: absolute; right: -7px; bottom: -7px; width: 12px; height: 12px; border-radius: 6px; background: #8FD3AC"></span>
        <span style="position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #8FD3AC, transparent); animation: kxScan 1.6s ease-in-out infinite alternate"></span>
      </div>
    </sc-if>
    <sc-if value="{{flash}}" hint-placeholder-val="{{false}}"><span style="position: absolute; inset: 0; background: #fff; animation: kxFlash .35s ease both"></span></sc-if>
    <div style="position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center"><span style="padding: 6px 14px; border-radius: 14px; background: rgba(0,0,0,.55); font-size: 13px; font-weight: 700; animation: kxHint 1.6s ease-in-out 2">{{hint}}</span></div>
  </div>

  <!-- Filters -->
  <div style="padding: 12px 16px 0; display: flex; gap: 6px; justify-content: center">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="3"><button onClick="{{f.tap}}" style="height: 32px; padding: 0 12px; border-radius: 16px; background: {{f.bg}}; color: {{f.ink}}; font-size: 12px; font-weight: 700">{{f.label}}</button></sc-for>
  </div>

  <!-- Bottom -->
  <div style="padding: 14px 20px 24px; display: flex; align-items: center; justify-content: space-between">
    <div style="position: relative; width: 56px; height: 56px">
      <sc-for list="{{pages}}" as="p" hint-placeholder-count="3"><span style="position: absolute; inset: 0; border-radius: 10px; background: #F2EFE6; border: 2px solid #0A0C0B; transform: rotate({{p.r}}) translate({{p.t}}); animation: kxIn .3s ease both"></span></sc-for>
      <sc-if value="{{hasPages}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: -6px; top: -6px; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #8FD3AC; color: #06150D; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{pageN}}</span></sc-if>
    </div>
    <button onClick="{{shoot}}" aria-label="Снять страницу" style="width: 76px; height: 76px; border-radius: 38px; background: transparent; border: 4px solid #EEF3EF; display: flex; align-items: center; justify-content: center"><span style="width: 60px; height: 60px; border-radius: 30px; background: {{shutter}}; transition: background .2s"></span></button>
    <button onClick="{{done}}" aria-label="Готово" style="width: 56px; height: 56px; border-radius: 28px; background: {{doneBg}}; color: {{doneInk}}; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">{{doneIcon}}</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const FIL = [['Цвет', 'color'], ['Ч/Б документ', 'bw'], ['Оригинал', 'orig']];
const TILTS = ['-6deg', '4deg', '-2deg', '7deg'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { pages: 0, flash: 0, snap: 0, filter: 'bw', auto: true, tilt: 0, sent: false }; }
componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); }
shoot() {
  if (this.state.sent) return;
  this.setState({ flash: this.state.flash + 1, snap: 1 });
  clearTimeout(this.t1);
  this.t1 = setTimeout(() => this.setState({ snap: 0, pages: this.state.pages + 1, tilt: (this.state.tilt + 1) % TILTS.length }), 500);
}
renderVals() {
  const s = this.state;
  const bw = s.filter === 'bw', orig = s.filter === 'orig';
  return {
    toggleAuto: () => this.setState({ auto: !s.auto }), autoText: s.auto ? 'Авто' : 'Вручную', autoBg: s.auto ? 'rgba(143,211,172,.18)' : 'rgba(255,255,255,.1)', autoInk: s.auto ? '#8FD3AC' : '#EEF3EF',
    tilt: TILTS[s.tilt], paper: orig ? '#E8DCC4' : bw ? '#FFFFFF' : '#F6F1E4', ink: bw ? '#0A0C0B' : '#1F3A6E', ink2: bw ? '#3A3A3A' : '#6E7C8C',
    snap: s.snap ? 'kxSnap .5s cubic-bezier(.5,0,.8,.4) both' : 'none',
    detected: !s.snap && !s.sent, flash: s.flash > 0 && s.snap,
    hint: s.sent ? 'Отправлено в «Работа» как PDF' : s.snap ? 'Снято!' : s.auto ? 'Документ найден — держите ровно' : 'Нажмите на кнопку',
    filters: FIL.map(([label, k]) => ({ label, bg: s.filter === k ? 'rgba(143,211,172,.18)' : 'rgba(255,255,255,.08)', ink: s.filter === k ? '#8FD3AC' : '#C9D2CC', tap: () => this.setState({ filter: k }) })),
    pages: Array.from({ length: Math.min(3, s.pages) }, (_, i) => ({ r: (i * 6 - 6) + 'deg', t: (i * 2) + 'px,' + (-i * 2) + 'px' })),
    hasPages: s.pages > 0, pageN: String(s.pages),
    shoot: () => this.shoot(), shutter: s.snap ? '#8FD3AC' : '#EEF3EF',
    doneBg: s.pages && !s.sent ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.1)', doneInk: s.pages && !s.sent ? '#06150D' : '#9AA59F',
    doneIcon: s.sent ? 'replay' : 'send',
    done: () => { if (s.sent) this.setState({ sent: false, pages: 0 }); else if (s.pages) this.setState({ sent: true }); }
  };
}
}
</script>
</body>
</html>
