<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>В этот день</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
@keyframes kxCard{from{opacity:0;transform:translateX(60px) rotate(6deg)}to{opacity:1;transform:none}}
@keyframes kxCardB{from{opacity:0;transform:translateX(-60px) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes kxCard2{from{opacity:0;transform:translateX(60px) rotate(6deg)}to{opacity:1;transform:none}}
@keyframes kxCardB2{from{opacity:0;transform:translateX(-60px) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes kxKen{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.12) translate(-4%,-3%)}}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <div style="flex: 1"><h1 style="margin: 0; font-size: 20px; font-weight: 800">В этот день</h1><div style="font-size: 12px; color: #9AA59F">22 ноября</div></div>
  </header>

  <!-- Year chips -->
  <div style="padding: 6px 16px 0; display: flex; gap: 6px">
    <sc-for list="{{years}}" as="y" hint-placeholder-count="3"><button onClick="{{y.tap}}" style="height: 34px; padding: 0 14px; border-radius: 17px; background: {{y.bg}}; color: {{y.ink}}; font-size: 13px; font-weight: 700; transition: all .2s">{{y.label}}</button></sc-for>
  </div>

  <!-- Memory card -->
  <div style="flex: 1; min-height: 0; padding: 14px 16px 0; display: flex; flex-direction: column">
    <div style="position: relative; flex: 1; border-radius: 30px; overflow: hidden; animation: {{cardAnim}}; box-shadow: 0 20px 50px rgba(0,0,0,.5)">
      <div style="position: absolute; inset: -6%; background: {{bg}}; animation: kxKen 9s ease-in-out 2 alternate"></div>
      <span class="ms fill" style="position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%); font-size: 110px; color: rgba(255,255,255,.55)" aria-hidden="true">{{icon}}</span>
      <div style="position: absolute; left: 14px; right: 14px; top: 12px; display: flex; gap: 4px">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="flex: 1; height: 3px; border-radius: 2px; background: {{d}}"></span></sc-for>
      </div>
      <div style="position: absolute; left: 16px; top: 26px; padding: 6px 12px; border-radius: 14px; background: rgba(0,0,0,.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 12px; font-weight: 800">{{ago}}</div>
      <button onClick="{{prev}}" aria-label="Предыдущее воспоминание" style="position: absolute; left: 0; top: 0; bottom: 140px; width: 40%"></button>
      <button onClick="{{next}}" aria-label="Следующее воспоминание" style="position: absolute; right: 0; top: 0; bottom: 140px; width: 60%"></button>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 50px 16px 16px; background: linear-gradient(180deg, transparent, rgba(0,0,0,.8))">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 28px; height: 28px; border-radius: 14px; background: {{who}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">{{whoL}}</span>
          <span style="font-size: 13px; color: #C9D2CC">{{chat}}</span>
        </div>
        <div style="margin-top: 8px; font-size: 20px; font-weight: 800; line-height: 1.25">{{caption}}</div>
        <div style="margin-top: 4px; font-size: 13px; color: #C9D2CC">{{sub}}</div>
      </div>
    </div>
  </div>

  <div style="padding: 14px 16px 22px; display: flex; gap: 8px">
    <button onClick="{{hide}}" aria-label="Не показывать такое" style="width: 54px; height: 54px; border-radius: 27px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center; color: #9AA59F"><span class="ms" aria-hidden="true">visibility_off</span></button>
    <button onClick="{{openChat}}" style="flex: 1; height: 54px; border-radius: 27px; background: rgba(255,255,255,.08); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" style="font-size: 20px" aria-hidden="true">chat</span>К переписке</button>
    <button onClick="{{share}}" style="flex: 1.2; height: 54px; border-radius: 27px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms fill" style="font-size: 20px" aria-hidden="true">send</span>{{shareText}}</button>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 96px; padding: 12px 18px; border-radius: 18px; background: #232A26; border: 1px solid rgba(255,255,255,.16); font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2.4s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">{{toastIcon}}</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const MEM = [
  { year: 2025, chat: 'Анна', l: 'А', c: '#C0443C', caption: 'Первый снег на Кок-Тобе ❄️', sub: '12 фото · вы переписывались весь вечер', icon: 'ac_unit', bg: 'radial-gradient(70% 50% at 50% 30%, #E9F2F7, transparent 60%), linear-gradient(180deg, #9CC4E8, #3E6A8A 70%, #1B2F3E)', to: 'чат «Анна»' },
  { year: 2025, chat: 'Семья', l: 'С', c: '#2F6E9E', caption: 'Бабушкин пирог по новому рецепту', sub: 'Мама: «Получилось даже лучше!»', icon: 'bakery_dining', bg: 'radial-gradient(60% 50% at 40% 30%, #F4E7C5, transparent 60%), linear-gradient(180deg, #C9925A, #4A2E1E)', to: 'в чат «Семья»' },
  { year: 2024, chat: 'Kotlin-клуб', l: 'K', c: '#3F9A6C', caption: 'Первый митап клуба', sub: '23 человека · фото со сцены', icon: 'groups', bg: 'radial-gradient(70% 50% at 60% 30%, #8FD3AC, transparent 60%), linear-gradient(160deg, #1E4B36, #0E1C16)', to: 'в «Kotlin-клуб»' },
  { year: 2024, chat: 'Лиза', l: 'Л', c: '#6A4C9C', caption: 'Котёнок Мармелад приехал домой 🐱', sub: 'Самое популярное фото года', icon: 'pets', bg: 'radial-gradient(70% 50% at 50% 30%, #F2A6A0, transparent 60%), linear-gradient(160deg, #C0443C, #250C0A)', to: 'чат «Лиза»' }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0, dir: 1, k: 0, hidden: {}, toast: 0, toastText: '', toastIcon: 'done' }; }
componentWillUnmount() { clearTimeout(this.tt); }
toastMsg(text, icon) { clearTimeout(this.tt); this.setState({ toast: this.state.toast + 1, toastText: text, toastIcon: icon }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2400); }
renderVals() {
  const s = this.state;
  const list = MEM.map((m, i) => ({ m, i })).filter(({ i }) => !s.hidden[i]);
  const cur = list[Math.min(s.i, list.length - 1)] || { m: MEM[0], i: 0 };
  const m = cur.m;
  const pos = list.indexOf(cur);
  const go = d => { const n = pos + d; if (n < 0 || n >= list.length) return; this.setState({ i: n, dir: d, k: s.k + 1 }); };
  return {
    years: [['Всё', 0], ['Год назад', 2025], ['2 года', 2024]].map(([label, y]) => { const on = y === 0 || m.year === y; const active = y !== 0 && m.year === y; return { label, bg: active ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.05)', ink: active ? '#8FD3AC' : '#C9D2CC', tap: () => { if (!y) { this.setState({ i: 0, dir: -1, k: s.k + 1 }); return; } const n = list.findIndex(x => x.m.year === y); if (n >= 0) this.setState({ i: n, dir: 1, k: s.k + 1 }); } }; }),
    cardAnim: (s.dir < 0 ? 'kxCardB' : 'kxCard') + (s.k % 2 ? '2' : '') + ' .4s cubic-bezier(.2,.8,.2,1) both',
    bg: m.bg, icon: m.icon, ago: 2026 - m.year === 1 ? 'Год назад' : (2026 - m.year) + ' года назад',
    dots: list.map((_, k) => k === pos ? '#fff' : 'rgba(255,255,255,.35)'),
    prev: () => go(-1), next: () => go(1),
    who: m.c, whoL: m.l, chat: m.chat, caption: m.caption, sub: m.sub,
    shareText: 'Поделиться',
    share: () => this.toastMsg('Выберите, кому переслать', 'forward'),
    openChat: () => this.toastMsg('Откроется переписка за 22 ноября ' + m.year, 'chat'),
    hide: () => { if (list.length <= 1) return; this.setState({ hidden: { ...s.hidden, [cur.i]: true }, i: Math.max(0, pos - (pos === list.length - 1 ? 1 : 0)), k: s.k + 1 }); this.toastMsg('Больше не покажем', 'visibility_off'); },
    toast: s.toast > 0, toastText: s.toastText, toastIcon: s.toastIcon
  };
}
}
</script>
</body>
</html>
