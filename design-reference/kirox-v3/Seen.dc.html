<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кто прочитал</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@keyframes kxIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes kxReact{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes kxFloat{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-60px) scale(1.6);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.05)">
    <button aria-label="Назад" style="width: 42px; height: 42px; border-radius: 21px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="width: 38px; height: 38px; border-radius: 19px; background: linear-gradient(140deg,#7A5A2E,#3A2A14); color: #FFE2B8; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">С</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Семья</div><div style="font-size: 12px; color: #9AA59F">7 участников</div></div>
  </header>

  <div style="flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; background: radial-gradient(120% 60% at 100% 0%, rgba(63,154,108,.14), #0A0C0B 60%)">
    <div style="position: relative; align-self: flex-end; max-width: 82%">
      <div style="padding: 9px 12px 7px; border-radius: 18px 18px 5px 18px; background: linear-gradient(160deg, #2E6B4B, #1F4D36); color: #E6F6EC; font-size: 15px; line-height: 1.38">В воскресенье все у бабушки в 14:00, не забудьте торт 🎂
        <div style="margin-top: 4px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; color: #A9D9BF">15:20 <span class="ms" style="font-size: 15px" aria-hidden="true">done_all</span></div>
      </div>
      <div style="margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; flex-wrap: wrap">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
          <button onClick="{{c.tap}}" style="position: relative; height: 30px; padding: 0 9px 0 6px; border-radius: 15px; background: {{c.bg}}; border: 1px solid {{c.border}}; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; transition: all .2s">
            <span style="font-size: 16px; animation: {{c.anim}}">{{c.e}}</span>{{c.n}}
            <sc-if value="{{c.float}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; left: 4px; top: -4px; font-size: 18px; animation: kxFloat .8s ease-out both">{{c.e}}</span></sc-if>
          </button>
        </sc-for>
      </div>
      <button onClick="{{open}}" style="margin-top: 6px; margin-left: auto; height: 32px; padding: 0 10px 0 4px; border-radius: 16px; background: rgba(255,255,255,.06); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #C9D2CC">
        <span style="display: flex">
          <sc-for list="{{faces}}" as="f" hint-placeholder-count="3"><span style="width: 24px; height: 24px; margin-left: -6px; border-radius: 12px; background: {{f.av}}; border: 2px solid #0A0C0B; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{f.init}}</span></sc-for>
        </span>
        {{seenText}}<span class="ms" style="font-size: 16px" aria-hidden="true">chevron_right</span>
      </button>
    </div>
  </div>
  <div style="padding: 6px 10px 18px"><div style="height: 46px; border-radius: 23px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; padding: 0 14px; color: #8A958F; font-size: 15px">Сообщение</div></div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{true}}">
    <button aria-label="Закрыть" onClick="{{close}}" style="position: absolute; inset: 0; background: rgba(0,0,0,.5); animation: kxFade .25s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; border-radius: 30px 30px 0 0; background: #121614; border-top: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; animation: kxSheet .32s cubic-bezier(.2,.9,.3,1) both">
      <div style="padding: 10px 16px 0">
        <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A4540; margin: 0 auto 12px"></div>
        <div class="scroll" style="display: flex; gap: 6px; overflow-x: auto">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button onClick="{{t.tap}}" style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 18px; background: {{t.bg}}; color: {{t.ink}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px; transition: all .2s"><sc-if value="{{t.isIcon}}" hint-placeholder-val="{{true}}"><span class="ms" style="font-size: 17px" aria-hidden="true">{{t.icon}}</span></sc-if><sc-if value="{{t.isEmoji}}" hint-placeholder-val="{{false}}"><span style="font-size: 16px">{{t.icon}}</span></sc-if>{{t.n}}</button></sc-for>
        </div>
      </div>
      <div class="scroll" style="flex: 1; min-height: 0; padding: 10px 10px 20px">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 12px; padding: 8px 8px; animation: kxIn .25s ease {{p.d}} both; opacity: {{p.op}}">
            <span style="width: 44px; height: 44px; border-radius: 22px; background: {{p.av}}; color: #fff; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{p.init}}</span>
            <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 700">{{p.name}}</span><span style="display: flex; align-items: center; gap: 4px; margin-top: 2px; font-size: 12px; color: {{p.subInk}}"><span class="ms" style="font-size: 14px" aria-hidden="true">{{p.subIcon}}</span>{{p.sub}}</span></span>
            <sc-if value="{{p.hasR}}" hint-placeholder-val="{{false}}"><span style="font-size: 22px">{{p.r}}</span></sc-if>
          </div>
        </sc-for>
        <sc-if value="{{showHidden}}" hint-placeholder-val="{{false}}"><div style="padding: 10px 8px 0; font-size: 12px; line-height: 17px; color: #8A958F">Время прочтения видно 7 дней. Кто скрыл время в сети, тот не попадает в список.</div></sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const P = [
  { name: 'Мама', av: '#A8456A', seen: '15:21', r: '❤️' },
  { name: 'Папа', av: '#2F6E9E', seen: '15:24', r: '👍' },
  { name: 'Бабушка', av: '#B07A2E', seen: '15:40', r: '❤️' },
  { name: 'Дана', av: '#6A4C9C', seen: '16:02', r: '🎂' },
  { name: 'Тимур', av: '#3F7A5A', seen: '16:15', r: '' },
  { name: 'Дядя Олег', av: '#2E8A86', seen: '', r: '' }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sheet: true, tab: 'all', mine: '', floatAt: 0, floatE: '' }; }
renderVals() {
  const s = this.state;
  const all = s.mine ? [...P, { name: 'Вы', av: '#3F9A6C', seen: '15:20', r: s.mine, me: true }] : P;
  const counts = {};
  all.forEach(p => { if (p.r) counts[p.r] = (counts[p.r] || 0) + 1; });
  const emojis = ['❤️', '👍', '🎂'];
  const seenN = P.filter(p => p.seen).length;
  const toggle = e => this.setState({ mine: s.mine === e ? '' : e, floatAt: s.mine === e ? 0 : Date.now(), floatE: e });
  const list = s.tab === 'all' ? all.filter(p => !p.me) : s.tab === 'seen' ? P.filter(p => p.seen) : s.tab === 'unseen' ? P.filter(p => !p.seen) : all.filter(p => p.r === s.tab);
  return {
    chips: emojis.filter(e => counts[e]).map(e => ({ e, n: String(counts[e]), bg: s.mine === e ? 'rgba(143,211,172,.2)' : 'rgba(255,255,255,.07)', border: s.mine === e ? 'rgba(143,211,172,.5)' : 'transparent', anim: s.mine === e ? 'kxReact .4s ease both' : 'none', float: s.floatE === e && s.floatAt && Date.now() - s.floatAt < 900, tap: () => toggle(e) })),
    faces: P.filter(p => p.seen).slice(0, 3).map(p => ({ av: p.av, init: p.name[0] })),
    seenText: 'Прочитали ' + seenN + ' из ' + P.length,
    sheet: s.sheet, open: () => this.setState({ sheet: true }), close: () => this.setState({ sheet: false }),
    tabs: [
      { id: 'all', icon: 'groups', n: String(P.length), isIcon: true },
      { id: 'seen', icon: 'done_all', n: String(seenN), isIcon: true },
      { id: 'unseen', icon: 'schedule', n: String(P.length - seenN), isIcon: true },
      ...Object.keys(counts).map(e => ({ id: e, icon: e, n: String(counts[e]), isIcon: false }))
    ].map(t => ({ ...t, isEmoji: !t.isIcon, bg: s.tab === t.id ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.05)', ink: s.tab === t.id ? '#8FD3AC' : '#C9D2CC', tap: () => this.setState({ tab: t.id }) })),
    people: list.map((p, i) => ({
      name: p.name, init: p.name[0], av: p.av, r: p.r, hasR: !!p.r, d: (i * 0.03) + 's', op: p.seen ? '1' : '.6',
      sub: p.seen ? 'прочитал(а) в ' + p.seen : 'ещё не прочитал(а)', subIcon: p.seen ? 'done_all' : 'schedule', subInk: p.seen ? '#8FD3AC' : '#8A958F'
    })),
    showHidden: s.tab === 'all' || s.tab === 'seen'
  };
}
}
</script>
</body>
</html>
