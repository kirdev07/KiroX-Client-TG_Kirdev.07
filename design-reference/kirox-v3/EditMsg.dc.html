<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Изменить сообщение</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
input{font:inherit;color:inherit}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@keyframes kxPulse{0%{box-shadow:0 0 0 0 rgba(143,211,172,.6)}100%{box-shadow:0 0 0 10px rgba(143,211,172,0)}}
@keyframes kxMorph{0%{opacity:.3;filter:blur(3px)}100%{opacity:1;filter:none}}
@keyframes kxMorph2{0%{opacity:.3;filter:blur(3px)}100%{opacity:1;filter:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(135deg, #6FA9D8, #2F6E9E); display: flex; align-items: center; justify-content: center; font-weight: 800">K</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Kotlin-клуб</div><div style="font-size: 12px; color: #9AA59F">1 284 участника</div></div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end">
    <div style="align-self: flex-start; max-width: 80%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); font-size: 14px"><span style="display: block; font-size: 12px; font-weight: 800; color: #E8B04A">Мария</span>Где встречаемся и во сколько?</div>
    <button onClick="{{startEdit}}" aria-label="Изменить своё сообщение" style="align-self: flex-end; max-width: 84%; padding: 9px 12px 6px; border-radius: 18px 18px 6px 18px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; line-height: 1.4; animation: {{bubbleAnim}}">
      <span style="display: block; animation: {{morph}}">{{text}}</span>
      <span style="display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 2px; font-size: 11px; opacity: .7"><sc-if value="{{edited}}" hint-placeholder-val="{{false}}"><span style="font-style: italic">изменено</span></sc-if>18:21 ✓✓</span>
    </button>
    <sc-if value="{{edited}}" hint-placeholder-val="{{false}}"><button onClick="{{openHistory}}" style="align-self: flex-end; font-size: 12px; color: #8FD3AC; font-weight: 700; display: flex; align-items: center; gap: 4px; animation: kxIn .3s ease both"><span class="ms" style="font-size: 16px" aria-hidden="true">history</span>История правок · {{versions}}</button></sc-if>
    <sc-if value="{{tip}}" hint-placeholder-val="{{true}}"><div style="align-self: center; padding: 6px 12px; border-radius: 12px; background: rgba(143,211,172,.1); color: #8FD3AC; font-size: 12px; animation: kxIn .3s ease both">Удерживайте своё сообщение и выберите «Изменить»</div></sc-if>
  </div>

  <!-- Composer -->
  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06)">
    <sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
      <div style="margin: 0 2px 8px; padding: 8px 8px 8px 12px; border-radius: 14px; background: rgba(143,211,172,.08); border-left: 3px solid #8FD3AC; display: flex; align-items: center; gap: 10px; animation: kxIn .2s ease both">
        <span class="ms" style="color: #8FD3AC" aria-hidden="true">edit</span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 12px; font-weight: 800; color: #8FD3AC">Изменение сообщения</span><span style="display: block; font-size: 12px; color: #9AA59F; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{text}}</span></span>
        <button onClick="{{cancel}}" aria-label="Отменить изменение" style="width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: #9AA59F"><span class="ms" style="font-size: 18px" aria-hidden="true">close</span></button>
      </div>
    </sc-if>
    <div style="display: flex; align-items: center; gap: 8px">
      <label style="flex: 1; height: 50px; padding: 0 16px; border-radius: 25px; background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04)); border: 1px solid {{inBd}}; display: flex; align-items: center">
        <input value="{{draft}}" onInput="{{onDraft}}" placeholder="Сообщение" aria-label="Сообщение" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 15px">
      </label>
      <button onClick="{{save}}" aria-label="{{saveLabel}}" style="width: 50px; height: 50px; border-radius: 25px; background: {{saveBg}}; color: {{saveInk}}; display: flex; align-items: center; justify-content: center; animation: {{savePulse}}"><span class="ms fill" aria-hidden="true">{{saveIcon}}</span></button>
    </div>
  </div>

  <!-- History -->
  <sc-if value="{{history}}" hint-placeholder-val="{{false}}">
    <button onClick="{{closeHistory}}" aria-label="Закрыть" style="position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: kxFade .2s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 24px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, rgba(40,48,44,.97), rgba(18,22,20,.99)); border-top: 1px solid rgba(255,255,255,.16); animation: kxSheet .3s cubic-bezier(.2,.8,.2,1) both">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 0 auto 14px"></div>
      <div style="font-size: 19px; font-weight: 800">История правок</div>
      <div style="margin-top: 4px; font-size: 12px; color: #8A958F">Видна только вам — kiroX хранит прошлые версии на этом телефоне</div>
      <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{hist}}" as="h" hint-placeholder-count="3">
          <div style="padding: 10px 12px; border-radius: 16px; background: {{h.bg}}; border: 1px solid {{h.bd}}">
            <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8A958F"><span class="ms" style="font-size: 14px" aria-hidden="true">{{h.icon}}</span>{{h.label}}</div>
            <div style="margin-top: 4px; font-size: 14px; line-height: 1.4; color: {{h.ink}}; text-decoration: {{h.td}}">{{h.t}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const ORIG = 'Встречаемся у входа в 10:00';
class Component extends DCLogic {
constructor(props) { super(props); this.state = { versions: [ORIG], editing: false, draft: '', history: false, k: 0 }; }
renderVals() {
  const s = this.state;
  const cur = s.versions[s.versions.length - 1];
  const changed = s.editing && s.draft.trim() && s.draft.trim() !== cur;
  return {
    text: cur, edited: s.versions.length > 1, versions: String(s.versions.length),
    morph: s.k ? (s.k % 2 ? 'kxMorph' : 'kxMorph2') + ' .5s ease both' : 'none',
    bubbleAnim: s.editing ? 'kxPulse 1.4s ease-out infinite' : 'none',
    tip: !s.editing && s.versions.length === 1,
    startEdit: () => this.setState({ editing: true, draft: cur }),
    editing: s.editing, cancel: () => this.setState({ editing: false, draft: '' }),
    draft: s.draft, onDraft: e => this.setState({ draft: e.target.value }),
    inBd: s.editing ? 'rgba(143,211,172,.5)' : 'rgba(255,255,255,.12)',
    saveIcon: s.editing ? 'check' : 'send', saveLabel: s.editing ? 'Сохранить изменение' : 'Отправить',
    saveBg: changed ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.07)', saveInk: changed ? '#06150D' : '#5C6661',
    savePulse: 'none',
    save: () => { if (!changed) return; this.setState({ versions: [...s.versions, s.draft.trim()], editing: false, draft: '', k: s.k + 1 }); },
    openHistory: () => this.setState({ history: true }), closeHistory: () => this.setState({ history: false }), history: s.history,
    hist: s.versions.map((t, i) => { const last = i === s.versions.length - 1; return { t, label: i === 0 ? 'Оригинал · 18:21' : 'Правка ' + i + ' · 18:2' + (2 + i), icon: last ? 'check_circle' : i === 0 ? 'schedule' : 'edit', bg: last ? 'rgba(143,211,172,.1)' : 'rgba(255,255,255,.04)', bd: last ? 'rgba(143,211,172,.35)' : 'rgba(255,255,255,.08)', ink: last ? '#EEF3EF' : '#9AA59F', td: last ? 'none' : 'line-through' }; }).reverse()
  };
}
}
</script>
</body>
</html>
