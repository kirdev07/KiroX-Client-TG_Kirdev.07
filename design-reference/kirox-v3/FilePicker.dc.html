<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выбрать файл</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes kxIn2{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes kxBar{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxTick{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes kxUp{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <!-- chat behind -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <div style="padding: 10px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)"><span class="ms" aria-hidden="true">arrow_back</span><span style="width: 40px; height: 40px; border-radius: 20px; background: #5C6661; display: flex; align-items: center; justify-content: center; font-weight: 800">Р</span><span style="font-size: 16px; font-weight: 800">Работа</span></div>
    <div style="flex: 1; padding: 14px; display: flex; flex-direction: column; justify-content: flex-start; gap: 8px">
      <div style="align-self: flex-start; max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); font-size: 15px"><span style="display: block; font-size: 12px; font-weight: 800; color: #E8B04A">Дмитрий</span>Скиньте договор и счёт до вечера</div>
      <sc-for list="{{sent}}" as="f" hint-placeholder-count="0"><div style="align-self: flex-end; width: 250px; padding: 10px 12px; border-radius: 18px 18px 6px 18px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; display: flex; align-items: center; gap: 10px; animation: kxUp .3s ease both"><span style="width: 40px; height: 40px; border-radius: 10px; background: rgba(6,21,13,.18); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900">{{f.ext}}</span><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 800; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{f.n}}</span><span style="display: block; font-size: 11px; opacity: .75">{{f.size}}</span></span></div></sc-for>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.5); display: {{dimShow}}"></div>

  <sc-if value="{{open}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 660px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, rgba(36,43,40,.99), rgba(16,19,17,1)); border-top: 1px solid rgba(255,255,255,.16); display: flex; flex-direction: column; animation: kxSheet .35s cubic-bezier(.2,.8,.2,1) both">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 10px auto 8px"></div>
      <div style="padding: 0 14px; display: flex; align-items: center; gap: 8px">
        <button onClick="{{up}}" aria-label="Назад" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.06); display: {{upShow}}; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
        <div style="flex: 1; min-width: 0"><div style="font-size: 18px; font-weight: 800">{{title}}</div><div style="font-size: 12px; color: #8A958F; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{crumb}}</div></div>
        <span style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 20px" aria-hidden="true">search</span></span>
      </div>

      <div class="scroll" style="flex: 1; min-height: 0; padding: 10px 12px 90px; animation: {{anim}}">
        <sc-if value="{{root}}" hint-placeholder-val="{{true}}">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
            <sc-for list="{{places}}" as="p" hint-placeholder-count="4"><button onClick="{{p.tap}}" style="padding: 12px; border-radius: 18px; background: rgba(255,255,255,.05); display: flex; flex-direction: column; gap: 8px"><span style="width: 38px; height: 38px; border-radius: 12px; background: {{p.bg}}; color: {{p.c}}; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 20px" aria-hidden="true">{{p.i}}</span></span><span style="font-size: 14px; font-weight: 800">{{p.t}}</span><span style="font-size: 11px; color: #9AA59F">{{p.s}}</span><span style="display: {{p.barShow}}; height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden"><span style="display: block; height: 100%; width: {{p.used}}; background: {{p.c}}"></span></span></button></sc-for>
          </div>
          <div style="margin-top: 14px; font-size: 13px; font-weight: 700; color: #8FD3AC">Недавние</div>
        </sc-if>
        <div style="margin-top: 4px; display: flex; flex-direction: column">
          <sc-for list="{{files}}" as="f" hint-placeholder-count="6"><button onClick="{{f.tap}}" role="{{f.role}}" aria-checked="{{f.on}}" style="width: 100%; min-height: 60px; padding: 6px 4px; border-radius: 14px; background: {{f.rowBg}}; display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 12px; background: {{f.bg}}; color: {{f.c}}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; flex-shrink: 0"><span class="ms fill" style="font-size: 22px; display: {{f.iconShow}}" aria-hidden="true">{{f.i}}</span><span style="display: {{f.extShow}}">{{f.ext}}</span></span><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{f.n}}</span><span style="display: block; font-size: 12px; color: #9AA59F">{{f.meta}}</span></span><span style="width: 24px; height: 24px; border-radius: 12px; border: 2px solid {{f.cb}}; background: {{f.cf}}; display: {{f.cbShow}}; align-items: center; justify-content: center; color: #06150D"><span class="ms" style="font-size: 17px; font-weight: 700; display: {{f.tick}}; animation: kxTick .25s ease both" aria-hidden="true">check</span></span><span class="ms" style="font-size: 20px; color: #8A958F; display: {{f.chevShow}}" aria-hidden="true">chevron_right</span></button></sc-for>
        </div>
      </div>

      <sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; left: 12px; right: 12px; bottom: 16px; padding: 8px 8px 8px 14px; border-radius: 26px; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.07)); backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; gap: 10px; animation: kxBar .25s cubic-bezier(.2,.8,.2,1) both">
          <span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 800">{{selText}}</span><span style="display: block; font-size: 12px; color: #9AA59F">{{selSize}}</span></span>
          <button onClick="{{send}}" style="height: 46px; padding: 0 18px; border-radius: 23px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px"><span class="ms fill" style="font-size: 20px" aria-hidden="true">send</span>Отправить</button>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{closed}}" hint-placeholder-val="{{false}}">
    <button onClick="{{reopen}}" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); height: 44px; padding: 0 18px; border-radius: 22px; background: rgba(255,255,255,.08); font-size: 14px; font-weight: 700; color: #8FD3AC; display: flex; align-items: center; gap: 6px"><span class="ms" style="font-size: 20px" aria-hidden="true">attach_file</span>Выбрать ещё</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const PL = (n, a, b, c) => { const m = Math.abs(n) % 100, d = m % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d >= 2 && d <= 4 ? b : c; };

const KIND = { pdf: ['#FF8A80', 'rgba(255,138,128,.16)'], xlsx: ['#8FD3AC', 'rgba(143,211,172,.16)'], docx: ['#7FB8E0', 'rgba(127,184,224,.16)'], zip: ['#E8B04A', 'rgba(232,176,74,.16)'], mp3: ['#C9A0E0', 'rgba(201,160,224,.16)'], apk: ['#9AA59F', 'rgba(255,255,255,.08)'] };
const RECENT = [
  { id: 'a', n: 'Договор_поставки_v3.pdf', ext: 'pdf', size: 1.8, when: 'сегодня, 14:20' },
  { id: 'b', n: 'Счёт №482.pdf', ext: 'pdf', size: 0.3, when: 'сегодня, 11:05' },
  { id: 'c', n: 'Смета_ноябрь.xlsx', ext: 'xlsx', size: 0.9, when: 'вчера' },
  { id: 'd', n: 'Презентация_клиенту.docx', ext: 'docx', size: 4.2, when: '20 ноября' }
];
const FOLDERS = {
  dl: { t: 'Загрузки', crumb: 'Память телефона › Download', items: [{ id: 'e', n: 'maketi_kirox.zip', ext: 'zip', size: 24.5, when: 'сегодня' }, { id: 'b2', n: 'Счёт №482.pdf', ext: 'pdf', size: 0.3, when: 'сегодня' }, { id: 'f', n: 'podcast_ep12.mp3', ext: 'mp3', size: 38.1, when: '18 ноября' }, { id: 'g', n: 'app-debug.apk', ext: 'apk', size: 61.0, when: '15 ноября' }] },
  docs: { t: 'Документы', crumb: 'Память телефона › Documents', items: [{ id: 'a2', n: 'Договор_поставки_v3.pdf', ext: 'pdf', size: 1.8, when: 'сегодня' }, { id: 'c2', n: 'Смета_ноябрь.xlsx', ext: 'xlsx', size: 0.9, when: 'вчера' }, { id: 'h', n: 'Резюме.docx', ext: 'docx', size: 0.2, when: 'октябрь' }] }
};
const fmt = (mb) => mb >= 1 ? (mb.toFixed(1).replace('.', ',') + ' МБ') : (Math.round(mb * 1024) + ' КБ');
class Component extends DCLogic {
constructor(props) { super(props); this.state = { at: 'root', sel: {}, k: 0, open: true, sent: [] }; }
renderVals() {
  const s = this.state;
  const all = [...RECENT, ...FOLDERS.dl.items, ...FOLDERS.docs.items];
  const byId = (id) => all.find(x => x.id === id);
  const selIds = Object.keys(s.sel).filter(k => s.sel[k]);
  const go = (at) => this.setState({ at, k: s.k + 1 });
  const items = s.at === 'root' ? RECENT : FOLDERS[s.at].items;
  const total = selIds.reduce((a, id) => a + byId(id).size, 0);
  const word = (n) => PL(n, 'файл', 'файла', 'файлов');
  return {
    open: s.open, closed: !s.open, dimShow: s.open ? 'block' : 'none',
    title: s.at === 'root' ? 'Файлы' : FOLDERS[s.at].t, crumb: s.at === 'root' ? 'Выберите файл или папку' : FOLDERS[s.at].crumb,
    upShow: s.at === 'root' ? 'none' : 'flex', up: () => go('root'),
    anim: (s.k % 2 ? 'kxIn2' : 'kxIn') + ' .25s ease both',
    root: s.at === 'root',
    places: [
      { i: 'download', t: 'Загрузки', s: '4 файла', bg: 'rgba(143,211,172,.16)', c: '#8FD3AC', barShow: 'none', used: '0', tap: () => go('dl') },
      { i: 'description', t: 'Документы', s: '3 файла', bg: 'rgba(127,184,224,.16)', c: '#7FB8E0', barShow: 'none', used: '0', tap: () => go('docs') },
      { i: 'image', t: 'Галерея', s: 'Отправить как файл, без сжатия', bg: 'rgba(232,176,74,.16)', c: '#E8B04A', barShow: 'none', used: '0', tap: () => {} },
      { i: 'smartphone', t: 'Память телефона', s: 'Свободно 38 из 128 ГБ', bg: 'rgba(255,255,255,.08)', c: '#C9D2CC', barShow: 'block', used: '70%', tap: () => go('dl') }
    ],
    files: items.map(f => { const key = f.id.replace(/\d$/, ''); const on = !!s.sel[key]; const col = KIND[f.ext];
      return { n: f.n, ext: f.ext.toUpperCase(), i: '', iconShow: 'none', extShow: 'inline', bg: col[1], c: col[0], meta: fmt(f.size) + ' · ' + f.when,
        role: 'checkbox', on: on ? 'true' : 'false', rowBg: on ? 'rgba(143,211,172,.08)' : 'transparent',
        cbShow: 'flex', cb: on ? '#8FD3AC' : 'rgba(255,255,255,.3)', cf: on ? '#8FD3AC' : 'transparent', tick: on ? 'inline-block' : 'none', chevShow: 'none',
        tap: () => this.setState({ sel: { ...s.sel, [key]: !on } }) }; }),
    hasSel: selIds.length > 0,
    selText: 'Выбрано: ' + selIds.length + ' ' + word(selIds.length), selSize: fmt(total) + ' · без сжатия',
    send: () => this.setState({ open: false, sent: [...s.sent, ...selIds.map(id => { const f = byId(id); return { n: f.n, ext: f.ext.toUpperCase(), size: fmt(f.size) }; })].slice(-3), sel: {}, at: 'root' }),
    reopen: () => this.setState({ open: true }),
    sent: s.sent
  };
}
}
</script>
</body>
</html>
