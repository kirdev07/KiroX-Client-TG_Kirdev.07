<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Дни рождения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxBalloon{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes kxConf{0%{transform:translateY(-20px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(240px) rotate(540deg);opacity:0}}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 800">Дни рождения</h1>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 16px 30px">
    <!-- Today hero -->
    <div style="position: relative; overflow: hidden; padding: 18px 16px; border-radius: 26px; background: radial-gradient(100% 90% at 100% 0%, rgba(240,122,160,.3), transparent 60%), radial-gradient(90% 80% at 0% 100%, rgba(63,154,108,.3), transparent 60%), rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12)">
      <sc-for list="{{conf}}" as="c" hint-placeholder-count="10"><span style="position: absolute; left: {{c.x}}; top: 0; width: 6px; height: 10px; border-radius: 2px; background: {{c.c}}; animation: kxConf {{c.dur}} linear {{c.d}} 2" aria-hidden="true"></span></sc-for>
      <span style="position: absolute; right: 18px; top: 14px; font-size: 44px; animation: kxBalloon 3s ease-in-out 2" aria-hidden="true">🎈</span>
      <div style="font-size: 12px; font-weight: 800; color: #F07AA0; letter-spacing: .5px">СЕГОДНЯ</div>
      <div style="margin-top: 10px; display: flex; align-items: center; gap: 12px">
        <span style="width: 58px; height: 58px; border-radius: 29px; background: linear-gradient(135deg, #B07A2E, #6A4C9C); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; border: 3px solid #F07AA0">Б</span>
        <span><span style="display: block; font-size: 18px; font-weight: 800">Бабушка</span><span style="display: block; font-size: 13px; color: #C9D2CC">исполняется 80 🎂</span></span>
      </div>
      <div style="margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px">
        <button onClick="{{openWish}}" style="height: 44px; border-radius: 22px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 4px"><span class="ms fill" style="font-size: 18px" aria-hidden="true">celebration</span>{{wishText}}</button>
        <button onClick="{{call}}" style="height: 44px; border-radius: 22px; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px"><span class="ms fill" style="font-size: 18px" aria-hidden="true">call</span>Позвонить</button>
        <button onClick="{{video}}" style="height: 44px; border-radius: 22px; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px"><span class="ms fill" style="font-size: 18px" aria-hidden="true">videocam</span>Видео</button>
      </div>
    </div>

    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Скоро</div>
    <sc-for list="{{soon}}" as="p" hint-placeholder-count="4">
      <div style="padding: 10px 4px; display: flex; align-items: center; gap: 12px; animation: kxIn .25s ease {{p.d}} both">
        <span style="width: 46px; height: 46px; border-radius: 23px; background: {{p.c}}; display: flex; align-items: center; justify-content: center; font-weight: 800">{{p.l}}</span>
        <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 700">{{p.name}}</span><span style="display: block; font-size: 12px; color: #8A958F">{{p.date}}</span></span>
        <span style="padding: 4px 10px; border-radius: 12px; background: {{p.chipBg}}; color: {{p.chipInk}}; font-size: 12px; font-weight: 800">{{p.left}}</span>
        <button onClick="{{p.remind}}" aria-label="{{p.remLabel}}" style="width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,.06); color: {{p.remInk}}; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 19px; font-variation-settings: {{p.remFill}}" aria-hidden="true">notifications</span></button>
      </div>
    </sc-for>
    <p style="margin: 12px 4px 0; font-size: 12px; line-height: 1.45; color: #8A958F">Даты берутся из профилей Telegram, если человек их показывает, и из ваших контактов.</p>
  </div>

  <!-- Wish sheet -->
  <sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
    <button onClick="{{closeWish}}" aria-label="Закрыть" style="position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: kxFade .2s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 22px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, rgba(40,48,44,.97), rgba(18,22,20,.99)); border-top: 1px solid rgba(255,255,255,.16); animation: kxSheet .3s cubic-bezier(.2,.8,.2,1) both">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 0 auto 14px"></div>
      <div style="font-size: 19px; font-weight: 800">Поздравить</div>
      <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{wishes}}" as="w" hint-placeholder-count="3"><button onClick="{{w.tap}}" style="padding: 12px 14px; border-radius: 16px; background: {{w.bg}}; border: 1px solid {{w.bd}}; font-size: 14px; line-height: 1.4">{{w.t}}</button></sc-for>
      </div>
      <div style="margin-top: 10px; display: flex; gap: 6px">
        <sc-for list="{{stickers}}" as="st" hint-placeholder-count="5"><button onClick="{{st.tap}}" style="flex: 1; height: 50px; border-radius: 14px; background: {{st.bg}}; border: 1.5px solid {{st.bd}}; font-size: 26px; text-align: center">{{st.e}}</button></sc-for>
      </div>
      <button onClick="{{send}}" style="margin-top: 12px; width: 100%; height: 52px; border-radius: 26px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px"><span class="ms fill" aria-hidden="true">send</span>Отправить поздравление</button>
    </div>
  </sc-if>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 30px; padding: 12px 18px; border-radius: 18px; background: #232A26; border: 1px solid rgba(255,255,255,.16); font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2.4s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">{{toastIcon}}</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const SOON = [['Анна', 'А', '#C0443C', '25 ноября · среда', 3], ['Дмитрий', 'Д', '#2F6E9E', '2 декабря · среда', 10], ['Папа', 'П', '#3F9A6C', '14 декабря · понедельник', 22], ['Лиза', 'Л', '#6A4C9C', '31 декабря · четверг', 39]];
const WISH = ['С днём рождения, бабуля! Здоровья, тепла и радости каждый день ❤️', 'Бабушка, с юбилеем! 80 — это только начало. Обнимаю крепко!', 'С праздником! Приеду в выходные с тортом 🎂'];
const ST = ['🎂', '🎉', '💐', '🥳', '❤️'];
const CONF = ['#F07AA0', '#8FD3AC', '#E8B04A', '#6FA9D8', '#B39DDB'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sheet: false, wish: 0, st: 0, sent: false, remind: { 0: true }, toast: 0, toastText: '', toastIcon: 'done' }; }
componentWillUnmount() { clearTimeout(this.tt); }
toastMsg(text, icon) { clearTimeout(this.tt); this.setState({ toast: this.state.toast + 1, toastText: text, toastIcon: icon }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2400); }
renderVals() {
  const s = this.state;
  const days = n => n === 1 ? 'день' : n < 5 ? 'дня' : n % 10 === 1 && n !== 11 ? 'день' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n) ? 'дня' : 'дней';
  return {
    conf: Array.from({ length: 12 }, (_, i) => ({ x: (5 + i * 8) + '%', c: CONF[i % 5], dur: (2.4 + (i % 4) * 0.5) + 's', d: (i * 0.3) + 's' })),
    wishText: s.sent ? 'Поздравлено ✓' : 'Поздравить',
    openWish: () => !s.sent && this.setState({ sheet: true }), closeWish: () => this.setState({ sheet: false }), sheet: s.sheet,
    call: () => this.toastMsg('Звонок · Бабушка…', 'call'), video: () => this.toastMsg('Видеозвонок · Бабушка…', 'videocam'),
    soon: SOON.map(([name, l, c, date, left], i) => { const on = !!s.remind[i]; return { name, l, c, date, d: (i * 0.05) + 's', left: 'через ' + left + ' ' + days(left), chipBg: left <= 3 ? 'rgba(240,122,160,.16)' : 'rgba(255,255,255,.06)', chipInk: left <= 3 ? '#F07AA0' : '#9AA59F', remInk: on ? '#8FD3AC' : '#9AA59F', remFill: on ? "'FILL' 1" : "'FILL' 0", remLabel: on ? 'Не напоминать' : 'Напомнить за день', remind: () => { this.setState({ remind: { ...s.remind, [i]: !on } }); this.toastMsg(on ? 'Напоминание выключено' : 'Напомним за день', 'notifications'); } }; }),
    wishes: WISH.map((t, i) => ({ t, bg: s.wish === i ? 'rgba(143,211,172,.12)' : 'rgba(255,255,255,.04)', bd: s.wish === i ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', tap: () => this.setState({ wish: i }) })),
    stickers: ST.map((e, i) => ({ e, bg: s.st === i ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.04)', bd: s.st === i ? '#8FD3AC' : 'rgba(255,255,255,.06)', tap: () => this.setState({ st: i }) })),
    send: () => { this.setState({ sheet: false, sent: true }); this.toastMsg('Поздравление отправлено ' + ST[s.st], 'celebration'); },
    toast: s.toast > 0, toastText: s.toastText, toastIcon: s.toastIcon
  };
}
}
</script>
</body>
</html>
