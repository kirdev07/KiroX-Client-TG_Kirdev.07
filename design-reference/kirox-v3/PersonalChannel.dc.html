<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Канал в профиле</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxCard{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes kxCard2{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes kxGlow{0%,100%{box-shadow:0 0 0 0 rgba(143,211,172,0)}50%{box-shadow:0 0 0 5px rgba(143,211,172,.14)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px; display: flex; align-items: center; gap: 10px">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span style="flex: 1; font-size: 20px; font-weight: 800">Канал в профиле</span>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 0 16px 16px">
    <div style="font-size: 11px; font-weight: 700; color: #8A958F; margin-bottom: 8px">ТАК УВИДЯТ ВАШ ПРОФИЛЬ</div>
    <!-- Profile preview -->
    <div style="border-radius: 26px; overflow: hidden; background: linear-gradient(180deg, rgba(63,154,108,.35), rgba(10,12,11,0) 60%), rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); padding: 18px 14px 14px">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center">
        <span style="width: 76px; height: 76px; border-radius: 38px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800">А</span>
        <div style="margin-top: 8px; font-size: 19px; font-weight: 800">Алекс</div>
        <div style="font-size: 12px; color: #8FD3AC">@alex_codes · в сети</div>
      </div>
      <sc-if value="{{show}}" hint-placeholder-val="{{true}}">
        <div style="margin-top: 14px; padding: 12px; border-radius: 18px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.1); animation: {{cardAnim}}">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="width: 40px; height: 40px; border-radius: 12px; background: {{chC}}; display: flex; align-items: center; justify-content: center; font-weight: 800">{{chL}}</span>
            <div style="flex: 1; min-width: 0"><div style="font-size: 11px; font-weight: 700; color: #8A958F">КАНАЛ</div><div style="font-size: 15px; font-weight: 800">{{chName}}</div></div>
            <span style="font-size: 12px; color: #9AA59F">{{chSubs}}</span>
          </div>
          <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center">
            <span style="width: 54px; height: 54px; border-radius: 12px; background: {{postImg}}; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0">{{postE}}</span>
            <div style="flex: 1; min-width: 0"><div style="font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{postText}}</div><div style="margin-top: 2px; font-size: 11px; color: #8A958F">{{postMeta}}</div></div>
          </div>
          <div style="margin-top: 10px; height: 38px; border-radius: 19px; background: rgba(143,211,172,.14); color: #8FD3AC; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; animation: kxGlow 2.4s ease-in-out 2"><span class="ms" style="font-size: 18px" aria-hidden="true">add</span>Подписаться</div>
        </div>
      </sc-if>
      <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 2px">
        <div style="padding: 10px 4px; border-top: 1px solid rgba(255,255,255,.06)"><div style="font-size: 14px">Пишу приложения на Kotlin</div><div style="font-size: 11px; color: #8A958F">О себе</div></div>
        <div style="padding: 10px 4px; border-top: 1px solid rgba(255,255,255,.06)"><div style="font-size: 14px">14 марта</div><div style="font-size: 11px; color: #8A958F">День рождения</div></div>
      </div>
    </div>

    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC">Ваши публичные каналы</div>
    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{chans}}" as="c" hint-placeholder-count="4"><button onClick="{{c.tap}}" role="radio" aria-checked="{{c.on}}" style="padding: 10px 12px; border-radius: 18px; background: {{c.bg}}; border: 1.5px solid {{c.bd}}; display: flex; align-items: center; gap: 12px; opacity: {{c.op}}"><span style="width: 42px; height: 42px; border-radius: 13px; background: {{c.c}}; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0">{{c.l}}</span><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 700">{{c.n}}</span><span style="display: block; font-size: 12px; color: {{c.subInk}}">{{c.sub}}</span></span><span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{c.rb}}; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{c.dot}}"></span></span></button></sc-for>
    </div>
    <div style="margin-top: 8px; padding: 0 4px; font-size: 12px; color: #8A958F; line-height: 1.4">Показать можно только публичный канал, где вы владелец.</div>
  </div>

  <div style="padding: 10px 16px 20px">
    <button onClick="{{remove}}" style="width: 100%; height: 50px; border-radius: 25px; background: {{rmBg}}; color: {{rmInk}}; font-size: 15px; font-weight: 800; text-align: center">{{rmText}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CH = [
  { n: 'kiroX: дневник разработки', l: 'X', c: 'linear-gradient(135deg, #6FC497, #3F9A6C)', subs: '1,2 тыс.', ok: true, post: 'Новые макеты: стеклянные шторки, бусты и живые эмодзи. Что думаете?', pe: '🎨', img: 'linear-gradient(160deg, #3F9A6C, #1B3A2C)', meta: 'сегодня · 3,4 тыс. просмотров' },
  { n: 'Kotlin по-русски', l: 'K', c: '#2F6E9E', subs: '48 тыс.', ok: true, post: 'Корутины без боли: 7 ошибок новичков', pe: '💻', img: 'linear-gradient(160deg, #2F6E9E, #0B1F2E)', meta: '15 ноября · 21 тыс. просмотров' },
  { n: 'Фото с прогулок', l: 'Ф', c: '#B07A2E', subs: '320', ok: true, post: 'Осенний парк, плёнка, 35 мм', pe: '🍂', img: 'linear-gradient(160deg, #E8B04A, #8E4A1E)', meta: 'вчера · 410 просмотров' },
  { n: 'Митапы Алматы', l: 'М', c: '#6A4C9C', subs: '5 тыс.', ok: false, why: 'Вы админ, но не владелец' }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sel: 0, show: true, k: 0 }; }
renderVals() {
  const s = this.state;
  const c = CH[s.sel];
  return {
    show: s.show, cardAnim: (s.k % 2 ? 'kxCard2' : 'kxCard') + ' .35s cubic-bezier(.2,.8,.2,1) both',
    chC: c.c, chL: c.l, chName: c.n, chSubs: c.subs + ' подписчиков',
    postText: c.post || '', postE: c.pe || '', postImg: c.img || 'none', postMeta: c.meta || '',
    chans: CH.map((x, i) => { const on = s.show && s.sel === i; return { n: x.n, l: x.l, c: x.c, sub: x.ok ? x.subs + ' подписчиков · публичный' : x.why, subInk: x.ok ? '#9AA59F' : '#C9A06A', op: x.ok ? 1 : .5,
      on: on ? 'true' : 'false', bg: on ? 'rgba(143,211,172,.10)' : 'rgba(255,255,255,.04)', bd: on ? 'rgba(143,211,172,.55)' : 'transparent', rb: on ? '#8FD3AC' : 'rgba(255,255,255,.3)', dot: on ? '#8FD3AC' : 'transparent',
      tap: () => x.ok && this.setState({ sel: i, show: true, k: s.k + 1 }) }; }),
    rmText: s.show ? 'Убрать канал из профиля' : 'Канал не показывается',
    rmBg: s.show ? 'rgba(229,83,75,.1)' : 'rgba(255,255,255,.06)', rmInk: s.show ? '#FF8A80' : '#8A958F',
    remove: () => s.show && this.setState({ show: false })
  };
}
}
</script>
</body>
</html>
