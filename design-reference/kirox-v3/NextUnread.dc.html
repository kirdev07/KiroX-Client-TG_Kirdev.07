<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Следующий непрочитанный канал</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
@keyframes kxIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes kxIn2{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes kxNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06); animation: {{chAnim}}">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span style="width: 40px; height: 40px; border-radius: 12px; background: {{cc}}; display: flex; align-items: center; justify-content: center; font-weight: 800">{{cl}}</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">{{cn}}</div><div style="font-size: 12px; color: #9AA59F">{{csub}}</div></div>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; position: relative">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px; transform: translateY({{lift}}); transition: transform .2s ease-out; animation: {{chAnim}}">
      <sc-for list="{{posts}}" as="p" hint-placeholder-count="3"><div style="align-self: flex-start; width: 310px; border-radius: 20px 20px 20px 6px; background: rgba(255,255,255,.06); overflow: hidden"><span style="display: {{p.imgShow}}; height: 130px; background: {{p.img}}; align-items: center; justify-content: center; font-size: 44px">{{p.e}}</span><div style="padding: 10px 12px; font-size: 14px; line-height: 1.4">{{p.t}}<span style="display: block; margin-top: 4px; font-size: 11px; color: #8A958F">{{p.meta}}</span></div></div></sc-for>
      <div style="align-self: center; padding: 4px 12px; border-radius: 12px; background: rgba(143,211,172,.1); font-size: 12px; font-weight: 700; color: #8FD3AC">Вы всё прочитали ✓</div>
    </div>

    <!-- Pull indicator -->
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{pullH}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow: hidden; transition: height .2s ease-out">
      <span style="position: relative; width: 56px; height: 56px">
        <svg width="56" height="56" viewBox="0 0 56 56" style="position: absolute; inset: 0; transform: rotate(-90deg)" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"></circle><circle cx="28" cy="28" r="25" fill="none" stroke="#8FD3AC" stroke-width="3" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="{{ringOff}}" style="transition: stroke-dashoffset .2s"></circle></svg>
        <span style="position: absolute; inset: 6px; border-radius: 12px; background: {{nc}}; display: flex; align-items: center; justify-content: center; font-weight: 800; transform: scale({{avScale}}); transition: transform .2s">{{nl}}</span>
      </span>
      <span style="font-size: 13px; font-weight: 700; color: {{hintInk}}">{{hint}}</span>
    </div>
  </div>

  <div style="padding: 10px 12px 18px; border-top: 1px solid rgba(255,255,255,.06)">
    <div style="display: flex; gap: 8px">
      <button onClick="{{pull}}" style="flex: 1; height: 50px; border-radius: 25px; background: rgba(143,211,172,.14); color: #8FD3AC; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" style="animation: kxNudge 1.4s ease-in-out 2" aria-hidden="true">swipe_up</span>{{pullText}}</button>
      <button onClick="{{release}}" style="width: 120px; height: 50px; border-radius: 25px; background: {{relBg}}; color: {{relInk}}; font-size: 14px; font-weight: 800; text-align: center">Отпустить</button>
    </div>
    <div style="margin-top: 6px; text-align: center; font-size: 11px; color: #8A958F">В приложении — просто потяните ленту вверх в конце канала</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CH = [
  { n: 'Kotlin по-русски', l: 'K', c: '#2F6E9E', sub: '48 тыс. подписчиков', posts: [['Корутины без боли: 7 ошибок новичков', '💻', 'linear-gradient(160deg, #2F6E9E, #0B1F2E)', '15 ноября'], ['Опрос: на чём пишете UI?', '', '', '18 ноября'], ['Вышла новая версия Kotlin — что нового', '', '', 'сегодня']] },
  { n: 'Путешествия по Азии', l: 'П', c: '#B07A2E', sub: '12 непрочитанных', posts: [['5 мест у моря, где не бывает толп', '🌊', 'linear-gradient(180deg, #7FC4E8, #2F6E9E 60%, #E8D7A8)', 'вчера'], ['Как дёшево добраться до Бали', '', '', 'сегодня'], ['Лайфхак: виза по прилёту', '', '', 'сегодня']] },
  { n: 'Новости города', l: 'Н', c: '#5C6661', sub: '41 непрочитанное', posts: [['Пробки на Абая — объезд по Сатпаева', '🚗', 'linear-gradient(160deg, #3A403D, #1B201E)', '14:00'], ['Завтра до +5, без осадков', '', '', '15:10'], ['Открыли новый парк у реки', '', '', '16:30']] },
  { n: 'Фото с прогулок', l: 'Ф', c: '#6A4C9C', sub: '3 непрочитанных', posts: [['Осенний парк, плёнка, 35 мм', '🍂', 'linear-gradient(160deg, #E8B04A, #8E4A1E)', 'вчера'], ['Туман над озером', '', '', 'сегодня'], ['Закат с крыши', '', '', 'сегодня']] }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0, p: 0, k: 0 }; }
renderVals() {
  const s = this.state;
  const c = CH[s.i];
  const nx = CH[(s.i + 1) % CH.length];
  const ready = s.p >= 100;
  return {
    cn: c.n, cl: c.l, cc: c.c, csub: s.i === 0 ? c.sub : 'было ' + c.sub,
    chAnim: s.k ? (s.k % 2 ? 'kxIn2' : 'kxIn') + ' .4s cubic-bezier(.2,.8,.2,1) both' : 'none',
    posts: c.posts.map(([t, e, img, meta]) => ({ t, e, img: img || 'none', imgShow: img ? 'flex' : 'none', meta })),
    lift: '-' + Math.round(s.p * 1.3) + 'px', pullH: Math.round(s.p * 1.3) + 'px',
    ringOff: String(157 * (1 - Math.min(s.p, 100) / 100)), avScale: String(.6 + Math.min(s.p, 100) / 250),
    nc: nx.c, nl: nx.l,
    hint: ready ? 'Отпустите — откроем «' + nx.n + '»' : 'Тяните к следующему: «' + nx.n + '»',
    hintInk: ready ? '#8FD3AC' : '#C9D2CC',
    pullText: s.p ? (ready ? 'Готово' : 'Тянуть ещё') : 'Потянуть вверх',
    pull: () => this.setState({ p: Math.min(100, s.p + 34) }),
    relBg: ready ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.07)', relInk: ready ? '#06150D' : '#9AA59F',
    release: () => ready ? this.setState({ i: (s.i + 1) % CH.length, p: 0, k: s.k + 1 }) : this.setState({ p: 0 })
  };
}
}
</script>
</body>
</html>
