<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ключ шифрования</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
@keyframes kxFlip{0%{transform:rotateY(90deg) scale(.6);opacity:0}60%{transform:rotateY(-15deg) scale(1.1);opacity:1}100%{transform:rotateY(0) scale(1)}}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kxShield{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes kxConf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
@keyframes kxPulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.8);opacity:0}}
@keyframes kxShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{bg}}; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column; transition: background .5s">
  <header style="padding: 10px 12px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад к звонку" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <div style="flex: 1; min-width: 0"><div style="font-size: 16px; font-weight: 800">Звонок · Анна</div><div style="font-size: 12px; color: #8FD3AC; font-variant-numeric: tabular-nums">{{callTime}}</div></div>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px 24px 0; text-align: center">
    <div style="position: relative; width: 84px; height: 84px">
      <span style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid {{ringInk}}; animation: kxPulse 2s ease-out infinite" aria-hidden="true"></span>
      <span style="position: absolute; inset: 0; border-radius: 50%; background: {{shieldBg}}; display: flex; align-items: center; justify-content: center; animation: {{shieldAnim}}; transition: background .4s"><span class="ms fill" style="font-size: 44px; color: {{shieldInk}}" aria-hidden="true">{{shieldIcon}}</span></span>
      <sc-if value="{{party}}" hint-placeholder-val="{{false}}">
        <sc-for list="{{conf}}" as="c" hint-placeholder-count="10"><span style="position: absolute; left: 38px; top: 38px; width: 8px; height: 8px; border-radius: 2px; background: {{c.c}}; --dx: {{c.dx}}; --dy: {{c.dy}}; animation: kxConf .9s ease-out {{c.d}} both"></span></sc-for>
      </sc-if>
    </div>
    <div style="margin-top: 18px; font-size: 22px; font-weight: 800">{{title}}</div>
    <div style="margin-top: 8px; font-size: 14px; line-height: 1.5; color: #9AA59F; max-width: 300px">{{text}}</div>

    <!-- Emoji key -->
    <div style="margin-top: 26px; padding: 18px 16px; border-radius: 28px; background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 1px solid {{keyBd}}; display: flex; gap: 14px; perspective: 600px; animation: {{keyShake}}; transition: border-color .3s">
      <sc-for list="{{emoji}}" as="e" hint-placeholder-count="4"><span style="width: 58px; height: 58px; border-radius: 18px; background: rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; font-size: 36px; animation: kxFlip .6s cubic-bezier(.3,1.3,.5,1) {{e.d}} both">{{e.ch}}</span></sc-for>
    </div>
    <div style="margin-top: 12px; font-size: 12px; color: #8A958F">Попросите собеседника открыть такой же экран</div>

    <!-- How it works -->
    <sc-if value="{{asking}}" hint-placeholder-val="{{true}}">
      <div style="margin-top: 22px; width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left; animation: kxIn .3s ease .4s both">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="3"><div style="display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,.03)"><span style="width: 28px; height: 28px; border-radius: 14px; background: rgba(143,211,172,.12); color: #8FD3AC; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{s.n}}</span><span style="font-size: 13px; color: #C9D2CC">{{s.t}}</span></div></sc-for>
      </div>
    </sc-if>
  </div>

  <div style="padding: 14px 16px 22px; display: flex; gap: 8px">
    <sc-if value="{{asking}}" hint-placeholder-val="{{true}}">
      <button onClick="{{bad}}" style="flex: 1; height: 54px; border-radius: 27px; background: rgba(229,83,75,.12); border: 1px solid rgba(229,83,75,.3); color: #FF8A80; font-size: 15px; font-weight: 800; text-align: center">Не совпадают</button>
      <button onClick="{{good}}" style="flex: 1.3; height: 54px; border-radius: 27px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms fill" style="font-size: 20px" aria-hidden="true">verified</span>Совпадают</button>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <button onClick="{{again}}" style="height: 54px; padding: 0 18px; border-radius: 27px; background: rgba(255,255,255,.07); font-size: 15px; font-weight: 700">Проверить снова</button>
      <button style="flex: 1; height: 54px; border-radius: 27px; background: {{endBg}}; color: {{endInk}}; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms fill" style="font-size: 20px" aria-hidden="true">{{endIcon}}</span>{{endText}}</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const KEY = ['🦊', '🌵', '🚲', '🍋'];
const COLORS = ['#8FD3AC', '#E8B04A', '#6FA9D8', '#F07AA0', '#B39DDB'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { res: '', sec: 254, n: 0 }; }
componentDidMount() { this.iv = setInterval(() => this.setState({ sec: this.state.sec + 1 }), 1000); }
componentWillUnmount() { clearInterval(this.iv); }
renderVals() {
  const s = this.state;
  const ok = s.res === 'ok', bad = s.res === 'bad';
  return {
    bg: ok ? 'radial-gradient(90% 60% at 50% 15%, rgba(63,154,108,.3), transparent 70%), #0A0C0B' : bad ? 'radial-gradient(90% 60% at 50% 15%, rgba(229,83,75,.25), transparent 70%), #0A0C0B' : 'radial-gradient(90% 60% at 50% 15%, rgba(63,154,108,.14), transparent 70%), #0A0C0B',
    callTime: Math.floor(s.sec / 60) + ':' + String(s.sec % 60).padStart(2, '0'),
    ringInk: bad ? 'rgba(229,83,75,.6)' : 'rgba(143,211,172,.55)',
    shieldBg: ok ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : bad ? 'rgba(229,83,75,.18)' : 'rgba(143,211,172,.14)',
    shieldInk: ok ? '#06150D' : bad ? '#FF8A80' : '#8FD3AC', shieldIcon: ok ? 'verified_user' : bad ? 'gpp_bad' : 'encrypted',
    shieldAnim: s.res ? 'kxShield .5s ease both' : 'none',
    party: ok,
    conf: Array.from({ length: 12 }, (_, i) => { const a = i / 12 * Math.PI * 2; const r = 70 + (i % 3) * 18; return { c: COLORS[i % COLORS.length], dx: Math.round(Math.cos(a) * r) + 'px', dy: Math.round(Math.sin(a) * r) + 'px', d: (i % 4) * 0.03 + 's' }; }),
    title: ok ? 'Звонок защищён' : bad ? 'Ключи не совпали' : 'Сверьте ключ',
    text: ok ? 'Вы проверили: звонок шифруется от устройства до устройства, никто посередине его не слышит.' : bad ? 'Возможно, кто-то вмешивается в соединение. Лучше завершить звонок и позвонить ещё раз.' : 'Если у собеседника те же четыре эмодзи в том же порядке, звонок зашифрован и его никто не подслушивает.',
    keyBd: ok ? 'rgba(143,211,172,.6)' : bad ? 'rgba(229,83,75,.5)' : 'rgba(255,255,255,.16)',
    keyShake: bad ? 'kxShake .45s ease' : 'none',
    emoji: KEY.map((ch, i) => ({ ch, d: (s.n % 2 ? 0.001 : 0) + i * 0.12 + 's' })),
    asking: !s.res, done: !!s.res,
    steps: [['1', 'Скажите вслух, что видите: лиса, кактус, велосипед, лимон'], ['2', 'Собеседник сравнит со своим экраном'], ['3', 'Нажмите, совпало или нет']].map(([n, t]) => ({ n, t })),
    good: () => this.setState({ res: 'ok' }), bad: () => this.setState({ res: 'bad' }),
    again: () => this.setState({ res: '', n: s.n + 1 }),
    endBg: ok ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : '#E5534B', endInk: ok ? '#06150D' : '#fff',
    endIcon: ok ? 'call' : 'call_end', endText: ok ? 'Вернуться к звонку' : 'Завершить звонок'
  };
}
}
</script>
</body>
</html>
