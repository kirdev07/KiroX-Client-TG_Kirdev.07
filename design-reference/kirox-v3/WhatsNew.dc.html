<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Что нового</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kxSlide{from{opacity:0;transform:translateX(30px) scale(.97)}to{opacity:1;transform:none}}
@keyframes kxFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes kxOrbit{from{transform:rotate(0) translateX(70px) rotate(0)}to{transform:rotate(360deg) translateX(70px) rotate(-360deg)}}
@keyframes kxGlow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.1)}}
@keyframes kxProg{from{width:0}to{width:100%}}
@keyframes kxProg2{from{width:0}to{width:100%}}
@keyframes kxSlide2{from{opacity:0;transform:translateX(30px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 800">Что нового</h1>
    <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(143,211,172,.14); color: #8FD3AC; font-size: 12px; font-weight: 800; display: flex; align-items: center">1.0.0-rc.1</span>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 16px 30px">
    <!-- Story-like carousel -->
    <div style="position: relative; height: 380px; border-radius: 30px; overflow: hidden; background: {{slideBg}}; transition: background .5s; border: 1px solid rgba(255,255,255,.1)">
      <div style="position: absolute; left: 14px; right: 14px; top: 12px; display: flex; gap: 4px; z-index: 2">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="4"><span style="flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden"><span style="display: block; height: 100%; width: {{b.w}}; background: #EEF3EF; animation: {{b.anim}}"></span></span></sc-for>
      </div>
      <!-- art -->
      <div style="position: absolute; left: 0; right: 0; top: 30px; height: 200px; display: flex; align-items: center; justify-content: center" aria-hidden="true">
        <span style="position: absolute; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.35), transparent 70%); animation: kxGlow 3s ease-in-out 2"></span>
        <span style="position: absolute; width: 0; height: 0"><span class="ms fill" style="position: absolute; left: -12px; top: -12px; font-size: 24px; color: rgba(255,255,255,.8); animation: kxOrbit 6s linear 2">{{orbit}}</span></span>
        <span style="position: absolute; width: 0; height: 0"><span class="ms fill" style="position: absolute; left: -10px; top: -10px; font-size: 20px; color: rgba(255,255,255,.6); animation: kxOrbit 6s linear -3s 2">{{orbit2}}</span></span>
        <span style="width: 96px; height: 96px; border-radius: 30px; background: rgba(255,255,255,.18); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; animation: kxFloat 4s ease-in-out 2"><span class="ms fill" style="font-size: 52px; color: #fff">{{icon}}</span></span>
      </div>
      <div style="position: absolute; left: 20px; right: 20px; bottom: 64px; animation: {{slideAnim}}">
        <div style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: rgba(255,255,255,.75); text-transform: uppercase">{{tag}}</div>
        <div style="margin-top: 6px; font-size: 24px; font-weight: 800; line-height: 1.15">{{title}}</div>
        <div style="margin-top: 8px; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.85)">{{text}}</div>
      </div>
      <button onClick="{{prev}}" aria-label="Предыдущая новинка" style="position: absolute; left: 0; top: 0; bottom: 60px; width: 35%"></button>
      <button onClick="{{next}}" aria-label="Следующая новинка" style="position: absolute; right: 0; top: 0; bottom: 60px; width: 65%"></button>
      <button onClick="{{tryIt}}" style="position: absolute; left: 20px; right: 20px; bottom: 14px; height: 42px; border-radius: 21px; background: rgba(255,255,255,.92); color: #06150D; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" style="font-size: 18px" aria-hidden="true">arrow_forward</span>{{tryText}}</button>
    </div>

    <!-- Changelog -->
    <div style="margin-top: 18px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Все изменения</div>
    <div style="border-radius: 20px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <sc-if value="{{r.head}}" hint-placeholder-val="{{true}}">
        <button onClick="{{r.tap}}" aria-expanded="{{r.open}}" style="width: 100%; padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-top: {{r.line}}">
          <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 800">{{r.ver}}</span><span style="display: block; margin-top: 2px; font-size: 12px; color: #8A958F">{{r.date}}</span></span>
          <sc-if value="{{r.isNew}}" hint-placeholder-val="{{false}}"><span style="padding: 3px 8px; border-radius: 8px; background: #8FD3AC; color: #06150D; font-size: 11px; font-weight: 900">НОВОЕ</span></sc-if>
          <span class="ms" style="color: #9AA59F; transform: {{r.rot}}; transition: transform .25s" aria-hidden="true">expand_more</span>
        </button>
      </sc-if>
      <sc-if value="{{r.item}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; gap: 10px; padding: 5px 16px; font-size: 14px; color: #C9D2CC; animation: kxIn .2s ease both"><span class="ms fill" style="font-size: 18px; color: {{r.c}}" aria-hidden="true">{{r.icon}}</span><span style="flex: 1">{{r.t}}</span></div>
      </sc-if>
    </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const SLIDES = [
  { tag: 'Оформление', title: 'Свои темы и вид для каждого чата', text: 'Готовые темы, конструктор из одного цвета и отдельные обои для любимых чатов.', icon: 'palette', o1: 'format_paint', o2: 'wallpaper', bg: 'linear-gradient(160deg, #3F9A6C 0%, #1E4B36 55%, #0E1C16 100%)', btn: 'Открыть темы' },
  { tag: 'Админам', title: 'Медленный режим и статистика', text: 'Задержка между сообщениями, недавние действия, разрешённые реакции и статистика постов.', icon: 'shield_person', o1: 'bar_chart', o2: 'timer', bg: 'linear-gradient(160deg, #2F6E9E 0%, #1B3A55 55%, #0D1620 100%)', btn: 'Управление группой' },
  { tag: 'Premium', title: 'Подарки, расшифровка голосовых', text: 'Дарите подарки за звёзды и читайте голосовые текстом, когда неудобно слушать.', icon: 'redeem', o1: 'star', o2: 'graphic_eq', bg: 'linear-gradient(160deg, #B07A2E 0%, #5A3C1A 55%, #1E140A 100%)', btn: 'Посмотреть Premium' },
  { tag: 'Файлы', title: 'Файлы как в Telegram', text: 'Плитки, вкладка с музыкой, карточки аудио и кнопка «Подписаться» прямо в канале.', icon: 'folder_open', o1: 'music_note', o2: 'download', bg: 'linear-gradient(160deg, #6A4C9C 0%, #35264F 55%, #120E1C 100%)', btn: 'Открыть загрузки' }
];
const LOG = [
  ['1.0.0-rc.1', 'Сегодня', true, [['palette', '#8FD3AC', 'Свой вид для отдельного чата'], ['format_paint', '#8FD3AC', 'Готовые темы и конструктор'], ['shield_person', '#6FA9D8', 'Инструменты админов'], ['bug_report', '#E8B04A', 'Исправлены вылеты при открытии файлов']]],
  ['0.9.5', '10 ноября', false, [['redeem', '#E8B04A', 'Подарки за звёзды'], ['graphic_eq', '#8FD3AC', 'Расшифровка голосовых'], ['casino', '#B39DDB', 'Игры с кубиком']]],
  ['0.9.0', '28 октября', false, [['folder_open', '#8FD3AC', 'Новые файлы и музыка'], ['notifications_active', '#8FD3AC', 'Кнопка подписки в канале']]]
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0, open: 0, cycle: 0 }; }
componentDidMount() { this.iv = setInterval(() => this.setState({ i: (this.state.i + 1) % SLIDES.length, cycle: this.state.cycle + 1 }), 5000); }
componentWillUnmount() { clearInterval(this.iv); }
go(i) { clearInterval(this.iv); this.setState({ i, cycle: this.state.cycle + 1 }); this.iv = setInterval(() => this.setState({ i: (this.state.i + 1) % SLIDES.length, cycle: this.state.cycle + 1 }), 5000); }
renderVals() {
  const s = this.state;
  const sl = SLIDES[s.i];
  return {
    slideBg: sl.bg, icon: sl.icon, orbit: sl.o1, orbit2: sl.o2, tag: sl.tag, title: sl.title, text: sl.text, tryText: sl.btn, slideAnim: (s.cycle % 2 ? 'kxSlide2' : 'kxSlide') + ' .4s cubic-bezier(.2,.8,.2,1) both',
    bars: SLIDES.map((_, k) => ({ w: k < s.i ? '100%' : k === s.i ? '0' : '0', anim: k === s.i ? (s.cycle % 2 ? 'kxProg2' : 'kxProg') + ' 5s linear both' : 'none' })),
    prev: () => this.go((s.i + SLIDES.length - 1) % SLIDES.length),
    next: () => this.go((s.i + 1) % SLIDES.length),
    tryIt: () => this.go((s.i + 1) % SLIDES.length),
    rows: LOG.flatMap(([ver, date, isNew, items], k) => [
      { head: true, item: false, ver: 'Версия ' + ver, date, isNew, open: s.open === k, line: k ? '1px solid rgba(255,255,255,.06)' : 'none', rot: s.open === k ? 'rotate(180deg)' : 'none', tap: () => this.setState({ open: s.open === k ? -1 : k }) },
      ...(s.open === k ? items.map(([icon, c, t], j) => ({ head: false, item: true, icon, c, t, last: j === items.length - 1 })) : [])
    ])
  };
}
}
</script>
</body>
</html>
