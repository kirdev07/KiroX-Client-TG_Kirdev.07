<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Автоответ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
textarea{font:inherit;color:inherit}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxMsg{0%{opacity:0;transform:translateY(10px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes kxType{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 800">Автоответ</h1><span style="height: 20px; padding: 0 8px; border-radius: 10px; background: rgba(201,160,224,.18); color: #C9A0E0; font-size: 11px; font-weight: 800; line-height: 20px; flex: none">PREMIUM</span>
    <button onClick="{{toggleOn}}" aria-pressed="{{on}}" aria-label="Автоответ включён" style="width: 52px; height: 30px; border-radius: 15px; background: {{onTrack}}; position: relative; transition: background .2s"><span style="position: absolute; top: 3px; left: {{onKnob}}; width: 24px; height: 24px; border-radius: 12px; background: {{onKnobBg}}; transition: left .2s"></span></button>
  </header>

  <!-- Preview chat -->
  <div style="margin: 4px 16px 0; height: 190px; padding: 12px; box-sizing: border-box; border-radius: 24px; background: radial-gradient(90% 70% at 85% 0%, rgba(63,154,108,.2), transparent 60%), #111614; border: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; overflow: hidden">
    <div style="align-self: center; font-size: 11px; color: #8A958F">Так увидит тот, кто вам напишет</div>
    <div style="align-self: flex-end; max-width: 75%; padding: 7px 11px; border-radius: 16px 16px 6px 16px; background: rgba(255,255,255,.1); font-size: 14px; animation: kxMsg .3s ease both" data-k="{{loop}}">Здравствуйте! Можно заказать на завтра?</div>
    <sc-if value="{{typing}}" hint-placeholder-val="{{false}}"><div style="align-self: flex-start; padding: 8px 12px; border-radius: 16px 16px 16px 6px; background: rgba(143,211,172,.12); display: flex; gap: 3px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #8FD3AC; animation: kxType 1.2s infinite"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #8FD3AC; animation: kxType 1.2s .2s infinite"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #8FD3AC; animation: kxType 1.2s .4s infinite"></span></div></sc-if>
    <sc-if value="{{replied}}" hint-placeholder-val="{{true}}">
      <div style="align-self: flex-start; max-width: 82%; padding: 8px 12px; border-radius: 16px 16px 16px 6px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 14px; line-height: 1.35; animation: kxMsg .35s ease both">{{replyText}}<div style="margin-top: 2px; font-size: 11px; opacity: .65; display: flex; align-items: center; gap: 3px"><span class="ms" style="font-size: 12px" aria-hidden="true">smart_toy</span>автоответ</div></div>
    </sc-if>
    <sc-if value="{{noReply}}" hint-placeholder-val="{{false}}"><div style="align-self: center; font-size: 12px; color: #8A958F">{{noReplyText}}</div></sc-if>
  </div>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px 16px 110px; opacity: {{bodyOp}}; transition: opacity .3s">
    <div style="font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Текст</div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px">
      <sc-for list="{{templates}}" as="t" hint-placeholder-count="3"><button onClick="{{t.tap}}" style="height: 32px; padding: 0 12px; border-radius: 16px; background: {{t.bg}}; color: {{t.ink}}; border: 1px solid {{t.bd}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; transition: all .2s"><span class="ms" style="font-size: 15px" aria-hidden="true">{{t.icon}}</span>{{t.label}}</button></sc-for>
    </div>
    <div style="padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); font-size: 14px; line-height: 1.45; min-height: 60px">{{replyText}}</div>

    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Когда отвечать</div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{whens}}" as="w" hint-placeholder-count="3">
        <button onClick="{{w.tap}}" aria-pressed="{{w.on}}" style="padding: 12px 14px; border-radius: 18px; background: {{w.bg}}; border: 1px solid {{w.bd}}; display: flex; align-items: center; gap: 12px; transition: all .2s">
          <span class="ms" style="color: {{w.ic}}" aria-hidden="true">{{w.icon}}</span>
          <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 700">{{w.label}}</span><span style="display: block; font-size: 12px; color: #8A958F">{{w.sub}}</span></span>
          <span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{w.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{w.dot}}"></span></span>
        </button>
      </sc-for>
    </div>

    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Кому</div>
    <div style="padding: 4px; border-radius: 20px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px">
      <sc-for list="{{whos}}" as="o" hint-placeholder-count="3"><button onClick="{{o.tap}}" style="height: 40px; border-radius: 16px; background: {{o.bg}}; color: {{o.ink}}; font-size: 12px; font-weight: 700; text-align: center; transition: all .2s">{{o.label}}</button></sc-for>
    </div>
    <div style="margin: 8px 6px 0; font-size: 12px; color: #8A958F">Одному человеку автоответ придёт не чаще раза в сутки.</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: linear-gradient(180deg, rgba(10,12,11,0), #0A0C0B 40%)">
    <button onClick="{{save}}" style="width: 100%; height: 54px; border-radius: 27px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px"><span class="ms fill" aria-hidden="true">done</span>Сохранить</button>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 96px; padding: 12px 18px; border-radius: 18px; background: #232A26; border: 1px solid rgba(255,255,255,.16); font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2.4s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">smart_toy</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TPL = [
  ['Отпуск', 'beach_access', 'Я в отпуске до 1 декабря 🌴 Отвечу, как вернусь. Если срочно — пишите @maria_help.'],
  ['Не в сети', 'bedtime', 'Сейчас не в сети. Отвечу утром, после 9:00.'],
  ['Занят', 'work', 'Сейчас на встрече, отвечу в течение пары часов.']
];
const WHENS = [['Всегда', 'Пока автоответ включён', 'all_inclusive'], ['Вне рабочих часов', 'Пн–пт после 19:00 и в выходные', 'schedule'], ['Когда я не в сети', 'Если не заходили больше 10 минут', 'cloud_off']];
const WHOS = ['Всем', 'Не из контактов', 'Только новым'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { on: true, tpl: 0, when: 0, who: 0, phase: 0, loop: 0, toast: 0, toastText: '' }; }
componentDidMount() { this.cycle(); }
componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); clearTimeout(this.t3); clearTimeout(this.tt); }
cycle() {
  clearTimeout(this.t1); clearTimeout(this.t2); clearTimeout(this.t3);
  this.setState({ phase: 0, loop: this.state.loop + 1 });
  this.t1 = setTimeout(() => this.setState({ phase: 1 }), 700);
  this.t2 = setTimeout(() => this.setState({ phase: 2 }), 1800);
  this.t3 = setTimeout(() => this.cycle(), 5200);
}
renderVals() {
  const s = this.state;
  const sw = s.on;
  return {
    on: s.on, toggleOn: () => this.setState({ on: !s.on }),
    onTrack: sw ? '#3F9A6C' : 'rgba(255,255,255,.14)', onKnob: sw ? '25px' : '3px', onKnobBg: sw ? '#EEF3EF' : '#9AA59F',
    bodyOp: s.on ? '1' : '.45', loop: String(s.loop),
    typing: s.on && s.phase === 1, replied: s.on && s.phase === 2, noReply: !s.on && s.phase === 2,
    noReplyText: 'Автоответ выключен — человек будет ждать вас',
    replyText: TPL[s.tpl][2],
    templates: TPL.map(([label, icon], i) => ({ label, icon, bg: s.tpl === i ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.05)', ink: s.tpl === i ? '#8FD3AC' : '#C9D2CC', bd: s.tpl === i ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', tap: () => { this.setState({ tpl: i }); this.cycle(); } })),
    whens: WHENS.map(([label, sub, icon], i) => { const on = s.when === i; return { label, sub, icon, on, bg: on ? 'rgba(143,211,172,.1)' : 'rgba(255,255,255,.04)', bd: on ? 'rgba(143,211,172,.4)' : 'rgba(255,255,255,.08)', ic: on ? '#8FD3AC' : '#9AA59F', ring: on ? '#8FD3AC' : 'rgba(255,255,255,.3)', dot: on ? '#8FD3AC' : 'transparent', tap: () => this.setState({ when: i }) }; }),
    whos: WHOS.map((label, i) => ({ label, bg: s.who === i ? 'rgba(143,211,172,.16)' : 'transparent', ink: s.who === i ? '#8FD3AC' : '#C9D2CC', tap: () => this.setState({ who: i }) })),
    save: () => { clearTimeout(this.tt); this.setState({ toast: s.toast + 1, toastText: s.on ? 'Автоответ включён' : 'Автоответ выключен' }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2400); },
    toast: s.toast > 0, toastText: s.toastText
  };
}
}
</script>
</body>
</html>
