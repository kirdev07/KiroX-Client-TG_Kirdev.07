<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Стикеры и эмодзи</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.9)}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
input::placeholder{color:#8A958F}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes kxWob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes kxGif{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes kxPanel{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(120% 60% at 100% 0%, rgba(63,154,108,.22), #0A0C0B 60%); color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px">
    <button aria-label="Назад" style="width: 42px; height: 42px; border-radius: 21px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="width: 38px; height: 38px; border-radius: 19px; background: linear-gradient(140deg, #4B3F7A, #2A2240); color: #DCD0FF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">А</span>
    <div style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800">Анна</span><span style="font-size: 12px; color: #8FD3AC">в сети</span></div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 6px 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px">
    <div style="align-self: flex-start; max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 18px 5px; background: #161B18; font-size: 15px">Скинь что-нибудь смешное</div>
    <sc-for list="{{sent}}" as="m" hint-placeholder-count="1">
      <sc-if value="{{m.isText}}" hint-placeholder-val="{{true}}"><div style="align-self: flex-end; max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 5px 18px; background: linear-gradient(160deg, #2E6B4B, #1F4D36); color: #E6F6EC; font-size: {{m.fs}}; line-height: 1.3; animation: kxPop .3s ease both">{{m.text}}</div></sc-if>
      <sc-if value="{{m.isSticker}}" hint-placeholder-val="{{false}}"><div style="align-self: flex-end; font-size: 96px; line-height: 1; filter: drop-shadow(0 0 0 #fff) drop-shadow(0 6px 14px rgba(0,0,0,.5)); animation: kxPop .4s cubic-bezier(.34,1.45,.5,1) both">{{m.text}}</div></sc-if>
      <sc-if value="{{m.isGif}}" hint-placeholder-val="{{false}}"><div style="align-self: flex-end; width: 200px; height: 130px; border-radius: 18px; background: {{m.bg}}; background-size: 200% 100%; animation: kxPop .3s ease both, kxGif 3s linear 2; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box"><span style="font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.45)">GIF</span></div></sc-if>
    </sc-for>
  </div>

  <!-- Composer -->
  <div style="padding: 6px 10px 8px; display: flex; align-items: flex-end; gap: 8px">
    <div style="flex: 1; min-height: 46px; border-radius: 23px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; padding: 0 6px 0 4px">
      <button onClick="{{togglePanel}}" aria-label="{{panelBtnLabel}}" style="width: 38px; height: 38px; border-radius: 19px; display: flex; align-items: center; justify-content: center; color: {{panelBtnInk}}"><span class="ms" aria-hidden="true">{{panelBtnIcon}}</span></button>
      <span style="flex: 1; font-size: 15px; color: {{draftInk}}; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 4px">{{draftView}}</span>
      <sc-if value="{{hasDraft}}" hint-placeholder-val="{{false}}"><button onClick="{{backspace}}" aria-label="Стереть" style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: #9AA59F"><span class="ms" style="font-size: 20px" aria-hidden="true">backspace</span></button></sc-if>
    </div>
    <button onClick="{{send}}" aria-label="{{sendLabel}}" style="width: 46px; height: 46px; border-radius: 23px; background: linear-gradient(140deg, #6FC497, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms fill" aria-hidden="true">{{sendIcon}}</span></button>
  </div>

  <!-- Panel -->
  <sc-if value="{{panel}}" hint-placeholder-val="{{true}}">
    <div style="height: 392px; flex-shrink: 0; border-radius: 28px 28px 0 0; background: #111513; border-top: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; animation: kxPanel .3s cubic-bezier(.2,.9,.3,1) both">
      <div style="padding: 10px 12px 6px">
        <div style="height: 38px; border-radius: 19px; background: rgba(255,255,255,.06); display: flex; align-items: center; gap: 8px; padding: 0 12px">
          <span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">search</span>
          <input aria-label="Поиск" placeholder="{{searchHint}}" value="{{q}}" onInput="{{onQ}}" style="flex: 1; font-size: 14px">
        </div>
      </div>

      <!-- Category / pack strip -->
      <div class="scroll" style="display: flex; gap: 4px; padding: 0 10px 6px; overflow-x: auto; overflow-y: hidden">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
          <button onClick="{{c.pick}}" aria-label="{{c.label}}" style="flex-shrink: 0; width: 40px; height: 36px; border-radius: 12px; background: {{c.bg}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: background .2s">
            <sc-if value="{{c.isIcon}}" hint-placeholder-val="{{true}}"><span class="ms" style="font-size: 21px; font-variation-settings: {{c.fill}}" aria-hidden="true">{{c.icon}}</span></sc-if>
            <sc-if value="{{c.isEmoji}}" hint-placeholder-val="{{false}}"><span aria-hidden="true">{{c.icon}}</span></sc-if>
          </button>
        </sc-for>
      </div>

      <div class="scroll" style="flex: 1; min-height: 0; padding: 0 10px">
        <div style="padding: 4px 4px 6px; font-size: 12px; font-weight: 800; color: #8FD3AC">{{sectionTitle}}</div>
        <sc-if value="{{isEmoji}}" hint-placeholder-val="{{true}}">
          <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px">
            <sc-for list="{{emojis}}" as="e" hint-placeholder-count="32"><button onClick="{{e.tap}}" aria-label="{{e.ch}}" style="height: 42px; border-radius: 12px; font-size: 27px; display: flex; align-items: center; justify-content: center">{{e.ch}}</button></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{isStickers}}" hint-placeholder-val="{{false}}">
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{stickers}}" as="s" hint-placeholder-count="12"><button onClick="{{s.tap}}" aria-label="{{s.label}}" style="height: 80px; border-radius: 16px; font-size: 54px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 4px 8px rgba(0,0,0,.45)); animation: {{s.anim}}">{{s.ch}}</button></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{isGif}}" hint-placeholder-val="{{false}}">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{gifs}}" as="g" hint-placeholder-count="6"><button onClick="{{g.tap}}" style="height: {{g.h}}; border-radius: 16px; background: {{g.bg}}; background-size: 200% 100%; animation: kxGif {{g.speed}} linear 2; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box"><span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: rgba(0,0,0,.4)">{{g.label}}</span></button></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div style="padding: 30px 0; text-align: center; font-size: 14px; color: #8A958F">Ничего не нашлось</div></sc-if>
        <div style="height: 10px"></div>
      </div>

      <!-- Mode switch -->
      <div style="padding: 6px 12px 14px; display: flex; justify-content: center">
        <div style="position: relative; display: flex; padding: 4px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08)">
          <span aria-hidden="true" style="position: absolute; top: 4px; left: 4px; width: 92px; height: 34px; border-radius: 17px; background: linear-gradient(180deg, rgba(143,211,172,.28), rgba(143,211,172,.14)); border: 1px solid rgba(143,211,172,.4); box-sizing: border-box; transform: translateX({{lensX}}); transition: transform .4s cubic-bezier(.34,1.45,.5,1)"></span>
          <sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><button onClick="{{m.pick}}" style="position: relative; width: 92px; height: 34px; border-radius: 17px; font-size: 13px; font-weight: 700; color: {{m.ink}}; text-align: center; transition: color .2s">{{m.label}}</button></sc-for>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{noPanel}}" hint-placeholder-val="{{false}}"><div style="height: 18px"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
  super(props);
  this.state = { panel: true, mode: 0, cat: 0, draft: '', sent: [], q: '', recent: ['😂', '❤️', '👍', '🔥', '🥹', '😎', '🎉', '🙏'] };
}
push(m) { this.setState({ sent: [...this.state.sent, m].slice(-4) }); }
renderVals() {
  const s = this.state;
  const E = [
    ['schedule', 'Недавние', null, ''],
    ['😀', 'Смайлы', '😀😃😄😁😆😅😂🤣🥲🥹😊😇🙂😉😌😍🥰😘😋😛😜🤪😎🤩🥳😏😒😔😢😭😤😡🤯😱🤗🤔🫡🤫😴', 'улыбка смех'],
    ['🐱', 'Животные', '🐶🐱🐭🐹🐰🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🐔🐧🐦🦆🦉🐺🐗🐴🦄🐝🦋🐌🐞🐢🐍🦖🐙🦀🐬🐳🦈', 'кот собака'],
    ['🍕', 'Еда', '🍏🍎🍐🍊🍋🍌🍉🍇🍓🫐🍒🍑🥭🍍🥥🥝🍅🥑🥦🌽🥕🥐🍞🧀🍳🥞🍔🍟🍕🌭🌮🍣🍩🍪🎂☕🍵🧃', 'еда пицца'],
    ['⚽', 'Активности', '⚽🏀🏈⚾🎾🏐🎱🏓🏸🥊🎯🎳🎮🎲🧩🎸🎹🎺🎻🥁🎤🎧🎬🎨🏆🥇🎫🎪🛹🚴🏊🧗', 'спорт игра'],
    ['💡', 'Предметы', '⌚📱💻⌨️🖥️🖨️📷📹🎥📺📻⏰🔋🔌💡🔦🕯️💸💰💳💎🔧🔨🧲🔑🗝️🚪🛋️🎁🎈📦✉️📌✂️📎', 'вещи'],
    ['❤️', 'Символы', '❤️🧡💛💚💙💜🖤🤍🤎💔❣️💕💞💓💗💖💘💝✨⭐🌟💫🔥💯✅❌⚠️♻️🔔🎵➕➖✔️', 'сердце огонь']
  ];
  const ST = [
    ['star', 'Избранные', '🐼🦊🐸🐱', ''],
    ['🐼', 'Панда', '🐼🎍🍃🎋🥟🍜🧋😴🙈🫶🎉💤', 'панда'],
    ['🦊', 'Лис', '🦊🍂🌙🔥😏🎒🧣☕📚🏕️🎸👋', 'лис'],
    ['🐸', 'Лягушка', '🐸🪷💧🌿🎶😐🤌☔🍵🦟👑🫠', 'лягушка'],
    ['add', 'Свой набор', '', '']
  ];
  const G = ['Тренды', 'Смех', 'Ура', 'Привет', 'Котики', 'Да', 'Нет', 'Танец'];
  const grads = ['linear-gradient(90deg,#3F9A6C,#1B2E3A,#3F9A6C)', 'linear-gradient(90deg,#6A4C9C,#2A2240,#6A4C9C)', 'linear-gradient(90deg,#C77D3A,#3A2414,#C77D3A)', 'linear-gradient(90deg,#2F6E9E,#14243A,#2F6E9E)', 'linear-gradient(90deg,#9E3F5C,#2E1420,#9E3F5C)', 'linear-gradient(90deg,#5C9E3F,#1E2E14,#5C9E3F)'];
  const q = s.q.trim().toLowerCase();
  const modes = ['Эмодзи', 'Стикеры', 'GIF'].map((label, i) => ({ label, ink: i === s.mode ? '#EEF3EF' : '#8A958F', pick: () => this.setState({ mode: i, cat: 0, q: '' }) }));
  const src = s.mode === 0 ? E : s.mode === 1 ? ST : G.map(g => ['', g, '', g.toLowerCase()]);
  const cats = (s.mode === 2 ? [] : src).map(([icon, label], i) => {
    const isIcon = /^[a-z_]+$/.test(icon);
    return { icon, label, isIcon, isEmoji: !isIcon, fill: i === s.cat ? "'FILL' 1" : "'FILL' 0", bg: i === s.cat ? 'rgba(143,211,172,.16)' : 'transparent', ink: i === s.cat ? '#8FD3AC' : '#8A958F', pick: () => { if (s.mode === 1 && icon === 'add') return; this.setState({ cat: i, q: '' }); } };
  });
  const split = str => Array.from(str.matchAll(/\p{Extended_Pictographic}(️|‍\p{Extended_Pictographic})*/gu)).map(m => m[0]);
  let emojis = [], stickers = [], gifs = [], title = '';
  if (s.mode === 0) {
    let list;
    if (q) { list = E.filter(c => c[3] && (c[3].includes(q) || c[1].toLowerCase().includes(q))).flatMap(c => split(c[2])); title = 'Поиск'; }
    else if (s.cat === 0) { list = s.recent; title = 'Недавние'; }
    else { list = split(E[s.cat][2]); title = E[s.cat][1]; }
    emojis = list.map(ch => ({ ch, tap: () => this.setState({ draft: this.state.draft + ch, recent: [ch, ...this.state.recent.filter(x => x !== ch)].slice(0, 16) }) }));
  } else if (s.mode === 1) {
    let list;
    if (q) { list = ST.filter(c => c[3] && c[3].includes(q)).flatMap(c => split(c[2])); title = 'Поиск'; }
    else { list = split(ST[s.cat][2]); title = ST[s.cat][1]; }
    stickers = list.map((ch, i) => ({ ch, label: 'Стикер ' + ch, anim: i % 3 === 0 ? 'kxWob 2.4s ease-in-out 2' : 'none', tap: () => this.push({ type: 'sticker', text: ch }) }));
  } else {
    const list = q ? G.filter(g => g.toLowerCase().includes(q)) : G;
    title = q ? 'Поиск' : 'Популярные GIF';
    gifs = list.map((label, i) => ({ label, bg: grads[i % grads.length], h: i % 3 === 0 ? '130px' : '100px', speed: (2 + (i % 3)) + 's', tap: () => this.push({ type: 'gif', bg: grads[i % grads.length] }) }));
  }
  const sent = s.sent.map(m => ({ ...m, isText: m.type === 'text', isSticker: m.type === 'sticker', isGif: m.type === 'gif', fs: m.big ? '40px' : '15px', bg: m.bg || '' }));
  const hasDraft = s.draft.length > 0;
  const onlyEmoji = hasDraft && split(s.draft).join('') === s.draft && split(s.draft).length <= 3;
  return {
    sent, cats, emojis, stickers, gifs, modes,
    sectionTitle: title,
    isEmoji: s.mode === 0, isStickers: s.mode === 1, isGif: s.mode === 2,
    empty: (s.mode === 0 && !emojis.length) || (s.mode === 1 && !stickers.length && q) || (s.mode === 2 && !gifs.length),
    lensX: (s.mode * 92) + 'px',
    panel: s.panel, noPanel: !s.panel,
    togglePanel: () => this.setState({ panel: !s.panel }),
    panelBtnIcon: s.panel ? 'keyboard' : 'mood', panelBtnInk: s.panel ? '#8FD3AC' : '#9AA59F', panelBtnLabel: s.panel ? 'Клавиатура' : 'Эмодзи и стикеры',
    draftView: hasDraft ? s.draft : 'Сообщение', draftInk: hasDraft ? '#EEF3EF' : '#8A958F', hasDraft,
    backspace: () => { const parts = split(this.state.draft); this.setState({ draft: parts.slice(0, -1).join('') }); },
    sendIcon: hasDraft ? 'send' : 'mic', sendLabel: hasDraft ? 'Отправить' : 'Голосовое',
    send: () => { if (!hasDraft) return; this.push({ type: 'text', text: s.draft, big: onlyEmoji }); this.setState({ draft: '' }); },
    q: s.q, onQ: e => this.setState({ q: e.target.value }),
    searchHint: ['Поиск эмодзи', 'Поиск стикеров', 'Поиск GIF'][s.mode]
  };
}
}
</script>
</body>
</html>
