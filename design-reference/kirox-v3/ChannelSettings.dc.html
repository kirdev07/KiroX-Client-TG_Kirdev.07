<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки канала</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
input,textarea{font:inherit;color:inherit}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 800">Настройки канала</h1>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 16px 110px">
    <!-- Identity -->
    <div style="display: flex; align-items: center; gap: 14px">
      <button onClick="{{photo}}" aria-label="Сменить фото канала" style="position: relative; width: 76px; height: 76px; border-radius: 38px; background: linear-gradient(135deg, #6FC497, #2F6E9E); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms fill" style="font-size: 36px; color: #06150D" aria-hidden="true">campaign</span><span style="position: absolute; right: -2px; bottom: -2px; width: 28px; height: 28px; border-radius: 14px; background: #1A201D; border: 2px solid #0A0C0B; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 16px" aria-hidden="true">photo_camera</span></span></button>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <label style="height: 46px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); display: flex; align-items: center"><input value="{{title}}" onInput="{{onTitle}}" aria-label="Название канала" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 16px; font-weight: 700"></label>
      </div>
    </div>
    <textarea onInput="{{onDesc}}" aria-label="Описание канала" placeholder="Описание" style="margin-top: 10px; width: 100%; box-sizing: border-box; height: 76px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); outline: none; resize: none; font-size: 14px; line-height: 1.4">Новости Android-разработки каждую неделю: Compose, Kotlin, инструменты.</textarea>

    <!-- Type -->
    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Тип канала</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="2">
        <button onClick="{{t.tap}}" aria-pressed="{{t.on}}" style="padding: 12px; border-radius: 18px; background: {{t.bg}}; border: 1px solid {{t.bd}}; transition: all .2s">
          <span class="ms" style="color: {{t.ic}}; font-variation-settings: {{t.fill}}" aria-hidden="true">{{t.icon}}</span>
          <span style="display: block; margin-top: 6px; font-size: 14px; font-weight: 700">{{t.label}}</span>
          <span style="display: block; font-size: 11px; color: #8A958F">{{t.sub}}</span>
        </button>
      </sc-for>
    </div>
    <div style="margin-top: 8px; height: 48px; padding: 0 6px 0 14px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 8px; animation: kxIn .2s ease both" data-k="{{linkKey}}">
      <span class="ms" style="color: #9AA59F; font-size: 20px" aria-hidden="true">{{linkIcon}}</span>
      <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{link}}</span>
      <button onClick="{{copy}}" aria-label="Скопировать ссылку" style="width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px" aria-hidden="true">content_copy</span></button>
    </div>

    <!-- Toggles -->
    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Публикации</div>
    <div style="border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); overflow: hidden">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
        <button onClick="{{o.tap}}" aria-pressed="{{o.on}}" style="width: 100%; padding: 13px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.05)">
          <span class="ms" style="color: {{o.ic}}" aria-hidden="true">{{o.icon}}</span>
          <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">{{o.label}}</span><span style="display: block; margin-top: 2px; font-size: 12px; color: #8A958F">{{o.sub}}</span></span>
          <span style="width: 48px; height: 28px; border-radius: 14px; background: {{o.track}}; position: relative; transition: background .2s; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{o.knob}}; width: 22px; height: 22px; border-radius: 11px; background: {{o.knobBg}}; transition: left .2s"></span></span>
        </button>
      </sc-for>
    </div>

    <!-- Post preview -->
    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Так увидят подписчики</div>
    <div style="padding: 12px; border-radius: 20px; background: #111614; border: 1px solid rgba(255,255,255,.08)">
      <div style="font-size: 13px; font-weight: 800; color: #8FD3AC">{{title}}</div>
      <div style="margin-top: 4px; font-size: 14px; line-height: 1.4">Вышел Kotlin 2.3 — разбираем, что поменялось 🚀</div>
      <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #8A958F">
        <sc-if value="{{sign}}" hint-placeholder-val="{{true}}"><span style="font-style: italic; color: #9AA59F">Мария</span></sc-if>
        <span style="margin-left: auto; display: flex; align-items: center; gap: 2px"><span class="ms" style="font-size: 14px" aria-hidden="true">visibility</span>12,4K</span><span>09:30</span>
      </div>
      <div style="margin-top: 8px; display: flex; gap: 6px">
        <sc-if value="{{react}}" hint-placeholder-val="{{true}}"><span style="height: 26px; padding: 0 8px; border-radius: 13px; background: rgba(255,255,255,.06); font-size: 12px; display: flex; align-items: center; gap: 4px">🔥 <b>214</b></span><span style="height: 26px; padding: 0 8px; border-radius: 13px; background: rgba(255,255,255,.06); font-size: 12px; display: flex; align-items: center; gap: 4px">👍 <b>96</b></span></sc-if>
        <span style="margin-left: auto; display: flex; gap: 6px">
          <sc-if value="{{canFwd}}" hint-placeholder-val="{{true}}"><span style="width: 26px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 15px" aria-hidden="true">forward</span></span></sc-if>
          <sc-if value="{{noFwd}}" hint-placeholder-val="{{false}}"><span style="height: 26px; padding: 0 8px; border-radius: 13px; background: rgba(232,176,74,.12); color: #E8B04A; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px"><span class="ms" style="font-size: 14px" aria-hidden="true">lock</span>Защищено</span></sc-if>
        </span>
      </div>
      <sc-if value="{{comments}}" hint-placeholder-val="{{true}}"><div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8FD3AC; font-weight: 700"><span class="ms" style="font-size: 18px" aria-hidden="true">forum</span>48 комментариев<span class="ms" style="margin-left: auto; font-size: 18px; color: #8A958F" aria-hidden="true">chevron_right</span></div></sc-if>
    </div>

    <button onClick="{{del}}" style="margin-top: 16px; width: 100%; height: 50px; border-radius: 18px; background: rgba(229,83,75,.08); border: 1px solid rgba(229,83,75,.22); color: #FF8A80; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><span class="ms" aria-hidden="true">delete</span>Удалить канал</button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: linear-gradient(180deg, rgba(10,12,11,0), #0A0C0B 40%)">
    <button onClick="{{save}}" style="width: 100%; height: 54px; border-radius: 27px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px"><span class="ms fill" aria-hidden="true">done</span>Сохранить</button>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 96px; padding: 12px 18px; border-radius: 18px; background: #232A26; border: 1px solid rgba(255,255,255,.16); font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2.4s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">{{toastIcon}}</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { title: 'Android Weekly', pub: true, sign: true, protect: false, comments: true, react: true, silent: false, toast: 0, toastText: '', toastIcon: 'done' }; }
componentWillUnmount() { clearTimeout(this.tt); }
toastMsg(text, icon) { clearTimeout(this.tt); this.setState({ toast: this.state.toast + 1, toastText: text, toastIcon: icon }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2400); }
renderVals() {
  const s = this.state;
  const sw = v => ({ track: v ? '#3F9A6C' : 'rgba(255,255,255,.14)', knob: v ? '23px' : '3px', knobBg: v ? '#EEF3EF' : '#9AA59F' });
  return {
    title: s.title, onTitle: e => this.setState({ title: e.target.value }), onDesc: () => {},
    photo: () => this.toastMsg('Откроется выбор фото', 'photo_camera'),
    types: [['Публичный', 'Любой найдёт в поиске', 'public', true], ['Частный', 'Только по ссылке', 'lock', false]].map(([label, sub, icon, v]) => { const on = s.pub === v; return { label, sub, icon, on, bg: on ? 'rgba(143,211,172,.12)' : 'rgba(255,255,255,.04)', bd: on ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', ic: on ? '#8FD3AC' : '#9AA59F', fill: on ? "'FILL' 1" : "'FILL' 0", tap: () => this.setState({ pub: v }) }; }),
    link: s.pub ? 't.me/android_weekly_ru' : 't.me/+Ab3dK9xQ2pLm', linkIcon: s.pub ? 'alternate_email' : 'key', linkKey: s.pub ? 'p' : 'x',
    copy: () => this.toastMsg('Ссылка скопирована', 'content_copy'),
    opts: [
      { icon: 'draw', label: 'Подписывать посты', sub: 'Под постом будет имя админа', k: 'sign' },
      { icon: 'shield_lock', label: 'Запретить копирование', sub: 'Нельзя пересылать, сохранять и делать скриншоты', k: 'protect' },
      { icon: 'forum', label: 'Комментарии', sub: 'Обсуждение в группе «Android Weekly · чат»', k: 'comments' },
      { icon: 'add_reaction', label: 'Реакции', sub: 'Подписчики могут ставить реакции', k: 'react' },
      { icon: 'notifications_paused', label: 'Тихие публикации', sub: 'Новые посты приходят без звука', k: 'silent' }
    ].map(o => { const w = sw(s[o.k]); return { ...o, on: s[o.k], ic: s[o.k] ? '#8FD3AC' : '#9AA59F', track: w.track, knob: w.knob, knobBg: w.knobBg, tap: () => this.setState({ [o.k]: !s[o.k] }) }; }),
    sign: s.sign, react: s.react, comments: s.comments, canFwd: !s.protect, noFwd: s.protect,
    del: () => this.toastMsg('Удаление попросит подтверждения', 'delete'),
    save: () => this.toastMsg('Настройки канала сохранены', 'done'),
    toast: s.toast > 0, toastText: s.toastText, toastIcon: s.toastIcon
  };
}
}
</script>
</body>
</html>
