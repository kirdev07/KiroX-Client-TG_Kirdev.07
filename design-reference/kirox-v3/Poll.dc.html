<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Опрос</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
input::placeholder{color:#8A958F}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kxPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@keyframes kxSend{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:none}}
@keyframes kxConf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-120px) rotate(300deg);opacity:0}}
@keyframes kxShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">

  <!-- Creator -->
  <sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
    <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
      <button aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">close</span></button>
      <h1 style="flex: 1; margin: 0; font-size: 22px; font-weight: 800">{{headTitle}}</h1>
      <button onClick="{{create}}" style="height: 40px; padding: 0 16px; border-radius: 20px; background: {{createBg}}; color: {{createInk}}; font-size: 14px; font-weight: 700; transition: background .2s, color .2s; text-align: center">Создать</button>
    </header>
    <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 16px 30px">
      <div style="padding: 0 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Вопрос</div>
      <div style="border-radius: 22px; background: rgba(255,255,255,.045); padding: 0 16px; height: 56px; display: flex; align-items: center"><input aria-label="Вопрос" placeholder="Задайте вопрос" value="{{q}}" onInput="{{onQ}}" style="flex: 1; font-size: 16px; font-weight: 600"></div>

      <div style="padding: 16px 4px 6px; display: flex; align-items: baseline"><span style="flex: 1; font-size: 13px; font-weight: 800; color: #8FD3AC">Варианты</span><span style="font-size: 12px; color: #8A958F">{{optCount}}</span></div>
      <div style="border-radius: 22px; background: rgba(255,255,255,.045); overflow: hidden">
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 8px 0 14px; border-top: {{o.line}}; animation: kxIn .25s ease both">
            <sc-if value="{{o.quiz}}" hint-placeholder-val="{{false}}"><button onClick="{{o.mark}}" aria-label="Правильный ответ" style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid {{o.ringInk}}; background: {{o.ringBg}}; color: #06150D; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s"><sc-if value="{{o.correct}}" hint-placeholder-val="{{false}}"><span class="ms fill" style="font-size: 16px" aria-hidden="true">check</span></sc-if></button></sc-if>
            <sc-if value="{{o.notQuiz}}" hint-placeholder-val="{{true}}"><span class="ms" style="color: #8A958F; flex-shrink: 0" aria-hidden="true">drag_indicator</span></sc-if>
            <input aria-label="{{o.label}}" placeholder="Вариант ответа" value="{{o.text}}" onInput="{{o.onInput}}" style="flex: 1; font-size: 15px">
            <button onClick="{{o.remove}}" aria-label="Удалить вариант" style="width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #8A958F; opacity: {{o.canRemove}}"><span class="ms" style="font-size: 20px" aria-hidden="true">remove_circle_outline</span></button>
          </div>
        </sc-for>
        <sc-if value="{{canAdd}}" hint-placeholder-val="{{true}}">
          <button onClick="{{add}}" style="width: 100%; height: 52px; padding: 0 14px; border-top: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; gap: 10px; color: #8FD3AC; font-size: 15px; font-weight: 600"><span class="ms" aria-hidden="true">add_circle</span>Добавить вариант</button>
        </sc-if>
      </div>
      <sc-if value="{{quizHint}}" hint-placeholder-val="{{false}}"><div style="padding: 6px 6px 0; font-size: 12px; color: #E8B04A">Отметьте правильный ответ кружком слева</div></sc-if>

      <div style="padding: 16px 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Настройки</div>
      <div style="border-radius: 22px; background: rgba(255,255,255,.045); overflow: hidden">
        <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
          <button onClick="{{t.tap}}" style="width: 100%; padding: 13px 16px; display: flex; align-items: center; gap: 12px; border-top: {{t.line}}; opacity: {{t.op}}">
            <span class="ms" style="color: #8FD3AC" aria-hidden="true">{{t.icon}}</span>
            <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">{{t.label}}</span><span style="display: block; margin-top: 2px; font-size: 12px; color: #9AA59F">{{t.sub}}</span></span>
            <span style="width: 50px; height: 30px; border-radius: 15px; background: {{t.track}}; position: relative; flex-shrink: 0; transition: background .2s"><span style="position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: {{t.knob}}; transform: translateX({{t.x}}); transition: transform .25s cubic-bezier(.34,1.45,.5,1)"></span></span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <!-- Poll in chat -->
  <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
    <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px">
      <button onClick="{{backEdit}}" aria-label="Назад" style="width: 42px; height: 42px; border-radius: 21px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
      <span style="width: 38px; height: 38px; border-radius: 19px; background: linear-gradient(140deg,#4B3F7A,#2A2240); color: #DCD0FF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">К</span>
      <div><div style="font-size: 16px; font-weight: 800">Курс английского</div><div style="font-size: 12px; color: #9AA59F">24 участника</div></div>
    </header>
    <div style="flex: 1; min-height: 0; padding: 10px 12px; display: flex; flex-direction: column; justify-content: flex-end; background: radial-gradient(120% 60% at 100% 0%, rgba(63,154,108,.18), #0A0C0B 60%)">
      <div style="position: relative; align-self: flex-end; width: 300px; padding: 14px; border-radius: 22px 22px 6px 22px; background: linear-gradient(160deg, #23523B, #183A2A); animation: kxSend .45s cubic-bezier(.2,.9,.3,1) both, {{shake}}">
        <div style="font-size: 16px; font-weight: 800; line-height: 1.3">{{pollQ}}</div>
        <div style="margin-top: 3px; font-size: 12px; color: #A9D9BF">{{pollKind}}</div>
        <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{answers}}" as="a" hint-placeholder-count="3">
            <button onClick="{{a.tap}}" style="position: relative; width: 100%; min-height: 42px; padding: 0 12px; border-radius: 14px; background: rgba(0,0,0,.18); overflow: hidden; display: flex; align-items: center; gap: 10px">
              <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{a.w}}; background: {{a.bar}}; transition: width .7s cubic-bezier(.2,.9,.3,1)"></span>
              <span style="position: relative; width: 22px; height: 22px; border-radius: {{a.shape}}; border: 2px solid {{a.ring}}; background: {{a.dot}}; color: #06150D; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s"><sc-if value="{{a.icon}}" hint-placeholder-val="{{false}}"><span class="ms fill" style="font-size: 15px; animation: kxPop .3s ease both" aria-hidden="true">{{a.iconName}}</span></sc-if></span>
              <span style="position: relative; flex: 1; font-size: 14px; font-weight: 600; padding: 10px 0">{{a.text}}</span>
              <sc-if value="{{a.showPct}}" hint-placeholder-val="{{false}}"><span style="position: relative; font-size: 13px; font-weight: 800; animation: kxIn .3s ease both">{{a.pct}}</span></sc-if>
            </button>
          </sc-for>
        </div>
        <div style="margin-top: 10px; display: flex; align-items: center; font-size: 12px; color: #A9D9BF">
          <span style="flex: 1">{{votes}}</span>
          <sc-if value="{{canSubmit}}" hint-placeholder-val="{{false}}"><button onClick="{{submit}}" style="height: 30px; padding: 0 12px; border-radius: 15px; background: #8FD3AC; color: #06150D; font-size: 12px; font-weight: 800">Проголосовать</button></sc-if>
          <sc-if value="{{canRetract}}" hint-placeholder-val="{{false}}"><button onClick="{{retract}}" style="height: 30px; padding: 0 10px; border-radius: 15px; background: rgba(0,0,0,.2); font-size: 12px; font-weight: 700">Отменить голос</button></sc-if>
        </div>
        <sc-if value="{{confetti}}" hint-placeholder-val="{{false}}">
          <sc-for list="{{bits}}" as="b" hint-placeholder-count="12"><span aria-hidden="true" style="position: absolute; left: {{b.x}}; bottom: 40px; width: 8px; height: 8px; border-radius: 2px; background: {{b.c}}; animation: kxConf 1.1s ease-out {{b.d}} both"></span></sc-for>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
  super(props);
  this.state = { q: 'Когда удобнее заниматься?', opts: ['Утром', 'Днём', 'Вечером'], anon: true, multi: false, quiz: false, correct: -1, mode: 'edit', picked: [], voted: false, wrongAt: 0, confAt: 0 };
}
renderVals() {
  const s = this.state;
  const filled = s.opts.filter(o => o.trim());
  const canCreate = s.q.trim() && filled.length >= 2 && (!s.quiz || (s.correct >= 0 && s.opts[s.correct] && s.opts[s.correct].trim()));
  const setOpt = (i, v) => { const opts = s.opts.slice(); opts[i] = v; this.setState({ opts }); };
  const opts = s.opts.map((text, i) => ({
    text, label: 'Вариант ' + (i + 1), line: i ? '1px solid rgba(255,255,255,.06)' : '0',
    quiz: s.quiz, notQuiz: !s.quiz, correct: s.correct === i,
    ringInk: s.correct === i ? '#8FD3AC' : '#5C6661', ringBg: s.correct === i ? '#8FD3AC' : 'transparent',
    mark: () => this.setState({ correct: i }),
    onInput: e => setOpt(i, e.target.value),
    canRemove: s.opts.length > 2 ? '1' : '.3',
    remove: () => { if (s.opts.length <= 2) return; this.setState({ opts: s.opts.filter((_, k) => k !== i), correct: s.correct === i ? -1 : s.correct > i ? s.correct - 1 : s.correct }); }
  }));
  const sw = on => ({ track: on ? '#8FD3AC' : 'rgba(255,255,255,.12)', knob: on ? '#06150D' : '#8A958F', x: on ? '20px' : '0' });
  const toggles = [
    { icon: 'visibility_off', label: 'Анонимный опрос', sub: 'Никто не увидит, кто как проголосовал', ...sw(s.anon), op: '1', tap: () => this.setState({ anon: !s.anon }) },
    { icon: 'checklist', label: 'Несколько ответов', sub: 'Можно выбрать больше одного варианта', ...sw(s.multi), op: s.quiz ? '.4' : '1', tap: () => { if (!s.quiz) this.setState({ multi: !s.multi }); } },
    { icon: 'school', label: 'Викторина', sub: 'Один правильный ответ, его увидят после голоса', ...sw(s.quiz), op: '1', tap: () => this.setState({ quiz: !s.quiz, multi: false }) }
  ].map((t, i) => ({ ...t, line: i ? '1px solid rgba(255,255,255,.06)' : '0' }));

  // Poll results
  const shown = s.opts.map((t, i) => ({ t: t.trim(), i })).filter(x => x.t);
  const base = [9, 5, 7, 3, 4, 2, 6, 1, 3, 2];
  const counts = shown.map((x, k) => base[k % base.length] + (s.voted && s.picked.includes(x.i) ? 1 : 0));
  const total = counts.reduce((a, b) => a + b, 0);
  const answers = shown.map((x, k) => {
    const pick = s.picked.includes(x.i);
    const pct = Math.round(counts[k] / total * 100);
    const isCorrect = s.quiz && x.i === s.correct;
    const reveal = s.voted;
    let bar = 'transparent', ring = '#A9D9BF', dot = 'transparent', icon = false, iconName = 'check';
    if (reveal) {
      bar = s.quiz ? (isCorrect ? 'rgba(143,211,172,.35)' : pick ? 'rgba(255,138,128,.3)' : 'rgba(255,255,255,.08)') : (pick ? 'rgba(143,211,172,.35)' : 'rgba(255,255,255,.1)');
      if (pick || isCorrect) { icon = true; dot = s.quiz && pick && !isCorrect ? '#FF8A80' : '#8FD3AC'; ring = dot; iconName = s.quiz && pick && !isCorrect ? 'close' : 'check'; }
    } else if (pick) { ring = '#8FD3AC'; dot = '#8FD3AC'; icon = true; }
    return {
      text: x.t, pct: pct + '%', showPct: reveal, w: reveal ? pct + '%' : '0%', bar, ring, dot, icon, iconName,
      shape: s.multi ? '6px' : '11px',
      tap: () => {
        if (s.voted) return;
        if (s.multi) { this.setState({ picked: pick ? s.picked.filter(p => p !== x.i) : [...s.picked, x.i] }); return; }
        const wrong = s.quiz && x.i !== s.correct;
        this.setState({ picked: [x.i], voted: true, wrongAt: wrong ? Date.now() : 0, confAt: s.quiz && !wrong ? Date.now() : 0 });
      }
    };
  });
  const colors = ['#8FD3AC', '#E8B04A', '#FF8A80', '#9FB7FF', '#F2A65A', '#DCD0FF'];
  const n = total;
  const word = n % 10 === 1 && n % 100 !== 11 ? 'голос' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'голоса' : 'голосов';
  return {
    editing: s.mode === 'edit', sent: s.mode === 'sent',
    headTitle: s.quiz ? 'Викторина' : 'Опрос',
    q: s.q, onQ: e => this.setState({ q: e.target.value }),
    opts, optCount: s.opts.length + ' из 10', canAdd: s.opts.length < 10,
    add: () => this.setState({ opts: [...s.opts, ''] }),
    quizHint: s.quiz && s.correct < 0,
    toggles,
    createBg: canCreate ? '#8FD3AC' : 'rgba(255,255,255,.07)', createInk: canCreate ? '#06150D' : '#5C6661',
    create: () => { if (canCreate) this.setState({ mode: 'sent', picked: [], voted: false, wrongAt: 0, confAt: 0 }); },
    backEdit: () => this.setState({ mode: 'edit' }),
    pollQ: s.q, pollKind: (s.anon ? 'Анонимный ' : 'Открытый ') + (s.quiz ? 'тест' : 'опрос') + (s.multi ? ' · несколько ответов' : ''),
    answers,
    votes: s.voted ? n + ' ' + word : (n ? n + ' ' + word : 'Пока нет голосов'),
    canSubmit: s.multi && !s.voted && s.picked.length > 0,
    submit: () => this.setState({ voted: true }),
    canRetract: s.voted && !s.quiz,
    retract: () => this.setState({ voted: false, picked: [] }),
    shake: s.wrongAt && Date.now() - s.wrongAt < 800 ? 'kxShake .4s ease .1s' : 'none',
    confetti: !!s.confAt && Date.now() - s.confAt < 1500,
    bits: Array.from({ length: 12 }, (_, i) => ({ x: (20 + i * 22) + 'px', c: colors[i % colors.length], d: (i % 4) * 0.06 + 's' }))
  };
}
}
</script>
</body>
</html>
