<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Истории</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input::placeholder{color:rgba(255,255,255,.7)}
@keyframes kxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes kxSheen{0%{transform:translateX(-140%)}55%,100%{transform:translateX(260%)}}
@keyframes kxSpinRing{to{transform:rotate(360deg)}}
@keyframes kxZoom{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes kxKen{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes kxFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-160px) scale(1.8)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: -90px; top: -110px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(70,160,110,.18), rgba(70,160,110,0) 65%)"></div>

  <header style="position: relative; padding: 10px 16px 4px; display: flex; align-items: center; gap: 8px">
    <h1 style="margin: 0; flex-grow: 1; font-size: 30px; font-weight: 800; letter-spacing: -0.4px">Истории</h1>
    <button aria-label="Скрытые истории" style="width: 42px; height: 42px; border-radius: 21px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; color: #C9D2CC"><span class="ms" style="font-size: 22px" aria-hidden="true">visibility_off</span></button>
    <button aria-label="Новая история" style="width: 42px; height: 42px; border-radius: 21px; background: linear-gradient(140deg, #8FD3AC, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(63,154,108,.35)"><span class="ms" style="font-size: 22px" aria-hidden="true">add_a_photo</span></button>
  </header>

  <div style="position: relative; padding: 12px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button aria-label="Добавить историю" style="position: relative; height: 214px; border-radius: 24px; overflow: hidden; background: linear-gradient(160deg, #1E3A2A, #0F1A14); border: 1px dashed rgba(143,211,172,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; animation: kxRise .5s cubic-bezier(.2,.8,.2,1) both">
      <span style="width: 58px; height: 58px; border-radius: 29px; background: rgba(143,211,172,.16); color: #8FD3AC; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 30px" aria-hidden="true">add</span></span>
      <span style="font-size: 15px; font-weight: 700">Моя история</span>
      <span style="font-size: 12px; color: #9AA59F; text-align: center; padding: 0 16px">Фото или видео на 24 часа</span>
    </button>
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
      <button aria-label="{{c.label}}" onClick="{{c.open}}" style="position: relative; height: 214px; border-radius: 24px; overflow: hidden; background: {{c.bg}}; animation: kxRise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: {{c.delay}}; box-shadow: {{c.glow}}">
        <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.65))"></span>
        <span class="ms fill" style="position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); font-size: 44px; color: rgba(255,255,255,.28)" aria-hidden="true">{{c.icon}}</span>
        <span style="position: absolute; left: 10px; top: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center">
          <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: {{c.ring}}; animation: {{c.spin}}"></span>
          <span style="position: relative; width: 34px; height: 34px; border-radius: 17px; border: 2px solid #0A0C0B; box-sizing: border-box; background: {{c.avatar}}; color: {{c.ink}}; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.letter}}</span>
        </span>
        <span style="position: absolute; left: 12px; right: 12px; bottom: 10px">
          <span style="display: block; font-size: 15px; font-weight: 700">{{c.name}}</span>
          <span style="display: block; font-size: 12px; color: rgba(255,255,255,.75)">{{c.when}}</span>
        </span>
        <sc-if value="{{c.count}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 10px; top: 14px; padding: 2px 8px; border-radius: 10px; background: rgba(0,0,0,.4); font-size: 11px; font-weight: 700">{{c.count}}</span></sc-if>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{viewing}}" hint-placeholder-val="{{false}}">
    <div role="dialog" aria-label="Просмотр истории" style="position: absolute; inset: 0; background: #000; animation: kxZoom .3s cubic-bezier(.2,.8,.2,1) both">
      <div style="position: absolute; inset: 0; overflow: hidden; border-radius: 0 0 26px 26px">
        <div style="position: absolute; inset: -20px; background: {{vBg}}; animation: kxKen 6s ease-out both"></div>
        <span class="ms fill" style="position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%); font-size: 90px; color: rgba(255,255,255,.22)" aria-hidden="true">{{vIcon}}</span>
        <div style="position: absolute; left: 0; right: 0; top: 0; height: 140px; background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0))"></div>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.6))"></div>
        <div style="position: absolute; left: 12px; right: 12px; top: 12px; display: flex; gap: 4px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="3">
            <span style="flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden"><span style="display: block; height: 100%; width: {{b.w}}; background: #FFFFFF; transition: width .1s linear"></span></span>
          </sc-for>
        </div>
        <div style="position: absolute; left: 12px; right: 12px; top: 26px; display: flex; align-items: center; gap: 10px">
          <span style="width: 38px; height: 38px; border-radius: 19px; background: {{vAvatar}}; color: {{vInk}}; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{vLetter}}</span>
          <span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 700">{{vName}}</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,.75)">{{vWhen}}</span></span>
          <button aria-label="Ещё" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">more_horiz</span></button>
          <button aria-label="Закрыть" onClick="{{close}}" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">close</span></button>
        </div>
        <div style="position: absolute; left: 20px; right: 20px; bottom: 120px; font-size: 18px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,.5)">{{vCaption}}</div>
        <button aria-label="Назад" onClick="{{prev}}" style="position: absolute; left: 0; top: 80px; bottom: 100px; width: 35%"></button>
        <button aria-label="Дальше" onClick="{{next}}" style="position: absolute; right: 0; top: 80px; bottom: 100px; width: 65%"></button>
        <sc-for list="{{flying}}" as="f" hint-placeholder-count="0"><span aria-hidden="true" style="position: absolute; left: {{f.x}}; bottom: 100px; font-size: 34px; animation: kxFly 1s ease-out both">{{f.e}}</span></sc-for>
      </div>
      <div style="position: absolute; left: 10px; right: 10px; bottom: 22px; display: flex; align-items: center; gap: 8px">
        <div style="flex-grow: 1; height: 50px; border-radius: 25px; padding: 0 16px; display: flex; align-items: center; background: rgba(255,255,255,.12); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.2); font-size: 15px; color: rgba(255,255,255,.75)">Ответить {{vName}}…</div>
        <sc-for list="{{reacts}}" as="r" hint-placeholder-count="3">
          <button aria-label="{{r.label}}" onClick="{{r.send}}" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.12); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 20px; text-align: center">{{r.e}}</button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{showBar}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, rgba(10,12,11,0), rgba(10,12,11,.85) 70%)"></div>
    <nav aria-label="Разделы" style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); height: 64px; padding: 0 6px; border-radius: 32px; display: flex; align-items: center; overflow: hidden; background: rgba(28,34,31,.92); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 14px 34px rgba(0,0,0,.55); z-index: 5">
    <span aria-hidden="true" style="position: absolute; left: 6px; top: 6px; width: 78px; height: 52px; border-radius: 26px; background: rgba(143,211,172,.18); border: 1px solid rgba(166,227,193,.3); display: {{lensShow}}; transition: transform .45s cubic-bezier(.34,1.3,.5,1); transform: {{lensTransform}}"></span>
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
      <button aria-label="{{tab.label}}" aria-current="{{tab.current}}" onClick="{{tab.pick}}" style="position: relative; width: 78px; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{tab.color}}">
        <span class="{{tab.cls}}" style="font-size: 23px" aria-hidden="true">{{tab.icon}}</span>
        <span style="font-size: 11px; font-weight: {{tab.fw}}; line-height: 13px">{{tab.label}}</span>
        <sc-if value="{{tab.badge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 12px; top: 3px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: {{tab.badgeColor}}; color: #06150D; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{tab.badge}}</span></sc-if>
      </button>
    </sc-for>
  </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 3, open: null, slide: 0, progress: 0, flying: [], seen: {} }; }
componentWillUnmount() { clearInterval(this.tick); }
people() {
  return [
    { name: 'Анна', letter: 'А', avatar: 'linear-gradient(140deg,#4B3F7A,#2A2240)', ink: '#DCD0FF', when: '15 мин назад', slides: [
      { bg: 'linear-gradient(160deg,#6E58C9,#2A2240 70%)', icon: 'theaters', caption: 'Идём в кино 🎬' },
      { bg: 'linear-gradient(160deg,#C97A58,#3A2014 70%)', icon: 'local_cafe', caption: 'Сначала кофе ☕' },
      { bg: 'linear-gradient(160deg,#58A6C9,#14303A 70%)', icon: 'nights_stay', caption: 'Вечер удался' } ] },
    { name: 'Максим', letter: 'М', avatar: 'linear-gradient(140deg,#2D4E73,#1A2A40)', ink: '#C6DBF5', when: '1 ч назад', slides: [
      { bg: 'linear-gradient(160deg,#3E7A5A,#0F1A14 70%)', icon: 'terrain', caption: 'Горы 🏔' },
      { bg: 'linear-gradient(160deg,#5A8A3E,#141F0F 70%)', icon: 'forest', caption: 'Тропа к озеру' } ] },
    { name: 'Команда kiroX', letter: 'K', avatar: 'linear-gradient(140deg,#2E6B66,#18403C)', ink: '#BDEDE8', when: '3 ч назад', slides: [
      { bg: 'linear-gradient(160deg,#2E8A6B,#0B2018 70%)', icon: 'rocket_launch', caption: 'Новая сборка уже здесь 🚀' } ] },
    { name: 'Света', letter: 'С', avatar: 'linear-gradient(140deg,#3C7BD0,#1A3A6A)', ink: '#D6E6FF', when: 'вчера', viewed: true, slides: [
      { bg: 'linear-gradient(160deg,#3C7BD0,#0F1E3A 70%)', icon: 'beach_access', caption: 'Море 🌊' } ] },
    { name: 'Илья', letter: 'И', avatar: 'linear-gradient(140deg,#D08A3C,#7A4A16)', ink: '#FFE9C9', when: 'вчера', viewed: true, slides: [
      { bg: 'linear-gradient(160deg,#D08A3C,#3A220A 70%)', icon: 'sports_esports', caption: 'Новый рекорд 🎮' } ] }
  ];
}
start(i) {
  clearInterval(this.tick);
  this.setState({ open: i, slide: 0, progress: 0, flying: [] });
  this.tick = setInterval(() => {
    const p = this.state.progress + 2;
    if (p < 100) { this.setState({ progress: p }); return; }
    this.advance(1);
  }, 100);
}
advance(dir) {
  const ps = this.people();
  const cur = ps[this.state.open];
  if (!cur) return;
  let slide = this.state.slide + dir, open = this.state.open;
  if (slide >= cur.slides.length) { open += 1; slide = 0; }
  if (slide < 0) { if (open > 0) { open -= 1; slide = ps[open].slides.length - 1; } else slide = 0; }
  const seen = Object.assign({}, this.state.seen, { [this.state.open]: true });
  if (open >= ps.length) { clearInterval(this.tick); this.setState({ open: null, seen }); return; }
  this.setState({ open, slide, progress: 0, seen });
}
renderVals() {
  const s = this.state;
  const ps = this.people();
  const cards = ps.map((p, i) => {
    const viewed = p.viewed || s.seen[i];
    return {
      label: 'История: ' + p.name, name: p.name, letter: p.letter, avatar: p.avatar, ink: p.ink, when: p.when,
      bg: p.slides[0].bg, icon: p.slides[0].icon, delay: ((i + 1) * 0.05) + 's',
      ring: viewed ? 'rgba(255,255,255,.3)' : 'conic-gradient(#8FD3AC, #3F9A6C, #A6E3C1, #8FD3AC)',
      spin: viewed ? 'none' : 'kxSpinRing 6s linear 2',
      glow: viewed ? 'none' : '0 0 0 1px rgba(143,211,172,.35)',
      count: p.slides.length > 1 ? String(p.slides.length) : false,
      open: () => this.start(i)
    };
  });
  const v = s.open != null ? ps[s.open] : null;
  const sl = v ? v.slides[s.slide] : {};
  const bars = v ? v.slides.map((_, i) => ({ w: i < s.slide ? '100%' : i === s.slide ? s.progress + '%' : '0%' })) : [];
  const reacts = ['❤️', '🔥', '😂'].map((e, k) => ({ e, label: 'Реакция ' + e, send: () => {
    const f = s.flying.concat([{ e, x: (230 + k * 52) + 'px', id: Date.now() }]).slice(-4);
    this.setState({ flying: f });
  } }));
  const items = [
    { icon: 'chat', label: 'Чаты', badge: '16', badgeColor: '#8FD3AC' },
    { icon: 'call', label: 'Звонки', badge: '1', badgeColor: '#FF8A80' },
    { icon: 'motion_photos_on', label: 'Истории' },
    { icon: 'settings', label: 'Настройки' }
  ];
  const tabs = items.map((t, i) => {
    const on = i === 2;
    return {
      icon: t.icon, label: t.label, badge: t.badge || false, badgeColor: t.badgeColor || '#8FD3AC',
      current: on ? 'page' : 'false', cls: on ? 'ms fill' : 'ms', fw: on ? 800 : 600, fill: on ? 'fill' : '', color: on ? '#E6F6EC' : '#B4BEB8',
      iconTransform: on ? 'translateY(-1px) scale(1.08)' : 'translateY(6px) scale(1)',
      labelOpacity: on ? '1' : '0', labelTransform: on ? 'translateY(0)' : 'translateY(6px)',
      pick: () => this.setState({ tab: i })
    };
  });
  return {
    cards, tabs, lensTransform: 'translateX(156px)', lensShow: 'block',
    viewing: !!v, showBar: !v, bars, reacts, flying: s.flying,
    vName: v ? v.name : '', vLetter: v ? v.letter : '', vAvatar: v ? v.avatar : '#222', vInk: v ? v.ink : '#fff', vWhen: v ? v.when : '',
    vBg: sl.bg || '#000', vIcon: sl.icon || 'image', vCaption: sl.caption || '',
    close: () => { clearInterval(this.tick); this.setState({ open: null }); },
    next: () => this.advance(1),
    prev: () => this.advance(-1)
  };
}
}
</script>
</body>
</html>
