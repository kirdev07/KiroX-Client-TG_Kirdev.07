<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новое сообщение</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input::placeholder{color:#7C8781}
@keyframes kxRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes kxChip{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes kxSlide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes kxUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes kxDone{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; right: -90px; top: -110px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(70,160,110,.16), rgba(70,160,110,0) 65%)"></div>

  <header style="position: relative; padding: 10px 12px 4px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" onClick="{{back}}" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">{{backIcon}}</span></button>
    <span style="flex-grow: 1"><span style="display: block; font-size: 20px; font-weight: 800">{{title}}</span><sc-if value="{{subtitle}}" hint-placeholder-val="{{false}}"><span style="display: block; font-size: 12px; color: #8FD3AC">{{subtitle}}</span></sc-if></span>
  </header>

  <sc-if value="{{stepPick}}" hint-placeholder-val="{{true}}">
    <div style="position: relative; padding: 8px 16px 0">
      <sc-if value="{{multi}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
            <button onClick="{{c.remove}}" style="height: 32px; padding: 0 10px 0 3px; border-radius: 16px; background: rgba(143,211,172,.16); border: 1px solid rgba(143,211,172,.3); display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; animation: kxChip .3s cubic-bezier(.2,.8,.2,1) both"><span style="width: 26px; height: 26px; border-radius: 13px; background: {{c.avatar}}; color: {{c.ink}}; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.letter}}</span>{{c.first}}<span class="ms" style="font-size: 15px; color: #8FD3AC" aria-hidden="true">close</span></button>
          </sc-for>
        </div>
      </sc-if>
      <label style="height: 46px; border-radius: 23px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 10px; padding: 0 14px">
        <span class="ms" style="font-size: 20px; color: #7C8781" aria-hidden="true">search</span>
        <input aria-label="Кому" placeholder="Кому: имя или @username" value="{{query}}" onChange="{{onQuery}}" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #EEF3EF; font: inherit; font-size: 15px">
      </label>
    </div>

    <sc-if value="{{showActions}}" hint-placeholder-val="{{true}}">
      <div style="position: relative; padding: 12px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button onClick="{{startGroup}}" style="height: 64px; padding: 0 12px; border-radius: 20px; background: linear-gradient(150deg, rgba(63,154,108,.25), rgba(255,255,255,.03)); border: 1px solid rgba(143,211,172,.2); display: flex; align-items: center; gap: 10px"><span style="width: 38px; height: 38px; border-radius: 13px; background: rgba(143,211,172,.2); color: #8FD3AC; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">group_add</span></span><span style="font-size: 14px; font-weight: 700">Новая группа</span></button>
        <button onClick="{{startChannel}}" style="height: 64px; padding: 0 12px; border-radius: 20px; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 10px"><span style="width: 38px; height: 38px; border-radius: 13px; background: rgba(255,174,128,.16); color: #FFAE80; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">campaign</span></span><span style="font-size: 14px; font-weight: 700">Новый канал</span></button>
        <button style="height: 64px; padding: 0 12px; border-radius: 20px; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 10px"><span style="width: 38px; height: 38px; border-radius: 13px; background: rgba(201,166,255,.16); color: #C9A6FF; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">lock</span></span><span style="font-size: 14px; font-weight: 700">Секретный чат</span></button>
        <button style="height: 64px; padding: 0 12px; border-radius: 20px; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 10px"><span style="width: 38px; height: 38px; border-radius: 13px; background: rgba(127,196,240,.16); color: #7FC4F0; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">bookmark</span></span><span style="font-size: 14px; font-weight: 700">Избранное</span></button>
      </div>
    </sc-if>

    <div style="position: relative; padding: 12px 12px 0">
      <div style="padding: 0 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">{{listTitle}}</div>
      <sc-for list="{{people}}" as="p" hint-placeholder-count="6">
        <button onClick="{{p.tap}}" style="width: 100%; height: 58px; padding: 0 6px; border-radius: 16px; display: flex; align-items: center; gap: 12px; background: {{p.rowBg}}; transition: background .2s">
          <span style="position: relative; width: 44px; height: 44px; border-radius: 22px; background: {{p.avatar}}; color: {{p.ink}}; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{p.letter}}<sc-if value="{{p.picked}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: -3px; bottom: -3px; width: 20px; height: 20px; border-radius: 10px; background: #8FD3AC; color: #06150D; border: 2px solid #0A0C0B; display: flex; align-items: center; justify-content: center; animation: kxChip .25s ease both"><span class="ms" style="font-size: 14px; font-weight: 800" aria-hidden="true">check</span></span></sc-if></span>
          <span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 600">{{p.name}}</span><span style="display: block; font-size: 12px; color: {{p.statusColor}}">{{p.status}}</span></span>
        </button>
      </sc-for>
    </div>

    <sc-if value="{{canNext}}" hint-placeholder-val="{{false}}">
      <button onClick="{{next}}" style="position: absolute; right: 16px; bottom: 26px; height: 56px; padding: 0 22px; border-radius: 28px; background: linear-gradient(140deg, #8FD3AC, #3F9A6C); color: #06150D; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; box-shadow: 0 12px 28px rgba(63,154,108,.4); animation: kxUp .3s cubic-bezier(.2,.8,.2,1) both">Далее<span class="ms" aria-hidden="true">arrow_forward</span></button>
    </sc-if>
  </sc-if>

  <sc-if value="{{stepName}}" hint-placeholder-val="{{false}}">
    <div style="position: relative; padding: 14px 16px 0; animation: kxSlide .35s cubic-bezier(.2,.8,.2,1) both">
      <div style="display: flex; align-items: center; gap: 14px">
        <button aria-label="Выбрать фото" style="width: 76px; height: 76px; border-radius: 26px; background: linear-gradient(140deg, rgba(143,211,172,.25), rgba(63,154,108,.12)); border: 1px dashed rgba(143,211,172,.45); color: #8FD3AC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" style="font-size: 30px" aria-hidden="true">add_a_photo</span></button>
        <label style="flex-grow: 1; height: 56px; border-radius: 18px; background: rgba(255,255,255,.06); border: 1px solid rgba(143,211,172,.4); display: flex; align-items: center; padding: 0 14px">
          <input aria-label="{{nameHint}}" placeholder="{{nameHint}}" value="{{name}}" onChange="{{onName}}" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #EEF3EF; font: inherit; font-size: 16px">
        </label>
      </div>
      <label style="margin-top: 10px; min-height: 52px; border-radius: 18px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; padding: 0 14px">
        <input aria-label="Описание" placeholder="Описание (необязательно)" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #EEF3EF; font: inherit; font-size: 15px">
      </label>
      <sc-if value="{{isChannel}}" hint-placeholder-val="{{false}}">
        <div style="margin-top: 12px; padding: 0 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Тип канала</div>
        <div style="display: flex; gap: 8px">
          <sc-for list="{{types}}" as="t" hint-placeholder-count="2">
            <button onClick="{{t.pick}}" style="flex: 1; padding: 12px; border-radius: 18px; background: {{t.bg}}; border: 1px solid {{t.border}}; transition: background .25s, border-color .25s"><span class="ms fill" style="color: {{t.ink}}" aria-hidden="true">{{t.icon}}</span><span style="display: block; margin-top: 6px; font-size: 14px; font-weight: 700">{{t.label}}</span><span style="display: block; font-size: 11px; color: #8A958F">{{t.sub}}</span></button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{isGroup}}" hint-placeholder-val="{{true}}">
        <div style="margin-top: 14px; padding: 0 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Участники · {{pickedCount}}</div>
        <div style="display: flex; gap: 10px">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="2"><span style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 56px"><span style="width: 48px; height: 48px; border-radius: 24px; background: {{c.avatar}}; color: {{c.ink}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.letter}}</span><span style="font-size: 11px">{{c.first}}</span></span></sc-for>
        </div>
      </sc-if>
      <button onClick="{{create}}" style="margin-top: 22px; width: 100%; height: 56px; border-radius: 18px; background: {{createBg}}; color: {{createInk}}; font-size: 16px; font-weight: 800; text-align: center; transition: background .3s">{{createLabel}}</button>
    </div>
  </sc-if>

  <sc-if value="{{stepDone}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(70% 45% at 50% 45%, rgba(63,154,108,.25), #0A0C0B 70%)">
      <span style="width: 96px; height: 96px; border-radius: 48px; background: #8FD3AC; color: #06150D; display: flex; align-items: center; justify-content: center; animation: kxDone .5s cubic-bezier(.2,.8,.2,1) both"><span class="ms" style="font-size: 54px; font-weight: 700" aria-hidden="true">check</span></span>
      <span style="font-size: 22px; font-weight: 800; animation: kxUp .4s ease .15s both">{{doneTitle}}</span>
      <span style="font-size: 14px; color: #9AA59F; animation: kxUp .4s ease .2s both">«{{doneName}}» уже в списке чатов</span>
      <button onClick="{{restart}}" style="margin-top: 10px; height: 46px; padding: 0 20px; border-radius: 23px; background: rgba(255,255,255,.08); font-size: 14px; font-weight: 700; animation: kxUp .4s ease .25s both">Открыть чат</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 'msg', step: 'pick', picked: [], query: '', name: '', pub: false }; }
renderVals() {
  const s = this.state;
  const all = [
    { id: 1, name: 'Анна Ким', letter: 'А', avatar: 'linear-gradient(140deg,#4B3F7A,#2A2240)', ink: '#DCD0FF', st: 'в сети' },
    { id: 2, name: 'Максим Ли', letter: 'М', avatar: 'linear-gradient(140deg,#2D4E73,#1A2A40)', ink: '#C6DBF5', st: 'в сети' },
    { id: 3, name: 'Света Орлова', letter: 'С', avatar: 'linear-gradient(140deg,#3C7BD0,#1A3A6A)', ink: '#D6E6FF', st: 'был(а) 5 мин назад' },
    { id: 4, name: 'Илья Петров', letter: 'И', avatar: 'linear-gradient(140deg,#D08A3C,#7A4A16)', ink: '#FFE9C9', st: 'был(а) недавно' },
    { id: 5, name: 'Мама', letter: 'М', avatar: 'linear-gradient(140deg,#6B4E2E,#3A2A1A)', ink: '#F2DDBF', st: 'был(а) недавно' },
    { id: 6, name: 'Дмитрий Ан', letter: 'Д', avatar: 'linear-gradient(140deg,#2E6B66,#18403C)', ink: '#BDEDE8', st: 'был(а) на этой неделе' }
  ];
  const multi = s.mode === 'group';
  const q = s.query.trim().toLowerCase();
  const people = all.filter(p => !q || p.name.toLowerCase().includes(q)).map(p => {
    const picked = s.picked.includes(p.id);
    return Object.assign({}, p, {
      picked, status: p.st, statusColor: p.st === 'в сети' ? '#8FD3AC' : '#8A958F',
      rowBg: picked ? 'rgba(143,211,172,.08)' : 'transparent',
      tap: () => { if (!multi) return; this.setState({ picked: picked ? s.picked.filter(x => x !== p.id) : s.picked.concat([p.id]) }); }
    });
  });
  const chips = s.picked.map(id => { const p = all.find(x => x.id === id); return Object.assign({}, p, { first: p.name.split(' ')[0], remove: () => this.setState({ picked: s.picked.filter(x => x !== id) }) }); });
  const isChannel = s.mode === 'channel';
  const types = [{ pub: true, icon: 'public', label: 'Публичный', sub: 'Найдут в поиске' }, { pub: false, icon: 'lock', label: 'Частный', sub: 'Только по ссылке' }].map(t => ({
    icon: t.icon, label: t.label, sub: t.sub, ink: s.pub === t.pub ? '#8FD3AC' : '#8A958F',
    bg: s.pub === t.pub ? 'rgba(143,211,172,.12)' : 'rgba(255,255,255,.05)', border: s.pub === t.pub ? 'rgba(143,211,172,.4)' : 'rgba(255,255,255,.06)',
    pick: () => this.setState({ pub: t.pub })
  }));
  const hasName = s.name.trim().length > 0;
  const titles = { msg: 'Новое сообщение', group: 'Новая группа', channel: 'Новый канал' };
  return {
    title: s.step === 'name' ? (isChannel ? 'Название канала' : 'Название группы') : titles[s.mode],
    subtitle: multi && s.step === 'pick' ? 'Выбрано: ' + s.picked.length : false,
    backIcon: s.mode === 'msg' && s.step === 'pick' ? 'close' : 'arrow_back',
    back: () => { if (s.step === 'name') this.setState({ step: 'pick' }); else this.setState({ mode: 'msg', picked: [], step: 'pick' }); },
    stepPick: s.step === 'pick', stepName: s.step === 'name', stepDone: s.step === 'done',
    multi, chips, people, query: s.query, onQuery: (e) => this.setState({ query: e.target.value }),
    showActions: s.mode === 'msg' && !q,
    listTitle: multi ? 'Добавьте участников' : 'Контакты',
    startGroup: () => this.setState({ mode: 'group', picked: [], step: 'pick' }),
    startChannel: () => this.setState({ mode: 'channel', step: 'name', name: '' }),
    canNext: multi && s.picked.length > 0,
    next: () => this.setState({ step: 'name', name: '' }),
    name: s.name, onName: (e) => this.setState({ name: e.target.value }),
    nameHint: isChannel ? 'Название канала' : 'Название группы',
    isChannel, isGroup: !isChannel, types, pickedCount: s.picked.length,
    createLabel: isChannel ? 'Создать канал' : 'Создать группу',
    createBg: hasName ? 'linear-gradient(100deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.07)', createInk: hasName ? '#06150D' : '#8A958F',
    create: () => { if (hasName) this.setState({ step: 'done' }); },
    doneTitle: isChannel ? 'Канал создан' : 'Группа создана', doneName: s.name.trim(),
    restart: () => this.setState({ mode: 'msg', step: 'pick', picked: [], name: '', query: '' })
  };
}
}
</script>
</body>
</html>
