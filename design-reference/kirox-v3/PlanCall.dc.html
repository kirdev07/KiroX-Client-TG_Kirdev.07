<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Запланировать звонок</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
input{font:inherit;color:inherit}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxTick{0%{transform:translateY(-6px);opacity:0}100%{transform:none;opacity:1}}
@keyframes kxWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <div style="flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 20px; font-weight: 800">{{headTitle}}</h1>
      <div style="font-size: 12px; color: #9AA59F">Kotlin-клуб</div>
    </div>
  </header>

  <!-- Planned card -->
  <sc-if value="{{planned}}" hint-placeholder-val="{{false}}">
    <div class="scroll" style="flex: 1; min-height: 0; padding: 6px 16px 30px; animation: kxIn .3s ease both">
      <div style="position: relative; overflow: hidden; padding: 20px 18px; border-radius: 28px; background: radial-gradient(120% 90% at 100% 0%, rgba(63,154,108,.45), transparent 60%), radial-gradient(90% 80% at 0% 100%, rgba(47,110,158,.35), transparent 60%), #111614; border: 1px solid rgba(143,211,172,.25)">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #8FD3AC"><span class="ms fill" style="font-size: 18px" aria-hidden="true">event_available</span>Звонок запланирован</div>
        <div style="margin-top: 10px; font-size: 22px; font-weight: 800; line-height: 1.2">{{title}}</div>
        <div style="margin-top: 4px; font-size: 14px; color: #C9D2CC">{{whenText}}</div>
        <div style="margin-top: 18px; display: flex; gap: 8px">
          <sc-for list="{{count}}" as="c" hint-placeholder-count="4">
            <div style="flex: 1; padding: 10px 0; border-radius: 16px; background: rgba(0,0,0,.28); text-align: center">
              <div style="font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; animation: {{c.anim}}">{{c.v}}</div>
              <div style="font-size: 11px; color: #9AA59F">{{c.l}}</div>
            </div>
          </sc-for>
        </div>
        <div style="margin-top: 16px; display: flex; align-items: center; gap: 10px">
          <span style="display: flex">
            <sc-for list="{{going}}" as="g" hint-placeholder-count="4"><span style="width: 28px; height: 28px; border-radius: 14px; margin-left: {{g.ml}}; background: {{g.c}}; border: 2px solid #142019; font-size: 11px; font-weight: 800; color: #fff; display: flex; align-items: center; justify-content: center">{{g.l}}</span></sc-for>
          </span>
          <span style="font-size: 13px; color: #C9D2CC">{{goingText}}</span>
        </div>
      </div>

      <div style="margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
        <button onClick="{{toggleRemind}}" aria-pressed="{{remind}}" style="height: 52px; border-radius: 20px; background: {{remBg}}; color: {{remInk}}; border: 1px solid {{remBd}}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .2s"><span class="ms" style="font-variation-settings: {{remFill}}" aria-hidden="true">{{remIcon}}</span>{{remText}}</button>
        <button onClick="{{share}}" style="height: 52px; border-radius: 20px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" aria-hidden="true">link</span>Ссылка</button>
      </div>
      <button onClick="{{startNow}}" style="margin-top: 8px; width: 100%; height: 54px; border-radius: 27px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">
        <span style="display: flex; align-items: center; gap: 2px; height: 18px" aria-hidden="true"><span style="width: 3px; height: 18px; border-radius: 2px; background: #06150D; animation: kxWave .9s ease-in-out infinite"></span><span style="width: 3px; height: 18px; border-radius: 2px; background: #06150D; animation: kxWave .9s ease-in-out .15s infinite"></span><span style="width: 3px; height: 18px; border-radius: 2px; background: #06150D; animation: kxWave .9s ease-in-out .3s infinite"></span></span>
        Начать сейчас
      </button>
      <button onClick="{{edit}}" style="margin-top: 8px; width: 100%; height: 48px; border-radius: 24px; font-size: 14px; font-weight: 700; color: #9AA59F; text-align: center">Изменить время или отменить</button>
    </div>
  </sc-if>

  <!-- Form -->
  <sc-if value="{{form}}" hint-placeholder-val="{{true}}">
    <div class="scroll" style="flex: 1; min-height: 0; padding: 6px 16px 110px; animation: kxIn .3s ease both">
      <label style="height: 56px; padding: 0 16px; border-radius: 20px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 12px">
        <span class="ms" style="color: #9AA59F" aria-hidden="true">title</span>
        <input value="{{title}}" onInput="{{onTitle}}" placeholder="Тема звонка" aria-label="Тема звонка" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 16px">
      </label>

      <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">День</div>
      <div style="display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button onClick="{{d.tap}}" aria-pressed="{{d.on}}" style="width: 50px; flex-shrink: 0; padding: 8px 0; border-radius: 18px; background: {{d.bg}}; border: 1px solid {{d.bd}}; color: {{d.ink}}; text-align: center; transition: all .2s">
            <span style="display: block; font-size: 11px; font-weight: 600; opacity: .8">{{d.wd}}</span>
            <span style="display: block; margin-top: 2px; font-size: 18px; font-weight: 800">{{d.n}}</span>
          </button>
        </sc-for>
      </div>

      <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Время</div>
      <div style="padding: 14px; border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; gap: 14px">
        <button onClick="{{hMinus}}" aria-label="На час раньше" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">remove</span></button>
        <span style="font-size: 40px; font-weight: 800; letter-spacing: 1px; font-variant-numeric: tabular-nums; min-width: 130px; text-align: center">{{timeText}}</span>
        <button onClick="{{hPlus}}" aria-label="На полчаса позже" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">add</span></button>
      </div>
      <div style="margin-top: 8px; display: flex; gap: 6px">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="4"><button onClick="{{q.tap}}" style="flex: 1; height: 34px; border-radius: 17px; background: {{q.bg}}; color: {{q.ink}}; font-size: 13px; font-weight: 700; text-align: center; transition: all .2s">{{q.label}}</button></sc-for>
      </div>

      <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Формат</div>
      <div style="padding: 4px; border-radius: 20px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); display: grid; grid-template-columns: 1fr 1fr; gap: 4px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2"><button onClick="{{k.tap}}" aria-pressed="{{k.on}}" style="height: 44px; border-radius: 16px; background: {{k.bg}}; color: {{k.ink}}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .2s"><span class="ms" style="font-size: 20px" aria-hidden="true">{{k.icon}}</span>{{k.label}}</button></sc-for>
      </div>
      <div style="margin: 8px 6px 0; font-size: 12px; color: #8A958F">{{kindHint}}</div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: linear-gradient(180deg, rgba(10,12,11,0), #0A0C0B 40%)">
      <button onClick="{{plan}}" style="width: 100%; height: 54px; border-radius: 27px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 30px rgba(63,154,108,.35)"><span class="ms fill" aria-hidden="true">event</span>{{planText}}</button>
    </div>
  </sc-if>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 34px; padding: 12px 18px; border-radius: 18px; background: #232A26; border: 1px solid rgba(255,255,255,.16); font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2.4s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">{{toastIcon}}</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// "Now" is Sunday 22 Nov, 18:00
const WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const WDL = ['воскресенье', 'понедельник', 'вторник', 'среду', 'четверг', 'пятницу', 'субботу'];
const QUICK = [['10:00', 600], ['13:00', 780], ['19:00', 1140], ['21:00', 1260]];
const GOING = [['А', '#C0443C'], ['Д', '#2F6E9E'], ['М', '#B07A2E'], ['О', '#5C6661']];
const pad = n => String(n).padStart(2, '0');
class Component extends DCLogic {
constructor(props) { super(props); this.state = { title: 'Разбор Compose 1.9', day: 1, min: 1140, kind: 0, planned: false, remind: true, going: 23, left: 0, toast: 0, toastText: '', toastIcon: 'done' }; }
componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.tt); }
toastMsg(text, icon) { clearTimeout(this.tt); this.setState({ toast: this.state.toast + 1, toastText: text, toastIcon: icon }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2400); }
renderVals() {
  const s = this.state;
  const dayName = d => d === 0 ? 'Сегодня' : d === 1 ? 'Завтра' : 'В ' + WDL[d % 7];
  const timeText = pad(Math.floor(s.min / 60)) + ':' + pad(s.min % 60);
  const totalSec = Math.max(0, s.left);
  const parts = [[Math.floor(totalSec / 86400), 'дн'], [Math.floor(totalSec % 86400 / 3600), 'ч'], [Math.floor(totalSec % 3600 / 60), 'мин'], [totalSec % 60, 'сек']];
  return {
    headTitle: s.planned ? 'Групповой звонок' : 'Запланировать звонок',
    planned: s.planned, form: !s.planned,
    title: s.title, onTitle: e => this.setState({ title: e.target.value }),
    days: Array.from({ length: 7 }, (_, d) => {
      const on = s.day === d;
      return { wd: d === 0 ? 'Сег' : WD[d % 7], n: String(22 + d > 30 ? 22 + d - 30 : 22 + d), on, bg: on ? 'linear-gradient(160deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.04)', bd: on ? 'transparent' : 'rgba(255,255,255,.08)', ink: on ? '#06150D' : '#EEF3EF', tap: () => this.setState({ day: d }) };
    }),
    timeText,
    hMinus: () => this.setState({ min: (s.min + 1410) % 1440 }), hPlus: () => this.setState({ min: (s.min + 30) % 1440 }),
    quick: QUICK.map(([label, m]) => ({ label, bg: s.min === m ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.05)', ink: s.min === m ? '#8FD3AC' : '#C9D2CC', tap: () => this.setState({ min: m }) })),
    kinds: [['Звонок', 'groups', 0], ['Трансляция', 'podcasts', 1]].map(([label, icon, i]) => ({ label, icon, on: s.kind === i, bg: s.kind === i ? 'rgba(143,211,172,.16)' : 'transparent', ink: s.kind === i ? '#8FD3AC' : '#C9D2CC', tap: () => this.setState({ kind: i }) })),
    kindHint: s.kind === 0 ? 'Говорить может любой участник группы.' : 'Говорят только админы, остальные слушают и поднимают руку.',
    planText: 'Запланировать · ' + dayName(s.day).toLowerCase() + ' в ' + timeText,
    plan: () => {
      if (!s.title.trim()) { this.toastMsg('Добавьте тему звонка', 'info'); return; }
      const left = s.day * 86400 + (s.min - 1080) * 60;
      if (left <= 0) { this.toastMsg('Это время уже прошло', 'schedule'); return; }
      this.setState({ planned: true, left });
      clearInterval(this.iv);
      this.iv = setInterval(() => this.setState({ left: Math.max(0, this.state.left - 1) }), 1000);
      this.toastMsg('Участники получат уведомление', 'notifications_active');
    },
    whenText: dayName(s.day) + ', ' + (22 + s.day > 30 ? 22 + s.day - 30 + ' декабря' : 22 + s.day + ' ноября') + ' в ' + timeText + ' · ' + (s.kind ? 'трансляция' : 'звонок'),
    count: parts.map(([v, l], i) => ({ v: pad(v), l, anim: i === 3 ? 'kxTick .3s ease' : 'none' })),
    going: [],
    goingText: 'Напомнить себе: ' + (s.remind ? 'включено' : 'выключено'),
    remind: s.remind, toggleRemind: () => this.setState({ remind: !s.remind }),
    remBg: s.remind ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.06)', remInk: s.remind ? '#8FD3AC' : '#EEF3EF', remBd: s.remind ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.1)',
    remIcon: s.remind ? 'notifications_active' : 'notifications', remFill: s.remind ? "'FILL' 1" : "'FILL' 0", remText: s.remind ? 'Напомню' : 'Напомнить мне',
    share: () => this.toastMsg('Ссылка на звонок скопирована', 'content_copy'),
    startNow: () => { clearInterval(this.iv); this.toastMsg('Звонок начался', 'call'); },
    edit: () => { clearInterval(this.iv); this.setState({ planned: false }); },
    toast: s.toast > 0, toastText: s.toastText, toastIcon: s.toastIcon
  };
}
}
</script>
</body>
</html>
