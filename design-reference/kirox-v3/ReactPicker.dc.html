<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Все реакции</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.85)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxStrip{from{opacity:0;transform:translateY(10px) scale(.8)}to{opacity:1;transform:none}}
@keyframes kxGrow{from{opacity:.4;transform:scaleY(.3)}to{opacity:1;transform:none}}
@keyframes kxDim{from{opacity:0}to{opacity:1}}
@keyframes kxLand{0%{transform:scale(0)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes kxLand2{0%{transform:scale(0)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes kxBurst{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.4);opacity:0}}
@keyframes kxBurst2{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: #6A4C9C; display: flex; align-items: center; justify-content: center; font-weight: 800">Л</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Лиза</div><div style="font-size: 12px; color: #8FD3AC">в сети</div></div>
  </header>

  <div style="flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; justify-content: center; gap: 8px">
    <div style="align-self: flex-start; max-width: 80%; position: relative; z-index: 3">
      <button onClick="{{openStrip}}" style="padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.1); font-size: 15px; line-height: 1.4; display: block">Права получены с первого раза!!! 🚗🎉<span style="font-size: 11px; opacity: .6; margin-left: 8px">20:14</span></button>
      <span style="display: {{reactShow}}; position: relative; margin-top: -6px; margin-left: 10px; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(143,211,172,.18); border: 1px solid rgba(143,211,172,.45); align-items: center; gap: 4px; font-size: 15px; width: fit-content"><span style="position: absolute; left: 4px; top: -6px; width: 30px; height: 30px; border-radius: 15px; border: 2px solid #8FD3AC; animation: {{burst}}"></span><span style="display: inline-block; animation: {{land}}">{{react}}</span><span style="font-size: 12px; font-weight: 800; color: #8FD3AC">1</span></span>
    </div>
    <div style="align-self: center; font-size: 11px; color: #8A958F; display: {{hintShow}}">нажмите на сообщение</div>
  </div>
  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06)"><div style="height: 48px; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,.07); display: flex; align-items: center; font-size: 15px; color: #8A958F">Сообщение</div></div>

  <sc-if value="{{dim}}" hint-placeholder-val="{{true}}">
    <button onClick="{{close}}" aria-label="Закрыть" style="position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: kxDim .2s ease both; z-index: 2"></button>
  </sc-if>

  <sc-if value="{{strip}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 14px; top: 300px; z-index: 4; padding: 6px; border-radius: 30px; background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.08)); backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,.18); display: flex; align-items: center; gap: 2px; box-shadow: 0 14px 34px rgba(0,0,0,.5); animation: kxStrip .25s cubic-bezier(.2,.8,.2,1) both; transform-origin: left bottom">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="7"><button onClick="{{q.tap}}" aria-label="{{q.e}}" style="width: 40px; height: 40px; border-radius: 20px; font-size: 26px; display: flex; align-items: center; justify-content: center">{{q.e}}</button></sc-for>
      <button onClick="{{expand}}" aria-label="Все реакции" style="width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 20px" aria-hidden="true">expand_more</span></button>
    </div>
  </sc-if>

  <sc-if value="{{full}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 10px; right: 10px; top: 300px; bottom: 90px; z-index: 4; border-radius: 26px; background: linear-gradient(180deg, rgba(48,58,53,.98), rgba(24,29,27,.99)); border: 1px solid rgba(255,255,255,.16); display: flex; flex-direction: column; overflow: hidden; transform-origin: top; animation: kxGrow .25s cubic-bezier(.2,.8,.2,1) both">
      <div style="padding: 10px 10px 6px; display: flex; gap: 6px; align-items: center">
        <div style="flex: 1; height: 38px; padding: 0 12px; border-radius: 19px; background: rgba(0,0,0,.25); display: flex; align-items: center; gap: 6px; font-size: 14px; color: #8A958F"><span class="ms" style="font-size: 18px" aria-hidden="true">search</span>Поиск реакции</div>
      </div>
      <div class="scroll" style="padding: 0 10px 6px; display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button onClick="{{t.tap}}" aria-pressed="{{t.on}}" style="flex-shrink: 0; height: 30px; padding: 0 10px; border-radius: 15px; background: {{t.bg}}; color: {{t.ink}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px">{{t.t}}<span style="display: {{t.premShow}}; height: 16px; padding: 0 5px; border-radius: 8px; background: rgba(201,160,224,.2); color: #C9A0E0; font-size: 11px; font-weight: 800; line-height: 16px">PREMIUM</span></button></sc-for>
      </div>
      <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 8px 10px">
        <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px">
          <sc-for list="{{grid}}" as="g" hint-placeholder-count="35"><button onClick="{{g.tap}}" aria-label="{{g.e}}" style="height: 44px; border-radius: 12px; font-size: 26px; display: flex; align-items: center; justify-content: center; filter: {{g.f}}; position: relative">{{g.e}}<span class="ms fill" style="position: absolute; right: 2px; bottom: 2px; font-size: 12px; color: #C9A0E0; display: {{g.lock}}" aria-hidden="true">lock</span></button></sc-for>
        </div>
      </div>
      <div style="padding: 8px 12px; font-size: 11px; color: #8A958F; border-top: 1px solid rgba(255,255,255,.06); display: {{premNoteShow}}">Свои анимированные реакции доступны с Premium</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const QUICK = ['❤️', '👍', '🔥', '🥰', '👏', '😁', '🎉'];
const SETS = {
  recent: ['🎉', '❤️', '🔥', '😂', '👍', '🥳', '🙏', '💯', '😍', '🤩', '👏', '🚗', '🏆', '✨'],
  all: ['👍', '👎', '❤️', '🔥', '🥰', '👏', '😁', '🤔', '🤯', '😱', '🤬', '😢', '🎉', '🤩', '🤮', '💩', '🙏', '👌', '🕊', '🤡', '🥱', '🥴', '😍', '🐳', '❤️‍🔥', '🌚', '🌭', '💯', '🤣', '⚡', '🍌', '🏆', '💔', '🤨', '😐'],
  party: ['🎉', '🥳', '🎊', '🎈', '🍾', '🥂', '🎁', '🏆', '🥇', '🌟', '✨', '🎆', '🎇', '🪅'],
  custom: ['🦄', '🐉', '🌈', '🪐', '🧿', '🫧', '🍀', '🦋', '🌸', '🍄', '🐙', '🦊', '🐼', '🦜']
};
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 'strip', tab: 'recent', react: '', rk: 0 }; }
renderVals() {
  const s = this.state;
  const pick = (e) => this.setState({ react: s.react === e ? '' : e, mode: 'none', rk: s.rk + 1 });
  const custom = s.tab === 'custom';
  return {
    dim: s.mode !== 'none', strip: s.mode === 'strip', full: s.mode === 'full',
    openStrip: () => this.setState({ mode: 'strip' }), close: () => this.setState({ mode: 'none' }), expand: () => this.setState({ mode: 'full' }),
    hintShow: s.mode === 'none' && !s.react ? 'block' : 'none',
    quick: QUICK.map(e => ({ e, tap: () => pick(e) })),
    tabs: [['recent', 'Недавние'], ['all', 'Все'], ['party', 'Праздник'], ['custom', 'Свои']].map(([k, t]) => { const on = s.tab === k; return { t, on: on ? 'true' : 'false', bg: on ? 'rgba(143,211,172,.16)' : 'rgba(255,255,255,.05)', ink: on ? '#8FD3AC' : '#C9D2CC', premShow: k === 'custom' ? 'inline-block' : 'none', tap: () => this.setState({ tab: k }) }; }),
    grid: SETS[s.tab].map(e => ({ e, f: custom ? 'saturate(.6)' : 'none', lock: custom ? 'inline-block' : 'none', tap: () => custom ? null : pick(e) })),
    premNoteShow: custom ? 'block' : 'none',
    react: s.react, reactShow: s.react ? 'flex' : 'none',
    land: s.rk ? (s.rk % 2 ? 'kxLand2' : 'kxLand') + ' .4s cubic-bezier(.2,.8,.2,1) both' : 'none',
    burst: s.rk ? (s.rk % 2 ? 'kxBurst2' : 'kxBurst') + ' .6s ease-out both' : 'none'
  };
}
}
</script>
</body>
</html>
