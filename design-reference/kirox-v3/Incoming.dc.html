<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Входящий звонок</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94)}
@keyframes kxRing{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.1);opacity:0}}
@keyframes kxShake{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(-16deg)}20%,40%{transform:rotate(16deg)}50%{transform:rotate(0)}}
@keyframes kxHint{0%,100%{transform:translateX(0);opacity:.4}50%{transform:translateX(8px);opacity:1}}
@keyframes kxDrift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-20px,14px) scale(1.08)}}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@keyframes kxPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #070908; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: -80px; top: -60px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(120,100,200,.35), transparent 65%); animation: kxDrift 9s ease-in-out 2"></div>
  <div aria-hidden="true" style="position: absolute; right: -120px; bottom: 120px; width: 440px; height: 440px; border-radius: 50%; background: radial-gradient(circle, rgba(63,154,108,.32), transparent 65%); animation: kxDrift 11s ease-in-out -3s 2"></div>

  <sc-if value="{{ringing}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0">
      <div style="position: absolute; left: 0; right: 0; top: 54px; text-align: center">
        <div style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; background: rgba(255,255,255,.08); font-size: 12px; color: #C9D2CC"><span class="ms fill" style="font-size: 15px; color: #8FD3AC" aria-hidden="true">lock</span>{{kind}} · kiroX</div>
      </div>
      <div style="position: absolute; left: 50%; top: 150px; width: 140px; height: 140px; margin-left: -70px">
        <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(143,211,172,.6); animation: kxRing 2.2s ease-out infinite"></span>
        <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(143,211,172,.6); animation: kxRing 2.2s ease-out 1.1s infinite"></span>
        <span style="position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(140deg, #4B3F7A, #2A2240); color: #DCD0FF; font-size: 52px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 50px rgba(0,0,0,.5)">А</span>
      </div>
      <div style="position: absolute; left: 0; right: 0; top: 320px; text-align: center">
        <div style="font-size: 32px; font-weight: 800">Анна</div>
        <div style="margin-top: 8px; font-size: 15px; color: #9AA59F">{{subtitle}}</div>
      </div>

      <div style="position: absolute; left: 0; right: 0; bottom: 230px; display: flex; justify-content: center; gap: 40px">
        <button onClick="{{openReply}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #C9D2CC"><span style="width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">sms</span></span><span style="font-size: 12px">Ответить текстом</span></button>
        <button onClick="{{remind}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #C9D2CC"><span style="width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">alarm</span></span><span style="font-size: 12px">Напомнить</span></button>
      </div>

      <!-- Slider -->
      <div style="position: absolute; left: 24px; right: 24px; bottom: 120px; height: 76px; border-radius: 38px; background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.18)">
        <span style="position: absolute; left: 92px; right: 20px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 15px; font-weight: 600; color: #C9D2CC; opacity: {{hintOpacity}}; transition: opacity .2s">Сдвиньте, чтобы ответить<span class="ms" style="font-size: 20px; animation: kxHint 1.4s ease-in-out 2" aria-hidden="true">chevron_right</span></span>
        <button onClick="{{answer}}" aria-label="Ответить" style="position: absolute; top: 6px; left: 6px; width: 64px; height: 64px; border-radius: 32px; background: linear-gradient(140deg, #6FC497, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(63,154,108,.5); transform: translateX({{knobX}}); transition: transform .45s cubic-bezier(.2,.9,.3,1)"><span class="ms fill" style="font-size: 30px; animation: kxShake 1.6s ease-in-out 2" aria-hidden="true">{{answerIcon}}</span></button>
      </div>
      <button onClick="{{decline}}" style="position: absolute; left: 50%; bottom: 36px; margin-left: -80px; width: 160px; height: 48px; border-radius: 24px; background: rgba(229,83,75,.16); border: 1px solid rgba(229,83,75,.4); color: #FF8A80; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700"><span class="ms fill" aria-hidden="true">call_end</span>Отклонить</button>
    </div>
  </sc-if>

  <!-- Quick replies -->
  <sc-if value="{{reply}}" hint-placeholder-val="{{false}}">
    <button aria-label="Закрыть" onClick="{{closeReply}}" style="position: absolute; inset: 0; background: rgba(0,0,0,.5); animation: kxFade .25s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 26px; border-radius: 30px 30px 0 0; background: #121614; border-top: 1px solid rgba(255,255,255,.08); animation: kxSheet .32s cubic-bezier(.2,.9,.3,1) both">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A4540; margin: 0 auto 14px"></div>
      <div style="padding: 0 4px 10px; font-size: 18px; font-weight: 800">Отклонить и написать</div>
      <sc-for list="{{replies}}" as="r" hint-placeholder-count="4">
        <button onClick="{{r.tap}}" style="width: 100%; min-height: 50px; margin-bottom: 6px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 12px; text-align: left">
          <span style="flex: 1; font-size: 15px">{{r.text}}</span><span class="ms" style="color: #8FD3AC" aria-hidden="true">send</span>
        </button>
      </sc-for>
      <button style="width: 100%; height: 50px; padding: 0 14px; border-radius: 16px; display: flex; align-items: center; gap: 12px; color: #8FD3AC; font-size: 15px; font-weight: 600"><span class="ms" aria-hidden="true">edit</span>Свой текст…</button>
    </div>
  </sc-if>

  <!-- Result -->
  <sc-if value="{{result}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; animation: kxFade .4s ease both">
      <span style="width: 96px; height: 96px; border-radius: 30px; background: {{resBg}}; color: {{resInk}}; display: flex; align-items: center; justify-content: center; animation: kxPop .5s cubic-bezier(.34,1.45,.5,1) both"><span class="ms fill" style="font-size: 50px" aria-hidden="true">{{resIcon}}</span></span>
      <span style="margin-top: 8px; font-size: 22px; font-weight: 800; text-align: center; padding: 0 30px">{{resTitle}}</span>
      <span style="font-size: 14px; color: #9AA59F; text-align: center; padding: 0 40px">{{resSub}}</span>
      <div style="margin-top: 18px; display: flex; gap: 10px">
        <button onClick="{{again}}" style="height: 44px; padding: 0 18px; border-radius: 22px; background: rgba(255,255,255,.08); font-size: 14px; font-weight: 700">Позвонить ещё раз</button>
        <button onClick="{{switchKind}}" style="height: 44px; padding: 0 18px; border-radius: 22px; background: #8FD3AC; color: #06150D; font-size: 14px; font-weight: 700">{{switchLabel}}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { phase: 'ring', video: false, slide: false, reply: false, res: '', text: '' }; }
componentWillUnmount() { clearTimeout(this.t); }
renderVals() {
  const s = this.state;
  const R = {
    answered: ['call', 'Звонок принят', s.video ? 'Открывается видеозвонок' : 'Открывается экран звонка', 'linear-gradient(140deg,#6FC497,#3F9A6C)', '#06150D'],
    declined: ['call_end', 'Звонок отклонён', 'Анна увидит пропущенный звонок', 'rgba(229,83,75,.16)', '#FF8A80'],
    texted: ['mark_chat_read', 'Отправлено: «' + s.text + '»', 'Звонок отклонён', 'rgba(143,211,172,.14)', '#8FD3AC'],
    remind: ['alarm', 'Напомним через час', 'Звонок отклонён, в 15:42 придёт напоминание', 'rgba(232,176,74,.16)', '#E8B04A']
  }[s.res] || ['call', '', '', '', ''];
  const finish = res => this.setState({ phase: 'done', res, reply: false });
  return {
    ringing: s.phase === 'ring', result: s.phase === 'done', reply: s.reply,
    kind: s.video ? 'Видеозвонок' : 'Аудиозвонок',
    subtitle: s.video ? 'Входящий видеозвонок…' : 'Входящий звонок…',
    answerIcon: s.video ? 'videocam' : 'call',
    knobX: s.slide ? '250px' : '0', hintOpacity: s.slide ? '0' : '1',
    answer: () => { this.setState({ slide: true }); clearTimeout(this.t); this.t = setTimeout(() => finish('answered'), 450); },
    decline: () => finish('declined'),
    remind: () => finish('remind'),
    openReply: () => this.setState({ reply: true }), closeReply: () => this.setState({ reply: false }),
    replies: ['Не могу говорить, напишу позже', 'Перезвоню через 10 минут', 'Я за рулём', 'Что случилось?'].map(text => ({ text, tap: () => { this.setState({ text }); finish('texted'); } })),
    resIcon: R[0], resTitle: R[1], resSub: R[2], resBg: R[3], resInk: R[4],
    again: () => this.setState({ phase: 'ring', slide: false, res: '' }),
    switchLabel: s.video ? 'Аудиозвонок' : 'Видеозвонок',
    switchKind: () => this.setState({ phase: 'ring', slide: false, res: '', video: !s.video })
  };
}
}
</script>
</body>
</html>
