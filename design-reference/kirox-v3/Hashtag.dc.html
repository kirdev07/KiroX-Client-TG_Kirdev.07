<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поиск по хештегу</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kxIn2{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kxGlow{0%,100%{box-shadow:0 0 0 0 rgba(143,211,172,0)}50%{box-shadow:0 0 0 6px rgba(143,211,172,.12)}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,16px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,16px)}}
@keyframes kxToast2{0%{opacity:0;transform:translate(-50%,16px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,16px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <div style="flex: 1; height: 46px; padding: 0 14px; border-radius: 23px; background: rgba(255,255,255,.08); border: 1px solid rgba(143,211,172,.35); display: flex; align-items: center; gap: 6px; animation: kxGlow 2.4s ease-in-out 2">
      <span style="font-size: 18px; font-weight: 800; color: #8FD3AC">#</span>
      <span style="flex: 1; font-size: 16px; font-weight: 700">{{tag}}</span>
      <span class="ms" style="font-size: 20px; color: #9AA59F" aria-hidden="true">close</span>
    </div>
  </header>

  <!-- Related tags -->
  <div class="scroll" style="padding: 6px 12px 4px; display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0">
    <sc-for list="{{tags}}" as="t" hint-placeholder-count="5"><button onClick="{{t.tap}}" aria-pressed="{{t.on}}" style="flex-shrink: 0; height: 32px; padding: 0 12px; border-radius: 16px; background: {{t.bg}}; color: {{t.ink}}; border: 1px solid {{t.bd}}; font-size: 13px; font-weight: 700">#{{t.t}}</button></sc-for>
  </div>

  <!-- Scope tabs -->
  <div style="margin: 8px 12px 4px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 18px; background: rgba(255,255,255,.05)">
    <sc-for list="{{scopes}}" as="sc" hint-placeholder-count="3"><button onClick="{{sc.tap}}" aria-pressed="{{sc.on}}" style="height: 38px; border-radius: 14px; background: {{sc.bg}}; color: {{sc.ink}}; font-size: 13px; font-weight: 700; text-align: center; transition: all .2s">{{sc.t}}</button></sc-for>
  </div>
  <div style="padding: 6px 16px 4px; font-size: 12px; color: #8A958F">{{countText}}</div>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 0 12px 16px">
    <sc-for list="{{res}}" as="r" hint-placeholder-count="5">
      <button onClick="{{r.tap}}" style="width: 100%; margin-top: 8px; padding: 12px; border-radius: 20px; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.035)); border: 1px solid rgba(255,255,255,.08); display: block; animation: {{r.anim}}">
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="width: 36px; height: 36px; border-radius: {{r.rad}}; background: {{r.c}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">{{r.l}}</span>
          <span style="flex: 1; min-width: 0"><span style="display: flex; align-items: center; gap: 4px"><span class="ms fill" style="font-size: 15px; color: #8FD3AC" aria-hidden="true">{{r.kindIcon}}</span><span style="font-size: 14px; font-weight: 800">{{r.chat}}</span></span><span style="display: block; font-size: 12px; color: #9AA59F">{{r.who}} · {{r.t}}</span></span>
        </span>
        <span style="display: block; margin-top: 8px; font-size: 14px; line-height: 1.45; color: #DDE5E0">{{r.before}}<span style="color: #8FD3AC; font-weight: 800; background: rgba(143,211,172,.12); border-radius: 6px; padding: 0 3px">#{{r.hit}}</span>{{r.after}}</span>
        <span style="display: {{r.photoShow}}; margin-top: 8px; height: 110px; border-radius: 14px; background: {{r.photo}}"></span>
      </button>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="padding: 60px 20px; text-align: center; color: #9AA59F"><span class="ms" style="font-size: 44px; color: #8A958F" aria-hidden="true">tag</span><div style="margin-top: 8px; font-size: 15px; font-weight: 700; color: #C9D2CC">Здесь пока пусто</div><div style="margin-top: 4px; font-size: 13px">Попробуйте другую вкладку или похожий тег</div></div>
    </sc-if>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 28px; padding: 12px 16px; border-radius: 18px; background: rgba(40,48,44,.96); border: 1px solid rgba(255,255,255,.12); font-size: 13px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: {{toastAnim}}"><span class="ms fill" style="font-size: 18px; color: #8FD3AC" aria-hidden="true">forum</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TAGS = ['отпуск', 'море', 'рецепт', 'kotlin'];
const R = [
  { tag: 'отпуск', sc: 0, chat: 'Семья', kind: 'group', who: 'Мама', l: 'С', c: '#2F6E9E', t: 'вчера', before: 'Билеты взяли! Летим 14 июля ', after: ' 🌴', photo: '' },
  { tag: 'отпуск', sc: 0, chat: 'Анна', kind: 'person', who: 'Анна', l: 'А', c: '#C0443C', t: '12 мая', before: 'Список вещей на ', after: ': крем, шляпа, зарядка', photo: '' },
  { tag: 'отпуск', sc: 1, chat: 'Путешествия по Азии', kind: 'campaign', who: 'Канал', l: 'П', c: '#B07A2E', t: '3 дня назад', before: '5 мест у моря, где не бывает толп. ', after: ' без спешки', photo: 'linear-gradient(160deg, #1E5A7A, #3F9A6C 55%, #F2B866)' },
  { tag: 'отпуск', sc: 1, chat: 'Дешёвые билеты', kind: 'campaign', who: 'Канал', l: 'Д', c: '#6A4C9C', t: 'неделю назад', before: 'Подборка на лето: ', after: ' от 30 000 ₸ туда и обратно', photo: '' },
  { tag: 'отпуск', sc: 2, chat: 'Избранное', kind: 'bookmark', who: 'Вы', l: '★', c: '#3F9A6C', t: 'апрель', before: 'Идеи на ', after: ': горы или море? Сравнить цены', photo: '' },
  { tag: 'море', sc: 0, chat: 'Семья', kind: 'group', who: 'Папа', l: 'С', c: '#2F6E9E', t: 'вчера', before: 'Вот это вид! ', after: '', photo: 'linear-gradient(180deg, #7FC4E8, #2F6E9E 60%, #E8D7A8)' },
  { tag: 'море', sc: 1, chat: 'Путешествия по Азии', kind: 'campaign', who: 'Канал', l: 'П', c: '#B07A2E', t: '3 дня назад', before: 'Лучшие пляжи сезона ', after: '', photo: '' },
  { tag: 'рецепт', sc: 0, chat: 'Мама', kind: 'person', who: 'Мама', l: 'М', c: '#B07A2E', t: 'в воскресенье', before: 'Бабушкин ', after: ' пирога с яблоками, как обещала', photo: '' },
  { tag: 'kotlin', sc: 0, chat: 'Kotlin-клуб', kind: 'group', who: 'Дмитрий', l: 'K', c: '#3F9A6C', t: '17:40', before: 'Корутины без боли — разбор в субботу ', after: '', photo: '' },
  { tag: 'kotlin', sc: 2, chat: 'Избранное', kind: 'bookmark', who: 'Вы', l: '★', c: '#3F9A6C', t: 'март', before: 'Почитать про Flow ', after: ' потом', photo: '' }
];
const SC = ['Мои чаты', 'Каналы', 'Избранное'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tag: 0, sc: 0, k: 0, toast: '', tk: 0 }; }
componentWillUnmount() { clearTimeout(this.tt); }
renderVals() {
  const s = this.state;
  const tag = TAGS[s.tag];
  const list = R.filter(r => r.tag === tag && r.sc === s.sc);
  const say = (t) => { clearTimeout(this.tt); this.setState({ toast: t, tk: s.tk + 1 }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2000); };
  const icon = { group: 'group', person: 'person', campaign: 'campaign', bookmark: 'bookmark' };
  const nWord = (n) => n % 10 === 1 && n % 100 !== 11 ? 'сообщение' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'сообщения' : 'сообщений';
  return {
    tag,
    tags: TAGS.map((t, i) => { const on = s.tag === i; return { t, on: on ? 'true' : 'false', bg: on ? 'rgba(143,211,172,.16)' : 'rgba(255,255,255,.05)', ink: on ? '#8FD3AC' : '#C9D2CC', bd: on ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', tap: () => this.setState({ tag: i, k: s.k + 1 }) }; }),
    scopes: SC.map((t, i) => { const on = s.sc === i; const n = R.filter(r => r.tag === tag && r.sc === i).length; return { t: t + (n ? ' · ' + n : ''), on: on ? 'true' : 'false', bg: on ? 'rgba(143,211,172,.18)' : 'transparent', ink: on ? '#8FD3AC' : '#9AA59F', tap: () => this.setState({ sc: i, k: s.k + 1 }) }; }),
    countText: list.length ? list.length + ' ' + nWord(list.length) + ' с #' + tag : 'Нет сообщений с #' + tag,
    res: list.map(r => ({ ...r, hit: tag, kindIcon: icon[r.kind], rad: r.kind === 'campaign' ? '12px' : '18px', photoShow: r.photo ? 'block' : 'none', anim: (s.k % 2 ? 'kxIn2' : 'kxIn') + ' .3s ease both', tap: () => say('Откроем сообщение в «' + r.chat + '»') })),
    empty: !list.length,
    toast: !!s.toast, toastText: s.toast, toastAnim: (s.tk % 2 ? 'kxToast2' : 'kxToast') + ' 2s ease both'
  };
}
}
</script>
</body>
</html>
