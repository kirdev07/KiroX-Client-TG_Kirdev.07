<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Специальные возможности</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.12);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:12px;background:#8FD3AC;border:3px solid #0A0C0B;box-shadow:0 0 0 1px #8FD3AC}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxWiggle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{bg}}; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column; transition: background .3s">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 800">Специальные возможности</h1>
  </header>

  <!-- Live preview -->
  <div style="margin: 4px 16px 0; padding: 14px; border-radius: 24px; background: {{pvBg}}; border: {{pvBorder}}; transition: all .3s">
    <div style="display: flex; gap: 8px; align-items: flex-end">
      <span style="width: {{av}}; height: {{av}}; border-radius: 50%; background: #C0443C; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; transition: all .3s">А</span>
      <div style="max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: {{inBg}}; border: {{inBd}}; transition: all .3s">
        <div style="font-size: {{fs}}; font-weight: {{fw}}; line-height: 1.4; color: {{ink}}; transition: all .3s">Встречаемся у входа в 18:30?</div>
      </div>
    </div>
    <div style="margin-top: 8px; display: flex; justify-content: flex-end">
      <div style="max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 6px 18px; background: {{outBg}}; color: {{outInk}}; border: {{outBd}}; animation: {{wiggle}}; transition: all .3s">
        <div style="font-size: {{fs}}; font-weight: {{fw}}; line-height: 1.4; transition: all .3s">Да, буду вовремя</div>
      </div>
    </div>
    <div style="margin-top: 10px; display: flex; gap: 8px">
      <span style="flex: 1; height: {{btnH}}; border-radius: 999px; background: {{btnBg}}; color: {{btnInk}}; font-size: {{btnFs}}; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .3s"><span class="ms" style="font-size: 18px" aria-hidden="true">reply</span>Ответить</span>
      <span style="width: {{btnH}}; height: {{btnH}}; border-radius: 999px; background: rgba(255,255,255,.08); border: {{iconBd}}; display: flex; align-items: center; justify-content: center; transition: all .3s"><span class="ms" aria-hidden="true">mic</span></span>
    </div>
  </div>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px 16px 30px">
    <div style="padding: 14px 16px; border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08)">
      <div style="display: flex; align-items: baseline"><span style="flex: 1; font-size: 15px; font-weight: 600">Размер текста везде</span><span style="font-size: 15px; font-weight: 800; color: #8FD3AC">{{scaleText}}</span></div>
      <div style="margin-top: 12px; display: flex; align-items: center; gap: 12px">
        <span style="font-size: 13px; color: #9AA59F">А</span>
        <input type="range" min="85" max="150" step="5" value="{{scale}}" onInput="{{onScale}}" aria-label="Размер текста" style="flex: 1">
        <span style="font-size: 22px; color: #9AA59F">А</span>
      </div>
    </div>

    <div style="margin-top: 12px; border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); overflow: hidden">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="6">
        <button onClick="{{o.tap}}" aria-pressed="{{o.on}}" style="width: 100%; padding: 13px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.05)">
          <span class="ms" style="color: {{o.ic}}" aria-hidden="true">{{o.icon}}</span>
          <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">{{o.label}}</span><span style="display: block; margin-top: 2px; font-size: 12px; color: #8A958F">{{o.sub}}</span></span>
          <span style="width: 48px; height: 28px; border-radius: 14px; background: {{o.track}}; position: relative; transition: background .2s; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{o.knob}}; width: 22px; height: 22px; border-radius: 11px; background: {{o.knobBg}}; transition: left .2s"></span></span>
        </button>
      </sc-for>
    </div>

    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Различение цветов</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
      <sc-for list="{{cb}}" as="c" hint-placeholder-count="4">
        <button onClick="{{c.tap}}" aria-pressed="{{c.on}}" style="padding: 12px; border-radius: 18px; background: {{c.bg}}; border: 1px solid {{c.bd}}; transition: all .2s">
          <span style="display: flex; gap: 4px"><span style="width: 18px; height: 18px; border-radius: 9px; background: {{c.c1}}"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: {{c.c2}}"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: {{c.c3}}"></span></span>
          <span style="display: block; margin-top: 8px; font-size: 14px; font-weight: 700">{{c.label}}</span>
          <span style="display: block; font-size: 11px; color: #8A958F">{{c.sub}}</span>
        </button>
      </sc-for>
    </div>
    <p style="margin: 12px 4px 0; font-size: 12px; line-height: 1.45; color: #8A958F">В новом дизайне у каждой кнопки есть подпись для TalkBack.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CB = [
  ['Обычные', 'Как задумано', '#8FD3AC', '#FF8A80', '#E8B04A'],
  ['Красный–зелёный', 'Дейтеранопия', '#6FA9D8', '#E8B04A', '#EEF3EF'],
  ['Синий–жёлтый', 'Тританопия', '#4FC3C3', '#F07AA0', '#EEF3EF'],
  ['Монохром', 'Без цвета', '#EEF3EF', '#8A958F', '#C9D2CC']
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { scale: 100, bold: false, contrast: false, motion: true, big: false, captions: true, outline: false, cb: 0 }; }
renderVals() {
  const s = this.state;
  const sw = v => ({ track: v ? '#3F9A6C' : 'rgba(255,255,255,.14)', knob: v ? '23px' : '3px', knobBg: v ? '#EEF3EF' : '#9AA59F' });
  const pal = CB[s.cb];
  const acc = pal[2];
  return {
    bg: s.contrast ? '#000' : '#0A0C0B',
    pvBg: s.contrast ? '#000' : 'radial-gradient(90% 70% at 85% 0%, rgba(63,154,108,.2), transparent 60%), #111614',
    pvBorder: s.contrast ? '2px solid #fff' : '1px solid rgba(255,255,255,.08)',
    av: Math.round(30 * s.scale / 100) + 'px',
    inBg: s.contrast ? '#1A1A1A' : 'rgba(255,255,255,.08)', inBd: s.contrast || s.outline ? '1.5px solid #fff' : '1px solid transparent',
    outBg: s.contrast ? acc : (s.cb === 0 ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : acc), outInk: '#06150D', outBd: s.outline ? '1.5px solid #fff' : '1px solid transparent',
    fs: (15 * s.scale / 100).toFixed(1) + 'px', fw: s.bold ? '700' : '400', ink: s.contrast ? '#fff' : '#EEF3EF',
    wiggle: s.motion ? 'kxWiggle 2.4s ease-in-out 2' : 'none',
    btnH: s.big ? '56px' : '44px', btnFs: s.big ? '16px' : '14px',
    btnBg: acc, btnInk: '#06150D', iconBd: s.outline ? '1.5px solid #fff' : '1px solid transparent',
    scale: String(s.scale), scaleText: s.scale + '%', onScale: e => this.setState({ scale: +e.target.value }),
    opts: [
      { icon: 'format_bold', label: 'Жирный шрифт', sub: 'Текст читается легче', k: 'bold' },
      { icon: 'contrast', label: 'Высокий контраст', sub: 'Чистый чёрный фон и белые рамки', k: 'contrast' },
      { icon: 'border_style', label: 'Контуры кнопок', sub: 'Видно, где кончается кнопка', k: 'outline' },
      { icon: 'touch_app', label: 'Крупные кнопки', sub: 'Больше места для нажатия', k: 'big' },
      { icon: 'animation', label: 'Анимации', sub: 'Выключите, если от движения укачивает', k: 'motion' },
      { icon: 'closed_caption', label: 'Текст под голосовыми', sub: 'Расшифровка видна сразу', k: 'captions' }
    ].map(o => { const w = sw(s[o.k]); return { ...o, on: s[o.k], ic: s[o.k] ? acc : '#9AA59F', track: s[o.k] ? '#3F9A6C' : w.track, knob: w.knob, knobBg: w.knobBg, tap: () => this.setState({ [o.k]: !s[o.k] }) }; }),
    cb: CB.map(([label, sub, c1, c2, c3], i) => ({ label, sub, c1, c2, c3, on: s.cb === i, bg: s.cb === i ? 'rgba(143,211,172,.12)' : 'rgba(255,255,255,.04)', bd: s.cb === i ? acc : 'rgba(255,255,255,.08)', tap: () => this.setState({ cb: i }) }))
  };
}
}
</script>
</body>
</html>
