<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Медленный режим</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes kxNudge{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes kxNudge2{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes kxTip{0%{opacity:0;transform:translateY(8px)}12%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(8px)}}
@keyframes kxTip2{0%{opacity:0;transform:translateY(8px)}12%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(8px)}}
@keyframes kxSnail{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes kxReady{0%{box-shadow:0 0 0 0 rgba(143,211,172,.6)}100%{box-shadow:0 0 0 14px rgba(143,211,172,0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: #3F9A6C; display: flex; align-items: center; justify-content: center; font-weight: 800">K</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Kotlin-клуб</div><div style="font-size: 12px; color: #9AA59F">1 284 участника, 96 в сети</div></div>
  </header>

  <div style="margin: 8px 12px 0; padding: 10px 12px; border-radius: 16px; background: rgba(232,176,74,.08); border: 1px solid rgba(232,176,74,.25); display: flex; align-items: center; gap: 10px">
    <span style="font-size: 20px; display: inline-block; animation: kxSnail 2s ease-in-out 2" aria-hidden="true">🐌</span>
    <span style="flex: 1; font-size: 12px; line-height: 1.35; color: #E8D2A0">Медленный режим: одно сообщение раз в {{intervalText}}. Так в чате спокойнее.</span>
  </div>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <div style="align-self: {{m.side}}; max-width: 80%; animation: {{m.anim}}">
        <div style="display: {{m.nameShow}}; font-size: 12px; font-weight: 800; color: {{m.nc}}; margin: 0 0 2px 10px">{{m.who}}</div>
        <div style="padding: 8px 12px; border-radius: {{m.rad}}; background: {{m.bg}}; color: {{m.ink}}; font-size: 15px; line-height: 1.4">{{m.text}}<span style="font-size: 11px; opacity: .6; margin-left: 8px">{{m.t}}</span></div>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{tip}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 16px; right: 16px; bottom: 86px; padding: 10px 14px; border-radius: 16px; background: rgba(40,48,44,.97); border: 1px solid rgba(232,176,74,.3); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; animation: {{tipAnim}}"><span class="ms fill" style="font-size: 18px; color: #E8B04A" aria-hidden="true">schedule</span>{{tipText}}</div>
  </sc-if>

  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06); display: flex; gap: 8px; align-items: center">
    <div style="flex: 1; min-height: 48px; padding: 0 16px; border-radius: 24px; background: {{inBg}}; border: 1px solid {{inBd}}; display: flex; align-items: center; font-size: 15px; color: {{inInk}}; animation: {{nudge}}; transition: background .3s">{{inText}}</div>
    <button onClick="{{send}}" aria-label="{{sendLabel}}" style="position: relative; width: 52px; height: 52px; border-radius: 26px; background: {{sBg}}; color: {{sInk}}; display: flex; align-items: center; justify-content: center; animation: {{readyAnim}}; transition: background .3s">
      <svg width="52" height="52" viewBox="0 0 52 52" style="position: absolute; inset: 0; transform: rotate(-90deg); opacity: {{ringOp}}" aria-hidden="true"><circle cx="26" cy="26" r="23" fill="none" stroke="rgba(232,176,74,.18)" stroke-width="3"></circle><circle cx="26" cy="26" r="23" fill="none" stroke="#E8B04A" stroke-width="3" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="{{ringOff}}" style="transition: stroke-dashoffset 1s linear"></circle></svg>
      <span class="ms fill" style="position: relative; display: {{iconShow}}" aria-hidden="true">send</span>
      <span style="position: relative; display: {{timeShow}}; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums">{{left}}</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const INT = 60;
const BASE = [
  { who: 'Дмитрий', nc: '#8FD3AC', text: 'Кто разбирался с Compose Multiplatform на iOS?', t: '17:31' },
  { who: 'Айгерим', nc: '#E8B04A', text: 'Пробую сейчас: пока сыровато, но жить можно', t: '17:32' },
  { who: 'Сергей', nc: '#7FB8E0', text: 'Есть пример с навигацией?', t: '17:33' }
];
const MINE = ['Могу скинуть свой шаблон с навигацией 👇', 'github.com/… там README с шагами', 'Если что — пишите в личку'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mine: [], left: 0, nk: 0, tip: false, tk: 0 }; }
componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.tt); }
renderVals() {
  const s = this.state;
  const locked = s.left > 0;
  const nextText = MINE[s.mine.length % MINE.length];
  const mmss = (n) => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
  const send = () => {
    if (locked) { clearTimeout(this.tt); this.setState({ nk: s.nk + 1, tip: true, tk: s.tk + 1 }); this.tt = setTimeout(() => this.setState({ tip: false }), 2200); return; }
    const t = '17:' + String(34 + s.mine.length).padStart(2, '0');
    this.setState({ mine: [...s.mine, { text: nextText, t }], left: INT });
    clearInterval(this.iv);
    this.iv = setInterval(() => { const l = this.state.left - 1; if (l <= 0) { clearInterval(this.iv); this.setState({ left: 0 }); } else this.setState({ left: l }); }, 1000);
  };
  const all = [...BASE.map(m => ({ ...m, me: false })), ...s.mine.map(m => ({ ...m, me: true }))].slice(-6);
  return {
    intervalText: 'минуту',
    msgs: all.map(m => ({ side: m.me ? 'flex-end' : 'flex-start', who: m.who || '', nc: m.nc || '#8FD3AC', nameShow: m.me ? 'none' : 'block', text: m.text, t: m.t,
      rad: m.me ? '18px 18px 6px 18px' : '18px 18px 18px 6px', bg: m.me ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.07)', ink: m.me ? '#06150D' : '#EEF3EF',
      anim: m.me ? 'kxIn .3s cubic-bezier(.2,.8,.2,1) both' : 'none' })),
    inText: locked ? 'Следующее сообщение через ' + mmss(s.left) : nextText,
    inInk: locked ? '#8A958F' : '#EEF3EF', inBg: locked ? 'rgba(232,176,74,.06)' : 'rgba(255,255,255,.07)', inBd: locked ? 'rgba(232,176,74,.2)' : 'transparent',
    nudge: s.nk ? (s.nk % 2 ? 'kxNudge2' : 'kxNudge') + ' .4s ease both' : 'none',
    send, sendLabel: locked ? 'Медленный режим, осталось ' + mmss(s.left) : 'Отправить',
    sBg: locked ? 'rgba(255,255,255,.06)' : 'linear-gradient(135deg, #6FC497, #3F9A6C)', sInk: locked ? '#E8B04A' : '#06150D',
    ringOp: locked ? 1 : 0, ringOff: String(144.5 * (1 - s.left / INT)),
    iconShow: locked ? 'none' : 'inline-block', timeShow: locked ? 'inline' : 'none', left: s.left,
    readyAnim: !locked && s.mine.length ? 'kxReady 1s ease-out 1' : 'none',
    tip: s.tip, tipAnim: (s.tk % 2 ? 'kxTip2' : 'kxTip') + ' 2.2s ease both',
    tipText: 'Подождите ещё ' + mmss(s.left) + ' — в группе медленный режим'
  };
}
}
</script>
</body>
</html>
