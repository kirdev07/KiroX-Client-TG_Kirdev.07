<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Перейти к дате</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.92)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxMonthL{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes kxMonthR{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes kxPick{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <div style="flex: 1; min-width: 0"><h1 style="margin: 0; font-size: 20px; font-weight: 800">Перейти к дате</h1><div style="font-size: 12px; color: #9AA59F">Чат: Анна</div></div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 16px 30px">
    <!-- Month nav -->
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 0 10px">
      <button onClick="{{prev}}" aria-label="Предыдущий месяц" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; opacity: {{prevOp}}"><span class="ms" aria-hidden="true">chevron_left</span></button>
      <div style="flex: 1; text-align: center"><div style="font-size: 18px; font-weight: 800">{{monthName}}</div><div style="font-size: 12px; color: #9AA59F">{{monthSub}}</div></div>
      <button onClick="{{next}}" aria-label="Следующий месяц" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; opacity: {{nextOp}}"><span class="ms" aria-hidden="true">chevron_right</span></button>
    </div>

    <div style="padding: 12px; border-radius: 24px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08)">
      <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 11px; color: #8A958F; text-align: center; padding-bottom: 6px">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; animation: {{gridAnim}}">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <button onClick="{{c.tap}}" aria-label="{{c.label}}" aria-pressed="{{c.on}}" style="aspect-ratio: 1; border-radius: 14px; background: {{c.bg}}; border: 1.5px solid {{c.bd}}; color: {{c.ink}}; opacity: {{c.op}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; animation: {{c.anim}}; transition: background .2s">
            <span style="font-size: 14px; font-weight: {{c.fw}}">{{c.n}}</span>
            <span style="width: 4px; height: 4px; border-radius: 2px; background: {{c.dot}}"></span>
          </button>
        </sc-for>
      </div>
      <div style="margin-top: 10px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 11px; color: #8A958F">
        Меньше
        <span style="width: 12px; height: 12px; border-radius: 4px; background: rgba(143,211,172,.1)"></span>
        <span style="width: 12px; height: 12px; border-radius: 4px; background: rgba(143,211,172,.25)"></span>
        <span style="width: 12px; height: 12px; border-radius: 4px; background: rgba(143,211,172,.45)"></span>
        <span style="width: 12px; height: 12px; border-radius: 4px; background: rgba(143,211,172,.7)"></span>
        Больше
      </div>
    </div>

    <!-- Day preview -->
    <sc-if value="{{hasDay}}" hint-placeholder-val="{{true}}">
      <div style="margin-top: 14px; padding: 14px; border-radius: 22px; background: linear-gradient(150deg, rgba(63,154,108,.16), rgba(255,255,255,.03)); border: 1px solid rgba(143,211,172,.22); animation: kxIn .25s ease both" data-k="{{dayKey}}">
        <div style="display: flex; align-items: baseline"><span style="flex: 1; font-size: 15px; font-weight: 800">{{dayTitle}}</span><span style="font-size: 12px; color: #8FD3AC; font-weight: 700">{{dayCount}}</span></div>
        <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{preview}}" as="m" hint-placeholder-count="2">
            <div style="align-self: {{m.side}}; max-width: 82%; padding: 7px 11px; border-radius: 14px; background: {{m.bg}}; color: {{m.ink}}; font-size: 13px">{{m.t}} <span style="font-size: 11px; opacity: .6">{{m.time}}</span></div>
          </sc-for>
        </div>
        <button onClick="{{go}}" style="margin-top: 12px; width: 100%; height: 48px; border-radius: 24px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px"><span class="ms" aria-hidden="true">move_down</span>{{goText}}</button>
      </div>
    </sc-if>
    <sc-if value="{{noDay}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 14px; padding: 18px; border-radius: 22px; background: rgba(255,255,255,.03); border: 1px dashed rgba(255,255,255,.12); text-align: center; font-size: 13px; color: #8A958F; animation: kxIn .25s ease both">{{noDayText}}</div>
    </sc-if>

    <!-- Quick jumps -->
    <div style="margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="4"><button onClick="{{q.tap}}" style="height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); font-size: 13px; font-weight: 700; color: #C9D2CC; display: flex; align-items: center; gap: 4px"><span class="ms" style="font-size: 16px" aria-hidden="true">{{q.icon}}</span>{{q.label}}</button></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WDL = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
// first message: 3 Sep 2025; today: 22 Nov 2026
const FIRST = new Date(2025, 8, 3), TODAY = new Date(2026, 10, 22);
const count = d => { if (d < FIRST || d > TODAY) return 0; const k = d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate(); const r = (Math.sin(k * 12.9898) * 43758.5453) % 1; const v = Math.abs(r); const base = v < 0.28 ? 0 : Math.round(v * v * 90); const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); return ['2026-10-22', '2026-10-15', '2026-10-14', '2025-10-22', '2025-8-3'].includes(key) ? Math.max(base, 14) : base; };
const SAMPLES = [['Ты дома?', 'Да, уже приехала'], ['Скинь фото с прогулки', 'Держи 📸'], ['Кино в 20:00?', 'Идём!'], ['Как прошёл день?', 'Устала, но всё хорошо'], ['Купить хлеб?', 'И молоко 🙂']];
const plural = (n, a, b, c) => n % 10 === 1 && n % 100 !== 11 ? a : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? b : c;
class Component extends DCLogic {
constructor(props) { super(props); this.state = { y: 2026, m: 10, sel: 14, dir: 0, jumped: '' }; }
renderVals() {
  const s = this.state;
  const first = new Date(s.y, s.m, 1);
  const days = new Date(s.y, s.m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const monthTotal = Array.from({ length: days }, (_, i) => count(new Date(s.y, s.m, i + 1))).reduce((a, b) => a + b, 0);
  const canPrev = new Date(s.y, s.m, 1) > new Date(2025, 8, 1);
  const canNext = new Date(s.y, s.m, 1) < new Date(2026, 10, 1);
  const shift = d => { const t = new Date(s.y, s.m + d, 1); this.setState({ y: t.getFullYear(), m: t.getMonth(), sel: -1, dir: d }); };
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push({ n: '', label: 'Пусто', on: false, bg: 'transparent', bd: 'transparent', ink: 'transparent', op: '1', fw: '400', dot: 'transparent', anim: 'none', tap: () => {} });
  for (let d = 1; d <= days; d++) {
    const date = new Date(s.y, s.m, d);
    const c = count(date);
    const on = s.sel === d;
    const isToday = date.getTime() === TODAY.getTime();
    const future = date > TODAY, before = date < FIRST;
    const lvl = c === 0 ? 0 : c < 10 ? 1 : c < 30 ? 2 : c < 60 ? 3 : 4;
    cells.push({
      n: String(d), on, label: d + ' ' + GEN[s.m] + ': ' + (c ? c + ' ' + plural(c, 'сообщение', 'сообщения', 'сообщений') : 'нет сообщений'),
      bg: on ? 'linear-gradient(160deg, #6FC497, #3F9A6C)' : ['transparent', 'rgba(143,211,172,.1)', 'rgba(143,211,172,.25)', 'rgba(143,211,172,.45)', 'rgba(143,211,172,.7)'][lvl],
      bd: isToday && !on ? '#8FD3AC' : 'transparent', ink: on ? '#06150D' : lvl >= 3 ? '#06150D' : '#EEF3EF',
      op: future || before ? '.25' : '1', fw: on || isToday ? '800' : '500', dot: isToday && !on ? '#8FD3AC' : 'transparent',
      anim: on ? 'kxPick .25s ease both' : 'none',
      tap: () => !(future || before) && this.setState({ sel: d })
    });
  }
  const selDate = s.sel > 0 ? new Date(s.y, s.m, s.sel) : null;
  const selCount = selDate ? count(selDate) : 0;
  const smp = SAMPLES[(s.sel + s.m) % SAMPLES.length];
  return {
    prev: () => canPrev && shift(-1), next: () => canNext && shift(1), prevOp: canPrev ? '1' : '.3', nextOp: canNext ? '1' : '.3',
    monthName: MONTHS[s.m] + ' ' + s.y, monthSub: monthTotal ? monthTotal + ' ' + plural(monthTotal, 'сообщение', 'сообщения', 'сообщений') : 'Сообщений не было',
    gridAnim: s.dir < 0 ? 'kxMonthL .25s ease both' : s.dir > 0 ? 'kxMonthR .25s ease both' : 'none',
    cells,
    hasDay: !!selDate && selCount > 0, noDay: !selDate || selCount === 0,
    noDayText: !selDate ? 'Выберите день — подсвечены дни, когда вы переписывались' : 'В этот день вы не переписывались',
    dayKey: String(s.sel), dayTitle: selDate ? s.sel + ' ' + GEN[s.m] + ', ' + WDL[selDate.getDay()] : '',
    dayCount: selCount + ' фото и видео',
    preview: [{ t: smp[0], time: '10:1' + (s.sel % 10), side: 'flex-start', bg: 'rgba(255,255,255,.08)', ink: '#EEF3EF' }, { t: smp[1], time: '10:2' + (s.sel % 10), side: 'flex-end', bg: 'linear-gradient(135deg, #6FC497, #3F9A6C)', ink: '#06150D' }],
    goText: s.jumped === s.y + '-' + s.m + '-' + s.sel ? 'Открываем…' : 'Перейти к первому сообщению',
    go: () => this.setState({ jumped: s.y + '-' + s.m + '-' + s.sel }),
    quick: [
      { icon: 'today', label: 'Сегодня', tap: () => this.setState({ y: 2026, m: 10, sel: 22, dir: 0 }) },
      { icon: 'history', label: 'Неделю назад', tap: () => this.setState({ y: 2026, m: 10, sel: 15, dir: 0 }) },
      { icon: 'event_repeat', label: 'Год назад', tap: () => this.setState({ y: 2025, m: 10, sel: 22, dir: -1 }) },
      { icon: 'first_page', label: 'Самое начало', tap: () => this.setState({ y: 2025, m: 8, sel: 3, dir: -1 }) }
    ]
  };
}
}
</script>
</body>
</html>
