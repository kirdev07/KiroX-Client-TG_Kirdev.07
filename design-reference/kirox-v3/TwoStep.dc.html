<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Двухэтапная проверка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
input::placeholder{color:#8A958F}
@keyframes kxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes kxGlow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes kxSlide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes kxPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes kxShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes kxShield{0%{transform:scale(.4) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0D0C; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column; padding: 0 24px">
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 80px; width: 300px; height: 300px; margin-left: -150px; border-radius: 50%; background: radial-gradient(circle, rgba(70,160,110,.22), transparent 65%); animation: kxGlow 4s ease-in-out 2"></div>
  <div style="position: relative; height: 64px; display: flex; align-items: center; margin: 0 -12px">
    <button onClick="{{back}}" aria-label="Назад" style="width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <div style="flex: 1; display: flex; justify-content: center; gap: 6px; padding-right: 48px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4"><span style="width: {{s.w}}; height: 6px; border-radius: 3px; background: {{s.bg}}; transition: all .35s cubic-bezier(.34,1.45,.5,1)"></span></sc-for>
    </div>
  </div>

  <div style="position: relative; flex: 1; display: flex; flex-direction: column; animation: kxSlide .35s cubic-bezier(.2,.9,.3,1) both" data-k="{{stepKey}}">
    <div style="margin: 24px auto 0; width: 92px; height: 92px; border-radius: 30px; background: linear-gradient(145deg, #1D2A23, #121714); border: 1px solid #2A3A31; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 40px rgba(0,0,0,.5); animation: kxFloat 4.5s ease-in-out 2">
      <span class="ms fill" style="font-size: 44px; color: #8FD3AC" aria-hidden="true">{{icon}}</span>
    </div>
    <h1 style="margin: 26px 0 0; text-align: center; font-size: 26px; line-height: 32px; font-weight: 700">{{title}}</h1>
    <p style="margin: 8px 0 0; text-align: center; font-size: 15px; line-height: 22px; color: #9AA59F">{{sub}}</p>

    <sc-if value="{{hasField}}" hint-placeholder-val="{{true}}">
      <div style="margin-top: 28px; height: 60px; border-radius: 18px; background: #151917; border: 1px solid {{fieldBorder}}; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; animation: {{shake}}; transition: border-color .2s">
        <span class="ms" style="color: #8A958F" aria-hidden="true">{{fieldIcon}}</span>
        <input aria-label="{{placeholder}}" type="{{inputType}}" placeholder="{{placeholder}}" value="{{val}}" onInput="{{onVal}}" style="flex: 1; font-size: 17px">
        <sc-if value="{{isPw}}" hint-placeholder-val="{{true}}"><button onClick="{{toggleShow}}" aria-label="Показать пароль" style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #9AA59F"><span class="ms" aria-hidden="true">{{showIcon}}</span></button></sc-if>
      </div>
      <sc-if value="{{showStrength}}" hint-placeholder-val="{{true}}">
        <div style="margin-top: 10px; display: flex; gap: 4px">
          <sc-for list="{{meter}}" as="m" hint-placeholder-count="4"><span style="flex: 1; height: 5px; border-radius: 3px; background: {{m}}; transition: background .25s"></span></sc-for>
        </div>
        <div style="margin-top: 6px; font-size: 12px; color: {{strengthInk}}">{{strengthText}}</div>
      </sc-if>
      <sc-if value="{{showNote}}" hint-placeholder-val="{{false}}"><div style="margin-top: 8px; font-size: 13px; color: {{noteInk}}">{{note}}</div></sc-if>
    </sc-if>

    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 26px; padding: 14px; border-radius: 20px; background: rgba(255,255,255,.045); display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{summary}}" as="r" hint-placeholder-count="3"><div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span class="ms fill" style="font-size: 20px; color: #8FD3AC; animation: kxPop .4s ease {{r.d}} both" aria-hidden="true">check_circle</span><span style="flex: 1; color: #C9D2CC">{{r.k}}</span><span style="font-weight: 700">{{r.v}}</span></div></sc-for>
      </div>
    </sc-if>

    <div style="flex-grow: 1"></div>
    <sc-if value="{{canSkip}}" hint-placeholder-val="{{false}}"><button onClick="{{skip}}" style="height: 44px; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: #9AA59F; text-align: center">Пропустить</button></sc-if>
    <button onClick="{{next}}" style="margin-bottom: 28px; height: 56px; border-radius: 16px; background: {{btnBg}}; color: {{btnInk}}; font-size: 16px; font-weight: 700; box-shadow: {{btnShadow}}; transition: all .25s">{{btnText}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { step: 0, pw: '', pw2: '', hint: '', mail: '', show: false, err: 0 }; }
renderVals() {
  const s = this.state;
  const pw = s.pw;
  let score = 0;
  if (pw.length >= 6) score++;
  if (pw.length >= 10) score++;
  if (/[A-ZА-Я]/.test(pw) && /[a-zа-я]/.test(pw)) score++;
  if (/\d/.test(pw) && /[^A-Za-zА-Яа-я0-9]/.test(pw)) score++;
  const SC = [['Слишком короткий', '#FF8A80'], ['Слабый', '#FF8A80'], ['Средний', '#E8B04A'], ['Хороший', '#8FD3AC'], ['Отличный', '#8FD3AC']];
  const mailOk = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.mail.trim());
  const S = [
    { key: 'pw', icon: 'password', title: 'Придумайте пароль', sub: 'Его будут спрашивать при входе на новом устройстве, после кода из СМС', ph: 'Пароль', fi: 'key', val: s.pw, field: 'pw', ok: pw.length >= 6 },
    { key: 'pw2', icon: 'lock_reset', title: 'Повторите пароль', sub: 'Чтобы точно не ошибиться', ph: 'Ещё раз', fi: 'key', val: s.pw2, field: 'pw2', ok: s.pw2.length > 0 },
    { key: 'hint', icon: 'lightbulb', title: 'Подсказка', sub: 'Поможет вспомнить пароль. Не пишите сам пароль', ph: 'Например: любимый город', fi: 'edit', val: s.hint, field: 'hint', ok: true, skip: true },
    { key: 'mail', icon: 'mail', title: 'Почта для восстановления', sub: 'Если забудете пароль, пришлём код сюда', ph: 'name@example.com', fi: 'alternate_email', val: s.mail, field: 'mail', ok: mailOk, skip: true },
    { key: 'done', icon: 'verified_user', title: 'Аккаунт защищён', sub: 'Двухэтапная проверка включена' }
  ];
  const st = S[s.step];
  const isDone = s.step === 4;
  const isPw = st.field === 'pw' || st.field === 'pw2';
  const mismatch = s.step === 1 && s.err;
  const next = () => {
    if (isDone) { this.setState({ step: 0, pw: '', pw2: '', hint: '', mail: '', err: 0 }); return; }
    if (!st.ok) return;
    if (s.step === 1 && s.pw2 !== s.pw) { this.setState({ err: Date.now(), pw2: '' }); return; }
    this.setState({ step: s.step + 1, err: 0, show: false });
  };
  return {
    stepKey: st.key,
    steps: [0, 1, 2, 3].map(i => ({ w: i === Math.min(s.step, 3) && !isDone ? '28px' : '8px', bg: i < s.step || isDone ? '#8FD3AC' : i === s.step ? '#8FD3AC' : 'rgba(255,255,255,.15)' })),
    back: () => this.setState({ step: Math.max(0, s.step - 1), err: 0 }),
    icon: st.icon, title: st.title, sub: st.sub,
    hasField: !isDone, done: isDone,
    fieldIcon: st.fi || 'key', placeholder: st.ph || '', val: st.val || '',
    onVal: e => this.setState({ [st.field]: e.target.value, err: 0 }),
    isPw, inputType: isPw && !s.show ? 'password' : 'text',
    toggleShow: () => this.setState({ show: !s.show }), showIcon: s.show ? 'visibility_off' : 'visibility',
    fieldBorder: mismatch ? 'rgba(255,138,128,.6)' : st.ok && st.val ? '#4E8F6B' : '#232A26',
    shake: mismatch && Date.now() - s.err < 800 ? 'kxShake .4s ease' : 'none',
    showStrength: s.step === 0, meter: [0, 1, 2, 3].map(i => i < score ? SC[score][1] : 'rgba(255,255,255,.1)'),
    strengthText: pw ? 'Надёжность: ' + SC[pw.length < 6 ? 0 : score][0] : 'Минимум 6 символов', strengthInk: pw ? SC[pw.length < 6 ? 0 : score][1] : '#8A958F',
    showNote: mismatch || (s.step === 3 && s.mail && !mailOk),
    note: mismatch ? 'Пароли не совпадают, попробуйте ещё раз' : 'Проверьте адрес почты', noteInk: '#FF8A80',
    canSkip: !!st.skip, skip: () => this.setState({ step: s.step + 1, [st.field]: '' }),
    summary: [['Пароль', '•'.repeat(Math.min(s.pw.length, 10))], ['Подсказка', s.hint || 'нет'], ['Почта', s.mail ? s.mail.replace(/^(.).*(@.*)$/, '$1•••$2') : 'не указана']].map(([k, v], i) => ({ k, v, d: (i * 0.12) + 's' })),
    btnText: isDone ? 'Готово' : s.step === 3 ? 'Включить защиту' : 'Продолжить',
    btnBg: st.ok || isDone ? 'linear-gradient(100deg, #6FC497 0%, #3F9A6C 100%)' : 'rgba(255,255,255,.07)',
    btnInk: st.ok || isDone ? '#06150D' : '#5C6661',
    btnShadow: st.ok || isDone ? '0 10px 28px rgba(63,154,108,.35)' : 'none',
    next
  };
}
}
</script>
</body>
</html>
