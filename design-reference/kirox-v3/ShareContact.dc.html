<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поделиться контактом</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@keyframes kxFly{0%{opacity:0;transform:translateY(40px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(135deg, #C0443C, #6A4C9C); display: flex; align-items: center; justify-content: center; font-weight: 800">А</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Анна</div><div style="font-size: 12px; color: #8FD3AC">в сети</div></div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px; justify-content: flex-end">
    <div style="align-self: flex-start; max-width: 80%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); font-size: 15px">Скинь контакт мастера по ремонту, пожалуйста</div>
    <!-- Incoming contact card example -->
    <div style="align-self: flex-start; width: 270px; padding: 12px; border-radius: 20px 20px 20px 6px; background: rgba(255,255,255,.07)">
      <div style="font-size: 11px; color: #9AA59F; margin-bottom: 8px">Контакт · Анна · вчера</div>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 44px; height: 44px; border-radius: 22px; background: linear-gradient(135deg, #6FA9D8, #2F6E9E); display: flex; align-items: center; justify-content: center; font-weight: 800">Д</span>
        <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 800">Доктор Ахметова</span><span style="display: block; font-size: 12px; color: #9AA59F">+7 727 ••• •• 15 · есть в Telegram</span></span>
      </div>
      <div style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px">
        <button onClick="{{addIn}}" style="height: 36px; border-radius: 18px; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 700; text-align: center">{{addInText}}</button>
        <button onClick="{{writeIn}}" style="height: 36px; border-radius: 18px; background: rgba(143,211,172,.16); color: #8FD3AC; font-size: 13px; font-weight: 700; text-align: center">Написать</button>
      </div>
    </div>
    <sc-for list="{{sent}}" as="m" hint-placeholder-count="1">
      <div style="align-self: flex-end; width: 270px; padding: 12px; border-radius: 20px 20px 6px 20px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; animation: kxFly .35s cubic-bezier(.2,.8,.2,1) both">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(6,21,13,.2); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #06150D">{{m.l}}</span>
          <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 800">{{m.name}}</span><span style="display: block; font-size: 12px; opacity: .75">{{m.sub}}</span></span>
        </div>
        <sc-if value="{{m.hasNote}}" hint-placeholder-val="{{false}}"><div style="margin-top: 8px; font-size: 14px">{{m.note}}</div></sc-if>
        <div style="margin-top: 4px; text-align: right; font-size: 11px; opacity: .65">18:30 ✓✓</div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06); display: flex; gap: 8px; align-items: center">
    <button onClick="{{openSheet}}" aria-label="Прикрепить контакт" style="width: 48px; height: 48px; border-radius: 24px; background: rgba(143,211,172,.14); color: #8FD3AC; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">person_add</span></button>
    <div style="flex: 1; height: 48px; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,.07); display: flex; align-items: center; font-size: 15px; color: #8A958F">Сообщение</div>
  </div>

  <!-- Sheet -->
  <sc-if value="{{sheet}}" hint-placeholder-val="{{true}}">
    <button onClick="{{closeSheet}}" aria-label="Закрыть" style="position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: kxFade .2s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 640px; padding: 10px 16px 20px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, rgba(40,48,44,.97), rgba(18,22,20,.99)); border-top: 1px solid rgba(255,255,255,.16); display: flex; flex-direction: column; animation: kxSheet .3s cubic-bezier(.2,.8,.2,1) both">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 0 auto 12px"></div>
      <div style="font-size: 19px; font-weight: 800">Поделиться контактом</div>
      <sc-if value="{{picking}}" hint-placeholder-val="{{true}}">
        <button onClick="{{pickMe}}" style="margin-top: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(143,211,172,.08); border: 1px solid rgba(143,211,172,.25); display: flex; align-items: center; gap: 12px"><span style="width: 42px; height: 42px; border-radius: 21px; background: linear-gradient(135deg, #6FC497, #2F6E9E); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #06150D">К</span><span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 700">Мой контакт</span><span style="display: block; font-size: 12px; color: #9AA59F">Ваш номер увидит Анна</span></span><span class="ms" style="color: #8FD3AC" aria-hidden="true">chevron_right</span></button>
        <div style="margin-top: 12px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 6px">Контакты</div>
        <div class="scroll" style="max-height: 300px">
          <sc-for list="{{contacts}}" as="c" hint-placeholder-count="5"><button onClick="{{c.tap}}" style="width: 100%; padding: 8px 4px; display: flex; align-items: center; gap: 12px"><span style="width: 42px; height: 42px; border-radius: 21px; background: {{c.c}}; display: flex; align-items: center; justify-content: center; font-weight: 800">{{c.l}}</span><span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 700">{{c.name}}</span><span style="display: block; font-size: 12px; color: #8A958F">{{c.sub}}</span></span></button></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{confirming}}" hint-placeholder-val="{{false}}">
        <div style="margin-top: 14px; padding: 14px; border-radius: 20px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); animation: kxIn .25s ease both">
          <div style="display: flex; align-items: center; gap: 12px"><span style="width: 52px; height: 52px; border-radius: 26px; background: {{pc}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">{{pl}}</span><span style="flex: 1"><span style="display: block; font-size: 17px; font-weight: 800">{{pname}}</span><span style="display: block; font-size: 12px; color: #9AA59F">Что отправить</span></span></div>
          <sc-for list="{{fields}}" as="f" hint-placeholder-count="3"><button onClick="{{f.tap}}" style="width: 100%; margin-top: 8px; padding: 10px 12px; border-radius: 14px; background: rgba(0,0,0,.2); display: flex; align-items: center; gap: 10px"><span class="ms" style="color: #9AA59F; font-size: 20px" aria-hidden="true">{{f.icon}}</span><span style="flex: 1; font-size: 14px">{{f.v}}</span><span style="width: 22px; height: 22px; border-radius: 7px; border: 2px solid {{f.ring}}; background: {{f.bg}}; color: #06150D; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 16px; opacity: {{f.op}}" aria-hidden="true">check</span></span></button></sc-for>
        </div>
        <div style="margin-top: 12px; display: flex; gap: 8px">
          <button onClick="{{backPick}}" style="height: 50px; padding: 0 18px; border-radius: 25px; background: rgba(255,255,255,.08); font-size: 15px; font-weight: 700">Назад</button>
          <button onClick="{{send}}" style="flex: 1; height: 50px; border-radius: 25px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms fill" style="font-size: 20px" aria-hidden="true">send</span>Отправить</button>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 96px; padding: 12px 18px; border-radius: 18px; background: #232A26; border: 1px solid rgba(255,255,255,.16); font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2.4s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">{{toastIcon}}</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const C = [['Мастер по ремонту', 'М', '#5C6661', '+7 700 ••• •• 61', 'нет в Telegram'], ['Ерлан, сосед', 'Е', '#2F6E9E', '+7 777 ••• •• 18', 'в Telegram'], ['Сервис-центр', 'С', '#B07A2E', '+7 727 ••• •• 40', 'нет в Telegram'], ['Тренер Аскар', 'А', '#3F9A6C', '+7 747 ••• •• 03', 'в Telegram'], ['Лиза', 'Л', '#C0443C', '+7 771 ••• •• 27', 'в Telegram']];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sheet: true, pick: -1, me: false, f: [true, true, false], sent: [], added: false, toast: 0, toastText: '', toastIcon: 'done' }; }
componentWillUnmount() { clearTimeout(this.tt); }
toastMsg(text, icon) { clearTimeout(this.tt); this.setState({ toast: this.state.toast + 1, toastText: text, toastIcon: icon }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2400); }
renderVals() {
  const s = this.state;
  const p = s.me ? ['Алекс', 'А', 'linear-gradient(135deg, #6FC497, #2F6E9E)', '+7 777 ••• •• 12', 'в Telegram'] : s.pick >= 0 ? C[s.pick] : C[0];
  const fieldVals = [['call', p[3]], ['badge', p[0]], ['sticky_note_2', 'Заметка: «звонить после 10:00»']];
  return {
    addInText: s.added ? 'В контактах ✓' : 'Добавить', addIn: () => { this.setState({ added: true }); this.toastMsg('Доктор Ахметова в контактах', 'person_add'); },
    writeIn: () => this.toastMsg('Откроется чат с контактом', 'chat'),
    sheet: s.sheet, openSheet: () => this.setState({ sheet: true, pick: -1, me: false }), closeSheet: () => this.setState({ sheet: false }),
    picking: s.pick < 0 && !s.me, confirming: s.pick >= 0 || s.me,
    pickMe: () => this.setState({ me: true }),
    contacts: C.map(([name, l, c, ph, tg], i) => ({ name, l, c, sub: ph + ' · ' + tg, tap: () => this.setState({ pick: i, me: false }) })),
    pname: p[0], pl: p[1], pc: p[2],
    fields: fieldVals.map(([icon, v], i) => ({ icon, v, ring: s.f[i] ? '#8FD3AC' : 'rgba(255,255,255,.3)', bg: s.f[i] ? '#8FD3AC' : 'transparent', op: s.f[i] ? '1' : '0', tap: () => this.setState({ f: s.f.map((x, k) => k === i ? !x : x) }) })),
    backPick: () => this.setState({ pick: -1, me: false }),
    send: () => { this.setState({ sheet: false, sent: [...s.sent, { name: s.f[1] ? p[0] : 'Контакт', l: p[1], sub: s.f[0] ? p[3] : 'номер скрыт', note: s.f[2] ? 'Звонить после 10:00' : '', hasNote: !!s.f[2] }], pick: -1, me: false }); },
    sent: s.sent,
    toast: s.toast > 0, toastText: s.toastText, toastIcon: s.toastIcon
  };
}
}
</script>
</body>
</html>
