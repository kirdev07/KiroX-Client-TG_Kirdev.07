<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Эффекты сообщений</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94)}
@keyframes kxDownA{0%{transform:translateY(-60px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(860px) rotate(540deg);opacity:.9}}
@keyframes kxDownB{0%{transform:translateY(-60px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(860px) rotate(540deg);opacity:.9}}
@keyframes kxUpA{0%{transform:translateY(0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translateY(-640px) scale(1.3);opacity:0}}
@keyframes kxUpB{0%{transform:translateY(0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translateY(-640px) scale(1.3);opacity:0}}
@keyframes kxMenu{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
@keyframes kxBub{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes kxBub2{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes kxWig{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes kxDim{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(135deg, #6A4C9C, #C0443C); display: flex; align-items: center; justify-content: center; font-weight: 800">Л</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Лиза</div><div style="font-size: 12px; color: #8FD3AC">в сети</div></div>
  </header>

  <div style="flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
    <div style="align-self: flex-start; max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); font-size: 15px">Экзамен сдан!!! 🎓</div>
    <sc-for list="{{sent}}" as="m" hint-placeholder-count="0">
      <div style="align-self: flex-end; max-width: 78%; position: relative; padding: 8px 12px; border-radius: 18px 18px 6px 18px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; animation: kxBub .35s cubic-bezier(.2,.8,.2,1) both">{{m.text}}<span style="position: absolute; left: -10px; bottom: -6px; width: 24px; height: 24px; border-radius: 12px; background: #1B211E; border: 1px solid rgba(255,255,255,.12); display: {{m.show}}; align-items: center; justify-content: center; font-size: 13px">{{m.e}}</span></div>
    </sc-for>
  </div>

  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06); display: flex; gap: 8px; align-items: center">
    <div style="flex: 1; min-height: 48px; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,.07); display: flex; align-items: center; font-size: 15px">{{draft}}</div>
    <button onClick="{{toggleMenu}}" aria-label="Выбрать эффект" style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,.07); color: {{fxInk}}; display: flex; align-items: center; justify-content: center; font-size: 22px">{{fxBtn}}</button>
    <button onClick="{{send}}" aria-label="Отправить" style="width: 48px; height: 48px; border-radius: 24px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">send</span></button>
  </div>

  <sc-if value="{{menu}}" hint-placeholder-val="{{true}}">
    <button onClick="{{toggleMenu}}" aria-label="Закрыть" style="position: absolute; inset: 0; background: rgba(0,0,0,.45); animation: kxDim .2s ease both"></button>
    <div style="position: absolute; right: 12px; bottom: 80px; width: 250px; padding: 12px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.07)); backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 16px 40px rgba(0,0,0,.5); animation: kxMenu .25s cubic-bezier(.2,.8,.2,1) both; transform-origin: bottom right">
      <div style="font-size: 13px; font-weight: 800; color: #C9D2CC; padding: 0 4px 8px; display: flex; align-items: center; gap: 8px">Отправить с эффектом<span style="font-size: 11px; font-weight: 600; color: #8A958F">часть эффектов — с Premium</span></div>
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px">
        <sc-for list="{{fx}}" as="f" hint-placeholder-count="8"><button onClick="{{f.tap}}" aria-label="{{f.name}}" aria-pressed="{{f.on}}" style="height: 52px; border-radius: 16px; background: {{f.bg}}; border: 1.5px solid {{f.bd}}; display: flex; align-items: center; justify-content: center; font-size: 26px"><span style="display: inline-block; animation: {{f.wig}}">{{f.e}}</span></button></sc-for>
      </div>
      <div style="margin-top: 10px; min-height: 36px; padding: 0 4px; display: flex; align-items: center; gap: 8px">
        <span style="flex: 1; font-size: 13px; font-weight: 700">{{fxName}}</span>
        <button onClick="{{preview}}" style="height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(143,211,172,.14); color: #8FD3AC; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 4px"><span class="ms fill" style="font-size: 16px" aria-hidden="true">play_arrow</span>Превью</button>
      </div>
    </div>
  </sc-if>

  <!-- Particles -->
  <div style="position: absolute; inset: 0; pointer-events: none; overflow: hidden" aria-hidden="true">
    <sc-for list="{{parts}}" as="p" hint-placeholder-count="0"><span style="position: absolute; left: {{p.x}}; top: {{p.y}}; font-size: {{p.sz}}; animation: {{p.anim}}">{{p.e}}</span></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const FX = [
  ['🎉', 'Конфетти', 'down', ['🎊', '🎉', '✨', '🟩', '🟨']],
  ['❤️', 'Сердечки', 'up', ['❤️', '💚', '💖']],
  ['🔥', 'Огонь', 'up', ['🔥', '🔥', '✨']],
  ['👍', 'Класс', 'up', ['👍', '👍', '✨']],
  ['🎈', 'Шарики', 'up', ['🎈', '🎈', '🎈']],
  ['❄️', 'Снегопад', 'down', ['❄️', '❄️', '✨']],
  ['⭐', 'Звездопад', 'down', ['⭐', '🌟', '✨']],
  ['😂', 'Смех', 'up', ['😂', '🤣', '😆']]
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { menu: true, fx: 0, run: -1, rk: 0, sent: [], bk: 0 }; }
componentWillUnmount() { clearTimeout(this.tr); }
play(i) { clearTimeout(this.tr); this.setState({ run: i, rk: this.state.rk + 1 }); this.tr = setTimeout(() => this.setState({ run: -1 }), 3400); }
renderVals() {
  const s = this.state;
  const f = FX[s.fx];
  const parts = [];
  if (s.run >= 0) {
    const r = FX[s.run];
    const up = r[2] === 'up';
    for (let i = 0; i < 26; i++) {
      const x = ((i * 37) % 100);
      parts.push({ e: r[3][i % r[3].length], x: x + '%', y: up ? (760 + (i % 4) * 20) + 'px' : '0px', sz: (18 + (i * 7) % 16) + 'px',
        anim: (up ? (s.rk % 2 ? 'kxUpB' : 'kxUpA') : (s.rk % 2 ? 'kxDownB' : 'kxDownA')) + ' ' + (2 + (i % 5) * 0.25) + 's ' + (up ? 'ease-out' : 'linear') + ' ' + ((i % 9) * 0.12) + 's both' });
    }
  }
  return {
    menu: s.menu,
    draft: s.sent.length ? 'Сообщение' : 'Поздравляю!!! 🥳',
    fxBtn: s.fx >= 0 ? f[0] : '✨', fxInk: '#EEF3EF',
    fx: FX.map(([e, name], i) => { const on = s.fx === i; return { e, name, on: on ? 'true' : 'false', bg: on ? 'rgba(143,211,172,.18)' : 'rgba(0,0,0,.18)', bd: on ? '#8FD3AC' : 'transparent', wig: on ? 'kxWig .6s ease 2' : 'none', tap: () => { this.setState({ fx: i }); this.play(i); } }; }),
    fxName: f[1],
    preview: () => this.play(s.fx),
    toggleMenu: () => this.setState({ menu: !s.menu }),
    send: () => { const text = s.sent.length ? 'Горжусь тобой! 💚' : 'Поздравляю!!! 🥳'; this.setState({ menu: false, sent: [...s.sent, { text, e: f[0] }] }); this.play(s.fx); },
    sent: s.sent.map(m => ({ ...m, show: 'flex' })),
    parts
  };
}
}
</script>
</body>
</html>
