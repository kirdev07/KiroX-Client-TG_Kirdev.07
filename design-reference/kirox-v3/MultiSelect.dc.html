<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выбор сообщений</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kxCheck{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes kxPoof{0%{opacity:1;transform:none;max-height:120px}60%{opacity:0;transform:scale(.85);filter:blur(4px)}100%{opacity:0;max-height:0;margin:0;padding:0}}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <!-- Header switches -->
  <sc-if value="{{notSel}}" hint-placeholder-val="{{false}}">
    <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
      <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
      <span style="width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(135deg, #C0443C, #6A4C9C); display: flex; align-items: center; justify-content: center; font-weight: 800">А</span>
      <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Анна</div><div style="font-size: 12px; color: #8FD3AC">в сети</div></div>
      <button onClick="{{startSel}}" style="height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(255,255,255,.06); font-size: 13px; font-weight: 700">Выбрать</button>
    </header>
  </sc-if>
  <sc-if value="{{selMode}}" hint-placeholder-val="{{true}}">
    <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(143,211,172,.2); background: rgba(143,211,172,.06); animation: kxFade .2s ease both">
      <button onClick="{{endSel}}" aria-label="Закончить выбор" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">close</span></button>
      <div style="flex: 1; font-size: 18px; font-weight: 800">{{selTitle}}</div>
      <button onClick="{{selAll}}" style="height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 700">{{selAllText}}</button>
    </header>
  </sc-if>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="9">
      <button onClick="{{m.tap}}" aria-label="{{m.label}}" aria-pressed="{{m.on}}" style="display: flex; align-items: flex-end; gap: 8px; padding: 4px 6px; border-radius: 16px; background: {{m.rowBg}}; overflow: hidden; animation: {{m.anim}}; transition: background .15s">
        <span style="width: {{m.chkW}}; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: width .2s; overflow: hidden">
          <span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{m.ring}}; background: {{m.fill}}; color: #06150D; display: flex; align-items: center; justify-content: center"><sc-if value="{{m.on}}" hint-placeholder-val="{{false}}"><span class="ms" style="font-size: 16px; animation: kxCheck .2s ease both" aria-hidden="true">check</span></sc-if></span>
        </span>
        <span style="flex: 1; display: flex; justify-content: {{m.just}}">
          <span style="max-width: 82%; padding: 8px 12px; border-radius: {{m.r}}; background: {{m.bg}}; color: {{m.ink}}; font-size: 14px; line-height: 1.35">{{m.t}} <span style="font-size: 11px; opacity: .6">{{m.time}}</span></span>
        </span>
      </button>
    </sc-for>
  </div>

  <!-- Action bar -->
  <sc-if value="{{selMode}}" hint-placeholder-val="{{true}}">
    <div style="padding: 10px 12px 18px; border-top: 1px solid rgba(255,255,255,.06); display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; animation: kxIn .2s ease both">
      <sc-for list="{{acts}}" as="a" hint-placeholder-count="4"><button onClick="{{a.tap}}" style="height: 60px; border-radius: 18px; background: {{a.bg}}; color: {{a.ink}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; opacity: {{a.op}}"><span class="ms" aria-hidden="true">{{a.icon}}</span>{{a.label}}</button></sc-for>
    </div>
  </sc-if>
  <sc-if value="{{notSel}}" hint-placeholder-val="{{false}}">
    <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06)"><div style="height: 48px; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,.07); display: flex; align-items: center; font-size: 15px; color: #8A958F">Сообщение</div></div>
  </sc-if>

  <!-- Delete sheet -->
  <sc-if value="{{confirm}}" hint-placeholder-val="{{false}}">
    <button onClick="{{closeConfirm}}" aria-label="Закрыть" style="position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: kxFade .2s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 22px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, rgba(40,48,44,.97), rgba(18,22,20,.99)); border-top: 1px solid rgba(255,255,255,.16); animation: kxSheet .3s cubic-bezier(.2,.8,.2,1) both">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 0 auto 16px"></div>
      <div style="font-size: 19px; font-weight: 800">Удалить {{delCount}}?</div>
      <button onClick="{{toggleAll}}" style="margin-top: 14px; width: 100%; padding: 12px 0; display: flex; align-items: center; gap: 12px; opacity: {{forAllOp}}">
        <span style="width: 24px; height: 24px; border-radius: 7px; border: 2px solid {{faBd}}; background: {{faBg}}; color: #fff; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px; opacity: {{faChk}}" aria-hidden="true">check</span></span>
        <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Также удалить у: Анна</span><span style="display: block; font-size: 12px; color: #8A958F">{{faSub}}</span></span>
      </button>
      <div style="margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
        <button onClick="{{closeConfirm}}" style="height: 50px; border-radius: 25px; background: rgba(255,255,255,.08); font-size: 15px; font-weight: 700; text-align: center">Отмена</button>
        <button onClick="{{doDelete}}" style="height: 50px; border-radius: 25px; background: #E5534B; color: #fff; font-size: 15px; font-weight: 800; text-align: center">Удалить</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 100px; padding: 12px 18px; border-radius: 18px; background: #232A26; border: 1px solid rgba(255,255,255,.16); font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2.4s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">{{toastIcon}}</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const PL = (n, a, b, c) => { const m = Math.abs(n) % 100, d = m % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d >= 2 && d <= 4 ? b : c; };

const M = [
  ['Привет! Есть планы на субботу?', 0, '10:02'], ['Пока нет, а что?', 1, '10:05'], ['Хотим на каток, потом в кафе', 0, '10:06'],
  ['Звучит отлично 👍', 1, '10:07'], ['Адрес катка: Медеу, касса №2', 0, '10:08'], ['Сбор в 11:00 у входа', 0, '10:08'],
  ['Возьму термос с чаем', 1, '10:10'], ['Ой, не тот чат 🙈', 1, '10:11'], ['Ахах, бывает', 0, '10:12']
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sel: true, on: { 7: true }, gone: {}, leaving: {}, confirm: false, forAll: true, toast: 0, toastText: '', toastIcon: 'done' }; }
componentWillUnmount() { clearTimeout(this.tl); clearTimeout(this.tt); }
toastMsg(text, icon) { clearTimeout(this.tt); this.setState({ toast: this.state.toast + 1, toastText: text, toastIcon: icon }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2400); }
renderVals() {
  const s = this.state;
  const vis = M.map((m, i) => ({ m, i })).filter(({ i }) => !s.gone[i]);
  const ids = vis.filter(({ i }) => s.on[i]).map(({ i }) => i);
  const n = ids.length;
  const allMine = ids.every(i => M[i][1] === 1);
  const word = k => PL(k, 'сообщение', 'сообщения', 'сообщений');
  return {
    selMode: s.sel, notSel: !s.sel,
    startSel: () => this.setState({ sel: true, on: {} }), endSel: () => this.setState({ sel: false, on: {} }),
    selTitle: n ? 'Выбрано: ' + n : 'Выберите сообщения',
    selAll: () => { const o = {}; if (n < vis.length) vis.forEach(({ i }) => o[i] = true); this.setState({ on: o }); }, selAllText: n < vis.length ? 'Все' : 'Снять',
    msgs: vis.map(({ m, i }) => { const on = !!s.on[i]; const me = m[1] === 1; return {
      t: m[0], time: m[2], on, just: me ? 'flex-end' : 'flex-start',
      r: me ? '16px 16px 6px 16px' : '16px 16px 16px 6px', bg: me ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.08)', ink: me ? '#06150D' : '#EEF3EF',
      rowBg: on ? 'rgba(143,211,172,.12)' : 'transparent', chkW: s.sel ? '28px' : '0px', ring: on ? '#8FD3AC' : 'rgba(255,255,255,.35)', fill: on ? '#8FD3AC' : 'transparent',
      anim: s.leaving[i] ? 'kxPoof .45s ease both' : 'none', label: m[0] + (on ? ', выбрано' : ''),
      tap: () => s.sel ? this.setState({ on: { ...s.on, [i]: !on } }) : this.setState({ sel: true, on: { [i]: true } })
    }; }),
    acts: [
      { icon: 'content_copy', label: 'Копировать', tap: () => n && this.toastMsg('Скопировано ' + n + ' ' + word(n), 'content_copy') },
      { icon: 'forward', label: 'Переслать', tap: () => n && this.toastMsg('Выберите, кому переслать', 'forward') },
      { icon: 'bookmark', label: 'В Избранное', tap: () => n && this.toastMsg('Сохранено в Избранное', 'bookmark') },
      { icon: 'delete', label: 'Удалить', danger: true, tap: () => n && this.setState({ confirm: true, forAll: allMine }) }
    ].map(a => ({ ...a, op: n ? '1' : '.4', bg: a.danger ? 'rgba(229,83,75,.12)' : 'rgba(255,255,255,.06)', ink: a.danger ? '#FF8A80' : '#EEF3EF' })),
    confirm: s.confirm, closeConfirm: () => this.setState({ confirm: false }),
    delCount: n + ' ' + word(n),
    toggleAll: () => allMine && this.setState({ forAll: !s.forAll }), forAllOp: allMine ? '1' : '.45',
    faBd: s.forAll && allMine ? '#E5534B' : 'rgba(255,255,255,.3)', faBg: s.forAll && allMine ? '#E5534B' : 'transparent', faChk: s.forAll && allMine ? '1' : '0',
    faSub: allMine ? 'Сообщения исчезнут из чата у обоих' : 'Чужие сообщения удалятся только у вас',
    doDelete: () => {
      const leaving = {}; ids.forEach(i => leaving[i] = true);
      this.setState({ confirm: false, leaving });
      clearTimeout(this.tl);
      this.tl = setTimeout(() => { const gone = { ...this.state.gone }; ids.forEach(i => gone[i] = true); this.setState({ gone, leaving: {}, on: {}, sel: false }); this.toastMsg('Удалено ' + n + ' ' + word(n) + (s.forAll && allMine ? ' у обоих' : ''), 'delete'); }, 460);
    },
    toast: s.toast > 0, toastText: s.toastText, toastIcon: s.toastIcon
  };
}
}
</script>
</body>
</html>
