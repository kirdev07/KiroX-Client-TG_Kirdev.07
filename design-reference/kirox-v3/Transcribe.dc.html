<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Расшифровка голосовых</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxShimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes kxIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes kxBar{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,16px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,16px)}}
@keyframes kxToast2{0%{opacity:0;transform:translate(-50%,16px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,16px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: #B07A2E; display: flex; align-items: center; justify-content: center; font-weight: 800">М</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Мама</div><div style="font-size: 12px; color: #8FD3AC">в сети</div></div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="align-self: center; padding: 3px 10px; border-radius: 10px; background: rgba(255,255,255,.06); font-size: 11px; font-weight: 700; color: #9AA59F">Сегодня</div>
    <sc-for list="{{voices}}" as="v" hint-placeholder-count="3">
      <div style="align-self: {{v.side}}; width: 284px; padding: 10px 12px; border-radius: {{v.rad}}; background: {{v.bg}}; color: {{v.ink}}">
        <div style="display: flex; align-items: center; gap: 10px">
          <button onClick="{{v.play}}" aria-label="{{v.playLabel}}" style="width: 40px; height: 40px; border-radius: 20px; background: {{v.pbg}}; color: {{v.pink}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms fill" aria-hidden="true">{{v.pIcon}}</span></button>
          <span style="flex: 1; height: 28px; display: flex; align-items: center; gap: 2px" aria-hidden="true"><span style="flex: 1; height: 8px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.00s"></span><span style="flex: 1; height: 14px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.08s"></span><span style="flex: 1; height: 20px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.16s"></span><span style="flex: 1; height: 12px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.24s"></span><span style="flex: 1; height: 24px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.32s"></span><span style="flex: 1; height: 18px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.00s"></span><span style="flex: 1; height: 10px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.08s"></span><span style="flex: 1; height: 22px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.16s"></span><span style="flex: 1; height: 26px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.24s"></span><span style="flex: 1; height: 16px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.32s"></span><span style="flex: 1; height: 12px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.00s"></span><span style="flex: 1; height: 20px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.08s"></span><span style="flex: 1; height: 24px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.16s"></span><span style="flex: 1; height: 14px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.24s"></span><span style="flex: 1; height: 8px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.32s"></span><span style="flex: 1; height: 18px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.00s"></span><span style="flex: 1; height: 22px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.08s"></span><span style="flex: 1; height: 12px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.16s"></span><span style="flex: 1; height: 16px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.24s"></span><span style="flex: 1; height: 26px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.32s"></span><span style="flex: 1; height: 20px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.00s"></span><span style="flex: 1; height: 10px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.08s"></span><span style="flex: 1; height: 14px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.16s"></span><span style="flex: 1; height: 22px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.24s"></span><span style="flex: 1; height: 18px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.32s"></span><span style="flex: 1; height: 12px; border-radius: 2px; background: {{v.barC}}; animation: {{v.barAnim}}; animation-delay: 0.00s"></span></span>
          <button onClick="{{v.tr}}" aria-label="{{v.trLabel}}" aria-expanded="{{v.open}}" style="width: 36px; height: 36px; border-radius: 12px; background: {{v.tbg}}; color: {{v.tink}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; flex-shrink: 0">{{v.trIcon}}</button>
        </div>
        <div style="margin-top: 4px; display: flex; font-size: 11px; opacity: .75"><span style="flex: 1">{{v.dur}}</span><span>{{v.t}}</span></div>
        <sc-if value="{{v.loading}}" hint-placeholder-val="{{false}}">
          <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px" aria-label="Расшифровываем">
            <span style="height: 10px; border-radius: 5px; width: 92%; background: linear-gradient(90deg, rgba(255,255,255,.06) 0, rgba(255,255,255,.22) 50%, rgba(255,255,255,.06) 100%); background-size: 200px 100%; animation: kxShimmer 1.1s linear infinite"></span>
            <span style="height: 10px; border-radius: 5px; width: 70%; background: linear-gradient(90deg, rgba(255,255,255,.06) 0, rgba(255,255,255,.22) 50%, rgba(255,255,255,.06) 100%); background-size: 200px 100%; animation: kxShimmer 1.1s linear .15s infinite"></span>
          </div>
        </sc-if>
        <sc-if value="{{v.shown}}" hint-placeholder-val="{{false}}">
          <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid {{v.line}}; font-size: 14px; line-height: 1.45; animation: kxIn .25s ease both">{{v.text}}<span style="opacity: .5">{{v.rest}}</span></div>
          <sc-if value="{{v.full}}" hint-placeholder-val="{{false}}">
            <div style="margin-top: 8px; display: flex; align-items: center; gap: 4px; animation: kxIn .25s ease both">
              <button onClick="{{v.copy}}" aria-label="Скопировать текст" style="height: 30px; padding: 0 10px; border-radius: 15px; background: {{v.chip}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px"><span class="ms" style="font-size: 16px" aria-hidden="true">content_copy</span>Копировать</button>
              <button onClick="{{v.translate}}" style="height: 30px; padding: 0 10px; border-radius: 15px; background: {{v.chip}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px"><span class="ms" style="font-size: 16px" aria-hidden="true">translate</span>{{v.trBtn}}</button>
              <span style="flex: 1"></span>
              <button onClick="{{v.good}}" aria-label="Хорошая расшифровка" aria-pressed="{{v.goodOn}}" style="width: 30px; height: 30px; border-radius: 15px; background: {{v.goodBg}}; display: flex; align-items: center; justify-content: center"><span class="{{v.goodFill}}" style="font-size: 16px" aria-hidden="true">thumb_up</span></button>
              <button onClick="{{v.bad}}" aria-label="Плохая расшифровка" aria-pressed="{{v.badOn}}" style="width: 30px; height: 30px; border-radius: 15px; background: {{v.badBg}}; display: flex; align-items: center; justify-content: center"><span class="{{v.badFill}}" style="font-size: 16px" aria-hidden="true">thumb_down</span></button>
            </div>
          </sc-if>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06)">
    <button onClick="{{toggleAuto}}" role="switch" aria-checked="{{autoOn}}" style="width: 100%; min-height: 52px; padding: 0 4px; display: flex; align-items: center; gap: 12px"><span class="ms" style="color: #9AA59F" aria-hidden="true">subtitles</span><span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 700">Расшифровывать сразу</span><span style="display: block; font-size: 12px; color: #9AA59F">Текст появится под каждым новым голосовым</span></span><span style="width: 46px; height: 28px; border-radius: 14px; background: {{trk}}; position: relative; transition: background .2s; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{knx}}; width: 22px; height: 22px; border-radius: 11px; background: {{knc}}; transition: left .2s"></span></span></button>
    <div style="margin-top: 4px; padding: 0 4px; font-size: 12px; color: #9AA59F; display: flex; align-items: center; gap: 6px"><span style="height: 18px; padding: 0 6px; border-radius: 9px; background: rgba(201,160,224,.18); color: #C9A0E0; font-size: 11px; font-weight: 800; line-height: 18px">PREMIUM</span>Без Premium Telegram даёт лишь несколько расшифровок в неделю.</div>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 96px; padding: 12px 16px; border-radius: 18px; background: rgba(40,48,44,.96); border: 1px solid rgba(255,255,255,.12); font-size: 13px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: {{toastAnim}}"><span class="ms fill" style="font-size: 18px; color: #8FD3AC" aria-hidden="true">check_circle</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const V = [
  { mine: false, dur: '0:24', t: '12:05', ru: 'Привет! Я на рынке, тут хорошая клубника. Взять тебе пару килограммов или уже есть? Ещё напомни, во сколько завтра приезжаешь.', en: 'Hi! I am at the market, the strawberries are good. Should I get you a couple of kilos or do you have some? Also remind me what time you arrive tomorrow.' },
  { mine: true, dur: '0:09', t: '12:07', ru: 'Возьми, спасибо! Приезжаю к шести, поезд в 17:40.', en: 'Get some, thanks! I arrive around six, the train is at 17:40.' },
  { mine: false, dur: '0:13', t: '12:08', ru: 'Хорошо, встречу на вокзале. Оденься потеплее, обещают дождь.', en: 'Okay, I will meet you at the station. Dress warmer, rain is expected.' }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { st: {}, words: {}, en: {}, rate: {}, playing: -1, auto: false, toast: '', tk: 0 }; }
componentWillUnmount() { Object.values(this.timers || {}).forEach(clearInterval); clearTimeout(this.tt); clearTimeout(this.tp); }
start(i) {
  this.timers = this.timers || {};
  this.setState({ st: { ...this.state.st, [i]: 'load' }, words: { ...this.state.words, [i]: 0 } });
  setTimeout(() => {
    this.setState({ st: { ...this.state.st, [i]: 'show' } });
    clearInterval(this.timers[i]);
    this.timers[i] = setInterval(() => {
      const s = this.state; const n = V[i].ru.split(' ').length; const w = (s.words[i] || 0) + 2;
      if (w >= n) { clearInterval(this.timers[i]); this.setState({ words: { ...s.words, [i]: n } }); }
      else this.setState({ words: { ...s.words, [i]: w } });
    }, 90);
  }, 1100);
}
renderVals() {
  const s = this.state;
  const say = (t) => { clearTimeout(this.tt); this.setState({ toast: t, tk: s.tk + 1 }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2000); };
  return {
    voices: V.map((v, i) => {
      const st = s.st[i]; const open = st === 'load' || st === 'show';
      const src = s.en[i] ? v.en : v.ru; const all = src.split(' ');
      const n = s.en[i] ? all.length : (s.words[i] || 0);
      const full = st === 'show' && n >= all.length;
      const me = v.mine; const pl = s.playing === i; const r = s.rate[i];
      return {
        side: me ? 'flex-end' : 'flex-start', rad: me ? '20px 20px 6px 20px' : '20px 20px 20px 6px',
        bg: me ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.07)', ink: me ? '#06150D' : '#EEF3EF',
        pbg: me ? 'rgba(6,21,13,.18)' : 'rgba(143,211,172,.16)', pink: me ? '#06150D' : '#8FD3AC', pIcon: pl ? 'pause' : 'play_arrow', playLabel: pl ? 'Пауза' : 'Слушать',
        play: () => { clearTimeout(this.tp); if (pl) this.setState({ playing: -1 }); else { this.setState({ playing: i }); this.tp = setTimeout(() => this.setState({ playing: -1 }), 3000); } },
        barC: me ? 'rgba(6,21,13,.45)' : 'rgba(143,211,172,.55)', barAnim: pl ? 'kxBar .6s ease-in-out infinite' : 'none',
        tbg: open ? (me ? 'rgba(6,21,13,.25)' : 'rgba(143,211,172,.22)') : (me ? 'rgba(6,21,13,.12)' : 'rgba(255,255,255,.08)'), tink: me ? '#06150D' : '#8FD3AC',
        trIcon: open ? '▴' : '→A', trLabel: open ? 'Скрыть текст' : 'Расшифровать', open: open ? 'true' : 'false',
        tr: () => open ? this.setState({ st: { ...s.st, [i]: 'closed' } }) : (s.words[i] >= V[i].ru.split(' ').length ? this.setState({ st: { ...s.st, [i]: 'show' } }) : this.start(i)),
        dur: v.dur, t: v.t,
        loading: st === 'load', shown: st === 'show',
        text: all.slice(0, n).join(' '), rest: full ? '' : ' ▍',
        line: me ? 'rgba(6,21,13,.15)' : 'rgba(255,255,255,.08)',
        full, chip: me ? 'rgba(6,21,13,.12)' : 'rgba(255,255,255,.07)',
        copy: () => say('Текст скопирован'),
        trBtn: s.en[i] ? 'Оригинал' : 'На английский', translate: () => this.setState({ en: { ...s.en, [i]: !s.en[i] } }),
        goodOn: r === 1 ? 'true' : 'false', badOn: r === -1 ? 'true' : 'false',
        goodBg: r === 1 ? (me ? 'rgba(6,21,13,.25)' : 'rgba(143,211,172,.22)') : 'transparent', badBg: r === -1 ? (me ? 'rgba(6,21,13,.25)' : 'rgba(255,138,128,.2)') : 'transparent',
        goodFill: r === 1 ? 'ms fill' : 'ms', badFill: r === -1 ? 'ms fill' : 'ms',
        good: () => { this.setState({ rate: { ...s.rate, [i]: 1 } }); say('Спасибо за оценку'); },
        bad: () => { this.setState({ rate: { ...s.rate, [i]: -1 } }); say('Учтём, чтобы расшифровка была точнее'); }
      };
    }),
    toggleAuto: () => { const on = !s.auto; this.setState({ auto: on }); if (on) V.forEach((_, i) => { if (s.st[i] !== 'show') this.start(i); }); },
    autoOn: s.auto ? 'true' : 'false',
    trk: s.auto ? '#3F9A6C' : 'rgba(255,255,255,.14)', knc: s.auto ? '#EEF3EF' : '#9AA59F', knx: s.auto ? '21px' : '3px',
    toast: !!s.toast, toastText: s.toast, toastAnim: (s.tk % 2 ? 'kxToast2' : 'kxToast') + ' 2s ease both'
  };
}
}
</script>
</body>
</html>
