<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новый вход</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
@keyframes kxDrop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
@keyframes kxPing{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
@keyframes kxShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes kxCut{0%{width:0}100%{width:100%}}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kxPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 14px 16px 8px; display: flex; align-items: center"><span style="flex: 1; font-size: 26px; font-weight: 800">Чаты</span><span class="ms" style="color: #9AA59F" aria-hidden="true">search</span></div>

  <!-- Alert card -->
  <sc-if value="{{ask}}" hint-placeholder-val="{{true}}">
    <div style="margin: 4px 12px 8px; padding: 14px; border-radius: 24px; background: linear-gradient(180deg, rgba(232,176,74,.14), rgba(232,176,74,.05)); border: 1px solid rgba(232,176,74,.35); animation: kxDrop .4s cubic-bezier(.2,.8,.2,1) both">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 40px; height: 40px; border-radius: 14px; background: rgba(232,176,74,.18); color: #E8B04A; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="animation: kxShake 1.2s ease .4s 2" aria-hidden="true">notifications_active</span></span>
        <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Новый вход в аккаунт</div><div style="font-size: 12px; color: #C9D2CC">{{ago}}</div></div>
      </div>
      <div style="margin-top: 12px; display: flex; gap: 12px; align-items: stretch">
        <div style="position: relative; width: 96px; height: 96px; border-radius: 18px; overflow: hidden; background: radial-gradient(circle at 30% 40%, rgba(143,211,172,.14), transparent 60%), repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 14px), repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 14px), #101614; flex-shrink: 0" aria-hidden="true">
          <span style="position: absolute; left: 44px; top: 44px; width: 10px; height: 10px; border-radius: 5px; background: #E8B04A"></span>
          <span style="position: absolute; left: 44px; top: 44px; width: 10px; height: 10px; border-radius: 5px; border: 2px solid #E8B04A; box-sizing: border-box; animation: kxPing 1.6s ease-out infinite"></span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
          <sc-for list="{{facts}}" as="f" hint-placeholder-count="4"><div style="display: flex; align-items: center; gap: 8px"><span class="ms" style="font-size: 17px; color: #9AA59F" aria-hidden="true">{{f.i}}</span><span style="color: #EEF3EF; font-weight: 600">{{f.t}}</span></div></sc-for>
        </div>
      </div>
      <div style="margin-top: 10px; font-size: 12px; color: #9AA59F; line-height: 1.4">Место примерное — определено по IP-адресу.</div>
      <div style="margin-top: 12px; display: flex; gap: 8px">
        <button onClick="{{notMe}}" style="flex: 1; height: 48px; border-radius: 24px; background: #E5534B; color: #fff; font-size: 15px; font-weight: 800; text-align: center">Это не я</button>
        <button onClick="{{itsMe}}" style="flex: 1; height: 48px; border-radius: 24px; background: rgba(255,255,255,.1); font-size: 15px; font-weight: 700; text-align: center">Это я</button>
      </div>
    </div>
  </sc-if>

  <!-- Me: small confirmation -->
  <sc-if value="{{okMe}}" hint-placeholder-val="{{false}}">
    <div style="margin: 4px 12px 8px; height: 52px; padding: 0 12px; border-radius: 18px; background: rgba(143,211,172,.1); border: 1px solid rgba(143,211,172,.3); display: flex; align-items: center; gap: 10px; animation: kxIn .3s ease both">
      <span class="ms fill" style="color: #8FD3AC" aria-hidden="true">verified_user</span>
      <span style="flex: 1; font-size: 13px; font-weight: 700">Отлично, вход подтверждён</span>
      <button onClick="{{reset}}" style="height: 36px; padding: 0 10px; border-radius: 18px; font-size: 12px; font-weight: 700; color: #8FD3AC">Ещё раз</button>
    </div>
  </sc-if>

  <!-- Chat list -->
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 12px; opacity: {{listOp}}; transition: opacity .3s">
    <sc-for list="{{chats}}" as="c" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
        <span style="width: 50px; height: 50px; border-radius: 25px; background: {{c.c}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px">{{c.l}}</span>
        <span style="flex: 1; min-width: 0"><span style="display: flex"><span style="flex: 1; font-size: 15px; font-weight: 700">{{c.name}}</span><span style="font-size: 12px; color: #8A958F">{{c.t}}</span></span><span style="display: block; font-size: 13px; color: #9AA59F; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{c.msg}}</span></span>
      </div>
    </sc-for>
  </div>

  <!-- Not me: full sheet -->
  <sc-if value="{{secure}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(0,0,0,.6)"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 18px 24px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, rgba(40,48,44,.99), rgba(18,22,20,1)); border-top: 1px solid rgba(255,255,255,.16); animation: kxIn .35s ease both">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center">
        <span style="width: 80px; height: 80px; border-radius: 28px; background: {{shieldBg}}; color: {{shieldInk}}; display: flex; align-items: center; justify-content: center; animation: kxPop .5s ease both; transition: background .3s"><span class="ms fill" style="font-size: 42px" aria-hidden="true">{{shieldIcon}}</span></span>
        <div style="margin-top: 12px; font-size: 20px; font-weight: 800">{{secTitle}}</div>
        <div style="margin-top: 4px; font-size: 13px; color: #9AA59F">{{secSub}}</div>
      </div>
      <div style="margin-top: 12px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden"><span style="display: block; height: 100%; background: linear-gradient(90deg, #6FC497, #3F9A6C); animation: kxCut 1.4s ease both"></span></div>
      <div style="margin-top: 14px; font-size: 13px; font-weight: 700; color: #8FD3AC">Защитите аккаунт</div>
      <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{steps}}" as="st" hint-placeholder-count="3"><button onClick="{{st.tap}}" style="padding: 12px 14px; border-radius: 18px; background: rgba(255,255,255,.05); display: flex; align-items: center; gap: 12px; animation: kxIn .3s ease {{st.d}} both"><span class="ms fill" style="color: {{st.c}}" aria-hidden="true">{{st.i}}</span><span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 800; text-decoration: {{st.dec}}">{{st.t}}</span><span style="display: block; font-size: 12px; color: #9AA59F">{{st.s}}</span></span><span class="ms" style="font-size: 20px; color: {{st.c}}" aria-hidden="true">{{st.end}}</span></button></sc-for>
      </div>
      <button onClick="{{reset}}" style="margin-top: 14px; width: 100%; height: 52px; border-radius: 26px; background: rgba(255,255,255,.08); font-size: 15px; font-weight: 700; text-align: center">Готово</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CH = [['Анна', 'А', '#C0443C', 'До завтра 👋', '19:40'], ['Семья', 'С', '#2F6E9E', 'Мама: фото с дачи', '18:20'], ['Kotlin-клуб', 'K', '#3F9A6C', 'Дмитрий: PR готов', '17:40'], ['Лиза', 'Л', '#6A4C9C', 'Сюрприз готов 🎁', '15:30'], ['Работа', 'Р', '#5C6661', 'Созвон в понедельник', 'вчера'], ['Олег', 'О', '#9AA59F', 'Ок', 'вчера']];
const ST = [
  ['password', 'Сменить облачный пароль', 'Старый пароль перестанет работать'],
  ['devices', 'Проверить устройства', 'Завершите все сеансы, которые не узнаёте'],
  ['mail', 'Добавить почту для восстановления', 'Поможет вернуть доступ']
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 'ask', min: 2, done: {}, ending: true }; }
componentDidMount() { this.iv = setInterval(() => this.setState({ min: this.state.min + 1 }), 60000); }
componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.te); }
renderVals() {
  const s = this.state;
  return {
    ask: s.mode === 'ask', okMe: s.mode === 'me', secure: s.mode === 'no',
    ago: s.min + ' мин назад · проверьте, вы ли это',
    facts: [['computer', 'Windows · kiroX Desktop'], ['location_on', 'Алматы, Казахстан'], ['schedule', 'Сегодня в 19:52'], ['lan', 'IP 95.56.•••.•••']].map(([i, t]) => ({ i, t })),
    listOp: s.mode === 'no' ? .4 : 1,
    notMe: () => { this.setState({ mode: 'no', ending: true, done: {} }); clearTimeout(this.te); this.te = setTimeout(() => this.setState({ ending: false }), 1400); },
    itsMe: () => this.setState({ mode: 'me' }),
    shieldBg: s.ending ? 'rgba(232,176,74,.18)' : 'linear-gradient(135deg, #6FC497, #3F9A6C)', shieldInk: s.ending ? '#E8B04A' : '#06150D',
    shieldIcon: s.ending ? 'gpp_maybe' : 'gpp_good',
    secTitle: s.ending ? 'Завершаем чужой сеанс…' : 'Сеанс завершён',
    secSub: s.ending ? 'Windows · Алматы' : 'Это устройство больше не видит ваши чаты',
    steps: ST.map(([i, t, sub], k) => { const d = !!s.done[k]; return { i: d ? 'check_circle' : i, t, s: sub, c: d ? '#8FD3AC' : '#C9D2CC', dec: 'none', end: d ? 'done' : 'chevron_right', d: (0.6 + k * 0.08) + 's', tap: () => this.setState({ done: { ...s.done, [k]: true } }) }; }),
    chats: CH.map(([name, l, c, msg, t]) => ({ name, l, c, msg, t })),
    reset: () => this.setState({ mode: 'ask', min: 2, done: {} })
  };
}
}
</script>
</body>
</html>
