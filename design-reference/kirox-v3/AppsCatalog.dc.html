<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мини-приложения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94)}
input{font:inherit;color:inherit}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes kxOpen{0%{transform:scale(.3);border-radius:40px;opacity:.6}100%{transform:none;border-radius:0;opacity:1}}
@keyframes kxSpin{to{transform:rotate(360deg)}}
@keyframes kxSlide{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <label style="flex: 1; height: 44px; padding: 0 14px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 8px">
      <span class="ms" style="color: #9AA59F; font-size: 20px" aria-hidden="true">search</span>
      <input value="{{q}}" onInput="{{onQ}}" placeholder="Мини-приложения" aria-label="Поиск мини-приложений" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 15px">
    </label>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 6px 0 30px">
    <!-- Featured carousel -->
    <sc-if value="{{noQ}}" hint-placeholder-val="{{true}}">
      <div style="overflow: hidden; padding: 0 0 4px">
        <div style="display: flex; gap: 10px; width: max-content; padding-left: 16px; animation: kxSlide 24s linear 2">
          <sc-for list="{{featured}}" as="f" hint-placeholder-count="8">
            <button onClick="{{f.tap}}" style="width: 220px; height: 110px; border-radius: 22px; background: {{f.bg}}; padding: 14px; box-sizing: border-box; position: relative; overflow: hidden; flex-shrink: 0">
              <span class="ms fill" style="position: absolute; right: -6px; bottom: -10px; font-size: 80px; color: rgba(255,255,255,.18)" aria-hidden="true">{{f.icon}}</span>
              <span style="display: block; font-size: 11px; font-weight: 800; color: rgba(255,255,255,.75)">{{f.tag}}</span>
              <span style="display: block; margin-top: 6px; font-size: 17px; font-weight: 800">{{f.name}}</span>
              <span style="display: block; margin-top: 2px; font-size: 12px; color: rgba(255,255,255,.8)">{{f.sub}}</span>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <!-- Categories -->
    <div style="padding: 12px 16px 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><button onClick="{{c.tap}}" style="flex-shrink: 0; height: 34px; padding: 0 12px; border-radius: 17px; background: {{c.bg}}; color: {{c.ink}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px"><span class="ms" style="font-size: 16px" aria-hidden="true">{{c.icon}}</span>{{c.label}}</button></sc-for>
    </div>

    <!-- Recent -->
    <sc-if value="{{noQ}}" hint-placeholder-val="{{true}}">
      <div style="padding: 16px 16px 8px; font-size: 13px; font-weight: 700; color: #8FD3AC">Недавние</div>
      <div style="padding: 0 16px; display: flex; gap: 14px">
        <sc-for list="{{recent}}" as="r" hint-placeholder-count="4"><button onClick="{{r.tap}}" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 58px; height: 58px; border-radius: 18px; background: {{r.c}}; display: flex; align-items: center; justify-content: center; color: #fff"><span class="ms fill" style="font-size: 28px" aria-hidden="true">{{r.icon}}</span></span><span style="font-size: 11px; color: #C9D2CC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 64px">{{r.name}}</span></button></sc-for>
      </div>
    </sc-if>

    <!-- List -->
    <div style="padding: 16px 16px 8px; font-size: 13px; font-weight: 700; color: #8FD3AC">{{listTitle}}</div>
    <div style="padding: 0 12px">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="5">
        <div style="padding: 8px 6px; display: flex; align-items: center; gap: 12px; animation: kxIn .25s ease {{a.d}} both">
          <span style="width: 50px; height: 50px; border-radius: 15px; background: {{a.c}}; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0"><span class="ms fill" aria-hidden="true">{{a.icon}}</span></span>
          <span style="flex: 1; min-width: 0"><span style="display: flex; align-items: center; gap: 4px"><span style="font-size: 15px; font-weight: 700">{{a.name}}</span><sc-if value="{{a.verified}}" hint-placeholder-val="{{false}}"><span class="ms fill" style="font-size: 15px; color: #6FA9D8" aria-hidden="true">verified</span></sc-if></span><span style="display: block; font-size: 12px; color: #8A958F; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{a.sub}}</span></span>
          <button onClick="{{a.tap}}" style="height: 34px; padding: 0 14px; border-radius: 17px; background: rgba(143,211,172,.14); color: #8FD3AC; font-size: 13px; font-weight: 800">Открыть</button>
        </div>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div style="padding: 30px; text-align: center; font-size: 14px; color: #8A958F">Ничего не нашли</div></sc-if>
    </div>
  </div>

  <!-- Launch overlay -->
  <sc-if value="{{launching}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: {{lBg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; animation: kxOpen .4s cubic-bezier(.2,.8,.2,1) both">
      <span style="width: 88px; height: 88px; border-radius: 26px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; color: #fff"><span class="ms fill" style="font-size: 46px" aria-hidden="true">{{lIcon}}</span></span>
      <div style="font-size: 20px; font-weight: 800">{{lName}}</div>
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; animation: kxSpin .8s linear infinite" aria-hidden="true"></span>
      <button onClick="{{closeApp}}" style="position: absolute; left: 14px; top: 14px; height: 38px; padding: 0 14px; border-radius: 19px; background: rgba(0,0,0,.3); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px"><span class="ms" style="font-size: 18px" aria-hidden="true">close</span>Закрыть</button>
      <div style="position: absolute; bottom: 30px; font-size: 11px; color: rgba(255,255,255,.75)">Приложение не видит ваш номер без разрешения</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const APPS = [
  ['Такси Город', 'local_taxi', '#E8B04A', 'transport', 'Вызвать машину прямо из чата', true],
  ['Афиша', 'theater_comedy', '#C0443C', 'fun', 'Кино, концерты и билеты', true],
  ['Погода', 'partly_cloudy_day', '#2F6E9E', 'tools', 'Прогноз на 10 дней', false],
  ['Пицца рядом', 'local_pizza', '#B07A2E', 'food', 'Доставка за 30 минут', false],
  ['Словарик', 'translate', '#6A4C9C', 'tools', 'Переводчик и карточки слов', false],
  ['Шахматы', 'grid_on', '#3F9A6C', 'fun', 'Сыграйте с другом в чате', true],
  ['Кофейня «Зерно»', 'local_cafe', '#5C6661', 'food', 'Закажите заранее', false],
  ['Билеты на поезд', 'train', '#2F6E9E', 'transport', 'Расписание и места', true]
];
const CATS = [['Все', 'apps', 'all'], ['Еда', 'restaurant', 'food'], ['Развлечения', 'sports_esports', 'fun'], ['Транспорт', 'directions_car', 'transport'], ['Полезное', 'build', 'tools']];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { q: '', cat: 'all', open: -1 }; }
componentWillUnmount() { clearTimeout(this.to); }
launch(i) { this.setState({ open: i }); }
renderVals() {
  const s = this.state;
  const q = s.q.trim().toLowerCase();
  const list = APPS.map((a, i) => ({ a, i })).filter(({ a }) => (s.cat === 'all' || a[3] === s.cat) && (!q || (a[0] + ' ' + a[4]).toLowerCase().includes(q)));
  const o = s.open >= 0 ? APPS[s.open] : APPS[0];
  const feat = [0, 1, 5, 7];
  return {
    q: s.q, onQ: e => this.setState({ q: e.target.value }), noQ: !q,
    featured: [...feat, ...feat].map(i => ({ name: APPS[i][0], icon: APPS[i][1], sub: APPS[i][4], tag: 'Выбор kiroX', bg: 'linear-gradient(140deg, ' + APPS[i][2] + ', #0E1311)', tap: () => this.launch(i) })),
    cats: CATS.map(([label, icon, k]) => ({ label, icon, bg: s.cat === k ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.05)', ink: s.cat === k ? '#8FD3AC' : '#C9D2CC', tap: () => this.setState({ cat: k }) })),
    recent: [2, 4, 6, 3].map(i => ({ name: APPS[i][0], icon: APPS[i][1], c: APPS[i][2], tap: () => this.launch(i) })),
    listTitle: q ? 'Найдено: ' + list.length : 'Популярные',
    apps: list.map(({ a, i }, k) => ({ name: a[0], icon: a[1], c: a[2], sub: a[4], verified: a[5], d: (k * 0.03) + 's', tap: () => this.launch(i) })),
    empty: list.length === 0,
    launching: s.open >= 0, lBg: 'radial-gradient(80% 60% at 50% 40%, ' + o[2] + ', #0A0C0B 80%)', lIcon: o[1], lName: o[0],
    closeApp: () => this.setState({ open: -1 })
  };
}
}
</script>
</body>
</html>
