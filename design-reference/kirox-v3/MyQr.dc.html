<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мой QR-код</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
@keyframes kxFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes kxPop{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}
@keyframes kxToast{0%{opacity:0;transform:translateY(16px)}12%,85%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{bg}}; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; transition: background .5s">
  <!-- floating emoji pattern -->
  <sc-for list="{{floaters}}" as="f" hint-placeholder-count="10"><span aria-hidden="true" style="position: absolute; left: {{f.x}}; top: {{f.y}}; font-size: {{f.s}}; opacity: .22; animation: kxFloat {{f.dur}} ease-in-out {{f.d}} 2">{{f.e}}</span></sc-for>

  <header style="position: relative; padding: 10px 12px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="flex: 1; font-size: 18px; font-weight: 800">QR-код</span>
    <button onClick="{{toggleMode}}" aria-label="Сканировать" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">qr_code_scanner</span></button>
  </header>

  <!-- Card -->
  <div style="position: relative; margin: 54px auto 0; width: 290px; padding: 62px 22px 22px; box-sizing: border-box; border-radius: 34px; background: #F4F7F5; color: #0B110E; box-shadow: 0 30px 60px rgba(0,0,0,.45); text-align: center; animation: kxPop .45s cubic-bezier(.2,.9,.3,1) both">
    <span style="position: absolute; left: 50%; top: -46px; width: 92px; height: 92px; margin-left: -46px; border-radius: 46px; background: linear-gradient(140deg,#3F9A6C,#1F4D36); color: #DFF5E8; font-size: 34px; font-weight: 800; border: 5px solid #F4F7F5; display: flex; align-items: center; justify-content: center; box-sizing: border-box">АМ</span>
    <div style="display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); width: 210px; height: 210px; margin: 0 auto; position: relative">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="625"><span style="background: {{c}}; border-radius: 2px; transition: background .4s"></span></sc-for>
      <span style="position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 14px; background: {{ink}}; border: 4px solid #F4F7F5; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #F4F7F5; transition: background .4s"><span class="ms fill" style="font-size: 22px" aria-hidden="true">chat_bubble</span></span>
    </div>
    <div style="margin-top: 16px; font-size: 22px; font-weight: 800; color: {{ink}}; letter-spacing: .3px; transition: color .4s">@ALEX_M</div>
    <div style="margin-top: 4px; font-size: 13px; color: #5C6A63">Отсканируйте, чтобы написать мне в kiroX</div>
  </div>

  <!-- Theme strip -->
  <div style="position: absolute; left: 0; right: 0; bottom: 120px; padding: 0 16px">
    <div style="display: flex; gap: 10px; justify-content: center">
      <sc-for list="{{themes}}" as="t" hint-placeholder-count="6"><button onClick="{{t.pick}}" aria-label="{{t.label}}" style="width: 48px; height: 64px; border-radius: 16px; background: {{t.bg}}; box-shadow: {{t.ring}}; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; box-sizing: border-box; font-size: 18px; transition: box-shadow .2s">{{t.e}}</button></sc-for>
    </div>
  </div>

  <!-- Actions -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; gap: 8px">
    <button onClick="{{copy}}" style="flex: 1; height: 54px; border-radius: 18px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700"><span class="ms" aria-hidden="true">link</span>Ссылка</button>
    <button onClick="{{share}}" style="flex: 1.4; height: 54px; border-radius: 18px; background: #F4F7F5; color: #0B110E; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 800"><span class="ms" aria-hidden="true">ios_share</span>Поделиться кодом</button>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 24px; right: 24px; bottom: 100px; height: 46px; border-radius: 16px; background: #1E2622; border: 1px solid rgba(143,211,172,.25); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; animation: kxToast 2.2s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">check_circle</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TH = [
  ['Лес', 'linear-gradient(170deg,#2E6B4B 0%,#163828 60%,#0A0C0B 100%)', '#1F5A3E', '🌿'],
  ['Ночь', 'linear-gradient(170deg,#3B2F6E 0%,#1A1533 60%,#0A0A12 100%)', '#3B2F6E', '🌙'],
  ['Закат', 'linear-gradient(170deg,#C0587E 0%,#6E2A44 55%,#1C0C14 100%)', '#8E3458', '🌅'],
  ['Океан', 'linear-gradient(170deg,#2F6E9E 0%,#14304A 60%,#081018 100%)', '#1F5480', '🌊'],
  ['Пустыня', 'linear-gradient(170deg,#C98A3A 0%,#6E4214 60%,#1C1006 100%)', '#8A5414', '🌵'],
  ['Снег', 'linear-gradient(170deg,#7C93A8 0%,#3E4F60 60%,#12181E 100%)', '#3E5568', '❄️']
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { th: 0, toast: 0, toastText: '' }; }
componentWillUnmount() { clearTimeout(this.tt); }
say(t) { clearTimeout(this.tt); this.setState({ toast: Date.now(), toastText: t }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2200); }
renderVals() {
  const s = this.state;
  const T = TH[s.th];
  const N = 25;
  let x = 4242;
  const rnd = () => { x = (x * 9301 + 49297) % 233280; return x / 233280; };
  const cells = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    let on = null;
    for (const [r0, c0] of [[0, 0], [0, N - 7], [N - 7, 0]]) {
      const rr = r - r0, cc = c - c0;
      if (rr >= -1 && rr <= 7 && cc >= -1 && cc <= 7) on = rr >= 0 && rr <= 6 && cc >= 0 && cc <= 6 && (rr === 0 || rr === 6 || cc === 0 || cc === 6 || (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4));
    }
    if (on === null) on = (r >= 10 && r <= 14 && c >= 10 && c <= 14) ? false : rnd() > 0.5;
    cells.push(on ? T[2] : 'transparent');
  }
  const pos = [[20, 120, 28], [300, 90, 22], [40, 520, 24], [320, 470, 30], [170, 600, 20], [80, 300, 18], [330, 280, 20], [260, 650, 26], [30, 700, 22], [200, 80, 18]];
  return {
    bg: T[1], ink: T[2], cells,
    floaters: pos.map(([px, py, sz], i) => ({ x: px + 'px', y: py + 'px', s: sz + 'px', e: T[3], dur: (5 + i % 4) + 's', d: (-i * .7) + 's' })),
    themes: TH.map((t, i) => ({ label: t[0], bg: t[1], e: t[3], ring: i === s.th ? '0 0 0 2px rgba(0,0,0,.4), 0 0 0 4px #F4F7F5' : 'inset 0 0 0 1px rgba(255,255,255,.2)', pick: () => this.setState({ th: i }) })),
    copy: () => this.say('Ссылка t.me/alex_m скопирована'),
    share: () => this.say('Картинка с кодом готова к отправке'),
    toggleMode: () => this.say('Откроется сканер QR-кодов')
  };
}
}
</script>
</body>
</html>
