<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Боты прямо в поле ввода</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes kxUp2{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes kxCell{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes kxPan{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes kxIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
@keyframes kxCaret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes kxShimmer{0%{background-position:-160px 0}100%{background-position:160px 0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: #6A4C9C; display: flex; align-items: center; justify-content: center; font-weight: 800">Л</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Лиза</div><div style="font-size: 12px; color: #8FD3AC">в сети</div></div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
    <div style="align-self: flex-start; max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); font-size: 15px">Понедельник опять 😩</div>
    <sc-for list="{{sent}}" as="m" hint-placeholder-count="0">
      <div style="align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; animation: kxIn .3s cubic-bezier(.2,.8,.2,1) both">
        <div style="width: {{m.w}}; height: {{m.h}}; border-radius: 18px 18px 6px 18px; background: {{m.bg}}; background-size: 300% 100%; animation: kxPan 4s linear infinite alternate; display: flex; align-items: center; justify-content: center; font-size: {{m.fs}}; color: {{m.col}}; padding: {{m.pad}}; box-sizing: border-box; text-align: {{m.ta}}">{{m.content}}</div>
        <span style="font-size: 11px; color: #8A958F">через {{m.via}}</span>
      </div>
    </sc-for>
  </div>

  <!-- Inline results panel -->
  <sc-if value="{{panel}}" hint-placeholder-val="{{true}}">
    <div style="margin: 0 8px; padding: 10px 8px 8px; border-radius: 22px 22px 0 0; background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06)); backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,.14); border-bottom: 0; animation: {{panelAnim}}">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 6px 8px"><span style="width: 24px; height: 24px; border-radius: 8px; background: {{botBg}}; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 15px; color: #fff" aria-hidden="true">{{botIcon}}</span></span><span style="flex: 1; font-size: 12px; font-weight: 700; color: #C9D2CC">{{botLabel}}</span><span style="font-size: 11px; color: #8A958F">{{resCount}}</span></div>
      <sc-if value="{{grid}}" hint-placeholder-val="{{true}}">
        <div class="scroll" style="display: flex; gap: 6px; overflow-x: auto; padding: 0 2px">
          <sc-for list="{{items}}" as="it" hint-placeholder-count="6"><button onClick="{{it.tap}}" aria-label="{{it.aria}}" style="flex-shrink: 0; width: {{it.w}}; height: 110px; border-radius: 14px; background: {{it.bg}}; background-size: 300% 100%; animation: kxCell .25s ease {{it.d}} both, kxPan 4s linear 2 alternate; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #fff; position: relative"><span>{{it.e}}</span><span style="position: absolute; left: 6px; bottom: 5px; padding: 1px 5px; border-radius: 6px; background: rgba(0,0,0,.45); font-size: 11px; font-weight: 800">{{it.tag}}</span></button></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{list}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><button onClick="{{r.tap}}" style="padding: 8px 10px; border-radius: 14px; background: rgba(0,0,0,.2); display: flex; align-items: center; gap: 10px; animation: kxCell .25s ease {{r.d}} both"><span style="width: 40px; height: 40px; border-radius: 10px; background: {{r.bg}}; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0">{{r.e}}</span><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 700">{{r.t}}</span><span style="display: block; font-size: 12px; color: #9AA59F; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{r.s}}</span></span></button></sc-for>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <div style="padding: 8px 12px 8px; border-top: 1px solid rgba(255,255,255,.06); display: flex; gap: 8px; align-items: center">
    <div style="flex: 1; height: 48px; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,.07); border: 1px solid rgba(143,211,172,.3); display: flex; align-items: center; font-size: 15px"><span style="color: #8FD3AC; font-weight: 800">{{botName}}</span>&nbsp;<span>{{query}}</span><span style="display: inline-block; width: 2px; height: 18px; margin-left: 1px; background: #8FD3AC; animation: kxCaret 1s step-end infinite"></span></div>
  </div>
  <div style="padding: 0 12px 14px; display: flex; gap: 6px; justify-content: center">
    <sc-for list="{{bots}}" as="b" hint-placeholder-count="3"><button onClick="{{b.tap}}" aria-pressed="{{b.on}}" style="height: 32px; padding: 0 12px; border-radius: 16px; background: {{b.bg}}; color: {{b.ink}}; border: 1px solid {{b.bd}}; font-size: 12px; font-weight: 800">{{b.t}}</button></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const GRADS = ['linear-gradient(110deg, #3F9A6C, #2F6E9E, #6A4C9C)', 'linear-gradient(110deg, #C0443C, #E8B04A, #C0443C)', 'linear-gradient(110deg, #2F6E9E, #7FB8E0, #1B2A3A)', 'linear-gradient(110deg, #6A4C9C, #C0443C, #2A1630)', 'linear-gradient(110deg, #B07A2E, #F2B866, #6B4A2E)', 'linear-gradient(110deg, #3A403D, #9AA59F, #1B201E)'];
const BOTS = {
  gif: { name: '@gif', q: 'понедельник', label: 'GIF по запросу «понедельник»', icon: 'gif_box', bg: '#C0443C', type: 'grid', items: [['😴', 'GIF'], ['☕', 'GIF'], ['🐱', 'GIF'], ['🙃', 'GIF'], ['🧟', 'GIF'], ['📅', 'GIF']] },
  sticker: { name: '@sticker', q: 'кофе', label: 'Стикеры «кофе»', icon: 'emoji_emotions', bg: '#B07A2E', type: 'grid', items: [['☕', 'STK'], ['🫖', 'STK'], ['🥐', 'STK'], ['😵‍💫', 'STK'], ['🧋', 'STK'], ['🍪', 'STK']] },
  wiki: { name: '@wiki', q: 'понедельник', label: 'Статьи из Википедии', icon: 'menu_book', bg: '#2F6E9E', type: 'list', rows: [['📅', 'Понедельник', 'День недели между воскресеньем и вторником'], ['🎵', 'Понедельник (песня)', 'Музыкальная композиция'], ['🧠', 'Синдром понедельника', 'Термин из популярной психологии']] }
};
class Component extends DCLogic {
constructor(props) { super(props); this.state = { bot: 'gif', open: true, sent: [], pk: 0 }; }
renderVals() {
  const s = this.state;
  const b = BOTS[s.bot];
  const send = (m) => this.setState({ open: false, sent: [...s.sent, m].slice(-2) });
  return {
    panel: s.open, panelAnim: (s.pk % 2 ? 'kxUp2' : 'kxUp') + ' .3s cubic-bezier(.2,.8,.2,1) both',
    botBg: b.bg, botIcon: b.icon, botLabel: b.label, resCount: b.type === 'grid' ? 'листайте →' : b.rows.length + ' результата',
    grid: b.type === 'grid', list: b.type === 'list',
    items: b.type === 'grid' ? b.items.map(([e, tag], i) => ({ e, tag, w: s.bot === 'gif' ? (i % 2 ? '96px' : '130px') : '96px', bg: s.bot === 'gif' ? GRADS[i % GRADS.length] : 'rgba(0,0,0,.2)', d: (i * 0.04) + 's', aria: (s.bot === 'gif' ? 'GIF ' : 'Стикер ') + e,
      tap: () => send(s.bot === 'gif' ? { w: '200px', h: '140px', bg: GRADS[i % GRADS.length], fs: '58px', content: e, pad: '0', ta: 'center', via: '@gif' } : { w: '120px', h: '120px', bg: 'transparent', fs: '84px', content: e, pad: '0', ta: 'center', via: '@sticker' }) })) : [],
    rows: b.type === 'list' ? b.rows.map(([e, t, sub], i) => ({ e, t, s: sub, bg: 'rgba(127,184,224,.16)', d: (i * 0.05) + 's', tap: () => send({ w: '240px', h: 'auto', bg: 'linear-gradient(135deg, #6FC497, #3F9A6C)', fs: '14px', content: t + ' — ' + sub.toLowerCase() + '. ru.wikipedia.org', pad: '10px 12px', ta: 'left', via: '@wiki' }) })) : [],
    botName: b.name, query: b.q,
    bots: Object.keys(BOTS).map(k => { const on = s.bot === k; return { t: BOTS[k].name, on: on ? 'true' : 'false', bg: on ? 'rgba(143,211,172,.16)' : 'rgba(255,255,255,.05)', ink: on ? '#8FD3AC' : '#C9D2CC', bd: on ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', tap: () => this.setState({ bot: k, open: true, pk: s.pk + 1 }) }; }),
    sent: s.sent.map(m => ({ ...m, col: m.via === '@wiki' ? '#06150D' : '#fff' }))
  };
}
}
</script>
</body>
</html>
