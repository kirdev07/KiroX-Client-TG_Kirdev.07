<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Уведомления и звуки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
@keyframes kxRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes kxDrop{0%{transform:translateY(-120%)}12%,85%{transform:translateY(0)}100%{transform:translateY(-120%)}}
@keyframes kxRing{0%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(0)}}
@keyframes kxOpen{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; right: -90px; top: -110px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(70,160,110,.18), rgba(70,160,110,0) 65%)"></div>

  <header style="position: relative; padding: 10px 12px 2px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="margin: 0; flex-grow: 1; font-size: 22px; font-weight: 800">Уведомления</h1>
    <button onClick="{{test}}" style="height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(143,211,172,.14); border: 1px solid rgba(143,211,172,.3); color: #C8F0D8; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span class="ms fill" style="font-size: 18px; animation: kxRing 2.4s ease-in-out infinite" aria-hidden="true">notifications_active</span>Проверить</button>
  </header>

  <div style="position: relative; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
      <div style="border-radius: 22px; background: rgba(255,255,255,.045); border: 1px solid {{c.border}}; overflow: hidden; transition: border-color .3s; animation: kxRise .4s ease both; animation-delay: {{c.d}}">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px">
          <button onClick="{{c.expand}}" aria-expanded="{{c.expanded}}" style="flex-grow: 1; display: flex; align-items: center; gap: 12px">
            <span style="width: 40px; height: 40px; border-radius: 14px; background: {{c.tile}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 21px" aria-hidden="true">{{c.icon}}</span></span>
            <span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 600">{{c.label}}</span><span style="display: block; font-size: 12px; color: {{c.subColor}}">{{c.sub}}</span></span>
            <span class="ms" style="font-size: 20px; color: #8A958F; transition: transform .3s; transform: {{c.chev}}" aria-hidden="true">expand_more</span>
          </button>
          <button role="switch" aria-checked="{{c.checked}}" aria-label="{{c.label}}" onClick="{{c.flip}}" style="width: 48px; height: 28px; border-radius: 14px; background: {{c.track}}; position: relative; transition: background .3s; flex-shrink: 0"><span style="position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .35s cubic-bezier(.34,1.5,.5,1); transform: {{c.knob}}"></span></button>
        </div>
        <sc-if value="{{c.open}}" hint-placeholder-val="{{false}}">
          <div style="padding: 0 12px 12px 64px; display: flex; flex-direction: column; gap: 10px; animation: kxOpen .25s ease both">
            <div style="display: flex; gap: 6px">
              <sc-for list="{{sounds}}" as="s" hint-placeholder-count="4"><button onClick="{{s.pick}}" style="height: 30px; padding: 0 10px; border-radius: 15px; background: {{s.bg}}; color: {{s.color}}; font-size: 12px; font-weight: 700">{{s.label}}</button></sc-for>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 13px; color: #C9D2CC"><span>Текст сообщения</span><span style="color: #8FD3AC">Показывать</span></div>
            <div style="display: flex; justify-content: space-between; font-size: 13px; color: #C9D2CC"><span>Исключения</span><span style="color: #9AA59F">{{c.exc}}</span></div>
          </div>
        </sc-if>
      </div>
    </sc-for>

    <div style="padding: 6px 4px 0; font-size: 13px; font-weight: 800; color: #8FD3AC">В приложении</div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{inApp}}" as="g" hint-placeholder-count="4">
        <button role="switch" aria-checked="{{g.checked}}" onClick="{{g.flip}}" style="height: 50px; padding: 0 14px; border-radius: {{g.radius}}; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 12px">
          <span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">{{g.icon}}</span>
          <span style="flex-grow: 1; font-size: 15px">{{g.label}}</span>
          <span style="width: 44px; height: 26px; border-radius: 13px; background: {{g.track}}; position: relative; transition: background .3s"><span style="position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .35s cubic-bezier(.34,1.5,.5,1); transform: {{g.knob}}"></span></span>
        </button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{banner}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 10px; right: 10px; top: 10px; padding: 10px 12px; border-radius: 22px; display: flex; align-items: center; gap: 10px; background: linear-gradient(180deg, rgba(46,58,52,.92), rgba(24,30,27,.95)); border: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 18px 40px rgba(0,0,0,.6); animation: kxDrop 3.2s cubic-bezier(.2,.9,.25,1) both">
      <span style="width: 42px; height: 42px; border-radius: 21px; background: linear-gradient(140deg, #4B3F7A, #2A2240); color: #DCD0FF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">А</span>
      <span style="flex-grow: 1; min-width: 0"><span style="display: flex; font-size: 14px; font-weight: 700"><span style="flex-grow: 1">Анна</span><span style="font-size: 11px; font-weight: 500; color: #8A958F">сейчас</span></span><span style="display: block; font-size: 13px; color: #C9D2CC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Ты где? Фильм через 10 минут 🎬</span></span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
  super(props);
  this.state = { on: { users: true, groups: true, channels: false, reactions: true, calls: true }, open: 'users', sound: 'Нота', banner: 0,
    app: { sound: true, vibrate: true, banner: true, badge: true } };
}
componentWillUnmount() { clearTimeout(this.t); }
renderVals() {
  const s = this.state;
  const defs = [
    { key: 'users', icon: 'person', label: 'Личные чаты', tile: '#1F3A2C', ink: '#8FD3AC', exc: '2 чата' },
    { key: 'groups', icon: 'groups', label: 'Группы', tile: '#1F2E40', ink: '#A9CBF5', exc: '5 групп без звука' },
    { key: 'channels', icon: 'campaign', label: 'Каналы', tile: '#3B2A22', ink: '#FFB68F', exc: 'Исключений нет' },
    { key: 'reactions', icon: 'favorite', label: 'Реакции', tile: '#3A1E2A', ink: '#FF9CC8', exc: 'На сообщения и истории' },
    { key: 'calls', icon: 'call', label: 'Звонки', tile: '#2E2A3D', ink: '#CFC2F2', exc: 'На весь экран' }
  ];
  const cats = defs.map((d, i) => {
    const on = s.on[d.key], open = s.open === d.key;
    return {
      icon: d.icon, label: d.label, tile: d.tile, ink: d.ink, exc: d.exc, d: (i * 0.04) + 's',
      sub: on ? (d.key === 'calls' ? 'Мелодия · вибрация' : 'Звук «' + s.sound + '» · превью') : 'Выключены',
      subColor: on ? '#9AA59F' : '#FF8A80',
      checked: on ? 'true' : 'false', track: on ? '#8FD3AC' : '#2A322E', knob: on ? 'translateX(20px)' : 'translateX(0)',
      border: open ? 'rgba(143,211,172,.3)' : 'rgba(255,255,255,0)',
      chev: open ? 'rotate(180deg)' : 'rotate(0)', open, expanded: open ? 'true' : 'false',
      flip: () => this.setState({ on: Object.assign({}, s.on, { [d.key]: !on }) }),
      expand: () => this.setState({ open: open ? null : d.key })
    };
  });
  const sounds = ['Нота', 'Капля', 'Звон', 'Без звука'].map(label => ({
    label, bg: label === s.sound ? '#8FD3AC' : 'rgba(255,255,255,.07)', color: label === s.sound ? '#06150D' : '#C9D2CC',
    pick: () => this.setState({ sound: label })
  }));
  const appDefs = [
    { key: 'sound', icon: 'volume_up', label: 'Звук' },
    { key: 'vibrate', icon: 'vibration', label: 'Вибрация' },
    { key: 'banner', icon: 'web_asset', label: 'Баннер сверху' },
    { key: 'badge', icon: 'counter_1', label: 'Счётчик на иконке' }
  ];
  const inApp = appDefs.map((g, i) => {
    const on = s.app[g.key];
    return {
      icon: g.icon, label: g.label, checked: on ? 'true' : 'false', track: on ? '#8FD3AC' : '#2A322E', knob: on ? 'translateX(18px)' : 'translateX(0)',
      radius: i === 0 ? '20px 20px 6px 6px' : i === appDefs.length - 1 ? '6px 6px 20px 20px' : '6px',
      flip: () => this.setState({ app: Object.assign({}, s.app, { [g.key]: !on }) })
    };
  });
  return {
    cats, sounds, inApp,
    banner: s.banner > 0 && s.app.banner,
    test: () => { clearTimeout(this.t); this.setState({ banner: 0 }); setTimeout(() => this.setState({ banner: Date.now() }), 30); this.t = setTimeout(() => this.setState({ banner: 0 }), 3300); }
  };
}
}
</script>
</body>
</html>
