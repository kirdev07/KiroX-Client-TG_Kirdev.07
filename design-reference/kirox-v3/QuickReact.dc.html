<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Быстрая реакция</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.92)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxBig{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}35%{transform:translate(-50%,-50%) scale(1.5);opacity:1}70%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-120%) scale(.5);opacity:0}}
@keyframes kxP1{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(-46px,-40px) scale(1);opacity:0}}
@keyframes kxP2{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(48px,-36px) scale(1);opacity:0}}
@keyframes kxP3{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(-30px,34px) scale(1);opacity:0}}
@keyframes kxP4{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(36px,30px) scale(1);opacity:0}}
@keyframes kxChip{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes kxTap{0%,100%{transform:scale(1);opacity:.0}10%{opacity:.9}20%{transform:scale(.8)}30%{transform:scale(1)}40%{transform:scale(.8)}50%{transform:scale(1);opacity:.9}70%{opacity:0}}
@keyframes kxSel{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 800">Быстрая реакция</h1>
  </header>

  <!-- Playground -->
  <div style="margin: 4px 16px 0; height: 240px; position: relative; border-radius: 26px; background: radial-gradient(100% 80% at 80% 0%, rgba(63,154,108,.22), transparent 60%), #101413; border: 1px solid rgba(255,255,255,.08); overflow: hidden">
    <div style="position: absolute; left: 14px; right: 14px; top: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="align-self: flex-start; display: flex; gap: 8px; align-items: flex-end">
        <span style="width: 30px; height: 30px; border-radius: 15px; background: #C0443C; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">А</span>
        <button onClick="{{tap}}" aria-label="Дважды нажмите на сообщение" style="position: relative; max-width: 240px; padding: 10px 14px 8px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.08)">
          <span style="display: block; font-size: 15px">Сдала экзамен на отлично!! 🎓</span>
          <span style="display: flex; align-items: center; gap: 6px; margin-top: 6px">
            <sc-if value="{{hasReact}}" hint-placeholder-val="{{false}}"><span style="height: 26px; padding: 0 8px; border-radius: 13px; background: rgba(143,211,172,.2); border: 1px solid rgba(143,211,172,.45); display: flex; align-items: center; gap: 4px; font-size: 14px; animation: kxChip .35s ease both"><span>{{reactEmoji}}</span><span style="font-size: 12px; font-weight: 800; color: #8FD3AC">1</span></span></sc-if>
            <span style="margin-left: auto; font-size: 11px; color: #8A958F">14:02</span>
          </span>
          <sc-if value="{{burst}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; left: 50%; top: 50%; font-size: 54px; animation: kxBig .9s cubic-bezier(.2,.8,.2,1) both; pointer-events: none">{{reactEmoji}}</span>
            <span style="position: absolute; left: 50%; top: 50%; font-size: 18px; animation: kxP1 .8s ease-out both; pointer-events: none">{{reactEmoji}}</span>
            <span style="position: absolute; left: 50%; top: 50%; font-size: 14px; animation: kxP2 .8s ease-out .05s both; pointer-events: none">{{reactEmoji}}</span>
            <span style="position: absolute; left: 50%; top: 50%; font-size: 16px; animation: kxP3 .8s ease-out .1s both; pointer-events: none">{{reactEmoji}}</span>
            <span style="position: absolute; left: 50%; top: 50%; font-size: 12px; animation: kxP4 .8s ease-out .08s both; pointer-events: none">{{reactEmoji}}</span>
          </sc-if>
        </button>
      </div>
    </div>
    <sc-if value="{{showHint}}" hint-placeholder-val="{{true}}">
      <span style="position: absolute; left: 150px; top: 46px; width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.35); animation: kxTap 2s ease-in-out 2; pointer-events: none" aria-hidden="true"></span>
    </sc-if>
    <div style="position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 13px; color: #9AA59F">{{hint}}</div>
  </div>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px 16px 30px">
    <div style="display: flex; align-items: center; padding: 0 4px 10px"><span style="flex: 1; font-size: 13px; font-weight: 700; color: #8FD3AC">Реакция по двойному нажатию</span><span style="font-size: 22px">{{reactEmoji}}</span></div>
    <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px">
      <sc-for list="{{emojis}}" as="e" hint-placeholder-count="18">
        <button onClick="{{e.tap}}" aria-label="{{e.label}}" aria-pressed="{{e.on}}" style="aspect-ratio: 1; border-radius: 18px; background: {{e.bg}}; border: 1.5px solid {{e.bd}}; font-size: 26px; display: flex; align-items: center; justify-content: center; transition: background .2s, border-color .2s"><span style="animation: {{e.anim}}; transform: {{e.tf}}; display: inline-block">{{e.ch}}</span></button>
      </sc-for>
    </div>

    <div style="margin-top: 18px; border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); overflow: hidden">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
        <button onClick="{{o.tap}}" style="width: 100%; padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.05)">
          <span class="ms" style="color: #9AA59F" aria-hidden="true">{{o.icon}}</span>
          <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">{{o.label}}</span><span style="display: block; margin-top: 2px; font-size: 12px; color: #8A958F">{{o.sub}}</span></span>
          <span style="width: 48px; height: 28px; border-radius: 14px; background: {{o.track}}; position: relative; transition: background .2s; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{o.knob}}; width: 22px; height: 22px; border-radius: 11px; background: {{o.knobBg}}; transition: left .2s"></span></span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const EM = [['❤️', 'Сердце'], ['👍', 'Класс'], ['🔥', 'Огонь'], ['😂', 'Смех'], ['🥰', 'Нежность'], ['👏', 'Аплодисменты'], ['🎉', 'Праздник'], ['🤯', 'Взрыв мозга'], ['😮', 'Удивление'], ['😢', 'Грусть'], ['🙏', 'Спасибо'], ['💯', 'Сто'], ['⚡', 'Молния'], ['🤝', 'Рукопожатие'], ['👀', 'Глаза'], ['💚', 'Зелёное сердце'], ['🌚', 'Луна'], ['🫡', 'Есть']];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sel: 0, last: 0, reacted: false, burst: 0, popSel: -1, anim: true, haptic: true, big: true }; }
componentWillUnmount() { clearTimeout(this.tb); }
tap() {
  const now = Date.now();
  const s = this.state;
  if (now - s.last < 400) {
    const on = !s.reacted;
    clearTimeout(this.tb);
    this.setState({ reacted: on, burst: on && s.anim ? s.burst + 1 : 0, last: 0 });
    if (on) this.tb = setTimeout(() => this.setState({ burst: 0 }), 950);
  } else this.setState({ last: now });
}
renderVals() {
  const s = this.state;
  const sw = v => ({ track: v ? '#3F9A6C' : 'rgba(255,255,255,.14)', knob: v ? '23px' : '3px', knobBg: v ? '#EEF3EF' : '#9AA59F' });
  const em = EM[s.sel][0];
  return {
    tap: () => this.tap(),
    hasReact: s.reacted, reactEmoji: em, burst: s.burst > 0,
    showHint: !s.reacted,
    hint: s.reacted ? 'Нажмите дважды ещё раз, чтобы убрать' : 'Нажмите дважды на сообщение',
    emojis: EM.map(([ch, label], i) => {
      const on = s.sel === i;
      return { ch, label, on, bg: on ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.04)', bd: on ? '#8FD3AC' : 'rgba(255,255,255,.06)', anim: s.popSel === i ? 'kxSel .3s ease both' : 'none', tf: on ? 'scale(1.12)' : 'none', tap: () => this.setState({ sel: i, popSel: i }) };
    }),
    opts: [
      { icon: 'animation', label: 'Анимация реакции', sub: 'Большой эмодзи и брызги вокруг', k: 'anim' },
      { icon: 'vibration', label: 'Отклик вибрацией', sub: 'Короткая вибрация при реакции', k: 'haptic' },
      { icon: 'zoom_in', label: 'Крупные реакции в чате', sub: 'Чипы под сообщением чуть больше', k: 'big' }
    ].map(o => { const w = sw(s[o.k]); return { ...o, track: w.track, knob: w.knob, knobBg: w.knobBg, tap: () => this.setState({ [o.k]: !s[o.k] }) }; })
  };
}
}
</script>
</body>
</html>
