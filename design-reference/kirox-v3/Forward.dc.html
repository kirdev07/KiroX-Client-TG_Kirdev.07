<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Переслать</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
input::placeholder{color:#8A958F}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@keyframes kxPop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes kxUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(120px,-500px) scale(.3);opacity:0}}
@keyframes kxToast{0%{opacity:0;transform:translateY(16px)}12%,85%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <!-- Chat behind -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px">
      <button aria-label="Назад" style="width: 42px; height: 42px; border-radius: 21px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
      <span style="width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(140deg,#2F6E9E,#14243A); color: #CFE6FF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Н</span>
      <div><div style="font-size: 16px; font-weight: 800">Новости технологий</div><div style="font-size: 12px; color: #9AA59F">канал</div></div>
    </header>
    <div style="flex: 1; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
      <div style="align-self: flex-start; width: 290px; border-radius: 20px 20px 20px 6px; background: #161B18; overflow: hidden">
        <div style="height: 150px; background: linear-gradient(150deg,#3F9A6C,#1B2E3A)"></div>
        <div style="padding: 10px 12px; font-size: 15px; line-height: 1.38">Вышло большое обновление Android: новые жесты, экран блокировки и режим экономии батареи.</div>
        <div style="padding: 0 12px 10px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8A958F"><span class="ms" style="font-size: 15px" aria-hidden="true">visibility</span>18,2K · 14:02</div>
      </div>
      <button onClick="{{open}}" style="align-self: flex-start; height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(143,211,172,.12); color: #8FD3AC; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700"><span class="ms" style="font-size: 20px" aria-hidden="true">forward</span>Переслать</button>
    </div>
  </div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{true}}">
    <button aria-label="Закрыть" onClick="{{close}}" style="position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: kxFade .25s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; border-radius: 30px 30px 0 0; background: #121614; border-top: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; animation: kxSheet .35s cubic-bezier(.2,.9,.3,1) both">
      <div style="padding: 10px 16px 0">
        <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A4540; margin: 0 auto 12px"></div>
        <div style="display: flex; align-items: center; gap: 8px">
          <div style="flex: 1; height: 42px; border-radius: 21px; background: rgba(255,255,255,.06); display: flex; align-items: center; gap: 8px; padding: 0 14px">
            <span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">search</span>
            <input aria-label="Поиск чата" placeholder="Кому переслать?" value="{{q}}" onInput="{{onQ}}" style="flex: 1; font-size: 15px">
          </div>
          <button onClick="{{copyLink}}" aria-label="Скопировать ссылку" style="width: 42px; height: 42px; border-radius: 21px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">link</span></button>
        </div>
      </div>

      <div class="scroll" style="flex: 1; min-height: 0; padding: 14px 10px 10px">
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 4px">
          <sc-for list="{{chats}}" as="c" hint-placeholder-count="12">
            <button onClick="{{c.tap}}" aria-label="{{c.name}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
              <span style="position: relative; width: 62px; height: 62px">
                <span style="position: absolute; inset: 0; border-radius: {{c.shape}}; background: {{c.av}}; color: {{c.ink}}; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; transform: scale({{c.scale}}); transition: transform .25s cubic-bezier(.34,1.45,.5,1)">
                  <sc-if value="{{c.isSaved}}" hint-placeholder-val="{{false}}"><span class="ms fill" style="font-size: 28px" aria-hidden="true">bookmark</span></sc-if>
                  <sc-if value="{{c.notSaved}}" hint-placeholder-val="{{true}}"><span>{{c.init}}</span></sc-if>
                </span>
                <span aria-hidden="true" style="position: absolute; inset: -3px; border-radius: {{c.shapeRing}}; border: 2.5px solid {{c.ring}}; transition: border-color .2s"></span>
                <sc-if value="{{c.sel}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 11px; background: #8FD3AC; color: #06150D; border: 2px solid #121614; display: flex; align-items: center; justify-content: center; animation: kxPop .3s ease both"><span class="ms fill" style="font-size: 14px" aria-hidden="true">check</span></span></sc-if>
                <sc-if value="{{c.online}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 2px; top: 2px; width: 12px; height: 12px; border-radius: 6px; background: #8FD3AC; border: 2px solid #121614"></span></sc-if>
              </span>
              <span style="font-size: 12px; line-height: 15px; color: {{c.nameInk}}; max-width: 80px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{c.name}}</span>
            </button>
          </sc-for>
        </div>
        <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div style="padding: 40px 0; text-align: center; font-size: 14px; color: #8A958F">Чаты не найдены</div></sc-if>
      </div>

      <!-- Send bar -->
      <sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
        <div style="padding: 10px 12px 20px; border-top: 1px solid rgba(255,255,255,.06); background: #161B18; animation: kxUp .3s cubic-bezier(.2,.9,.3,1) both">
          <div style="display: flex; gap: 6px; padding-bottom: 10px">
            <sc-for list="{{opts}}" as="o" hint-placeholder-count="2"><button onClick="{{o.tap}}" style="height: 32px; padding: 0 12px; border-radius: 16px; background: {{o.bg}}; color: {{o.ink}}; border: 1px solid {{o.border}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px; transition: all .2s"><span class="ms" style="font-size: 16px" aria-hidden="true">{{o.icon}}</span>{{o.label}}</button></sc-for>
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <div style="flex: 1; height: 46px; border-radius: 23px; background: rgba(255,255,255,.07); display: flex; align-items: center; padding: 0 14px">
              <input aria-label="Комментарий" placeholder="Добавить комментарий" value="{{note}}" onInput="{{onNote}}" style="flex: 1; font-size: 15px">
            </div>
            <button onClick="{{send}}" aria-label="Отправить" style="position: relative; width: 46px; height: 46px; border-radius: 23px; background: linear-gradient(140deg, #6FC497, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center">
              <span class="ms fill" aria-hidden="true">send</span>
              <span style="position: absolute; right: -4px; top: -4px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #EEF3EF; color: #06150D; border: 2px solid #161B18; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{count}}</span>
            </button>
          </div>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{flying}}" hint-placeholder-val="{{false}}"><span class="ms fill" aria-hidden="true" style="position: absolute; right: 30px; bottom: 30px; font-size: 34px; color: #8FD3AC; animation: kxFly .7s cubic-bezier(.4,0,.6,1) both">send</span></sc-if>
  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; min-height: 50px; padding: 8px 14px; box-sizing: border-box; border-radius: 18px; background: #1E2622; border: 1px solid rgba(143,211,172,.25); display: flex; align-items: center; gap: 10px; font-size: 14px; animation: kxToast 2.6s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">check_circle</span><span style="flex: 1">{{toastText}}</span></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CHATS = [
  { name: 'Избранное', saved: true, av: 'linear-gradient(140deg,#6FC497,#3F9A6C)', ink: '#06150D' },
  { name: 'Анна', av: 'linear-gradient(140deg,#4B3F7A,#2A2240)', ink: '#DCD0FF', online: true },
  { name: 'Сергей', av: 'linear-gradient(140deg,#3F7A5A,#1E3A2A)', ink: '#CFF2DD' },
  { name: 'Курс английского', group: true, av: 'linear-gradient(140deg,#4B3F7A,#2A2240)', ink: '#DCD0FF' },
  { name: 'Мама', av: 'linear-gradient(140deg,#9E3F5C,#2E1420)', ink: '#FFD0DD', online: true },
  { name: 'Работа · команда', group: true, av: 'linear-gradient(140deg,#2F6E9E,#14243A)', ink: '#CFE6FF' },
  { name: 'Дана', av: 'linear-gradient(140deg,#9E3F5C,#2E1420)', ink: '#FFD0DD' },
  { name: 'Олег', av: 'linear-gradient(140deg,#2F6E9E,#14243A)', ink: '#CFE6FF' },
  { name: 'Двор · Соседи', group: true, av: 'linear-gradient(140deg,#7A5A2E,#3A2A14)', ink: '#FFE2B8' },
  { name: 'Тимур', av: 'linear-gradient(140deg,#7A5A2E,#3A2A14)', ink: '#FFE2B8', online: true },
  { name: 'Алина', av: 'linear-gradient(140deg,#3A6E7A,#14303A)', ink: '#CFF4FF' },
  { name: 'Мой канал', channel: true, av: 'linear-gradient(140deg,#3F9A6C,#1B2E3A)', ink: '#DFF5E8' }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sheet: true, sel: [], q: '', note: '', hide: false, noCap: false, fly: 0, toast: 0, toastText: '' }; }
componentWillUnmount() { clearTimeout(this.t); clearTimeout(this.ft); }
renderVals() {
  const s = this.state;
  const q = s.q.trim().toLowerCase();
  const list = CHATS.map((c, i) => ({ c, i })).filter(x => !q || x.c.name.toLowerCase().includes(q));
  const chats = list.map(({ c, i }) => {
    const sel = s.sel.includes(i);
    const shape = c.channel || c.group ? '20px' : '31px';
    return {
      name: c.name, init: c.name[0], av: c.av, ink: c.ink, isSaved: !!c.saved, notSaved: !c.saved, online: !!c.online && !sel,
      shape, shapeRing: c.channel || c.group ? '23px' : '34px',
      sel, scale: sel ? '.84' : '1', ring: sel ? '#8FD3AC' : 'transparent', nameInk: sel ? '#8FD3AC' : '#C9D2CC',
      tap: () => this.setState({ sel: sel ? s.sel.filter(k => k !== i) : [...s.sel, i] })
    };
  });
  const names = s.sel.map(i => CHATS[i].name);
  const say = t => { clearTimeout(this.t); this.setState({ toast: Date.now(), toastText: t }); this.t = setTimeout(() => this.setState({ toast: 0 }), 2600); };
  return {
    sheet: s.sheet, open: () => this.setState({ sheet: true }), close: () => this.setState({ sheet: false, sel: [], q: '', note: '' }),
    q: s.q, onQ: e => this.setState({ q: e.target.value }),
    chats, empty: chats.length === 0,
    hasSel: s.sel.length > 0, count: String(s.sel.length),
    note: s.note, onNote: e => this.setState({ note: e.target.value }),
    opts: [
      { icon: s.hide ? 'visibility_off' : 'person', label: s.hide ? 'Без автора' : 'С автором', on: s.hide, tap: () => this.setState({ hide: !s.hide }) },
      { icon: 'subtitles_off', label: 'Без подписи', on: s.noCap, tap: () => this.setState({ noCap: !s.noCap }) }
    ].map(o => ({ ...o, bg: o.on ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.05)', ink: o.on ? '#8FD3AC' : '#C9D2CC', border: o.on ? 'rgba(143,211,172,.4)' : 'transparent' })),
    send: () => {
      const text = names.length === 1 ? (names[0] === 'Избранное' ? 'Сохранено в «Избранное»' : 'Переслано: ' + names[0]) : 'Переслано в ' + names.length + ' чата: ' + names.slice(0, 2).join(', ') + (names.length > 2 ? '…' : '');
      clearTimeout(this.ft);
      this.setState({ fly: Date.now(), sheet: false, sel: [], q: '', note: '' });
      this.ft = setTimeout(() => { this.setState({ fly: 0 }); say(text); }, 650);
    },
    copyLink: () => { this.setState({ sheet: false }); say('Ссылка на пост скопирована'); },
    flying: !!s.fly, toast: !!s.toast, toastText: s.toastText
  };
}
}
</script>
</body>
</html>
