<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Контакты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input::placeholder{color:#7C8781}
@keyframes kxRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes kxSheen{0%{transform:translateX(-140%)}55%,100%{transform:translateX(260%)}}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@keyframes kxPulse{0%,100%{box-shadow:0 0 0 0 rgba(143,211,172,.5)}50%{box-shadow:0 0 0 5px rgba(143,211,172,0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; right: -90px; top: -110px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(70,160,110,.18), rgba(70,160,110,0) 65%)"></div>

  <header style="position: relative; padding: 10px 16px 4px; display: flex; align-items: center; gap: 8px">
    <h1 style="margin: 0; flex-grow: 1; font-size: 30px; font-weight: 800; letter-spacing: -0.4px">Контакты</h1>
    <button aria-label="{{sortLabel}}" onClick="{{toggleSort}}" style="height: 42px; padding: 0 14px; border-radius: 21px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); display: flex; align-items: center; gap: 6px; color: #C9D2CC; font-size: 13px; font-weight: 600"><span class="ms" style="font-size: 18px" aria-hidden="true">swap_vert</span>{{sortShort}}</button>
    <button aria-label="Добавить контакт" onClick="{{openAdd}}" style="width: 42px; height: 42px; border-radius: 21px; background: linear-gradient(140deg, #8FD3AC, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(63,154,108,.35)"><span class="ms" style="font-size: 22px" aria-hidden="true">person_add</span></button>
  </header>

  <div style="position: relative; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <label style="height: 46px; border-radius: 23px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 10px; padding: 0 14px">
      <span class="ms" style="font-size: 20px; color: #7C8781" aria-hidden="true">search</span>
      <input aria-label="Поиск контактов" placeholder="Имя, @username или номер" value="{{query}}" onChange="{{onQuery}}" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #EEF3EF; font: inherit; font-size: 15px">
    </label>
    <div style="display: flex; gap: 10px">
      <button style="flex: 1; height: 56px; padding: 0 12px; border-radius: 20px; background: linear-gradient(150deg, rgba(63,154,108,.22), rgba(255,255,255,.04)); border: 1px solid rgba(143,211,172,.16); display: flex; align-items: center; gap: 10px"><span class="ms fill" style="color: #8FD3AC" aria-hidden="true">share</span><span style="font-size: 14px; font-weight: 600">Пригласить</span></button>
      <button style="flex: 1; height: 56px; padding: 0 12px; border-radius: 20px; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 10px"><span class="ms" style="color: #A9CBF5" aria-hidden="true">qr_code_scanner</span><span style="font-size: 14px; font-weight: 600">По QR-коду</span></button>
    </div>
  </div>

  <div style="position: relative; margin-top: 12px">
    <sc-if value="{{showOnline}}" hint-placeholder-val="{{true}}">
      <div style="padding: 0 16px 8px; display: flex; gap: 12px">
        <sc-for list="{{online}}" as="o" hint-placeholder-count="3">
          <button onClick="{{o.open}}" style="width: 58px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center">
            <span style="position: relative; width: 54px; height: 54px; border-radius: 27px; background: {{o.avatar}}; color: {{o.ink}}; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{o.letter}}<span style="position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; border-radius: 7px; background: #8FD3AC; border: 3px solid #0A0C0B; animation: kxPulse 2s ease-in-out infinite"></span></span>
            <span style="font-size: 11px">{{o.first}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="padding: 10px 16px 4px; font-size: 13px; font-weight: 800; color: #8FD3AC">{{g.head}}</div>
      <sc-for list="{{g.items}}" as="c" hint-placeholder-count="2">
        <button onClick="{{c.open}}" style="width: 100%; height: 62px; padding: 0 16px; display: flex; align-items: center; gap: 13px; animation: kxRise .4s cubic-bezier(.2,.8,.2,1) both">
          <span style="position: relative; width: 46px; height: 46px; border-radius: 23px; background: {{c.avatar}}; color: {{c.ink}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{c.letter}}<sc-if value="{{c.isOnline}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 7px; background: #8FD3AC; border: 3px solid #0A0C0B"></span></sc-if></span>
          <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">{{c.name}}</span><span style="display: block; font-size: 13px; color: {{c.statusColor}}">{{c.status}}</span></span>
        </button>
      </sc-for>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="padding: 40px 24px; text-align: center; color: #8A958F; font-size: 14px"><span class="ms" style="display: block; font-size: 40px; margin-bottom: 8px; color: #3A4540" aria-hidden="true">person_search</span>Никого не нашли.<br>Можно пригласить по номеру.</div>
    </sc-if>
  </div>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <button aria-label="Закрыть" onClick="{{closeSheet}}" style="position: absolute; inset: 0; width: 100%; background: rgba(0,0,0,.55); animation: kxFade .2s ease both"></button>
    <div role="dialog" aria-label="{{sheetTitle}}" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 24px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, rgba(34,44,39,.94), rgba(16,20,18,.97)); border-top: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); animation: kxSheet .38s cubic-bezier(.2,.9,.25,1) both">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 0 auto 14px"></div>
      <sc-if value="{{isPerson}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="width: 84px; height: 84px; border-radius: 42px; background: {{pAvatar}}; color: {{pInk}}; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{pLetter}}</span>
          <span style="font-size: 22px; font-weight: 800">{{pName}}</span>
          <span style="font-size: 13px; color: {{pStatusColor}}">{{pStatus}}</span>
        </div>
        <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <button style="height: 64px; border-radius: 20px; background: rgba(143,211,172,.16); color: #C8F0D8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600"><span class="ms fill" aria-hidden="true">chat</span>Написать</button>
          <button style="height: 64px; border-radius: 20px; background: rgba(255,255,255,.07); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600"><span class="ms" aria-hidden="true">call</span>Звонок</button>
          <button style="height: 64px; border-radius: 20px; background: rgba(255,255,255,.07); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600"><span class="ms" aria-hidden="true">videocam</span>Видео</button>
          <button style="height: 64px; border-radius: 20px; background: rgba(255,255,255,.07); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600"><span class="ms" aria-hidden="true">edit</span>Изменить</button>
        </div>
        <div style="margin-top: 12px; padding: 12px 14px; border-radius: 18px; background: rgba(255,255,255,.05); display: flex; flex-direction: column; gap: 10px; font-size: 14px">
          <div style="display: flex; gap: 10px"><span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">phone</span><span style="flex-grow: 1">+7 ··· ··· ·· ··</span><span style="color: #8A958F; font-size: 12px">мобильный</span></div>
          <div style="display: flex; gap: 10px"><span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">alternate_email</span><span style="flex-grow: 1">{{pUser}}</span></div>
        </div>
      </sc-if>
      <sc-if value="{{isAdd}}" hint-placeholder-val="{{false}}">
        <div style="font-size: 20px; font-weight: 800; margin-bottom: 14px">Новый контакт</div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <label style="height: 52px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 10px; padding: 0 14px"><span class="ms" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">badge</span><input aria-label="Имя" placeholder="Имя" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #EEF3EF; font: inherit; font-size: 15px"></label>
          <label style="height: 52px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 10px; padding: 0 14px"><span class="ms" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">badge</span><input aria-label="Фамилия" placeholder="Фамилия (необязательно)" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #EEF3EF; font: inherit; font-size: 15px"></label>
          <label style="height: 52px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(143,211,172,.4); display: flex; align-items: center; gap: 10px; padding: 0 14px"><span class="ms" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">call</span><span style="font-size: 15px">+7</span><input aria-label="Номер телефона" type="tel" placeholder="700 000 00 00" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #EEF3EF; font: inherit; font-size: 15px"></label>
          <button onClick="{{closeSheet}}" style="margin-top: 6px; height: 54px; border-radius: 18px; background: linear-gradient(100deg, #6FC497, #3F9A6C); color: #06150D; font-size: 16px; font-weight: 800; text-align: center">Сохранить</button>
          <div style="text-align: center; font-size: 12px; color: #8A958F">Нет в Telegram? Отправим приглашение</div>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{showBar}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, rgba(10,12,11,0), rgba(10,12,11,.85) 70%)"></div>
    <nav aria-label="Разделы" style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); height: 64px; padding: 0 6px; border-radius: 32px; display: flex; align-items: center; overflow: hidden; background: rgba(28,34,31,.92); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 14px 34px rgba(0,0,0,.55); z-index: 5">
    <span aria-hidden="true" style="position: absolute; left: 6px; top: 6px; width: 78px; height: 52px; border-radius: 26px; background: rgba(143,211,172,.18); border: 1px solid rgba(166,227,193,.3); display: {{lensShow}}; transition: transform .45s cubic-bezier(.34,1.3,.5,1); transform: {{lensTransform}}"></span>
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
      <button aria-label="{{tab.label}}" aria-current="{{tab.current}}" onClick="{{tab.pick}}" style="position: relative; width: 78px; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{tab.color}}">
        <span class="{{tab.cls}}" style="font-size: 23px" aria-hidden="true">{{tab.icon}}</span>
        <span style="font-size: 11px; font-weight: {{tab.fw}}; line-height: 13px">{{tab.label}}</span>
        <sc-if value="{{tab.badge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 12px; top: 3px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: {{tab.badgeColor}}; color: #06150D; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{tab.badge}}</span></sc-if>
      </button>
    </sc-for>
  </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 0, query: '', byName: true, sheet: null }; }
renderVals() {
  const s = this.state;
  const all = [
    { name: 'Анна Ким', user: '@anna', letter: 'А', avatar: 'linear-gradient(140deg,#4B3F7A,#2A2240)', ink: '#DCD0FF', st: 'online', order: 0 },
    { name: 'Илья Петров', user: '@ilya', letter: 'И', avatar: 'linear-gradient(140deg,#D08A3C,#7A4A16)', ink: '#FFE9C9', st: 'был(а) 5 мин назад', order: 2 },
    { name: 'Максим Ли', user: '@max', letter: 'М', avatar: 'linear-gradient(140deg,#2D4E73,#1A2A40)', ink: '#C6DBF5', st: 'online', order: 1 },
    { name: 'Мама', user: 'нет имени пользователя', letter: 'М', avatar: 'linear-gradient(140deg,#6B4E2E,#3A2A1A)', ink: '#F2DDBF', st: 'был(а) недавно', order: 3 },
    { name: 'Света Орлова', user: '@sveta', letter: 'С', avatar: 'linear-gradient(140deg,#3C7BD0,#1A3A6A)', ink: '#D6E6FF', st: 'online', order: 0.5 },
    { name: 'Дмитрий Ан', user: '@dima', letter: 'Д', avatar: 'linear-gradient(140deg,#2E6B66,#18403C)', ink: '#BDEDE8', st: 'был(а) на этой неделе', order: 4 }
  ];
  const q = s.query.trim().toLowerCase();
  const list = all.filter(c => !q || c.name.toLowerCase().includes(q) || c.user.toLowerCase().includes(q));
  const mk = c => ({
    name: c.name, letter: c.letter, avatar: c.avatar, ink: c.ink,
    isOnline: c.st === 'online',
    status: c.st === 'online' ? 'в сети' : c.st,
    statusColor: c.st === 'online' ? '#8FD3AC' : '#8A958F',
    open: () => this.setState({ sheet: c })
  });
  let groups;
  if (s.byName) {
    const sorted = list.slice().sort((a, b) => a.name.localeCompare(b.name, 'ru'));
    const map = {};
    sorted.forEach(c => { const h = c.name[0].toUpperCase(); (map[h] = map[h] || []).push(mk(c)); });
    groups = Object.keys(map).map(h => ({ head: h, items: map[h] }));
  } else {
    const sorted = list.slice().sort((a, b) => a.order - b.order);
    groups = [{ head: 'По времени захода', items: sorted.map(mk) }];
  }
  const online = all.filter(c => c.st === 'online').map(c => ({ letter: c.letter, avatar: c.avatar, ink: c.ink, first: c.name.split(' ')[0], open: () => this.setState({ sheet: c }) }));
  const p = s.sheet && s.sheet !== 'add' ? s.sheet : null;
  const items = [
    { icon: 'chat', label: 'Чаты', badge: '16', badgeColor: '#8FD3AC' },
    { icon: 'call', label: 'Звонки', badge: '1', badgeColor: '#FF8A80' },
    { icon: 'motion_photos_on', label: 'Истории' },
    { icon: 'settings', label: 'Настройки' }
  ];
  const tabs = items.map((t, i) => {
    const on = i === -1;
    return {
      icon: t.icon, label: t.label, badge: t.badge || false, badgeColor: t.badgeColor || '#8FD3AC',
      current: on ? 'page' : 'false', cls: on ? 'ms fill' : 'ms', fw: on ? 800 : 600, fill: on ? 'fill' : '', color: on ? '#E6F6EC' : '#B4BEB8',
      iconTransform: on ? 'translateY(-1px) scale(1.08)' : 'translateY(6px) scale(1)',
      labelOpacity: on ? '1' : '0', labelTransform: on ? 'translateY(0)' : 'translateY(6px)',
      pick: () => this.setState({ tab: i })
    };
  });
  return {
    tabs, lensTransform: 'translateX(0px)', lensShow: 'none',
    query: s.query, onQuery: (e) => this.setState({ query: e.target.value }),
    groups, empty: list.length === 0, online, showOnline: !q,
    sortShort: s.byName ? 'А–Я' : 'В сети', sortLabel: s.byName ? 'Сортировка: по имени' : 'Сортировка: по времени захода',
    toggleSort: () => this.setState({ byName: !s.byName }),
    openAdd: () => this.setState({ sheet: 'add' }),
    sheetOpen: !!s.sheet, isAdd: s.sheet === 'add', isPerson: !!p, showBar: !s.sheet,
    sheetTitle: s.sheet === 'add' ? 'Новый контакт' : 'Контакт',
    closeSheet: () => this.setState({ sheet: null }),
    pName: p ? p.name : '', pLetter: p ? p.letter : '', pAvatar: p ? p.avatar : '#222', pInk: p ? p.ink : '#fff', pUser: p ? p.user : '',
    pStatus: p ? (p.st === 'online' ? 'в сети' : p.st) : '', pStatusColor: p && p.st === 'online' ? '#8FD3AC' : '#8A958F'
  };
}
}
</script>
</body>
</html>
