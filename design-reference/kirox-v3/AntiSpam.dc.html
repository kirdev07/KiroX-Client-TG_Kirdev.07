<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Защита от спама</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxShield{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes kxScan{0%{transform:translateY(-40px);opacity:0}20%,80%{opacity:1}100%{transform:translateY(40px);opacity:0}}
@keyframes kxIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes kxGone{0%{opacity:1;max-height:80px}100%{opacity:0;max-height:0;padding:0;margin:0}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,16px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,16px)}}
@keyframes kxToast2{0%{opacity:0;transform:translate(-50%,16px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,16px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px; display: flex; align-items: center; gap: 10px">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <div style="flex: 1"><div style="font-size: 20px; font-weight: 800">Защита от спама</div><div style="font-size: 12px; color: #9AA59F">Android Dev KZ · 4 820 участников</div></div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 0 16px 20px">
    <div style="position: relative; padding: 18px 16px; border-radius: 26px; background: radial-gradient(circle at 50% 0%, {{glow}}, transparent 70%), rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 14px; overflow: hidden">
      <span style="position: relative; width: 72px; height: 72px; border-radius: 24px; background: {{shBg}}; color: {{shInk}}; display: flex; align-items: center; justify-content: center; overflow: hidden; animation: {{shAnim}}; flex-shrink: 0"><span class="ms fill" style="font-size: 40px" aria-hidden="true">{{shIcon}}</span><span style="position: absolute; left: 0; right: 0; height: 2px; background: rgba(255,255,255,.8); box-shadow: 0 0 10px #fff; display: {{scanShow}}; animation: kxScan 1.6s ease-in-out infinite"></span></span>
      <div style="flex: 1"><div style="font-size: 17px; font-weight: 800">{{shTitle}}</div><div style="margin-top: 2px; font-size: 13px; color: #C9D2CC; line-height: 1.4">{{shSub}}</div></div>
    </div>

    <div style="margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px">
      <sc-for list="{{stats}}" as="st" hint-placeholder-count="3"><div style="padding: 12px 6px; border-radius: 18px; background: rgba(255,255,255,.04); text-align: center"><div style="font-size: 22px; font-weight: 800; color: {{st.c}}; font-variant-numeric: tabular-nums">{{st.v}}</div><div style="font-size: 11px; color: #9AA59F">{{st.t}}</div></div></sc-for>
    </div>

    <div style="margin-top: 14px; border-radius: 20px; background: rgba(255,255,255,.04); padding: 0 14px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><button onClick="{{o.tap}}" role="switch" aria-checked="{{o.on}}" style="width: 100%; min-height: 64px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{o.line}}"><span class="ms" style="color: #9AA59F" aria-hidden="true">{{o.i}}</span><span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 700">{{o.t}}</span><span style="display: block; font-size: 12px; color: #9AA59F; line-height: 1.35">{{o.s}}</span></span><span style="width: 46px; height: 28px; border-radius: 14px; background: {{o.tr}}; position: relative; flex-shrink: 0; transition: background .2s"><span style="position: absolute; top: 3px; left: {{o.x}}; width: 22px; height: 22px; border-radius: 11px; background: {{o.kn}}; transition: left .2s"></span></span></button></sc-for>
    </div>

    <div style="margin-top: 16px; display: flex; align-items: center"><span style="flex: 1; font-size: 13px; font-weight: 700; color: #8FD3AC">Удалено сегодня · {{caughtN}}</span><span style="font-size: 11px; color: #8A958F">отметьте ошибки</span></div>
    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{caught}}" as="c" hint-placeholder-count="3"><div style="padding: 10px 12px; border-radius: 16px; background: rgba(255,138,128,.05); border: 1px solid rgba(255,138,128,.15); display: flex; gap: 10px; align-items: center; overflow: hidden; animation: {{c.anim}}"><span style="width: 36px; height: 36px; border-radius: 18px; background: #5C6661; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0">{{c.l}}</span><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 13px; font-weight: 700">{{c.n}} · <span style="color: #9AA59F; font-weight: 400">{{c.t}}</span></span><span style="display: block; font-size: 13px; color: #C9D2CC; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-decoration: line-through; text-decoration-color: rgba(255,138,128,.5)">{{c.msg}}</span></span><button onClick="{{c.restore}}" style="height: 30px; padding: 0 10px; border-radius: 15px; background: rgba(255,255,255,.08); font-size: 12px; font-weight: 800; color: #8FD3AC">Не спам</button></div></sc-for>
    </div>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 26px; padding: 12px 16px; border-radius: 18px; background: rgba(40,48,44,.96); border: 1px solid rgba(255,255,255,.12); font-size: 13px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: {{toastAnim}}"><span class="ms fill" style="font-size: 18px; color: #8FD3AC" aria-hidden="true">check_circle</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const C = [
  { id: 1, n: 'Гость_7741', l: 'Г', t: '14:02', msg: 'Заработок от 5000 в день без вложений, пиши в лс' },
  { id: 2, n: 'crypto_signal', l: 'C', t: '12:40', msg: 'Бесплатные сигналы, вход по ссылке в профиле 🚀' },
  { id: 3, n: 'Аружан', l: 'А', t: '10:15', msg: 'Ребята, ссылка на запись митапа: youtu.be/…' }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { aggr: true, newbies: false, links: false, back: {}, toast: '', tk: 0 }; }
componentWillUnmount() { clearTimeout(this.tt); }
renderVals() {
  const s = this.state;
  const sw = (on) => ({ tr: on ? '#3F9A6C' : 'rgba(255,255,255,.14)', kn: on ? '#EEF3EF' : '#9AA59F', x: on ? '21px' : '3px', on: on ? 'true' : 'false' });
  const say = (t) => { clearTimeout(this.tt); this.setState({ toast: t, tk: s.tk + 1 }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2000); };
  const list = C.filter(c => !s.back[c.id]);
  return {
    glow: s.aggr ? 'rgba(143,211,172,.22)' : 'rgba(232,176,74,.16)',
    shBg: s.aggr ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(232,176,74,.16)', shInk: s.aggr ? '#06150D' : '#E8B04A',
    shIcon: s.aggr ? 'shield_with_heart' : 'shield', shAnim: s.aggr ? 'kxShield 2.6s ease-in-out 2' : 'none', scanShow: s.aggr ? 'block' : 'none',
    shTitle: s.aggr ? 'Усиленная защита включена' : 'Обычная защита',
    shSub: s.aggr ? 'Telegram сам удаляет похожие на спам сообщения от новичков и подозрительных аккаунтов.' : 'Спам удаляют только админы и жалобы участников.',
    stats: [[s.aggr ? '27' : '—', 'удалено за неделю', '#FF8A80'], [String(list.length), 'сегодня', '#EEF3EF'], [String(Object.keys(s.back).length), 'отмечено «не спам»', '#8FD3AC']].map(([v, t, c]) => ({ v, t, c })),
    opts: [
      { i: 'shield_with_heart', t: 'Усиленный антиспам', s: 'Автоматически, для больших групп', ...sw(s.aggr), line: 'rgba(255,255,255,.06)', tap: () => this.setState({ aggr: !s.aggr }) },
      { i: 'link_off', t: 'Ссылки только от админов', s: 'Участники не смогут отправлять ссылки', ...sw(s.links), line: 'rgba(255,255,255,.06)', tap: () => this.setState({ links: !s.links }) },
      { i: 'speed', t: 'Медленный режим', s: 'Одно сообщение в минуту на участника', ...sw(s.newbies), line: 'transparent', tap: () => this.setState({ newbies: !s.newbies }) }
    ],
    caughtN: list.length,
    caught: list.map(c => ({ ...c, anim: 'kxIn .3s ease both', restore: () => { this.setState({ back: { ...s.back, [c.id]: true } }); say('Отмечено как ошибка — фильтр это учтёт'); } })),
    toast: !!s.toast, toastText: s.toast, toastAnim: (s.tk % 2 ? 'kxToast2' : 'kxToast') + ' 2s ease both'
  };
}
}
</script>
</body>
</html>
