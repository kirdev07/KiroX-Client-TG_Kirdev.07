<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Превью ссылки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
input{font:inherit;color:inherit}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@keyframes kxShimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes kxFly{0%{opacity:0;transform:translateY(24px) scale(.96)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(135deg, #C0443C, #6A4C9C); display: flex; align-items: center; justify-content: center; font-weight: 800">А</span>
    <div style="flex: 1; min-width: 0"><div style="font-size: 16px; font-weight: 800">Анна</div><div style="font-size: 12px; color: #8FD3AC">в сети</div></div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end">
    <div style="align-self: flex-start; max-width: 80%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); font-size: 15px">Куда поедем на выходных? 🏔</div>
    <sc-for list="{{sent}}" as="m" hint-placeholder-count="1">
      <div style="align-self: flex-end; width: 80%; padding: 6px; border-radius: 18px 18px 6px 18px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; display: flex; flex-direction: column; gap: 6px; animation: kxFly .35s cubic-bezier(.2,.8,.2,1) both">
        <sc-if value="{{m.above}}" hint-placeholder-val="{{false}}"><div style="padding: 2px 6px 0; font-size: 15px">{{m.text}}</div></sc-if>
        <sc-if value="{{m.card}}" hint-placeholder-val="{{true}}">
          <div style="border-radius: 12px; background: rgba(6,21,13,.14); border-left: 3px solid #06150D; overflow: hidden; display: flex; flex-direction: {{m.dir}}">
            <span style="flex-shrink: 0; width: {{m.imgW}}; height: {{m.imgH}}; margin: {{m.imgM}}; border-radius: 8px; background: radial-gradient(70% 60% at 30% 30%, #CDE7F2, transparent 60%), linear-gradient(180deg, #5E8FB0, #2B4E3C); display: flex; align-items: flex-end; justify-content: center; overflow: hidden"><span class="ms fill" style="font-size: {{m.icoSz}}; color: rgba(255,255,255,.85)" aria-hidden="true">landscape</span></span>
            <div style="padding: 8px 10px; min-width: 0">
              <div style="font-size: 12px; font-weight: 800">travel.kz</div>
              <div style="font-size: 13px; font-weight: 700">Медеу и Шымбулак за один день</div>
              <div style="font-size: 12px; opacity: .8">Маршрут, канатка, где поесть и что взять с собой</div>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{m.below}}" hint-placeholder-val="{{true}}"><div style="padding: 0 6px; font-size: 15px">{{m.text}}</div></sc-if>
        <div style="padding: 0 6px 2px; text-align: right; font-size: 11px; opacity: .7">18:24 ✓✓</div>
      </div>
    </sc-for>
  </div>

  <!-- Composer with preview -->
  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06)">
    <sc-if value="{{showPrev}}" hint-placeholder-val="{{true}}">
      <div style="margin: 0 2px 8px; padding: 8px; border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04)); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; gap: 10px; animation: kxIn .2s ease both">
        <span class="ms" style="color: #8FD3AC" aria-hidden="true">link</span>
        <sc-if value="{{loading}}" hint-placeholder-val="{{false}}">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="height: 10px; width: 60%; border-radius: 5px; background: linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.18), rgba(255,255,255,.06)); background-size: 200px 100%; animation: kxShimmer 1s linear infinite"></span><span style="height: 10px; width: 85%; border-radius: 5px; background: linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.18), rgba(255,255,255,.06)); background-size: 200px 100%; animation: kxShimmer 1s linear infinite"></span></span>
        </sc-if>
        <sc-if value="{{loaded}}" hint-placeholder-val="{{true}}">
          <button onClick="{{openOpts}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px">
            <span style="width: 40px; height: 40px; border-radius: 10px; background: radial-gradient(70% 60% at 30% 30%, #CDE7F2, transparent 60%), linear-gradient(180deg, #5E8FB0, #2B4E3C); flex-shrink: 0"></span>
            <span style="flex: 1; min-width: 0; border-left: 2px solid #8FD3AC; padding-left: 8px"><span style="display: block; font-size: 12px; font-weight: 800; color: #8FD3AC">travel.kz</span><span style="display: block; font-size: 13px; color: #C9D2CC; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">Медеу и Шымбулак за один день</span></span>
            <span class="ms" style="color: #9AA59F; font-size: 20px" aria-hidden="true">tune</span>
          </button>
        </sc-if>
        <button onClick="{{removePrev}}" aria-label="Убрать превью" style="width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #9AA59F"><span class="ms" style="font-size: 18px" aria-hidden="true">close</span></button>
      </div>
    </sc-if>
    <div style="display: flex; align-items: center; gap: 8px">
      <label style="flex: 1; height: 50px; padding: 0 16px; border-radius: 25px; background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center">
        <input value="{{draft}}" onInput="{{onDraft}}" placeholder="Сообщение" aria-label="Сообщение" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 15px">
      </label>
      <button onClick="{{send}}" aria-label="Отправить" style="width: 50px; height: 50px; border-radius: 25px; background: {{sendBg}}; color: {{sendInk}}; display: flex; align-items: center; justify-content: center; transition: all .2s"><span class="ms fill" aria-hidden="true">send</span></button>
    </div>
  </div>

  <!-- Options sheet -->
  <sc-if value="{{opts}}" hint-placeholder-val="{{false}}">
    <button onClick="{{closeOpts}}" aria-label="Закрыть" style="position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: kxFade .2s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 22px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, rgba(40,48,44,.96), rgba(18,22,20,.98)); border-top: 1px solid rgba(255,255,255,.16); animation: kxSheet .3s cubic-bezier(.2,.8,.2,1) both">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 0 auto 14px"></div>
      <div style="font-size: 19px; font-weight: 800">Как показать ссылку</div>
      <!-- live mini preview -->
      <div style="margin-top: 12px; padding: 6px; border-radius: 16px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; display: flex; flex-direction: column; gap: 6px">
        <sc-if value="{{pvAbove}}" hint-placeholder-val="{{false}}"><div style="padding: 2px 6px 0; font-size: 14px">{{pvText}}</div></sc-if>
        <div style="border-radius: 10px; background: rgba(6,21,13,.14); border-left: 3px solid #06150D; overflow: hidden; display: flex; flex-direction: {{pvDir}}; transition: all .3s">
          <span style="flex-shrink: 0; width: {{pvImgW}}; height: {{pvImgH}}; margin: {{pvImgM}}; border-radius: 8px; background: radial-gradient(70% 60% at 30% 30%, #CDE7F2, transparent 60%), linear-gradient(180deg, #5E8FB0, #2B4E3C); transition: all .3s"></span>
          <div style="padding: 6px 10px; min-width: 0"><div style="font-size: 11px; font-weight: 800">travel.kz</div><div style="font-size: 12px; font-weight: 700">Медеу и Шымбулак за один день</div></div>
        </div>
        <sc-if value="{{pvBelow}}" hint-placeholder-val="{{true}}"><div style="padding: 0 6px 2px; font-size: 14px">{{pvText}}</div></sc-if>
      </div>
      <div style="margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
        <sc-for list="{{choices}}" as="c" hint-placeholder-count="4">
          <button onClick="{{c.tap}}" aria-pressed="{{c.on}}" style="height: 52px; padding: 0 12px; border-radius: 16px; background: {{c.bg}}; border: 1px solid {{c.bd}}; display: flex; align-items: center; gap: 10px; transition: all .2s"><span class="ms" style="color: {{c.ic}}" aria-hidden="true">{{c.icon}}</span><span style="font-size: 14px; font-weight: 700">{{c.label}}</span></button>
        </sc-for>
      </div>
      <button onClick="{{closeOpts}}" style="margin-top: 14px; width: 100%; height: 50px; border-radius: 25px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; font-weight: 800; text-align: center">Готово</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const DRAFT = 'Глянь, вот хороший маршрут travel.kz/medeu';
class Component extends DCLogic {
constructor(props) { super(props); this.state = { draft: DRAFT, removed: false, loading: true, opts: false, big: false, above: false, sent: [] }; }
componentDidMount() { this.tl = setTimeout(() => this.setState({ loading: false }), 1400); }
componentWillUnmount() { clearTimeout(this.tl); }
renderVals() {
  const s = this.state;
  const hasLink = /travel\.kz/.test(s.draft);
  const look = big => big ? { dir: 'column', imgW: 'auto', imgH: big === 'pv' ? '70px' : '120px', imgM: '6px 6px 0', icoSz: '48px' } : { dir: 'row-reverse', imgW: '46px', imgH: '46px', imgM: '8px', icoSz: '22px' };
  const pv = look(s.big ? 'pv' : false);
  const can = s.draft.trim().length > 0;
  const ch = (on, icon, label, tap) => ({ on, icon, label, tap, bg: on ? 'rgba(143,211,172,.12)' : 'rgba(255,255,255,.04)', bd: on ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', ic: on ? '#8FD3AC' : '#9AA59F' });
  return {
    showPrev: hasLink && !s.removed, loading: s.loading, loaded: !s.loading,
    openOpts: () => this.setState({ opts: true }), closeOpts: () => this.setState({ opts: false }), opts: s.opts,
    removePrev: () => this.setState({ removed: true }),
    draft: s.draft, onDraft: e => this.setState({ draft: e.target.value }),
    sendBg: can ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.07)', sendInk: can ? '#06150D' : '#5C6661',
    send: () => {
      if (!can) return;
      const card = hasLink && !s.removed;
      const L = look(s.big);
      this.setState({ sent: [...s.sent, { text: s.draft.trim(), card, above: !card || !s.above ? false : true, below: !card || !s.above, ...L }], draft: '', removed: false });
    },
    sent: s.sent,
    pvAbove: s.above, pvBelow: !s.above, pvText: 'Глянь, вот хороший маршрут',
    pvDir: pv.dir, pvImgW: pv.imgW, pvImgH: pv.imgH, pvImgM: pv.imgM,
    choices: [
      ch(!s.big, 'photo_size_select_small', 'Маленькое фото', () => this.setState({ big: false })),
      ch(s.big, 'photo_size_select_large', 'Большое фото', () => this.setState({ big: true })),
      ch(!s.above, 'vertical_align_top', 'Ссылка сверху', () => this.setState({ above: false })),
      ch(s.above, 'vertical_align_bottom', 'Ссылка снизу', () => this.setState({ above: true }))
    ]
  };
}
}
</script>
</body>
</html>
