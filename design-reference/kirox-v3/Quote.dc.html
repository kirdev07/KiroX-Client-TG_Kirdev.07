<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ответ с цитатой</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.w{display:inline;padding:2px 1px;border-radius:4px;font-size:15px;line-height:1.75;transition:background .15s,color .15s}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kxHint{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes kxFly{0%{opacity:0;transform:translateY(20px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@keyframes kxGlow{0%{box-shadow:0 0 0 0 rgba(143,211,172,.5)}100%{box-shadow:0 0 0 10px rgba(143,211,172,0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(135deg, #6FA9D8, #2F6E9E); display: flex; align-items: center; justify-content: center; font-weight: 800">K</span>
    <div style="flex: 1; min-width: 0"><div style="font-size: 16px; font-weight: 800">Kotlin-клуб</div><div style="font-size: 12px; color: #9AA59F">1 284 участника</div></div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 8px">
    <div style="align-self: center; padding: 4px 12px; border-radius: 12px; background: rgba(255,255,255,.06); font-size: 12px; color: #9AA59F">Сегодня</div>

    <!-- Source message: selectable words -->
    <div style="align-self: flex-start; max-width: 86%; display: flex; gap: 8px; align-items: flex-end">
      <span style="width: 32px; height: 32px; border-radius: 16px; background: #6A4C9C; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0">Д</span>
      <div style="padding: 10px 12px 8px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); border: 1px solid {{srcBd}}; transition: border-color .2s; animation: {{srcGlow}}">
        <div style="font-size: 13px; font-weight: 800; color: #B39DDB; margin-bottom: 2px">Дмитрий</div>
        <div><sc-for list="{{words}}" as="w" hint-placeholder-count="20"><button onClick="{{w.tap}}" class="w" style="background: {{w.bg}}; color: {{w.ink}}">{{w.t}}</button> </sc-for></div>
        <div style="margin-top: 2px; text-align: right; font-size: 11px; color: #8A958F">10:12</div>
      </div>
    </div>

    <sc-if value="{{hintOn}}" hint-placeholder-val="{{true}}">
      <div style="align-self: center; margin-top: 4px; padding: 8px 14px; border-radius: 16px; background: rgba(143,211,172,.1); border: 1px solid rgba(143,211,172,.25); font-size: 13px; color: #8FD3AC; display: flex; align-items: center; gap: 6px; animation: kxHint 2s ease-in-out 2"><span class="ms" style="font-size: 18px" aria-hidden="true">touch_app</span>{{hint}}</div>
    </sc-if>

    <sc-for list="{{sent}}" as="m" hint-placeholder-count="1">
      <div style="align-self: flex-end; max-width: 82%; padding: 8px 10px 6px; border-radius: 18px 18px 6px 18px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; animation: kxFly .35s cubic-bezier(.2,.8,.2,1) both">
        <div style="padding: 6px 10px; border-radius: 10px; background: rgba(6,21,13,.14); border-left: 3px solid #06150D; position: relative">
          <div style="font-size: 12px; font-weight: 800">Дмитрий</div>
          <div style="font-size: 13px; font-style: italic; opacity: .85">{{m.quote}}</div>
          <span class="ms fill" style="position: absolute; right: 6px; top: 4px; font-size: 16px; opacity: .45" aria-hidden="true">format_quote</span>
        </div>
        <div style="margin-top: 6px; padding: 0 4px; font-size: 15px">{{m.text}}</div>
        <div style="margin-top: 2px; text-align: right; font-size: 11px; opacity: .7">10:15 ✓✓</div>
      </div>
    </sc-for>
  </div>

  <!-- Composer -->
  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06); background: rgba(10,12,11,.9)">
    <sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
      <div style="margin: 0 2px 8px; padding: 8px 8px 8px 12px; border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04)); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; gap: 10px; animation: kxIn .2s ease both">
        <span class="ms fill" style="color: #8FD3AC" aria-hidden="true">format_quote</span>
        <span style="flex: 1; min-width: 0; border-left: 2px solid #8FD3AC; padding-left: 8px"><span style="display: block; font-size: 12px; font-weight: 800; color: #8FD3AC">Цитата · Дмитрий</span><span style="display: block; font-size: 13px; color: #C9D2CC; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{selText}}</span></span>
        <button onClick="{{otherChat}}" aria-label="Ответить в другом чате" style="width: 34px; height: 34px; border-radius: 17px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center; color: #C9D2CC"><span class="ms" style="font-size: 18px" aria-hidden="true">forward</span></button>
        <button onClick="{{clear}}" aria-label="Убрать цитату" style="width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; color: #9AA59F"><span class="ms" style="font-size: 18px" aria-hidden="true">close</span></button>
      </div>
    </sc-if>
    <sc-if value="{{other}}" hint-placeholder-val="{{false}}">
      <div style="margin: 0 2px 8px; display: flex; gap: 6px; animation: kxIn .2s ease both">
        <sc-for list="{{chats}}" as="c" hint-placeholder-count="4"><button onClick="{{c.tap}}" style="flex: 1; padding: 8px 0; border-radius: 14px; background: {{c.bg}}; border: 1px solid {{c.bd}}; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #C9D2CC"><span style="width: 32px; height: 32px; border-radius: 16px; background: {{c.c}}; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 800">{{c.l}}</span>{{c.name}}</button></sc-for>
      </div>
    </sc-if>
    <div style="display: flex; align-items: center; gap: 8px">
      <label style="flex: 1; height: 50px; padding: 0 16px; border-radius: 25px; background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center">
        <input value="{{draft}}" onInput="{{onDraft}}" placeholder="{{ph}}" aria-label="Сообщение" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 15px">
      </label>
      <button onClick="{{send}}" aria-label="{{sendLabel}}" style="width: 50px; height: 50px; border-radius: 25px; background: {{sendBg}}; color: {{sendInk}}; display: flex; align-items: center; justify-content: center; transition: all .2s"><span class="ms fill" aria-hidden="true">send</span></button>
    </div>
  </div>
  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 96px; padding: 12px 18px; border-radius: 18px; background: #232A26; border: 1px solid rgba(255,255,255,.16); font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2.4s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">forward</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TEXT = 'Итоги митапа: собираемся в субботу в 11:00 в коворкинге на Абая, вход со двора. Возьмите ноутбуки, будем писать виджет на Compose. Пицца за счёт клуба.';
const WORDS = TEXT.split(' ');
const CHATS = [['Избранное', 'И', '#3F9A6C'], ['Анна', 'А', '#C0443C'], ['Мама', 'М', '#B07A2E'], ['Работа', 'Р', '#5C6661']];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { a: -1, b: -1, draft: '', sent: [], other: false, target: -1, toast: 0, toastText: '' }; }
componentWillUnmount() { clearTimeout(this.tt); }
renderVals() {
  const s = this.state;
  const lo = Math.min(s.a, s.b), hi = Math.max(s.a, s.b);
  const hasSel = s.a >= 0;
  const sel = hasSel ? WORDS.slice(lo, (s.b >= 0 ? hi : s.a) + 1).join(' ') : '';
  const can = hasSel && s.draft.trim();
  const inSel = i => hasSel && (s.b >= 0 ? i >= lo && i <= hi : i === s.a);
  return {
    words: WORDS.map((t, i) => {
      const on = inSel(i);
      const edge = hasSel && (i === s.a || i === s.b);
      return {
        t, bg: on ? (edge ? '#8FD3AC' : 'rgba(143,211,172,.38)') : 'transparent', ink: on && edge ? '#06150D' : '#EEF3EF',
        tap: () => {
          if (s.a < 0 || s.b >= 0) this.setState({ a: i, b: -1 });
          else this.setState({ b: i });
        }
      };
    }),
    srcBd: hasSel ? 'rgba(143,211,172,.4)' : 'transparent', srcGlow: hasSel && s.b < 0 ? 'kxGlow 1.2s ease-out 2' : 'none',
    hintOn: s.sent.length === 0 && (!hasSel || s.b < 0),
    hint: !hasSel ? 'Нажмите на первое слово цитаты' : 'Теперь нажмите на последнее слово',
    hasSel, selText: '«' + sel + '»',
    clear: () => this.setState({ a: -1, b: -1, other: false, target: -1 }),
    otherChat: () => this.setState({ other: !s.other }), other: s.other && hasSel,
    chats: CHATS.map(([name, l, c], i) => ({ name, l, c, bg: s.target === i ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.04)', bd: s.target === i ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', tap: () => this.setState({ target: s.target === i ? -1 : i }) })),
    draft: s.draft, onDraft: e => this.setState({ draft: e.target.value }),
    ph: hasSel ? (s.target >= 0 ? 'Ответ в чат «' + CHATS[s.target][0] + '»…' : 'Ваш ответ…') : 'Сообщение',
    sendBg: can ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.07)', sendInk: can ? '#06150D' : '#5C6661',
    sendLabel: s.target >= 0 ? 'Отправить в другой чат' : 'Отправить',
    send: () => {
      if (!can) return;
      if (s.target >= 0) { clearTimeout(this.tt); this.setState({ a: -1, b: -1, draft: '', other: false, target: -1, toast: s.toast + 1, toastText: 'Ответ с цитатой ушёл в «' + CHATS[s.target][0] + '»' }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2400); return; }
      this.setState({ sent: [...s.sent, { quote: sel, text: s.draft.trim() }], a: -1, b: -1, draft: '', other: false });
    },
    sent: s.sent, toast: s.toast > 0, toastText: s.toastText
  };
}
}
</script>
</body>
</html>
