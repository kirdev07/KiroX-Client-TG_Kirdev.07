<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Функции kiroX</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
@keyframes kxRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes kxGhost{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes kxOpen{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: -90px; top: -110px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, {{bgGlow}}, rgba(0,0,0,0) 65%); transition: background .6s"></div>

  <header style="position: relative; padding: 10px 12px 2px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="margin: 0; font-size: 22px; font-weight: 800">Функции <span style="font-weight: 300">kiro</span><span style="color: #8FD3AC">X</span></h1>
  </header>

  <div style="position: relative; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="border-radius: 26px; overflow: hidden; background: {{ghostBg}}; border: 1px solid {{ghostBorder}}; transition: background .4s, border-color .4s; animation: kxRise .45s ease both">
      <div style="padding: 14px; display: flex; align-items: center; gap: 12px">
        <span style="width: 52px; height: 52px; border-radius: 18px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; animation: {{ghostAnim}}"><span class="ms fill" style="font-size: 28px; color: #E6DEFF" aria-hidden="true">visibility_off</span></span>
        <span style="flex-grow: 1"><span style="display: block; font-size: 17px; font-weight: 800">Режим призрака</span><span style="display: block; font-size: 12px; color: #A6B5AC">{{ghostSub}}</span></span>
        <button role="switch" aria-checked="{{ghostChecked}}" aria-label="Режим призрака" onClick="{{toggleGhost}}" style="width: 52px; height: 30px; border-radius: 15px; background: {{ghostTrack}}; position: relative; transition: background .3s"><span style="position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .35s cubic-bezier(.34,1.5,.5,1); transform: {{ghostKnob}}"></span></button>
      </div>
      <sc-if value="{{ghostOn}}" hint-placeholder-val="{{false}}">
        <div style="padding: 0 14px 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; animation: kxOpen .25s ease both">
          <sc-for list="{{ghostOpts}}" as="o" hint-placeholder-count="4">
            <button onClick="{{o.flip}}" style="height: 40px; padding: 0 10px; border-radius: 14px; background: {{o.bg}}; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; transition: background .25s"><span class="ms" style="font-size: 17px; color: {{o.ink}}" aria-hidden="true">{{o.icon}}</span>{{o.label}}</button>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; animation: kxRise .45s ease .06s both">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
        <button role="switch" aria-checked="{{t.checked}}" onClick="{{t.flip}}" style="position: relative; height: 96px; padding: 12px; box-sizing: border-box; border-radius: 22px; background: {{t.bg}}; border: 1px solid {{t.border}}; display: flex; flex-direction: column; justify-content: space-between; transition: background .3s, border-color .3s">
          <span style="display: flex; align-items: center; justify-content: space-between"><span class="ms fill" style="font-size: 22px; color: {{t.ink}}; transition: color .3s" aria-hidden="true">{{t.icon}}</span><span style="width: 34px; height: 20px; border-radius: 10px; background: {{t.track}}; position: relative; transition: background .3s"><span style="position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF; transition: transform .3s cubic-bezier(.34,1.5,.5,1); transform: {{t.knob}}"></span></span></span>
          <span><span style="display: block; font-size: 13px; font-weight: 700; line-height: 16px">{{t.label}}</span><span style="display: block; font-size: 11px; color: #8A958F; line-height: 14px">{{t.sub}}</span></span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px; animation: kxRise .45s ease .12s both">
      <sc-for list="{{links}}" as="l" hint-placeholder-count="4">
        <button onClick="{{l.next}}" style="height: 50px; padding: 0 14px; border-radius: {{l.radius}}; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 12px">
          <span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">{{l.icon}}</span>
          <span style="flex-grow: 1; font-size: 14px">{{l.label}}</span>
          <span style="font-size: 12px; font-weight: 600; color: #8FD3AC">{{l.value}}</span>
          <span class="ms" style="font-size: 18px; color: #8A958F" aria-hidden="true">chevron_right</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
  super(props);
  this.state = { ghost: true, g: { read: true, typing: true, offline: true, stories: false },
    t: { deleted: true, edits: true, guard: true, browser: true, ids: false, noAuthor: false }, tap: 0, power: 0, confirm: 1 };
}
renderVals() {
  const s = this.state;
  const gDefs = [['read', 'done_all', 'Не читать'], ['typing', 'keyboard', 'Не «печатает»'], ['offline', 'wifi_off', 'Быть офлайн'], ['stories', 'visibility_off', 'Тайно смотреть истории']];
  const ghostOpts = gDefs.map(([k, icon, label]) => ({ icon, label, ink: s.g[k] ? '#06150D' : '#9AA59F', bg: s.g[k] ? '#8FD3AC' : 'rgba(0,0,0,.25)', flip: () => this.setState({ g: Object.assign({}, s.g, { [k]: !s.g[k] }) }) }));
  const onCount = Object.values(s.g).filter(Boolean).length;
  const tDefs = [
    ['deleted', 'delete_history', 'Удалённые сообщения', 'Хранить на телефоне'],
    ['edits', 'history', 'История изменений', 'Старые версии текста'],
    ['guard', 'shield', 'Проверка файлов', 'Предупреждать об опасных'],
    ['browser', 'travel_explore', 'Встроенный браузер', 'Ссылки внутри kiroX'],
    ['ids', 'tag', 'ID в профилях', 'Нажатие копирует'],
    ['noAuthor', 'forward', 'Пересылка без автора', 'Скрывать отправителя']
  ];
  const tiles = tDefs.map(([k, icon, label, sub]) => {
    const on = s.t[k];
    return {
      icon, label, sub, checked: on ? 'true' : 'false',
      bg: on ? 'linear-gradient(150deg, rgba(63,154,108,.22), rgba(255,255,255,.03))' : 'rgba(255,255,255,.045)',
      border: on ? 'rgba(143,211,172,.22)' : 'rgba(255,255,255,0)',
      ink: on ? '#8FD3AC' : '#8A958F', track: on ? '#8FD3AC' : '#2A322E', knob: on ? 'translateX(14px)' : 'translateX(0)',
      flip: () => this.setState({ t: Object.assign({}, s.t, { [k]: !on }) })
    };
  });
  const tapOpts = ['Ничего', 'Реакция ❤️', 'Ответить', 'Копировать'];
  const powerOpts = ['Как в системе', 'Всегда', 'Никогда'];
  const confOpts = ['Ничего', 'Стикеры', 'Стикеры, GIF', 'Всё'];
  const links = [
    { icon: 'touch_app', label: 'Двойной тап по сообщению', value: tapOpts[s.tap], next: () => this.setState({ tap: (s.tap + 1) % tapOpts.length }) },
    { icon: 'help', label: 'Спрашивать перед отправкой', value: confOpts[s.confirm], next: () => this.setState({ confirm: (s.confirm + 1) % confOpts.length }) },
    { icon: 'battery_saver', label: 'Энергосбережение', value: powerOpts[s.power], next: () => this.setState({ power: (s.power + 1) % powerOpts.length }) },
    { icon: 'filter_alt', label: 'Фильтры сообщений', value: '3 слова', next: () => {} },
    { icon: 'backup', label: 'Резервная копия настроек', value: '', next: () => {} }
  ].map((l, i, a) => Object.assign({}, l, { radius: i === 0 ? '20px 20px 6px 6px' : i === a.length - 1 ? '6px 6px 20px 20px' : '6px' }));
  return {
    ghostOn: s.ghost, ghostOpts, tiles, links,
    ghostChecked: s.ghost ? 'true' : 'false',
    ghostTrack: s.ghost ? '#8FD3AC' : '#2A322E', ghostKnob: s.ghost ? 'translateX(22px)' : 'translateX(0)',
    ghostBg: s.ghost ? 'linear-gradient(150deg, rgba(110,88,201,.35), rgba(30,24,48,.6))' : 'rgba(255,255,255,.045)',
    ghostBorder: s.ghost ? 'rgba(201,166,255,.3)' : 'rgba(255,255,255,0)',
    ghostAnim: s.ghost ? 'kxGhost 3s ease-in-out 2' : 'none',
    ghostSub: s.ghost ? 'Включён · ' + onCount + ' из 4' : 'Вас видят как обычно',
    bgGlow: s.ghost ? 'rgba(130,100,220,.22)' : 'rgba(70,160,110,.16)',
    toggleGhost: () => this.setState({ ghost: !s.ghost })
  };
}
}
</script>
</body>
</html>
