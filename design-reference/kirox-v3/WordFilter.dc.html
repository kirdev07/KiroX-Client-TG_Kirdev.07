<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фильтр слов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
input{font:inherit;color:inherit}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxChip{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes kxShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 800">Фильтр слов</h1>
    <button onClick="{{toggleOn}}" aria-pressed="{{on}}" aria-label="Фильтр включён" style="width: 52px; height: 30px; border-radius: 15px; background: {{onTrack}}; position: relative; transition: background .2s"><span style="position: absolute; top: 3px; left: {{onKnob}}; width: 24px; height: 24px; border-radius: 12px; background: {{onKnobBg}}; transition: left .2s"></span></button>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 16px 30px; opacity: {{bodyOp}}; transition: opacity .3s">
    <!-- Add word -->
    <div style="display: flex; gap: 8px; animation: {{shake}}">
      <label style="flex: 1; height: 50px; padding: 0 16px; border-radius: 25px; background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; gap: 10px">
        <span class="ms" style="color: #9AA59F" aria-hidden="true">filter_alt</span>
        <input value="{{draft}}" onInput="{{onDraft}}" placeholder="Слово или фраза" aria-label="Слово для фильтра" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 15px">
      </label>
      <button onClick="{{add}}" aria-label="Добавить слово" style="width: 50px; height: 50px; border-radius: 25px; background: {{addBg}}; color: {{addInk}}; display: flex; align-items: center; justify-content: center; transition: all .2s"><span class="ms" aria-hidden="true">add</span></button>
    </div>
    <div style="margin: 8px 6px 0; font-size: 12px; color: {{hintInk}}">{{hint}}</div>

    <!-- Chips -->
    <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{words}}" as="w" hint-placeholder-count="5">
        <span style="height: 34px; padding: 0 4px 0 12px; border-radius: 17px; background: rgba(229,83,75,.12); border: 1px solid rgba(229,83,75,.3); color: #FFB3AC; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px; animation: {{w.anim}}">
          {{w.text}}<span style="font-size: 11px; color: #C98A84; font-weight: 600">{{w.hits}}</span>
          <button onClick="{{w.remove}}" aria-label="{{w.label}}" style="width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; color: #FFB3AC"><span class="ms" style="font-size: 16px" aria-hidden="true">close</span></button>
        </span>
      </sc-for>
    </div>

    <!-- Presets -->
    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Готовые наборы</div>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
        <button onClick="{{p.tap}}" aria-pressed="{{p.on}}" style="flex: 1; padding: 12px 10px; border-radius: 18px; background: {{p.bg}}; border: 1px solid {{p.bd}}; text-align: center; transition: all .2s">
          <span class="ms" style="color: {{p.ic}}; font-variation-settings: {{p.fill}}" aria-hidden="true">{{p.icon}}</span>
          <span style="display: block; margin-top: 4px; font-size: 13px; font-weight: 700">{{p.label}}</span>
          <span style="display: block; font-size: 11px; color: #8A958F">{{p.sub}}</span>
        </button>
      </sc-for>
    </div>

    <!-- Action -->
    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Что делать с сообщением</div>
    <div style="padding: 4px; border-radius: 20px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px">
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="3"><button onClick="{{a.tap}}" aria-pressed="{{a.on}}" style="height: 40px; border-radius: 16px; background: {{a.bg}}; color: {{a.ink}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; transition: all .2s"><span class="ms" style="font-size: 18px" aria-hidden="true">{{a.icon}}</span>{{a.label}}</button></sc-for>
    </div>

    <!-- Where -->
    <div style="margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap">
      <sc-for list="{{scopes}}" as="c" hint-placeholder-count="3"><button onClick="{{c.tap}}" aria-pressed="{{c.on}}" style="height: 34px; padding: 0 12px; border-radius: 17px; background: {{c.bg}}; color: {{c.ink}}; border: 1px solid {{c.bd}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px; transition: all .2s"><span class="ms" style="font-size: 16px" aria-hidden="true">{{c.icon}}</span>{{c.label}}</button></sc-for>
    </div>

    <!-- Preview -->
    <div style="margin-top: 18px; display: flex; align-items: center; padding: 0 4px 8px"><span style="flex: 1; font-size: 13px; font-weight: 700; color: #8FD3AC">Как это будет выглядеть</span><span style="font-size: 12px; color: #8A958F">{{caught}}</span></div>
    <div style="padding: 12px; border-radius: 22px; background: #111614; border: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{preview}}" as="m" hint-placeholder-count="4">
        <div style="align-self: flex-start; max-width: 88%; position: relative; animation: kxIn .25s ease {{m.d}} both">
          <sc-if value="{{m.collapsed}}" hint-placeholder-val="{{false}}">
            <button onClick="{{m.peek}}" style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(255,255,255,.04); border: 1px dashed rgba(255,255,255,.14); font-size: 12px; color: #8A958F; display: flex; align-items: center; gap: 6px"><span class="ms" style="font-size: 16px" aria-hidden="true">visibility_off</span>Скрыто фильтром · {{m.from}}</button>
          </sc-if>
          <sc-if value="{{m.visible}}" hint-placeholder-val="{{true}}">
            <div style="padding: 8px 12px; border-radius: 16px 16px 16px 6px; background: rgba(255,255,255,.07); border: 1px solid {{m.bd}}">
              <div style="font-size: 12px; font-weight: 800; color: {{m.c}}">{{m.from}}</div>
              <div style="margin-top: 2px; font-size: 14px; filter: {{m.blur}}; transition: filter .3s">{{m.text}}</div>
              <sc-if value="{{m.flag}}" hint-placeholder-val="{{false}}"><div style="margin-top: 4px; font-size: 11px; color: #E8B04A; display: flex; align-items: center; gap: 4px"><span class="ms" style="font-size: 14px" aria-hidden="true">flag</span>Совпало: «{{m.hit}}»</div></sc-if>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <p style="margin: 12px 4px 0; font-size: 12px; line-height: 1.45; color: #8A958F">Фильтр работает только на этом телефоне. Отправители не узнают, что их сообщения скрыты.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const PL = (n, a, b, c) => { const m = Math.abs(n) % 100, d = m % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d >= 2 && d <= 4 ? b : c; };

const PRESETS = [
  ['Реклама', 'campaign', ['скидка', 'промокод', 'подпишись']],
  ['Крипта', 'currency_bitcoin', ['airdrop', 'x100', 'памп']],
  ['Спойлеры', 'movie', ['финал', 'спойлер']]
];
const MSGS = [
  ['Олег', '#6FA9D8', 'Кто смотрел финал сезона? Там такое…', 'g'],
  ['Магазин «Техно»', '#E8B04A', 'Только сегодня скидка 70% по промокоду KIROX', 'c'],
  ['Мария', '#C0443C', 'Завтра созвон в 11, не опаздываем', 'g'],
  ['Crypto Signals', '#B07A2E', 'Новый airdrop! Успей, монета даст x100', 'c'],
  ['Дмитрий', '#2F6E9E', 'Скинул презентацию в общий чат', 'p']
];
const ACTIONS = [['Скрыть', 'visibility_off', 'hide'], ['Размыть', 'blur_on', 'blur'], ['Отметить', 'flag', 'flag']];
const SCOPES = [['Группы', 'group', 'g'], ['Каналы', 'campaign', 'c'], ['Личные чаты', 'person', 'p']];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { on: true, words: ['финал', 'скидка'], draft: '', act: 0, scope: { g: true, c: true, p: false }, presets: {}, last: '', err: 0, peek: {} }; }
renderVals() {
  const s = this.state;
  const all = [...new Set([...s.words, ...PRESETS.flatMap((p, i) => s.presets[i] ? p[2] : [])])];
  const match = t => all.find(w => t.toLowerCase().includes(w.toLowerCase()));
  const act = ACTIONS[s.act][2];
  let caught = 0;
  const preview = MSGS.map(([from, c, text, sc], i) => {
    const hit = s.on && s.scope[sc] ? match(text) : null;
    if (hit) caught++;
    const peeked = !!s.peek[i];
    return {
      from, c, text, d: (i * 0.04) + 's', hit: hit || '',
      collapsed: !!hit && act === 'hide' && !peeked, visible: !hit || act !== 'hide' || peeked,
      blur: hit && act === 'blur' ? 'blur(5px)' : 'none',
      bd: hit ? 'rgba(232,176,74,.35)' : 'transparent',
      flag: !!hit && (act === 'flag' || peeked),
      peek: () => this.setState({ peek: { ...s.peek, [i]: true } })
    };
  });
  const d = s.draft.trim();
  const dup = d && all.map(w => w.toLowerCase()).includes(d.toLowerCase());
  const sw = s.on;
  const hitsOf = w => MSGS.filter(m => m[2].toLowerCase().includes(w.toLowerCase())).length;
  return {
    on: s.on, toggleOn: () => this.setState({ on: !s.on }),
    onTrack: sw ? '#3F9A6C' : 'rgba(255,255,255,.14)', onKnob: sw ? '25px' : '3px', onKnobBg: sw ? '#EEF3EF' : '#9AA59F',
    bodyOp: s.on ? '1' : '.45',
    draft: s.draft, onDraft: e => this.setState({ draft: e.target.value }),
    addBg: d && !dup ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.07)', addInk: d && !dup ? '#06150D' : '#5C6661',
    shake: s.err ? 'kxShake .3s ease' : 'none',
    hint: dup ? 'Это слово уже в фильтре' : 'Регистр не важен. Ищем и внутри слов: «скидк» найдёт «скидка» и «скидки».',
    hintInk: dup ? '#E8B04A' : '#8A958F',
    add: () => { if (!d || dup) { this.setState({ err: s.err + 1 }); setTimeout(() => this.setState({ err: 0 }), 320); return; } this.setState({ words: [...s.words, d], draft: '', last: d }); },
    words: s.words.map(w => ({ text: w, hits: hitsOf(w) ? '· ' + hitsOf(w) : '', label: 'Убрать слово ' + w, anim: w === s.last ? 'kxChip .3s ease both' : 'none', remove: () => this.setState({ words: s.words.filter(x => x !== w) }) })),
    presets: PRESETS.map(([label, icon, list], i) => { const on = !!s.presets[i]; return { label, icon, on, sub: list.length + ' ' + PL(list.length, 'слово', 'слова', 'слов'), bg: on ? 'rgba(143,211,172,.12)' : 'rgba(255,255,255,.04)', bd: on ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', ic: on ? '#8FD3AC' : '#9AA59F', fill: on ? "'FILL' 1" : "'FILL' 0", tap: () => this.setState({ presets: { ...s.presets, [i]: !on } }) }; }),
    actions: ACTIONS.map(([label, icon], i) => ({ label, icon, on: s.act === i, bg: s.act === i ? 'rgba(143,211,172,.16)' : 'transparent', ink: s.act === i ? '#8FD3AC' : '#C9D2CC', tap: () => this.setState({ act: i, peek: {} }) })),
    scopes: SCOPES.map(([label, icon, k]) => { const on = !!s.scope[k]; return { label, icon, on, bg: on ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.05)', ink: on ? '#8FD3AC' : '#C9D2CC', bd: on ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', tap: () => this.setState({ scope: { ...s.scope, [k]: !on } }) }; }),
    preview, caught: s.on ? 'Сработает: ' + caught + ' из ' + MSGS.length : 'Фильтр выключен'
  };
}
}
</script>
</body>
</html>
