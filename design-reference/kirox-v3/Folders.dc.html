<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Папки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input::placeholder{color:#7C8781}
@keyframes kxRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes kxFade{from{opacity:0}to{opacity:1}}
@keyframes kxFlash{0%{background:rgba(143,211,172,.25)}100%{background:rgba(255,255,255,.045)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: -90px; top: -110px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(70,160,110,.16), rgba(70,160,110,0) 65%)"></div>

  <header style="position: relative; padding: 10px 12px 2px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="margin: 0; flex-grow: 1; font-size: 22px; font-weight: 800">Папки с чатами</h1>
  </header>

  <div style="position: relative; margin: 10px 16px 0; padding: 12px; border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06)">
    <div style="font-size: 11px; color: #8A958F; margin-bottom: 8px">Так папки выглядят в списке чатов</div>
    <div style="display: flex; gap: 6px; overflow: hidden">
      <span style="flex-shrink: 0; height: 30px; padding: 0 12px; border-radius: 15px; background: #8FD3AC; color: #06150D; font-size: 12px; font-weight: 700; display: flex; align-items: center">Все</span>
      <sc-for list="{{preview}}" as="p" hint-placeholder-count="3"><span style="flex-shrink: 0; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(255,255,255,.07); color: #C9D2CC; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: all .3s"><span class="ms fill" style="font-size: 15px" aria-hidden="true">{{p.icon}}</span>{{p.title}}</span></sc-for>
    </div>
  </div>

  <div style="position: relative; padding: 14px 16px 0">
    <div style="display: flex; align-items: center; padding: 0 4px 6px"><span style="flex-grow: 1; font-size: 13px; font-weight: 800; color: #8FD3AC">Мои папки</span><span style="font-size: 11px; color: #8A958F">Стрелками — порядок</span></div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{folders}}" as="f" hint-placeholder-count="3">
        <div style="height: 62px; padding: 0 6px 0 12px; border-radius: 18px; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 12px; animation: {{f.anim}}">
          <span style="width: 40px; height: 40px; border-radius: 14px; background: {{f.bg}}; color: {{f.ink}}; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 21px" aria-hidden="true">{{f.icon}}</span></span>
          <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600">{{f.title}}</span><span style="display: block; font-size: 12px; color: #8A958F">{{f.sub}}</span></span>
          <button aria-label="Выше" onClick="{{f.up}}" style="width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; color: {{f.upInk}}"><span class="ms" aria-hidden="true">keyboard_arrow_up</span></button>
          <button aria-label="Ниже" onClick="{{f.down}}" style="width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; color: {{f.downInk}}"><span class="ms" aria-hidden="true">keyboard_arrow_down</span></button>
        </div>
      </sc-for>
      <button onClick="{{openNew}}" style="height: 56px; border-radius: 18px; border: 1px dashed rgba(143,211,172,.4); color: #8FD3AC; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700"><span class="ms" aria-hidden="true">create_new_folder</span>Создать папку</button>
    </div>
  </div>

  <div style="position: relative; padding: 14px 16px 0">
    <div style="padding: 0 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Рекомендуем</div>
    <div style="display: flex; gap: 8px">
      <button onClick="{{addUnread}}" style="flex: 1; padding: 12px; border-radius: 18px; background: rgba(255,255,255,.045); display: flex; flex-direction: column; gap: 6px"><span class="ms fill" style="color: #FFB68F" aria-hidden="true">mark_chat_unread</span><span style="font-size: 13px; font-weight: 700">Непрочитанные</span><span style="font-size: 11px; color: #8FD3AC; font-weight: 700">+ Добавить</span></button>
      <button onClick="{{addBots}}" style="flex: 1; padding: 12px; border-radius: 18px; background: rgba(255,255,255,.045); display: flex; flex-direction: column; gap: 6px"><span class="ms fill" style="color: #A9CBF5" aria-hidden="true">smart_toy</span><span style="font-size: 13px; font-weight: 700">Боты</span><span style="font-size: 11px; color: #8FD3AC; font-weight: 700">+ Добавить</span></button>
    </div>
  </div>

  <sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
    <button aria-label="Закрыть" onClick="{{closeNew}}" style="position: absolute; inset: 0; width: 100%; background: rgba(0,0,0,.55); animation: kxFade .2s ease both"></button>
    <div role="dialog" aria-label="Новая папка" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 22px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, rgba(34,44,39,.94), rgba(16,20,18,.97)); border-top: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); animation: kxSheet .38s cubic-bezier(.2,.9,.25,1) both">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 0 auto 12px"></div>
      <div style="font-size: 19px; font-weight: 800">Новая папка</div>
      <div style="margin-top: 12px; display: flex; gap: 10px; align-items: center">
        <span style="width: 52px; height: 52px; border-radius: 18px; background: rgba(143,211,172,.16); color: #8FD3AC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms fill" aria-hidden="true">{{newIcon}}</span></span>
        <label style="flex-grow: 1; height: 52px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(143,211,172,.4); display: flex; align-items: center; padding: 0 14px"><input aria-label="Название папки" placeholder="Название папки" value="{{newName}}" onChange="{{onName}}" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #EEF3EF; font: inherit; font-size: 15px"></label>
      </div>
      <div style="margin-top: 10px; display: flex; gap: 6px">
        <sc-for list="{{icons}}" as="i" hint-placeholder-count="6"><button aria-label="{{i.icon}}" onClick="{{i.pick}}" style="width: 44px; height: 44px; border-radius: 14px; background: {{i.bg}}; color: {{i.ink}}; display: flex; align-items: center; justify-content: center; transition: background .2s"><span class="ms fill" style="font-size: 21px" aria-hidden="true">{{i.icon}}</span></button></sc-for>
      </div>
      <div style="margin-top: 14px; font-size: 13px; font-weight: 800; color: #8FD3AC">Какие чаты показывать</div>
      <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="5"><button onClick="{{t.flip}}" style="height: 34px; padding: 0 12px; border-radius: 17px; background: {{t.bg}}; color: {{t.color}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px; transition: background .2s"><sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><span class="ms" style="font-size: 16px" aria-hidden="true">check</span></sc-if>{{t.label}}</button></sc-for>
      </div>
      <button onClick="{{save}}" style="margin-top: 16px; width: 100%; height: 54px; border-radius: 18px; background: {{saveBg}}; color: {{saveInk}}; font-size: 15px; font-weight: 800; text-align: center">Создать</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
  super(props);
  this.state = { list: [
    { id: 1, title: 'Работа', icon: 'work', sub: '8 чатов · 2 непрочитанных', bg: '#1F2E40', ink: '#A9CBF5' },
    { id: 2, title: 'Семья', icon: 'home', sub: '3 чата', bg: '#3A1E2A', ink: '#FF9CC8' },
    { id: 3, title: 'Каналы', icon: 'campaign', sub: 'Все каналы', bg: '#3B2A22', ink: '#FFB68F' }
  ], moved: null, editing: false, newName: '', newIcon: 'folder', types: { users: true, groups: false, channels: false, bots: false, unread: false } };
}
add(f) { const id = Date.now(); this.setState({ list: this.state.list.concat([Object.assign({ id }, f)]), moved: id }); }
move(i, d) {
  const l = this.state.list.slice(), j = i + d;
  if (j < 0 || j >= l.length) return;
  const t = l[i]; l[i] = l[j]; l[j] = t;
  this.setState({ list: l, moved: t.id });
}
renderVals() {
  const s = this.state, n = s.list.length;
  const folders = s.list.map((f, i) => Object.assign({}, f, {
    anim: s.moved === f.id ? 'kxFlash .6s ease both' : 'kxRise .3s ease both',
    upInk: i === 0 ? '#3A4540' : '#C9D2CC', downInk: i === n - 1 ? '#3A4540' : '#C9D2CC',
    up: () => this.move(i, -1), down: () => this.move(i, 1)
  }));
  const iconList = ['folder', 'work', 'home', 'school', 'favorite', 'sports_esports'];
  const icons = iconList.map(icon => ({ icon, bg: icon === s.newIcon ? '#8FD3AC' : 'rgba(255,255,255,.07)', ink: icon === s.newIcon ? '#06150D' : '#C9D2CC', pick: () => this.setState({ newIcon: icon }) }));
  const tDefs = [['users', 'Личные'], ['groups', 'Группы'], ['channels', 'Каналы'], ['bots', 'Боты'], ['unread', 'Только непрочитанные']];
  const types = tDefs.map(([k, label]) => {
    const on = s.types[k];
    return { label, on, bg: on ? '#8FD3AC' : 'rgba(255,255,255,.07)', color: on ? '#06150D' : '#C9D2CC', flip: () => this.setState({ types: Object.assign({}, s.types, { [k]: !on }) }) };
  });
  const ok = s.newName.trim().length > 0;
  return {
    folders, icons, types,
    preview: s.list.map(f => ({ title: f.title, icon: f.icon })),
    editing: s.editing, newName: s.newName, newIcon: s.newIcon,
    onName: (e) => this.setState({ newName: e.target.value }),
    openNew: () => this.setState({ editing: true, newName: '', newIcon: 'folder' }),
    closeNew: () => this.setState({ editing: false }),
    saveBg: ok ? 'linear-gradient(100deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.07)', saveInk: ok ? '#06150D' : '#8A958F',
    save: () => {
      if (!ok) return;
      const picked = tDefs.filter(([k]) => s.types[k]).map(([, l]) => l.toLowerCase());
      this.setState({ editing: false });
      this.add({ title: s.newName.trim(), icon: s.newIcon, sub: picked.length ? picked.join(', ') : 'Пустая', bg: '#1F3A2C', ink: '#8FD3AC' });
    },
    addUnread: () => { if (!s.list.some(f => f.title === 'Непрочитанные')) this.add({ title: 'Непрочитанные', icon: 'mark_chat_unread', sub: 'Только непрочитанные', bg: '#3B2A22', ink: '#FFB68F' }); },
    addBots: () => { if (!s.list.some(f => f.title === 'Боты')) this.add({ title: 'Боты', icon: 'smart_toy', sub: 'Все боты', bg: '#1F2E40', ink: '#A9CBF5' }); }
  };
}
}
</script>
</body>
</html>
