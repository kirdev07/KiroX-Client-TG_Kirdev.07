<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Удалить чат</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxDim{from{opacity:0}to{opacity:1}}
@keyframes kxUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes kxRing{from{stroke-dashoffset:0}to{stroke-dashoffset:75.4}}
@keyframes kxRing2{from{stroke-dashoffset:0}to{stroke-dashoffset:75.4}}
@keyframes kxBack{0%{background:rgba(143,211,172,.18)}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 14px 16px 8px; display: flex; align-items: center"><span style="flex: 1; font-size: 26px; font-weight: 800">Чаты</span><span class="ms" style="color: #9AA59F" aria-hidden="true">search</span></div>
  <div style="padding: 0 16px 8px; font-size: 12px; color: #8A958F">Нажмите на чат, чтобы открыть меню удаления</div>
  <div class="scroll" style="flex: 1; min-height: 0; padding: 0 8px">
    <sc-for list="{{chats}}" as="c" hint-placeholder-count="7">
      <button onClick="{{c.tap}}" aria-label="{{c.aria}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: {{c.pad}}; max-height: {{c.mh}}; opacity: {{c.op}}; overflow: hidden; border-radius: 18px; transition: max-height .35s ease, padding .35s ease, opacity .25s ease; background: {{c.bg}}; animation: {{c.anim}}">
        <span style="width: 50px; height: 50px; border-radius: 25px; background: {{c.c}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; flex-shrink: 0">{{c.l}}</span>
        <span style="flex: 1; min-width: 0"><span style="display: flex; align-items: center; gap: 4px"><span class="ms fill" style="font-size: 16px; color: #8FD3AC; display: {{c.grpShow}}" aria-hidden="true">group</span><span style="flex: 1; font-size: 15px; font-weight: 700">{{c.name}}</span><span style="font-size: 12px; color: #8A958F">{{c.t}}</span></span><span style="display: block; font-size: 13px; color: #9AA59F; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{c.msg}}</span></span>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{undo}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 12px; right: 12px; bottom: 18px; height: 56px; padding: 0 8px 0 12px; border-radius: 20px; background: rgba(40,48,44,.97); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 10px 30px rgba(0,0,0,.45); display: flex; align-items: center; gap: 12px; animation: kxUp .25s ease both">
      <span style="position: relative; width: 30px; height: 30px; flex-shrink: 0">
        <svg width="30" height="30" viewBox="0 0 30 30" style="transform: rotate(-90deg)" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="3"></circle><circle cx="15" cy="15" r="12" fill="none" stroke="#8FD3AC" stroke-width="3" stroke-linecap="round" stroke-dasharray="75.4" style="animation: {{ringAnim}}"></circle></svg>
        <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums">{{left}}</span>
      </span>
      <span style="flex: 1; font-size: 14px; font-weight: 700">{{undoText}}</span>
      <button onClick="{{doUndo}}" style="height: 40px; padding: 0 14px; border-radius: 20px; color: #8FD3AC; font-size: 14px; font-weight: 800">Вернуть</button>
    </div>
  </sc-if>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
    <button onClick="{{close}}" aria-label="Закрыть" style="position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: kxDim .2s ease both"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 18px 24px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, rgba(40,48,44,.99), rgba(18,22,20,1)); border-top: 1px solid rgba(255,255,255,.16); animation: kxSheet .35s cubic-bezier(.2,.8,.2,1) both">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 0 auto 14px"></div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 52px; height: 52px; border-radius: 26px; background: {{selC}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">{{selL}}</span>
        <div style="flex: 1"><div style="font-size: 18px; font-weight: 800">{{sheetTitle}}</div><div style="font-size: 13px; color: #9AA59F">{{sheetSub}}</div></div>
      </div>
      <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{choices}}" as="o" hint-placeholder-count="2"><button onClick="{{o.tap}}" role="radio" aria-checked="{{o.on}}" style="padding: 12px 14px; border-radius: 18px; background: {{o.bg}}; border: 1.5px solid {{o.bd}}; display: flex; align-items: center; gap: 12px; transition: all .2s"><span class="ms" style="color: {{o.ic}}" aria-hidden="true">{{o.i}}</span><span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 800">{{o.t}}</span><span style="display: block; margin-top: 2px; font-size: 12px; color: #9AA59F; line-height: 1.35">{{o.s}}</span></span><span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{o.rb}}; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{o.dot}}"></span></span></button></sc-for>
      </div>
      <div style="margin-top: 14px; display: flex; gap: 8px">
        <button onClick="{{close}}" style="flex: 1; height: 52px; border-radius: 26px; background: rgba(255,255,255,.08); font-size: 15px; font-weight: 700; text-align: center">Отмена</button>
        <button onClick="{{confirm}}" style="flex: 1.4; height: 52px; border-radius: 26px; background: #E5534B; color: #fff; font-size: 15px; font-weight: 800; text-align: center">{{confirmText}}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CH = [
  { name: 'Анна', gen: 'Анны', ins: 'Анной', l: 'А', c: '#C0443C', msg: 'До завтра 👋', t: '19:40', g: false },
  { name: 'Семья', l: 'С', c: '#2F6E9E', msg: 'Мама: фото с дачи', t: '18:20', g: true },
  { name: 'Олег', gen: 'Олега', ins: 'Олегом', l: 'О', c: '#9AA59F', msg: 'Ок', t: '17:05', g: false },
  { name: 'Kotlin-клуб', l: 'K', c: '#3F9A6C', msg: 'Дмитрий: PR готов', t: '16:40', g: true },
  { name: 'Лиза', gen: 'Лизы', ins: 'Лизой', l: 'Л', c: '#6A4C9C', msg: 'Сюрприз готов 🎁', t: '15:30', g: false },
  { name: 'Доставка 24', gen: 'Доставки 24', ins: '«Доставкой 24»', l: 'Д', c: '#B07A2E', msg: 'Ваш заказ в пути', t: 'вчера', g: false },
  { name: 'Работа', l: 'Р', c: '#5C6661', msg: 'Созвон в понедельник', t: 'вчера', g: true }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sel: -1, opt: 0, gone: {}, pend: -1, left: 5, rk: 0, back: -1 }; }
componentWillUnmount() { clearInterval(this.iv); }
startTimer(i) {
  clearInterval(this.iv);
  this.iv = setInterval(() => {
    const s = this.state;
    if (s.left <= 1) { clearInterval(this.iv); this.setState({ pend: -1, left: 5 }); }
    else this.setState({ left: s.left - 1 });
  }, 1000);
}
renderVals() {
  const s = this.state;
  const sel = s.sel >= 0 ? CH[s.sel] : null;
  const g = sel && sel.g;
  const first = sel && sel.gen ? sel.gen : '';
  const opts = g
    ? [['logout', 'Выйти из группы', 'Пропадёт из списка, сообщения у участников останутся'], ['delete_forever', 'Выйти и очистить у себя', 'Плюс удалим кэш фото и файлов этой группы']]
    : [['person', 'Удалить только у меня', 'У собеседника переписка останется'], ['group_remove', 'Удалить у меня и у собеседника', 'Переписка исчезнет у обоих']];
  const pendName = s.pend >= 0 ? CH[s.pend].name : '';
  return {
    chats: CH.map((c, i) => {
      const hid = !!s.gone[i];
      return { ...c, grpShow: c.g ? 'inline' : 'none', aria: 'Удалить чат ' + c.name,
        pad: hid ? '0 8px' : '10px 8px', mh: hid ? '0px' : '80px', op: hid ? 0 : 1,
        bg: 'transparent', anim: s.back === i ? 'kxBack 1.2s ease both' : 'none',
        tap: () => !hid && this.setState({ sel: i, opt: 0 }) };
    }),
    sheet: !!sel,
    selC: sel ? sel.c : '#333', selL: sel ? sel.l : '',
    sheetTitle: sel ? (g ? 'Выйти из «' + sel.name + '»?' : 'Удалить чат «' + sel.name + '»?') : '',
    sheetSub: g ? 'Вернуться можно по ссылке-приглашению' : 'Сообщения нельзя будет восстановить после 5 секунд',
    choices: opts.map(([i, t, sub], k) => { const on = s.opt === k; return { i, t, s: sub, on: on ? 'true' : 'false',
      bg: on ? 'rgba(229,83,75,.10)' : 'rgba(255,255,255,.05)', bd: on ? 'rgba(229,83,75,.55)' : 'transparent',
      ic: on ? '#FF8A80' : '#9AA59F', rb: on ? '#FF8A80' : 'rgba(255,255,255,.3)', dot: on ? '#FF8A80' : 'transparent',
      tap: () => this.setState({ opt: k }) }; }),
    confirmText: g ? 'Выйти' : 'Удалить',
    close: () => this.setState({ sel: -1 }),
    confirm: () => { const i = s.sel; this.setState({ sel: -1, gone: { ...s.gone, [i]: true }, pend: i, left: 5, rk: s.rk + 1, back: -1 }); this.startTimer(i); },
    undo: s.pend >= 0, left: s.left,
    ringAnim: (s.rk % 2 ? 'kxRing2' : 'kxRing') + ' 5s linear both',
    undoText: (CH[s.pend] && CH[s.pend].g ? 'Вы вышли из «' : 'Чат «') + pendName + (CH[s.pend] && CH[s.pend].g ? '»' : '» удалён'),
    doUndo: () => { clearInterval(this.iv); const i = s.pend; const gone = { ...s.gone }; delete gone[i]; this.setState({ gone, pend: -1, left: 5, back: i }); }
  };
}
}
</script>
</body>
</html>
