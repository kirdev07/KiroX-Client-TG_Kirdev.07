<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Время в kiroX</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxLeaf{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 800">Время в kiroX</h1>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 16px 30px">
    <!-- Today -->
    <div style="padding: 16px; border-radius: 24px; background: radial-gradient(100% 90% at 100% 0%, rgba(63,154,108,.28), transparent 60%), rgba(255,255,255,.04); border: 1px solid rgba(143,211,172,.2)">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="flex: 1"><div style="font-size: 12px; color: #9AA59F">{{dayLabel}}</div><div style="margin-top: 2px; font-size: 34px; font-weight: 800; letter-spacing: -1px">{{dayTime}}</div></div>
        <span class="ms fill" style="font-size: 40px; color: #8FD3AC; animation: kxLeaf 3s ease-in-out 2; transform-origin: bottom center" aria-hidden="true">eco</span>
      </div>
      <div style="margin-top: 4px; font-size: 13px; color: {{cmpInk}}">{{cmp}}</div>

      <!-- Bars -->
      <div style="position: relative; margin-top: 16px; height: 130px; display: flex; align-items: flex-end; gap: 8px">
        <span style="position: absolute; left: 0; right: 0; bottom: {{limitY}}; border-top: 1.5px dashed rgba(232,176,74,.7)" aria-hidden="true"></span>
        <span style="position: absolute; right: 0; bottom: {{limitY}}; transform: translateY(-100%); font-size: 11px; color: #E8B04A; padding-bottom: 2px">лимит {{limitText}}</span>
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
          <button onClick="{{b.tap}}" aria-label="{{b.label}}" style="flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px">
            <span style="width: 100%; height: {{b.h}}; border-radius: 4px 4px 2px 2px; background: {{b.c}}; transform-origin: bottom; animation: kxGrow .6s cubic-bezier(.2,.8,.2,1) {{b.d}} both; transition: background .2s"></span>
            <span style="font-size: 11px; color: {{b.ink}}; font-weight: {{b.fw}}">{{b.wd}}</span>
          </button>
        </sc-for>
      </div>
      <div style="margin-top: 6px; font-size: 11px; color: #8A958F">Нажмите на день, чтобы посмотреть подробнее</div>
    </div>

    <!-- Where -->
    <div style="margin-top: 14px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Где проводили время · {{dayShort}}</div>
    <div style="padding: 12px 14px; border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{where}}" as="w" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; animation: kxIn .25s ease both">
          <span style="width: 34px; height: 34px; border-radius: 17px; background: {{w.c}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">{{w.l}}</span>
          <span style="flex: 1"><span style="display: flex; align-items: baseline"><span style="flex: 1; font-size: 14px; font-weight: 700">{{w.name}}</span><span style="font-size: 13px; color: #C9D2CC; font-variant-numeric: tabular-nums">{{w.t}}</span></span><span style="display: block; margin-top: 4px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.06); overflow: hidden"><span style="display: block; height: 100%; width: {{w.w}}; background: #8FD3AC; border-radius: 0 3px 3px 0; transition: width .4s"></span></span></span>
        </div>
      </sc-for>
    </div>

    <!-- Limits -->
    <div style="margin-top: 14px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Дневной лимит</div>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px">
      <sc-for list="{{limits}}" as="l" hint-placeholder-count="4"><button onClick="{{l.tap}}" style="height: 42px; border-radius: 14px; background: {{l.bg}}; color: {{l.ink}}; border: 1px solid {{l.bd}}; font-size: 13px; font-weight: 700; text-align: center">{{l.label}}</button></sc-for>
    </div>
    <div style="margin-top: 12px; border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); overflow: hidden">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
        <button onClick="{{o.tap}}" style="width: 100%; padding: 13px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.05)">
          <span class="ms" style="color: #9AA59F" aria-hidden="true">{{o.icon}}</span>
          <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">{{o.label}}</span><span style="display: block; font-size: 12px; color: #8A958F">{{o.sub}}</span></span>
          <span style="width: 48px; height: 28px; border-radius: 14px; background: {{o.track}}; position: relative; transition: background .2s; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{o.knob}}; width: 22px; height: 22px; border-radius: 11px; background: {{o.knobBg}}; transition: left .2s"></span></span>
        </button>
      </sc-for>
    </div>
    <p style="margin: 12px 4px 0; font-size: 12px; line-height: 1.45; color: #8A958F">Считается только на этом телефоне. kiroX никуда не отправляет эти данные.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const DAYS = [['Пн', 82, 'понедельник'], ['Вт', 64, 'вторник'], ['Ср', 95, 'среда'], ['Чт', 51, 'четверг'], ['Пт', 118, 'пятница'], ['Сб', 74, 'суббота'], ['Вс', 47, 'сегодня']];
const SPLIT = [['Kotlin-клуб', 'K', '#3F9A6C', .34], ['Мама', 'М', '#B07A2E', .22], ['Каналы', 'К', '#2F6E9E', .26], ['Анна', 'А', '#C0443C', .18]];
const LIMITS = [['Нет', 0], ['45 мин', 45], ['1 час', 60], ['1,5 ч', 90]];
const hm = m => m >= 60 ? Math.floor(m / 60) + ' ч ' + (m % 60) + ' мин' : m + ' мин';
class Component extends DCLogic {
constructor(props) { super(props); this.state = { day: 6, limit: 60, breakR: true, night: false }; }
renderVals() {
  const s = this.state;
  const max = 130;
  const d = DAYS[s.day];
  const avg = Math.round(DAYS.reduce((a, x) => a + x[1], 0) / 7);
  const sw = v => ({ track: v ? '#3F9A6C' : 'rgba(255,255,255,.14)', knob: v ? '23px' : '3px', knobBg: v ? '#EEF3EF' : '#9AA59F' });
  return {
    dayLabel: s.day === 6 ? 'Сегодня' : d[2][0].toUpperCase() + d[2].slice(1), dayTime: hm(d[1]), dayShort: d[2],
    cmp: d[1] < avg ? 'На ' + (avg - d[1]) + ' мин меньше, чем обычно 🌿' : 'На ' + (d[1] - avg) + ' мин больше, чем обычно', cmpInk: d[1] < avg ? '#8FD3AC' : '#E8B04A',
    limitY: s.limit ? (s.limit / max * 106 + 18) + 'px' : '-100px', limitText: hm(s.limit),
    bars: DAYS.map(([wd, m], i) => { const over = s.limit && m > s.limit; const on = s.day === i; return { wd, h: (m / max * 106) + 'px', c: on ? (over ? '#E8B04A' : '#8FD3AC') : over ? 'rgba(232,176,74,.4)' : 'rgba(143,211,172,.35)', ink: on ? '#EEF3EF' : '#8A958F', fw: on ? '800' : '500', d: (i * 0.05) + 's', label: DAYS[i][2] + ': ' + hm(m), tap: () => this.setState({ day: i }) }; }),
    where: SPLIT.map(([name, l, c, f]) => ({ name, l, c, t: hm(Math.round(d[1] * f)), w: (f / .34 * 100) + '%' })),
    limits: LIMITS.map(([label, v]) => ({ label, bg: s.limit === v ? 'rgba(143,211,172,.16)' : 'rgba(255,255,255,.05)', ink: s.limit === v ? '#8FD3AC' : '#C9D2CC', bd: s.limit === v ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', tap: () => this.setState({ limit: v }) })),
    opts: [
      { icon: 'self_improvement', label: 'Напоминать о перерыве', sub: 'Мягкое уведомление после 30 минут подряд', k: 'breakR' },
      { icon: 'bedtime', label: 'Тише после 23:00', sub: 'Уведомления без звука, экран чатов приглушён', k: 'night' }
    ].map(o => { const w = sw(s[o.k]); return { ...o, track: w.track, knob: w.knob, knobBg: w.knobBg, tap: () => this.setState({ [o.k]: !s[o.k] }) }; })
  };
}
}
</script>
</body>
</html>
