<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Просмотры истории</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxFloat{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-120px) scale(1.1);opacity:0}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #050606; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <!-- Story behind, shrunk -->
  <div style="position: absolute; left: 50%; top: 18px; width: 220px; height: 340px; margin-left: -110px; border-radius: 22px; overflow: hidden; background: radial-gradient(70% 50% at 30% 25%, #F2B866, transparent 60%), linear-gradient(180deg, #E07A4F 0%, #6A4C9C 60%, #1E1530 100%); box-shadow: 0 20px 50px rgba(0,0,0,.5)">
    <div style="position: absolute; left: 10px; right: 10px; top: 8px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.4)"><div style="width: 60%; height: 100%; border-radius: 2px; background: #fff"></div></div>
    <svg viewBox="0 0 220 340" width="220" height="340" style="position: absolute; inset: 0" aria-hidden="true"><path d="M0 250 L50 190 L90 220 L140 160 L190 210 L220 190 L220 340 L0 340 Z" fill="#2A1E40"></path></svg>
    <div style="position: absolute; left: 12px; bottom: 12px; font-size: 13px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,.5)">Закат над Медеу 🌄</div>
    <sc-for list="{{floaters}}" as="f" hint-placeholder-count="3"><span style="position: absolute; left: {{f.x}}; bottom: 40px; font-size: 22px; animation: kxFloat 2.4s ease-out {{f.d}} 2">{{f.e}}</span></sc-for>
  </div>

  <!-- Sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 470px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, rgba(30,36,33,.98), rgba(14,17,15,1)); border-top: 1px solid rgba(255,255,255,.14); display: flex; flex-direction: column; animation: kxSheet .4s cubic-bezier(.2,.8,.2,1) both">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 10px auto 10px"></div>
    <div style="padding: 0 16px; display: flex; align-items: center; gap: 10px">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 800"><span class="ms" style="color: #8FD3AC" aria-hidden="true">visibility</span>{{total}}</span>
      <span style="display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; color: #FF8A80"><span class="ms fill" style="font-size: 20px" aria-hidden="true">favorite</span>{{likes}}</span>
      <span style="flex: 1"></span>
      <button onClick="{{share}}" aria-label="Поделиться историей" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 20px" aria-hidden="true">ios_share</span></button>
      <button onClick="{{del}}" aria-label="Удалить историю" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(229,83,75,.12); color: #FF8A80; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 20px" aria-hidden="true">delete</span></button>
    </div>
    <div style="padding: 12px 16px 6px; display: flex; gap: 6px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button onClick="{{t.tap}}" style="height: 32px; padding: 0 12px; border-radius: 16px; background: {{t.bg}}; color: {{t.ink}}; font-size: 12px; font-weight: 700; transition: all .2s">{{t.label}}</button></sc-for>
    </div>
    <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 10px 16px">
      <sc-for list="{{viewers}}" as="v" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 12px; padding: 8px 6px; animation: kxIn .25s ease {{v.d}} both">
          <span style="position: relative; width: 44px; height: 44px; border-radius: 22px; background: {{v.c}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; flex-shrink: 0">{{v.l}}
            <sc-if value="{{v.close}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 9px; background: #8FD3AC; color: #06150D; border: 2px solid #121614; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 11px" aria-hidden="true">star</span></span></sc-if>
          </span>
          <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 700">{{v.name}}</span><span style="display: block; font-size: 12px; color: #8A958F">{{v.time}}</span></span>
          <sc-if value="{{v.hasReact}}" hint-placeholder-val="{{false}}"><span style="font-size: 24px">{{v.react}}</span></sc-if>
          <button onClick="{{v.reply}}" aria-label="{{v.replyLabel}}" style="width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; color: #C9D2CC"><span class="ms" style="font-size: 18px" aria-hidden="true">chat</span></button>
        </div>
      </sc-for>
      <div style="margin: 10px 6px 0; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.04); font-size: 12px; color: #8A958F; display: flex; gap: 8px"><span class="ms" style="font-size: 18px" aria-hidden="true">schedule</span>{{expire}}</div>
    </div>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 34px; padding: 12px 18px; border-radius: 18px; background: #232A26; border: 1px solid rgba(255,255,255,.16); font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2.4s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">{{toastIcon}}</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const V = [
  ['Анна', 'А', '#C0443C', '2 мин назад', '❤️', true], ['Мама', 'М', '#B07A2E', '10 мин назад', '😍', true], ['Дмитрий', 'Д', '#2F6E9E', '25 мин назад', '🔥', false],
  ['Мария', 'М', '#6A4C9C', '40 мин назад', '', false], ['Олег', 'О', '#5C6661', '1 ч назад', '❤️', false], ['Алекс', 'А', '#3F9A6C', '2 ч назад', '', true], ['Лиза', 'Л', '#C0443C', '3 ч назад', '👏', false]
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 0, toast: 0, toastText: '', toastIcon: 'done' }; }
componentWillUnmount() { clearTimeout(this.tt); }
toastMsg(text, icon) { clearTimeout(this.tt); this.setState({ toast: this.state.toast + 1, toastText: text, toastIcon: icon }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2400); }
renderVals() {
  const s = this.state;
  const reacted = V.filter(v => v[4]);
  const list = s.tab === 0 ? V : s.tab === 1 ? reacted : V.filter(v => v[5]);
  return {
    total: '1 248', likes: String(reacted.filter(v => v[4] === '❤️').length + 86),
    floaters: [['❤️', '30px', '0s'], ['🔥', '110px', '.8s'], ['😍', '170px', '1.6s']].map(([e, x, d]) => ({ e, x, d })),
    tabs: [['Все · 1 248', 0], ['С реакцией · ' + (reacted.length + 92), 1], ['Близкие друзья', 2]].map(([label, i]) => ({ label, bg: s.tab === i ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.05)', ink: s.tab === i ? '#8FD3AC' : '#C9D2CC', tap: () => this.setState({ tab: i }) })),
    viewers: list.map(([name, l, c, time, react, close], k) => ({ name, l, c, time, react, close, hasReact: !!react, d: (k * 0.04) + 's', replyLabel: 'Ответить: ' + name, reply: () => this.toastMsg('Откроется чат «' + name + '»', 'chat') })),
    expire: 'История исчезнет через 19 ч. Список просмотров хранится ещё сутки после этого.',
    share: () => this.toastMsg('Ссылка на историю скопирована', 'link'),
    del: () => this.toastMsg('Удаление попросит подтверждения', 'delete'),
    toast: s.toast > 0, toastText: s.toastText, toastIcon: s.toastIcon
  };
}
}
</script>
</body>
</html>
