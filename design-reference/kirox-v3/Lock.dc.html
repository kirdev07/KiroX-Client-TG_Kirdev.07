<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Код-пароль</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94)}
@keyframes kxShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
@keyframes kxFill{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes kxGlow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes kxOpen{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-6px) rotate(-12deg)}}
@keyframes kxUnlock{from{opacity:1}to{opacity:0;transform:scale(1.06)}}
@keyframes kxFp{0%,100%{box-shadow:0 0 0 0 rgba(143,211,172,.45)}50%{box-shadow:0 0 0 10px rgba(143,211,172,0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <sc-if value="{{unlocked}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: radial-gradient(70% 45% at 50% 45%, rgba(63,154,108,.25), #0A0C0B 70%)">
      <span class="ms fill" style="font-size: 64px; color: #8FD3AC" aria-hidden="true">lock_open</span>
      <span style="font-size: 20px; font-weight: 800">kiroX открыт</span>
      <button onClick="{{lockAgain}}" style="margin-top: 8px; height: 44px; padding: 0 20px; border-radius: 22px; background: rgba(255,255,255,.08); font-size: 14px; font-weight: 700">Заблокировать снова</button>
    </div>
  </sc-if>

  <sc-if value="{{locked}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; animation: {{exitAnim}}">
      <div aria-hidden="true" style="position: absolute; left: 50%; top: 130px; width: 280px; height: 280px; margin-left: -140px; border-radius: 50%; background: radial-gradient(circle, rgba(70,160,110,.22), rgba(70,160,110,0) 65%); animation: kxGlow 4s ease-in-out 2"></div>
      <div style="position: relative; padding-top: 120px; display: flex; flex-direction: column; align-items: center">
        <span style="width: 76px; height: 76px; border-radius: 26px; background: linear-gradient(145deg, #1D2A23, #121714); border: 1px solid #2A3A31; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 40px rgba(0,0,0,.5)"><span class="ms fill" style="font-size: 38px; color: {{lockInk}}; animation: {{lockAnim}}; transition: color .3s" aria-hidden="true">{{lockIcon}}</span></span>
        <div style="margin-top: 22px; font-size: 20px; font-weight: 800">Введите код-пароль</div>
        <div style="margin-top: 6px; height: 18px; font-size: 13px; color: {{hintInk}}">{{hint}}</div>
        <div style="margin-top: 24px; display: flex; gap: 16px; animation: {{shake}}">
          <sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="width: 16px; height: 16px; border-radius: 8px; background: {{d.bg}}; border: 2px solid {{d.border}}; box-sizing: border-box; animation: {{d.anim}}; transition: background .15s"></span></sc-for>
        </div>
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 70px; padding: 0 44px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 22px; justify-items: center">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <sc-if value="{{k.isNum}}" hint-placeholder-val="{{true}}"><button aria-label="{{k.n}}" onClick="{{k.tap}}" style="width: 72px; height: 72px; border-radius: 36px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); box-shadow: inset 0 1px 0 rgba(255,255,255,.1); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform .1s"><span style="font-size: 28px; font-weight: 500; line-height: 1">{{k.n}}</span><span style="font-size: 11px; letter-spacing: 1.5px; color: #8A958F; height: 11px">{{k.sub}}</span></button></sc-if>
          <sc-if value="{{k.isFp}}" hint-placeholder-val="{{false}}"><button aria-label="Вход по отпечатку" onClick="{{k.tap}}" style="width: 72px; height: 72px; border-radius: 36px; display: flex; align-items: center; justify-content: center; color: #8FD3AC; animation: kxFp 2.4s ease-in-out 2"><span class="ms" style="font-size: 34px" aria-hidden="true">fingerprint</span></button></sc-if>
          <sc-if value="{{k.isDel}}" hint-placeholder-val="{{false}}"><button aria-label="Стереть" onClick="{{k.tap}}" style="width: 72px; height: 72px; border-radius: 36px; display: flex; align-items: center; justify-content: center; color: #C9D2CC"><span class="ms" style="font-size: 28px" aria-hidden="true">backspace</span></button></sc-if>
        </sc-for>
      </div>
      <button style="position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; font-size: 13px; color: #8A958F">Забыли код?</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { code: '', wrong: 0, state: 'locked', tries: 0 }; }
componentWillUnmount() { clearTimeout(this.t); }
enter(d) {
  const s = this.state;
  if (s.state !== 'locked' || s.code.length >= 4) return;
  const code = s.code + d;
  this.setState({ code });
  if (code.length === 4) {
    clearTimeout(this.t);
    this.t = setTimeout(() => {
      if (code === '1234') { this.setState({ state: 'opening' }); this.t = setTimeout(() => this.setState({ state: 'open', code: '' }), 650); }
      else this.setState({ code: '', wrong: Date.now(), tries: this.state.tries + 1 });
    }, 180);
  }
}
renderVals() {
  const s = this.state;
  const opening = s.state === 'opening';
  const dots = [0, 1, 2, 3].map(i => {
    const on = i < s.code.length;
    return { bg: opening ? '#8FD3AC' : on ? '#EEF3EF' : 'transparent', border: opening ? '#8FD3AC' : on ? '#EEF3EF' : '#3A4540', anim: on && i === s.code.length - 1 ? 'kxFill .2s ease' : 'none' };
  });
  const subs = { 2: 'ABC', 3: 'DEF', 4: 'GHI', 5: 'JKL', 6: 'MNO', 7: 'PQRS', 8: 'TUV', 9: 'WXYZ' };
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'fp', '0', 'del'].map(n => ({
    n, sub: subs[n] || '', isNum: n !== 'fp' && n !== 'del', isFp: n === 'fp', isDel: n === 'del',
    tap: () => {
      if (n === 'del') this.setState({ code: s.code.slice(0, -1) });
      else if (n === 'fp') { this.setState({ state: 'opening', code: '1234' }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ state: 'open', code: '' }), 650); }
      else this.enter(n);
    }
  }));
  const recentWrong = s.wrong && Date.now() - s.wrong < 1500;
  return {
    dots, keys,
    locked: s.state !== 'open', unlocked: s.state === 'open',
    exitAnim: opening ? 'kxUnlock .5s ease .2s both' : 'none',
    shake: recentWrong ? 'kxShake .45s ease' : 'none',
    lockIcon: opening ? 'lock_open' : 'lock', lockInk: opening ? '#8FD3AC' : recentWrong ? '#FF8A80' : '#8FD3AC',
    lockAnim: opening ? 'kxOpen .3s ease both' : 'none',
    hint: s.tries ? 'Неверный код · попыток: ' + s.tries : 'Макет: код 1234',
    hintInk: s.tries ? '#FF8A80' : '#8A958F',
    lockAgain: () => this.setState({ state: 'locked', code: '', tries: 0, wrong: 0 })
  };
}
}
</script>
</body>
</html>
