<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Загрузки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxStripe{from{background-position:0 0}to{background-position:28px 0}}
@keyframes kxDone{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes kxSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 22px; font-weight: 800">Загрузки</h1>
    <button onClick="{{toggleAll}}" style="height: 38px; padding: 0 14px; border-radius: 19px; background: rgba(255,255,255,.06); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span class="ms" style="font-size: 18px" aria-hidden="true">{{allIcon}}</span>{{allText}}</button>
  </header>

  <!-- Summary -->
  <div style="margin: 4px 16px 0; padding: 14px 16px; border-radius: 22px; background: linear-gradient(150deg, rgba(63,154,108,.18), rgba(255,255,255,.03)); border: 1px solid rgba(143,211,172,.2)">
    <div style="display: flex; align-items: baseline"><span style="flex: 1; font-size: 15px; font-weight: 800">{{sumTitle}}</span><span style="font-size: 13px; color: #8FD3AC; font-weight: 700">{{speed}}</span></div>
    <div style="margin-top: 10px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden"><div style="height: 100%; width: {{totalPct}}; border-radius: 4px; background: linear-gradient(90deg, #6FC497, #3F9A6C); transition: width .5s linear"></div></div>
    <div style="margin-top: 6px; font-size: 12px; color: #9AA59F">{{sumSub}}</div>
  </div>

  <div style="padding: 12px 16px 4px; display: flex; gap: 6px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button onClick="{{t.tap}}" style="height: 34px; padding: 0 14px; border-radius: 17px; background: {{t.bg}}; color: {{t.ink}}; font-size: 13px; font-weight: 700; transition: all .2s">{{t.label}}</button></sc-for>
  </div>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 6px 12px 30px">
    <sc-for list="{{items}}" as="f" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 6px; animation: kxIn .25s ease {{f.d}} both">
        <span style="position: relative; width: 50px; height: 50px; flex-shrink: 0">
          <span style="position: absolute; inset: 0; border-radius: 14px; background: {{f.c}}; color: #fff; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">{{f.icon}}</span></span>
          <sc-if value="{{f.done}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 10px; background: #8FD3AC; color: #06150D; border: 2px solid #0A0C0B; display: flex; align-items: center; justify-content: center; animation: kxDone .4s ease both"><span class="ms fill" style="font-size: 13px" aria-hidden="true">check</span></span></sc-if>
        </span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 14px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{f.name}}</span>
          <sc-if value="{{f.active}}" hint-placeholder-val="{{true}}">
            <span style="display: block; margin-top: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden"><span style="display: block; height: 100%; width: {{f.pct}}; border-radius: 3px; background: {{f.bar}}; background-size: 28px 100%; animation: {{f.stripe}}; transition: width .5s linear"></span></span>
          </sc-if>
          <span style="display: block; margin-top: 4px; font-size: 12px; color: {{f.subInk}}">{{f.sub}}</span>
        </span>
        <sc-if value="{{f.active}}" hint-placeholder-val="{{true}}">
          <button onClick="{{f.toggle}}" aria-label="{{f.btnLabel}}" style="width: 38px; height: 38px; border-radius: 19px; background: rgba(255,255,255,.07); color: {{f.btnInk}}; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 20px" aria-hidden="true">{{f.btnIcon}}</span></button>
          <button onClick="{{f.cancel}}" aria-label="Отменить" style="width: 38px; height: 38px; border-radius: 19px; display: flex; align-items: center; justify-content: center; color: #8A958F"><span class="ms" style="font-size: 20px" aria-hidden="true">close</span></button>
        </sc-if>
        <sc-if value="{{f.done}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #8A958F">{{f.from}}</span></sc-if>
      </div>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="padding: 60px 30px 0; text-align: center; animation: kxIn .3s ease both"><span class="ms" style="font-size: 54px; color: #3A4540" aria-hidden="true">download_done</span><div style="margin-top: 10px; font-size: 16px; font-weight: 700">{{emptyText}}</div></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const F = [
  { name: 'Фильм про горы.mp4', size: 1460, icon: 'movie', c: '#2F6E9E', from: 'Анна', got: 410 },
  { name: 'Фото с дачи.zip', size: 42, icon: 'folder_zip', c: '#B07A2E', from: 'Мама', got: 30 },
  { name: 'Лекция 7 — Compose.pdf', size: 18, icon: 'picture_as_pdf', c: '#C0443C', from: 'Kotlin-клуб', got: 3 },
  { name: 'Подкаст выпуск 42.mp3', size: 64, icon: 'graphic_eq', c: '#6A4C9C', from: 'Подкасты', got: 64, done: true },
  { name: 'kiroX-beta.apk', size: 31, icon: 'android', c: '#3F9A6C', from: 'Избранное', got: 31, done: true }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 0, list: F.map(f => ({ ...f, paused: false, gone: false })) }; }
componentDidMount() {
  this.iv = setInterval(() => {
    let changed = false;
    const list = this.state.list.map((f, i) => {
      if (f.gone || f.done || f.paused) return f;
      changed = true;
      const rate = [22, 2.6, 1.1][i] || 2;
      const got = Math.min(f.size, f.got + rate);
      return { ...f, got, done: got >= f.size };
    });
    if (changed) this.setState({ list });
  }, 500);
}
componentWillUnmount() { clearInterval(this.iv); }
renderVals() {
  const s = this.state;
  const fmt = mb => mb >= 1000 ? (mb / 1000).toFixed(2) + ' ГБ' : (mb < 10 ? mb.toFixed(1) : Math.round(mb)) + ' МБ';
  const live = s.list.filter(f => !f.gone);
  const active = live.filter(f => !f.done);
  const running = active.filter(f => !f.paused);
  const tot = active.reduce((a, f) => a + f.size, 0), got = active.reduce((a, f) => a + f.got, 0);
  const speedMb = running.length ? 4.2 : 0;
  const shown = live.map(f => ({ f, i: s.list.indexOf(f) })).filter(({ f }) => s.tab === 0 ? !f.done : f.done);
  const allPaused = running.length === 0 && active.length > 0;
  const set = (i, patch) => this.setState({ list: s.list.map((x, k) => k === i ? { ...x, ...patch } : x) });
  return {
    sumTitle: active.length ? 'Скачивается ' + active.length + ' из ' + live.length : 'Всё скачано',
    speed: running.length ? speedMb.toFixed(1) + ' МБ/с' : active.length ? 'на паузе' : '',
    totalPct: tot ? (got / tot * 100) + '%' : '100%',
    sumSub: active.length ? fmt(got) + ' из ' + fmt(tot) + (running.length ? ' · осталось ~' + Math.max(1, Math.round((tot - got) / Math.max(speedMb, 1) / 60)) + ' мин' : '') : 'Файлы лежат в папке kiroX',
    allIcon: allPaused ? 'play_arrow' : 'pause', allText: allPaused ? 'Продолжить все' : 'Пауза для всех',
    toggleAll: () => this.setState({ list: s.list.map(f => f.done ? f : { ...f, paused: !allPaused }) }),
    tabs: [['Активные', 0], ['Готово', 1]].map(([label, i]) => ({ label: label + ' · ' + (i === 0 ? active.length : live.length - active.length), bg: s.tab === i ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.05)', ink: s.tab === i ? '#8FD3AC' : '#C9D2CC', tap: () => this.setState({ tab: i }) })),
    items: shown.map(({ f, i }, k) => ({
      name: f.name, icon: f.icon, c: f.c, from: f.from, d: (k * 0.04) + 's', active: !f.done, done: f.done,
      pct: (f.got / f.size * 100) + '%',
      bar: f.paused ? '#5C6661' : 'repeating-linear-gradient(45deg, #8FD3AC 0 7px, #6FC497 7px 14px)', stripe: f.paused ? 'none' : 'kxStripe .8s linear 2',
      sub: f.done ? fmt(f.size) + ' · готово' : fmt(f.got) + ' из ' + fmt(f.size) + (f.paused ? ' · пауза' : ' · ' + Math.round(f.got / f.size * 100) + '%'),
      subInk: f.done ? '#8FD3AC' : f.paused ? '#E8B04A' : '#8A958F',
      btnIcon: f.paused ? 'play_arrow' : 'pause', btnLabel: f.paused ? 'Продолжить' : 'Пауза', btnInk: f.paused ? '#8FD3AC' : '#EEF3EF',
      toggle: () => set(i, { paused: !f.paused }), cancel: () => set(i, { gone: true })
    })),
    empty: shown.length === 0, emptyText: s.tab === 0 ? 'Нет активных загрузок' : 'Пока ничего не скачано'
  };
}
}
</script>
</body>
</html>
