<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Список дел</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
input{font:inherit;color:inherit}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxTick{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.3) rotate(5deg)}100%{transform:none}}
@keyframes kxConf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(220deg);opacity:0}}
@keyframes kxAv{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(135deg, #2F6E9E, #3F9A6C); display: flex; align-items: center; justify-content: center; font-weight: 800">С</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Семья</div><div style="font-size: 12px; color: #9AA59F">5 участников</div></div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; gap: 8px">
    <div style="align-self: flex-start; max-width: 80%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); font-size: 14px"><span style="font-size: 12px; font-weight: 800; color: #E8B04A; display: block">Мама</span>Кто что берёт на дачу в субботу?</div>

    <!-- Checklist message -->
    <div style="align-self: flex-end; width: 300px; position: relative; padding: 14px; border-radius: 22px 22px 6px 22px; background: linear-gradient(180deg, rgba(63,154,108,.28), rgba(63,154,108,.14)); border: 1px solid rgba(143,211,172,.35)">
      <div style="display: flex; align-items: center; gap: 8px"><span class="ms fill" style="color: #8FD3AC" aria-hidden="true">checklist</span><span style="flex: 1; font-size: 15px; font-weight: 800">На дачу в субботу</span><span style="font-size: 12px; font-weight: 800; color: #8FD3AC">{{doneText}}</span></div>
      <div style="margin-top: 8px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.25); overflow: hidden"><div style="height: 100%; width: {{pct}}; border-radius: 3px; background: #8FD3AC; transition: width .4s cubic-bezier(.2,.8,.2,1)"></div></div>
      <div style="margin-top: 8px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
          <button onClick="{{it.tap}}" aria-pressed="{{it.on}}" style="width: 100%; padding: 8px 2px; display: flex; align-items: center; gap: 10px">
            <span style="width: 24px; height: 24px; border-radius: 8px; border: 2px solid {{it.ring}}; background: {{it.fillBg}}; color: #06150D; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s"><sc-if value="{{it.on}}" hint-placeholder-val="{{false}}"><span class="ms" style="font-size: 18px; animation: kxTick .3s ease both" aria-hidden="true">check</span></sc-if></span>
            <span style="flex: 1; font-size: 14px; color: {{it.ink}}; text-decoration: {{it.strike}}; transition: color .2s">{{it.t}}</span>
            <sc-if value="{{it.on}}" hint-placeholder-val="{{false}}"><span style="width: 24px; height: 24px; border-radius: 12px; background: {{it.whoC}}; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; animation: kxAv .3s ease both">{{it.who}}</span></sc-if>
          </button>
        </sc-for>
      </div>
      <div style="margin-top: 6px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 8px">
        <span class="ms" style="color: #8FD3AC; font-size: 20px" aria-hidden="true">add</span>
        <input value="{{draft}}" onInput="{{onDraft}}" placeholder="Добавить пункт" aria-label="Новый пункт" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 14px">
        <sc-if value="{{canAdd}}" hint-placeholder-val="{{false}}"><button onClick="{{add}}" style="height: 28px; padding: 0 10px; border-radius: 14px; background: #8FD3AC; color: #06150D; font-size: 12px; font-weight: 800">Добавить</button></sc-if>
      </div>
      <div style="margin-top: 6px; text-align: right; font-size: 11px; color: #9AA59F">18:20 · все могут отмечать</div>
      <sc-if value="{{party}}" hint-placeholder-val="{{false}}">
        <sc-for list="{{conf}}" as="c" hint-placeholder-count="12"><span style="position: absolute; left: 150px; top: 40px; width: 8px; height: 8px; border-radius: 2px; background: {{c.c}}; --dx: {{c.dx}}; --dy: {{c.dy}}; animation: kxConf 1s ease-out {{c.d}} both; pointer-events: none"></span></sc-for>
      </sc-if>
    </div>
    <sc-if value="{{party}}" hint-placeholder-val="{{false}}"><div style="align-self: center; padding: 4px 12px; border-radius: 12px; background: rgba(143,211,172,.12); color: #8FD3AC; font-size: 12px; font-weight: 700; animation: kxIn .3s ease both">Список выполнен 🎉</div></sc-if>
  </div>

  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06); display: flex; gap: 8px; align-items: center">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(143,211,172,.14); color: #8FD3AC; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">checklist</span></span>
    <div style="flex: 1; height: 48px; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,.07); display: flex; align-items: center; font-size: 15px; color: #8A958F">Сообщение</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const WHO = { 'Я': '#3F9A6C', 'М': '#B07A2E', 'П': '#2F6E9E', 'Л': '#C0443C' };
const SEED = [['Мангал и уголь', 'П'], ['Мясо для шашлыка', ''], ['Овощи и зелень', 'М'], ['Пледы', ''], ['Настолки', 'Л'], ['Колонка', '']];
const COLORS = ['#8FD3AC', '#E8B04A', '#6FA9D8', '#F07AA0', '#B39DDB'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { items: SEED.map(([t, who]) => ({ t, who })), draft: '' }; }
renderVals() {
  const s = this.state;
  const n = s.items.length, done = s.items.filter(i => i.who).length;
  const d = s.draft.trim();
  return {
    doneText: done + ' из ' + n, pct: (done / n * 100) + '%',
    items: s.items.map((it, k) => ({
      t: it.t, on: !!it.who, who: it.who, whoC: WHO[it.who] || '#5C6661',
      ring: it.who ? '#8FD3AC' : 'rgba(255,255,255,.45)', fillBg: it.who ? '#8FD3AC' : 'transparent',
      ink: it.who ? '#9AA59F' : '#EEF3EF', strike: it.who ? 'line-through' : 'none',
      tap: () => this.setState({ items: s.items.map((x, j) => j === k ? { ...x, who: x.who === 'Я' ? '' : x.who ? x.who : 'Я' } : x) })
    })),
    draft: s.draft, onDraft: e => this.setState({ draft: e.target.value }), canAdd: !!d,
    add: () => d && this.setState({ items: [...s.items, { t: d, who: '' }], draft: '' }),
    party: done === n,
    conf: Array.from({ length: 14 }, (_, i) => { const a = i / 14 * Math.PI * 2; const r = 80 + (i % 3) * 25; return { c: COLORS[i % 5], dx: Math.round(Math.cos(a) * r) + 'px', dy: Math.round(Math.sin(a) * r) + 'px', d: (i % 4) * 0.04 + 's' }; })
  };
}
}
</script>
</body>
</html>
