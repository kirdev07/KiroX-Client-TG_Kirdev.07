<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Альбом в чате</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes kxUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}
@keyframes kxCheck{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(135deg, #B07A2E, #6A4C9C); display: flex; align-items: center; justify-content: center; font-weight: 800">М</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Мама</div><div style="font-size: 12px; color: #8FD3AC">в сети</div></div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end">
    <div style="align-self: flex-start; max-width: 80%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); font-size: 15px">Как съездили? Покажи фото 🙂</div>
    <!-- Album bubble -->
    <div style="align-self: flex-end; width: 290px; padding: 4px; border-radius: 20px 20px 6px 20px; background: linear-gradient(135deg, #6FC497, #3F9A6C)">
      <div style="display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 110px 110px; gap: 3px; border-radius: 17px 17px 4px 4px; overflow: hidden">
        <button onClick="{{t0}}" aria-label="Фото 1" style="grid-row: span 2; background: {{p0}}; position: relative"><span class="ms fill" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 40px; color: rgba(255,255,255,.75)" aria-hidden="true">landscape</span></button>
        <button onClick="{{t1}}" aria-label="Фото 2" style="background: {{p1}}"></button>
        <button onClick="{{t2}}" aria-label="Ещё фото" style="position: relative; background: {{p2}}"><span style="position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #fff">+{{more}}</span></button>
      </div>
      <div style="padding: 6px 8px 2px; color: #06150D; font-size: 14px">Медеу, было супер! 🏔 <span style="font-size: 11px; opacity: .65">18:20 ✓✓</span></div>
    </div>
  </div>

  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06)"><div style="height: 48px; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,.07); display: flex; align-items: center; font-size: 15px; color: #8A958F">Сообщение</div></div>

  <!-- Grid viewer -->
  <sc-if value="{{grid}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: #050606; display: flex; flex-direction: column; animation: kxUp .32s cubic-bezier(.2,.8,.2,1) both">
      <div style="padding: 10px 12px; display: flex; align-items: center; gap: 8px">
        <button onClick="{{closeGrid}}" aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">close</span></button>
        <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">{{gridTitle}}</div><div style="font-size: 12px; color: #9AA59F">Альбом · 7 фото · 22 ноября</div></div>
        <button onClick="{{toggleSelect}}" style="height: 36px; padding: 0 14px; border-radius: 18px; background: {{selBtnBg}}; color: {{selBtnInk}}; font-size: 13px; font-weight: 700">{{selBtnText}}</button>
      </div>
      <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 4px 100px">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px">
          <sc-for list="{{photos}}" as="p" hint-placeholder-count="7">
            <button onClick="{{p.tap}}" aria-label="{{p.label}}" style="position: relative; aspect-ratio: 1; border-radius: 8px; background: {{p.bg}}; overflow: hidden; transform: {{p.tf}}; transition: transform .2s; animation: kxIn .3s ease {{p.d}} both">
              <span class="ms fill" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 28px; color: rgba(255,255,255,.6)" aria-hidden="true">{{p.icon}}</span>
              <sc-if value="{{p.selecting}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 12px; border: 2px solid #fff; background: {{p.chkBg}}; color: #06150D; display: flex; align-items: center; justify-content: center"><sc-if value="{{p.on}}" hint-placeholder-val="{{false}}"><span class="ms" style="font-size: 16px; animation: kxCheck .2s ease both" aria-hidden="true">check</span></sc-if></span></sc-if>
              <sc-if value="{{p.video}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.55); font-size: 11px; font-weight: 700">0:14</span></sc-if>
            </button>
          </sc-for>
        </div>
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: linear-gradient(180deg, transparent, #050606 40%); display: flex; gap: 8px">
        <button onClick="{{share}}" style="flex: 1; height: 50px; border-radius: 25px; background: rgba(255,255,255,.08); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" style="font-size: 20px" aria-hidden="true">forward</span>Переслать</button>
        <button onClick="{{save}}" style="flex: 1.3; height: 50px; border-radius: 25px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms fill" style="font-size: 20px" aria-hidden="true">download</span>{{saveText}}</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 96px; padding: 12px 18px; border-radius: 18px; background: #232A26; border: 1px solid rgba(255,255,255,.16); font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2.4s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">{{toastIcon}}</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const P = [
  ['radial-gradient(70% 50% at 30% 25%, #CDE7F2, transparent 60%), linear-gradient(180deg, #5E8FB0, #2B4E3C)', 'landscape'],
  ['radial-gradient(60% 50% at 60% 30%, #F2B866, transparent 60%), linear-gradient(160deg, #B07A2E, #3A2410)', 'hiking'],
  ['radial-gradient(60% 60% at 50% 40%, #E9F2F7, transparent 60%), linear-gradient(180deg, #9CC4E8, #3E6A8A)', 'ice_skating'],
  ['radial-gradient(60% 50% at 40% 30%, #F4E7C5, transparent 60%), linear-gradient(180deg, #C9925A, #4A2E1E)', 'local_cafe', true],
  ['radial-gradient(70% 50% at 50% 30%, #8FD3AC, transparent 60%), linear-gradient(160deg, #1E4B36, #0E1C16)', 'forest'],
  ['radial-gradient(70% 50% at 50% 30%, #F2A6A0, transparent 60%), linear-gradient(160deg, #C0443C, #250C0A)', 'photo_camera'],
  ['radial-gradient(70% 50% at 40% 30%, #D2B6F2, transparent 60%), linear-gradient(160deg, #6A4C9C, #150E22)', 'nightlight']
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { grid: false, selecting: false, sel: {}, toast: 0, toastText: '', toastIcon: 'done' }; }
componentWillUnmount() { clearTimeout(this.tt); }
toastMsg(text, icon) { clearTimeout(this.tt); this.setState({ toast: this.state.toast + 1, toastText: text, toastIcon: icon }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2400); }
renderVals() {
  const s = this.state;
  const n = Object.values(s.sel).filter(Boolean).length;
  const open = () => this.setState({ grid: true });
  return {
    p0: P[0][0], p1: P[1][0], p2: P[2][0], more: String(P.length - 3),
    t0: open, t1: open, t2: open,
    grid: s.grid, closeGrid: () => this.setState({ grid: false, selecting: false, sel: {} }),
    gridTitle: s.selecting ? (n ? 'Выбрано: ' + n : 'Выберите фото') : 'Медеу, было супер! 🏔',
    toggleSelect: () => this.setState({ selecting: !s.selecting, sel: {} }),
    selBtnText: s.selecting ? 'Готово' : 'Выбрать', selBtnBg: s.selecting ? 'rgba(143,211,172,.16)' : 'rgba(255,255,255,.08)', selBtnInk: s.selecting ? '#8FD3AC' : '#EEF3EF',
    photos: P.map(([bg, icon, video], i) => { const on = !!s.sel[i]; return { bg, icon, video: !!video, on, selecting: s.selecting, chkBg: on ? '#8FD3AC' : 'rgba(0,0,0,.25)', tf: on ? 'scale(.92)' : 'none', d: (i * 0.04) + 's', label: 'Фото ' + (i + 1) + (on ? ', выбрано' : ''), tap: () => s.selecting ? this.setState({ sel: { ...s.sel, [i]: !on } }) : this.toastMsg('Откроется на весь экран', 'fullscreen') }; }),
    saveText: s.selecting && n ? 'Сохранить ' + n : 'Сохранить все 7',
    save: () => this.toastMsg('Сохранено в галерею: ' + (s.selecting && n ? n : 7), 'download_done'),
    share: () => this.toastMsg('Выберите, кому переслать', 'forward'),
    toast: s.toast > 0, toastText: s.toastText, toastIcon: s.toastIcon
  };
}
}
</script>
</body>
</html>
