<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Видеовстреча</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
@keyframes kxBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8%,-6%) scale(1.1)}}
@keyframes kxEq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes kxHand{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes kxIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #050606; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 12px 14px 8px; display: flex; align-items: center; gap: 10px">
    <div style="flex: 1"><div style="font-size: 15px; font-weight: 800">Kotlin-клуб · созвон</div><div style="font-size: 12px; color: #8FD3AC; font-variant-numeric: tabular-nums">{{time}} · {{count}}</div></div>
    <button onClick="{{toggleLayout}}" aria-label="Сменить вид" style="height: 38px; padding: 0 12px; border-radius: 19px; background: rgba(255,255,255,.08); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span class="ms" style="font-size: 18px" aria-hidden="true">{{layoutIcon}}</span>{{layoutText}}</button>
  </header>

  <!-- Grid -->
  <sc-if value="{{grid}}" hint-placeholder-val="{{true}}">
    <div style="flex: 1; min-height: 0; padding: 4px 10px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 8px; animation: kxIn .3s ease both">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
        <button onClick="{{t.pin}}" aria-label="{{t.label}}" style="position: relative; border-radius: 20px; overflow: hidden; background: #111614; border: 2.5px solid {{t.bd}}; transition: border-color .2s">
          <sc-if value="{{t.cam}}" hint-placeholder-val="{{true}}"><span style="position: absolute; inset: -10%; background: {{t.bg}}; animation: kxBlob {{t.dur}} ease-in-out 2"></span></sc-if>
          <span style="position: absolute; left: 50%; top: 46%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 27px; background: {{t.avBg}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; opacity: {{t.avOp}}">{{t.l}}</span>
          <span style="position: absolute; left: 8px; bottom: 8px; right: 8px; display: flex; align-items: center; gap: 6px">
            <span style="padding: 3px 8px; border-radius: 10px; background: rgba(0,0,0,.5); font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px"><span class="ms fill" style="font-size: 13px; color: {{t.micInk}}" aria-hidden="true">{{t.micIcon}}</span>{{t.name}}</span>
            <span style="flex: 1"></span>
            <sc-if value="{{t.speaking}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: flex-end; gap: 2px; height: 14px" aria-hidden="true"><span style="width: 3px; height: 14px; border-radius: 2px; background: #8FD3AC; transform-origin: bottom; animation: kxEq .7s ease-in-out infinite"></span><span style="width: 3px; height: 14px; border-radius: 2px; background: #8FD3AC; transform-origin: bottom; animation: kxEq .7s ease-in-out .15s infinite"></span><span style="width: 3px; height: 14px; border-radius: 2px; background: #8FD3AC; transform-origin: bottom; animation: kxEq .7s ease-in-out .3s infinite"></span></span></sc-if>
          </span>
          <sc-if value="{{t.hand}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; border-radius: 15px; background: #E8B04A; display: flex; align-items: center; justify-content: center; font-size: 16px; animation: kxHand 1s ease-in-out 2">✋</span></sc-if>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <!-- Speaker -->
  <sc-if value="{{speaker}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; min-height: 0; padding: 4px 10px; display: flex; flex-direction: column; gap: 8px; animation: kxIn .3s ease both">
      <div style="position: relative; flex: 1; border-radius: 24px; overflow: hidden; background: #111614; border: 2.5px solid #8FD3AC">
        <span style="position: absolute; inset: -10%; background: {{mainBg}}; animation: kxBlob 6s ease-in-out 2"></span>
        <span style="position: absolute; left: 50%; top: 45%; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 48px; background: rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800">{{mainL}}</span>
        <span style="position: absolute; left: 12px; bottom: 12px; padding: 5px 10px; border-radius: 12px; background: rgba(0,0,0,.5); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span class="ms fill" style="font-size: 16px; color: #8FD3AC" aria-hidden="true">push_pin</span>{{mainName}}</span>
      </div>
      <div style="display: flex; gap: 8px; height: 100px">
        <sc-for list="{{strip}}" as="t" hint-placeholder-count="5">
          <button onClick="{{t.pin}}" aria-label="{{t.label}}" style="position: relative; flex: 1; border-radius: 16px; overflow: hidden; background: #111614; border: 2px solid {{t.bd}}">
            <sc-if value="{{t.cam}}" hint-placeholder-val="{{true}}"><span style="position: absolute; inset: 0; background: {{t.bg}}"></span></sc-if>
            <span style="position: absolute; left: 50%; top: 42%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 17px; background: {{t.avBg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; opacity: {{t.avOp}}">{{t.l}}</span>
            <span style="position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 11px; font-weight: 700">{{t.name}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <!-- Controls -->
  <div style="padding: 12px 14px 24px; display: flex; justify-content: space-between; align-items: center">
    <sc-for list="{{ctrls}}" as="c" hint-placeholder-count="5">
      <button onClick="{{c.tap}}" aria-label="{{c.label}}" style="width: 56px; height: 56px; border-radius: 28px; background: {{c.bg}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; transition: all .2s"><span class="ms fill" aria-hidden="true">{{c.icon}}</span></button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const PL = (n, a, b, c) => { const m = Math.abs(n) % 100, d = m % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d >= 2 && d <= 4 ? b : c; };

const P = [
  { name: 'Вы', l: 'Я', bg: 'radial-gradient(60% 50% at 40% 40%, #6FC497, transparent 60%), linear-gradient(160deg, #1E4B36, #0E1C16)', av: '#3F9A6C', cam: true },
  { name: 'Дмитрий', l: 'Д', bg: 'radial-gradient(60% 50% at 60% 40%, #6FA9D8, transparent 60%), linear-gradient(160deg, #1B3A55, #0D1620)', av: '#2F6E9E', cam: true },
  { name: 'Мария', l: 'М', bg: 'radial-gradient(60% 50% at 50% 40%, #F2B866, transparent 60%), linear-gradient(160deg, #5A3C1A, #1E140A)', av: '#B07A2E', cam: true },
  { name: 'Олег', l: 'О', bg: '', av: '#5C6661', cam: false },
  { name: 'Анна', l: 'А', bg: 'radial-gradient(60% 50% at 50% 40%, #F2A6A0, transparent 60%), linear-gradient(160deg, #5A1E1A, #200A08)', av: '#C0443C', cam: true },
  { name: 'Алекс', l: 'А', bg: 'radial-gradient(60% 50% at 50% 40%, #D2B6F2, transparent 60%), linear-gradient(160deg, #35264F, #120E1C)', av: '#6A4C9C', cam: true }
];
const mmss = t => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sec: 1284, speaking: 1, pin: 1, layout: 'grid', mic: true, cam: true, hand: false }; }
componentDidMount() { this.iv = setInterval(() => this.setState({ sec: this.state.sec + 1 }), 1000); this.is = setInterval(() => { const opts = [1, 2, 4, 1, 5]; this.setState({ speaking: opts[Math.floor(Math.random() * opts.length)] }); }, 2600); }
componentWillUnmount() { clearInterval(this.iv); clearInterval(this.is); }
renderVals() {
  const s = this.state;
  const tile = (p, i) => {
    const me = i === 0;
    const cam = me ? s.cam : p.cam;
    const speaking = me ? false : s.speaking === i;
    const micOn = me ? s.mic : i !== 3;
    return {
      name: p.name, l: p.l, bg: p.bg, cam, avBg: cam ? 'rgba(0,0,0,.25)' : p.av, avOp: cam ? '.9' : '1', dur: (5 + i) + 's',
      bd: speaking ? '#8FD3AC' : 'transparent', speaking,
      micIcon: micOn ? 'mic' : 'mic_off', micInk: micOn ? '#EEF3EF' : '#FF8A80',
      hand: me && s.hand,
      label: p.name + (speaking ? ', говорит' : '') + ' — закрепить',
      pin: () => this.setState({ pin: i, layout: 'speaker' })
    };
  };
  const all = P.map(tile);
  const pp = P[s.pin];
  return {
    time: mmss(s.sec), count: P.length + ' ' + PL(P.length, 'участник', 'участника', 'участников'),
    grid: s.layout === 'grid', speaker: s.layout === 'speaker',
    layoutIcon: s.layout === 'grid' ? 'grid_view' : 'view_agenda', layoutText: s.layout === 'grid' ? 'Сетка' : 'Докладчик',
    toggleLayout: () => this.setState({ layout: s.layout === 'grid' ? 'speaker' : 'grid' }),
    tiles: all,
    mainBg: pp.bg || 'linear-gradient(160deg, #1A201D, #0A0C0B)', mainL: pp.l, mainName: pp.name,
    strip: all.filter((_, i) => i !== s.pin).slice(0, 5),
    ctrls: [
      { icon: s.mic ? 'mic' : 'mic_off', label: s.mic ? 'Выключить микрофон' : 'Включить микрофон', on: !s.mic, tap: () => this.setState({ mic: !s.mic }) },
      { icon: s.cam ? 'videocam' : 'videocam_off', label: s.cam ? 'Выключить камеру' : 'Включить камеру', on: !s.cam, tap: () => this.setState({ cam: !s.cam }) },
      { icon: 'back_hand', label: s.hand ? 'Опустить руку' : 'Поднять руку', on: s.hand, hand: true, tap: () => this.setState({ hand: !s.hand }) },
      { icon: 'screen_share', label: 'Показать экран', on: false, tap: () => {} },
      { icon: 'call_end', label: 'Выйти из звонка', end: true, tap: () => {} }
    ].map(c => ({ ...c, bg: c.end ? '#E5534B' : c.on ? (c.hand ? '#E8B04A' : '#EEF3EF') : 'rgba(255,255,255,.1)', ink: c.end ? '#fff' : c.on ? '#06150D' : '#EEF3EF' }))
  };
}
}
</script>
</body>
</html>
