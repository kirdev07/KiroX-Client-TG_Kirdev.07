<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход, код на почту</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
@keyframes kxIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes kxIn2{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes kxEnv{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes kxCell{0%{transform:scale(1.3)}100%{transform:none}}
@keyframes kxShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes kxShake2{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes kxPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:none}}
@keyframes kxCaret{0%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px; display: flex; align-items: center; gap: 10px">
    <button onClick="{{back}}" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="flex: 1"></span>
    <span style="display: flex; gap: 4px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="width: {{d.w}}; height: 6px; border-radius: 3px; background: {{d.c}}; transition: all .3s"></span></sc-for></span>
  </header>

  <div style="flex: 1; padding: 20px 24px 0; display: flex; flex-direction: column; align-items: center; text-align: center; animation: {{anim}}">
    <span style="width: 88px; height: 88px; border-radius: 30px; background: {{icBg}}; color: {{icInk}}; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 46px; animation: {{icAnim}}" aria-hidden="true">{{icon}}</span></span>
    <div style="margin-top: 18px; font-size: 22px; font-weight: 800">{{title}}</div>
    <div style="margin-top: 6px; font-size: 14px; color: #9AA59F; line-height: 1.45">{{sub}}</div>

    <sc-if value="{{s0}}" hint-placeholder-val="{{true}}">
      <div style="margin-top: 26px; width: 100%; height: 58px; padding: 0 16px; box-sizing: border-box; border-radius: 20px; background: rgba(255,255,255,.07); border: 1px solid rgba(143,211,172,.4); display: flex; align-items: center; gap: 10px; font-size: 17px"><span class="ms" style="color: #8FD3AC" aria-hidden="true">mail</span><span style="flex: 1; text-align: left">{{email}}<span style="display: inline-block; width: 2px; height: 18px; margin-left: 1px; vertical-align: -3px; background: #8FD3AC; animation: kxCaret 1s step-end infinite"></span></span></div>
      <div style="margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center">
        <sc-for list="{{doms}}" as="d" hint-placeholder-count="3"><button onClick="{{d.tap}}" style="height: 30px; padding: 0 10px; border-radius: 15px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); font-size: 12px; font-weight: 700; color: #C9D2CC">{{d.t}}</button></sc-for>
      </div>
      <div style="margin-top: 14px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.04); font-size: 12px; color: #9AA59F; line-height: 1.4; text-align: left; display: flex; gap: 8px"><span class="ms" style="font-size: 18px" aria-hidden="true">info</span><span>Почта нужна только для входа. Её не увидят ваши контакты.</span></div>
    </sc-if>

    <sc-if value="{{s1}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 26px; display: flex; gap: 8px; animation: {{shake}}">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="6"><span style="width: 46px; height: 58px; border-radius: 16px; background: {{c.bg}}; border: 1.5px solid {{c.bd}}; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; animation: {{c.anim}}">{{c.v}}</span></sc-for>
      </div>
      <div style="margin-top: 12px; font-size: 13px; color: {{errInk}}; min-height: 18px">{{err}}</div>
      <div style="margin-top: 16px; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12"><button onClick="{{k.tap}}" aria-label="{{k.aria}}" style="height: 52px; border-radius: 18px; background: {{k.bg}}; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; visibility: {{k.vis}}"><span class="{{k.cls}}">{{k.t}}</span></button></sc-for>
      </div>
      <button onClick="{{resend}}" style="margin-top: 12px; font-size: 13px; font-weight: 700; color: {{resInk}}">{{resText}}</button>
    </sc-if>

    <sc-if value="{{s2}}" hint-placeholder-val="{{false}}">
      <button onClick="{{restart}}" style="outline: 1px dashed rgba(143,211,172,.5); outline-offset: 2px; margin-top: 28px; height: 46px; padding: 0 20px; border-radius: 23px; background: rgba(255,255,255,.08); font-size: 14px; font-weight: 700; color: #8FD3AC">Макет: показать снова</button>
    </sc-if>
  </div>

  <sc-if value="{{s0}}" hint-placeholder-val="{{true}}">
    <div style="padding: 0 24px 28px"><button onClick="{{next}}" style="width: 100%; height: 56px; border-radius: 28px; background: {{nBg}}; color: {{nInk}}; font-size: 16px; font-weight: 800; text-align: center">Прислать код</button></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const OK = '482915';
class Component extends DCLogic {
constructor(props) { super(props); this.state = { st: 0, user: 'alex.codes', dom: '', code: '', k: 0, sk: 0, err: '', left: 59 }; }
componentWillUnmount() { clearInterval(this.iv); }
timer() { clearInterval(this.iv); this.setState({ left: 59 }); this.iv = setInterval(() => { const l = this.state.left - 1; if (l <= 0) { clearInterval(this.iv); this.setState({ left: 0 }); } else this.setState({ left: l }); }, 1000); }
renderVals() {
  const s = this.state;
  const email = s.user + (s.dom ? '@' + s.dom : '');
  const valid = !!s.dom;
  const go = (st) => this.setState({ st, k: s.k + 1 });
  const press = (d) => { if (s.code.length >= 6) return; const c = s.code + d; if (c.length === 6) { if (c === OK) { this.setState({ code: c }); setTimeout(() => go(2), 350); } else { this.setState({ code: c, err: 'Неверный код — попробуйте ещё раз', sk: s.sk + 1 }); setTimeout(() => this.setState({ code: '' }), 500); } } else this.setState({ code: c, err: '' }); };
  const masked = s.user.slice(0, 1) + '•••' + '@' + (s.dom || 'mail.com');
  return {
    s0: s.st === 0, s1: s.st === 1, s2: s.st === 2,
    anim: (s.k % 2 ? 'kxIn2' : 'kxIn') + ' .3s ease both',
    dots: [0, 1, 2].map(i => ({ w: s.st === i ? '20px' : '6px', c: s.st >= i ? '#8FD3AC' : 'rgba(255,255,255,.2)' })),
    back: () => s.st > 0 && s.st < 2 && go(s.st - 1),
    icon: s.st === 2 ? 'mark_email_read' : 'mail', icBg: s.st === 2 ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(143,211,172,.14)', icInk: s.st === 2 ? '#06150D' : '#8FD3AC',
    icAnim: s.st === 2 ? 'kxPop .5s ease both' : 'kxEnv 3s ease-in-out 2',
    title: ['Почта для входа', 'Введите код из письма', 'Почта подтверждена'][s.st],
    sub: [ 'Telegram просит почту, чтобы присылать коды для входа на этот номер.', 'Отправили 6 цифр на ' + masked, 'Теперь коды для входа будут приходить на почту.' ][s.st],
    email, doms: ['gmail.com', 'mail.ru', 'yandex.kz'].map(t => ({ t: '@' + t, tap: () => this.setState({ dom: t }) })),
    nBg: valid ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.07)', nInk: valid ? '#06150D' : '#8A958F',
    next: () => { if (!valid) return; go(1); this.setState({ code: '', err: '' }); this.timer(); },
    cells: [0, 1, 2, 3, 4, 5].map(i => { const v = s.code[i] || ''; const cur = i === s.code.length; return { v, bg: v ? 'rgba(143,211,172,.1)' : 'rgba(255,255,255,.05)', bd: s.err && s.code.length === 6 ? '#FF8A80' : cur ? '#8FD3AC' : v ? 'rgba(143,211,172,.4)' : 'rgba(255,255,255,.1)', anim: v && i === s.code.length - 1 ? 'kxCell .2s ease both' : 'none' }; }),
    shake: s.sk ? (s.sk % 2 ? 'kxShake2' : 'kxShake') + ' .4s ease both' : 'none',
    err: s.err || 'Для демо: код 482915', errInk: s.err ? '#FF8A80' : '#8A958F',
    keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(t => ({ t: t === '⌫' ? 'backspace' : t, cls: t === '⌫' ? 'ms' : '', aria: t === '⌫' ? 'Стереть' : t, vis: t === '' ? 'hidden' : 'visible', bg: t === '⌫' ? 'transparent' : 'rgba(255,255,255,.05)', tap: () => t === '⌫' ? this.setState({ code: s.code.slice(0, -1), err: '' }) : t && press(t) })),
    resText: s.left ? 'Прислать снова через 0:' + String(s.left).padStart(2, '0') : 'Прислать код ещё раз', resInk: s.left ? '#8A958F' : '#8FD3AC',
    resend: () => !s.left && this.timer(),
    restart: () => { clearInterval(this.iv); this.setState({ st: 0, dom: '', code: '', err: '', k: s.k + 1 }); }
  };
}
}
</script>
</body>
</html>
