<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Жесты в переписке</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxSwipeL{0%,15%{transform:translateX(0)}45%,60%{transform:translateX(-70px)}90%,100%{transform:translateX(0)}}
@keyframes kxSwipeR{0%,15%{transform:translateX(0)}45%,60%{transform:translateX(90px)}90%,100%{transform:translateX(0)}}
@keyframes kxFinger{0%,15%{transform:translate(0,0);opacity:0}20%{opacity:1}45%,60%{transform:translate(-70px,0);opacity:1}75%,100%{transform:translate(-70px,0);opacity:0}}
@keyframes kxFingerR{0%,15%{transform:translate(0,0);opacity:0}20%{opacity:1}45%,60%{transform:translate(90px,0);opacity:1}75%,100%{transform:translate(90px,0);opacity:0}}
@keyframes kxTap2{0%,10%{transform:scale(1);opacity:0}15%{opacity:1}20%{transform:scale(.8)}25%{transform:scale(1)}30%{transform:scale(.8)}35%{transform:scale(1);opacity:1}50%,100%{opacity:0}}
@keyframes kxHeart{0%,32%{transform:scale(0);opacity:0}45%{transform:scale(1.4);opacity:1}60%{transform:scale(1);opacity:1}85%,100%{transform:scale(1);opacity:0}}
@keyframes kxHold{0%,10%{transform:scale(1);opacity:0}20%{opacity:1}60%{transform:scale(1.3);opacity:.9}80%,100%{opacity:0}}
@keyframes kxLift{0%,30%{transform:scale(1);box-shadow:none}55%,80%{transform:scale(1.04);box-shadow:0 10px 30px rgba(0,0,0,.5)}100%{transform:scale(1);box-shadow:none}}
@keyframes kxIcon{0%,25%{opacity:0;transform:scale(.4)}45%,60%{opacity:1;transform:scale(1)}80%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 800">Жесты в переписке</h1>
  </header>

  <!-- Demo -->
  <div style="margin: 4px 16px 0; height: 230px; position: relative; border-radius: 26px; overflow: hidden; background: radial-gradient(90% 70% at 85% 0%, rgba(63,154,108,.2), transparent 60%), #111614; border: 1px solid rgba(255,255,255,.08)">
    <div style="position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-size: 12px; font-weight: 700; color: #8FD3AC">{{demoTitle}}</div>
    <div style="position: absolute; left: 16px; right: 16px; top: 70px; display: flex; align-items: center">
      <!-- action icon behind -->
      <span style="position: absolute; left: {{iconL}}; right: {{iconR}}; top: 50%; margin-top: -18px; width: 36px; height: 36px; border-radius: 18px; background: rgba(143,211,172,.18); color: #8FD3AC; display: flex; align-items: center; justify-content: center; animation: {{iconAnim}}" aria-hidden="true"><span class="ms fill" style="font-size: 20px">{{demoIcon}}</span></span>
      <div style="position: relative; margin-left: {{bubbleML}}; max-width: 230px; padding: 10px 14px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.09); font-size: 15px; animation: {{bubbleAnim}}" data-k="{{k}}">
        Встречаемся у кофейни в 7? ☕
        <span style="position: absolute; right: -10px; bottom: -14px; font-size: 28px; animation: {{heartAnim}}">❤️</span>
      </div>
      <span style="position: absolute; left: {{fingerL}}; top: 6px; width: 34px; height: 34px; border-radius: 17px; background: rgba(255,255,255,.45); border: 2px solid rgba(255,255,255,.8); animation: {{fingerAnim}}; pointer-events: none" aria-hidden="true"></span>
    </div>
    <div style="position: absolute; left: 16px; right: 16px; bottom: 14px; text-align: center; font-size: 14px; color: #C9D2CC">{{demoText}}</div>
  </div>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px 16px 30px">
    <div style="padding: 12px 14px; border-radius: 20px; background: linear-gradient(150deg, rgba(63,154,108,.16), rgba(255,255,255,.03)); border: 1px solid rgba(143,211,172,.25)">
      <div style="font-size: 13px; font-weight: 700; color: #8FD3AC">{{optsTitle}}</div>
      <div style="margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><button onClick="{{o.tap}}" style="height: 36px; padding: 0 12px; border-radius: 18px; background: {{o.bg}}; color: {{o.ink}}; border: 1px solid {{o.bd}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px; transition: all .2s"><span class="ms" style="font-size: 16px" aria-hidden="true">{{o.icon}}</span>{{o.label}}</button></sc-for>
      </div>
    </div>
    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Все жесты</div>
    <sc-for list="{{gestures}}" as="g" hint-placeholder-count="4">
      <div style="margin-bottom: 8px; padding: 12px 14px; border-radius: 20px; background: {{g.bg}}; border: 1px solid {{g.bd}}; transition: all .2s">
        <button onClick="{{g.show}}" style="width: 100%; display: flex; align-items: center; gap: 12px">
          <span style="width: 40px; height: 40px; border-radius: 13px; background: rgba(143,211,172,.12); color: #8FD3AC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">{{g.icon}}</span></span>
          <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 700">{{g.label}}</span><span style="display: block; font-size: 12px; color: #8A958F">{{g.actionText}}</span></span>
          <span class="ms fill" style="color: {{g.playInk}}" aria-hidden="true">play_circle</span>
        </button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const G = [
  { key: 'swipeL', label: 'Смахнуть влево', icon: 'swipe_left', opts: [['reply', 'Ответить'], ['forward', 'Переслать'], ['bookmark', 'В Избранное']] },
  { key: 'double', label: 'Двойное нажатие', icon: 'touch_double', opts: [['favorite', 'Реакция ❤️'], ['content_copy', 'Копировать'], ['block', 'Ничего']] },
  { key: 'hold', label: 'Долгое нажатие', icon: 'touch_long', opts: [['menu', 'Меню'], ['check_circle', 'Выделить'], ['translate', 'Перевести']] },
  { key: 'swipeR', label: 'Смахнуть вправо', icon: 'swipe_right', opts: [['arrow_back', 'Назад к чатам'], ['reply', 'Ответить'], ['block', 'Ничего']] }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { demo: 0, pick: [0, 0, 0, 0], k: 0 }; }
renderVals() {
  const s = this.state;
  const g = G[s.demo];
  const [icon, actLabel] = g.opts[s.pick[s.demo]];
  const loop = ' 2.6s ease-in-out infinite';
  const isL = g.key === 'swipeL', isR = g.key === 'swipeR', isD = g.key === 'double', isH = g.key === 'hold';
  return {
    k: String(s.k),
    demoTitle: g.label.toUpperCase(),
    demoText: actLabel === 'Ничего' ? 'Жест выключен' : '→ ' + actLabel,
    demoIcon: icon,
    iconL: isR ? '0' : 'auto', iconR: isL ? '0' : 'auto',
    iconAnim: isL || isR ? 'kxIcon' + loop : 'none',
    bubbleML: '0',
    bubbleAnim: isL ? 'kxSwipeL' + loop : isR ? 'kxSwipeR' + loop : isH ? 'kxLift' + loop : 'none',
    heartAnim: isD && icon === 'favorite' ? 'kxHeart' + loop : 'none',
    fingerL: isR ? '30px' : isL ? '200px' : '110px',
    fingerAnim: isL ? 'kxFinger' + loop : isR ? 'kxFingerR' + loop : isD ? 'kxTap2' + loop : 'kxHold' + loop,
    gestures: G.map((x, i) => ({
      label: x.label, icon: x.icon, actionText: 'Сейчас: ' + x.opts[s.pick[i]][1],
      bg: s.demo === i ? 'rgba(143,211,172,.08)' : 'rgba(255,255,255,.04)', bd: s.demo === i ? 'rgba(143,211,172,.35)' : 'rgba(255,255,255,.08)',
      playInk: s.demo === i ? '#8FD3AC' : '#3A4540',
      show: () => this.setState({ demo: i, k: s.k + 1 })
    })),
    optsTitle: 'Что делает «' + g.label.toLowerCase() + '»',
    opts: g.opts.map(([ic, label], j) => { const on = s.pick[s.demo] === j; return { icon: ic, label, bg: on ? 'rgba(143,211,172,.16)' : 'rgba(255,255,255,.05)', ink: on ? '#8FD3AC' : '#C9D2CC', bd: on ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', tap: () => this.setState({ pick: s.pick.map((v, k) => k === s.demo ? j : v) }) }; })
  };
}
}
</script>
</body>
</html>
