<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Жесты в списке чатов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxHintL{0%,100%{transform:translateX(0)}40%{transform:translateX(-70px)}60%{transform:translateX(-70px)}}
@keyframes kxHintR{0%,100%{transform:translateX(0)}40%{transform:translateX(70px)}60%{transform:translateX(70px)}}
@keyframes kxIconPop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxToast{0%{opacity:0;transform:translateY(16px)}12%,85%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 22px; font-weight: 800">Жесты</h1>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 16px 30px">
    <!-- Live demo -->
    <div style="padding: 0 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Попробуйте</div>
    <div style="border-radius: 22px; background: rgba(255,255,255,.045); padding: 6px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="position: relative; height: 72px; border-radius: 18px; overflow: hidden; margin-bottom: 4px">
          <div style="position: absolute; inset: 0; background: {{r.leftBg}}; display: flex; align-items: center; padding-left: 22px; color: #fff"><span class="ms fill" style="animation: {{r.iconAnim}}" aria-hidden="true">{{r.leftIcon}}</span></div>
          <div style="position: absolute; inset: 0; background: {{r.rightBg}}; display: flex; align-items: center; justify-content: flex-end; padding-right: 22px; color: #fff; opacity: {{r.rightOp}}"><span class="ms fill" aria-hidden="true">{{r.rightIcon}}</span></div>
          <div style="position: absolute; inset: 0; background: #141917; display: flex; align-items: center; gap: 12px; padding: 0 10px; transform: translateX({{r.x}}); transition: transform .35s cubic-bezier(.2,.9,.3,1); animation: {{r.hint}}">
            <span style="width: 48px; height: 48px; border-radius: 24px; background: {{r.av}}; color: {{r.ink}}; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{r.init}}</span>
            <span style="flex: 1; min-width: 0">
              <span style="display: flex; align-items: center; gap: 5px"><span style="font-size: 15px; font-weight: 700">{{r.name}}</span><sc-if value="{{r.pinned}}" hint-placeholder-val="{{false}}"><span class="ms fill" style="font-size: 14px; color: #8FD3AC; transform: rotate(45deg)" aria-hidden="true">push_pin</span></sc-if><sc-if value="{{r.muted}}" hint-placeholder-val="{{false}}"><span class="ms" style="font-size: 14px; color: #8A958F" aria-hidden="true">notifications_off</span></sc-if></span>
              <span style="display: block; margin-top: 3px; font-size: 13px; color: #8A958F; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{r.last}}</span>
            </span>
            <sc-if value="{{r.unread}}" hint-placeholder-val="{{true}}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: {{r.badgeBg}}; color: #06150D; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{r.badge}}</span></sc-if>
          </div>
          <button onClick="{{r.swL}}" aria-label="Смахнуть вправо" style="position: absolute; left: 0; top: 0; bottom: 0; width: 50%"></button>
          <button onClick="{{r.swR}}" aria-label="Смахнуть влево" style="position: absolute; right: 0; top: 0; bottom: 0; width: 50%"></button>
        </div>
      </sc-for>
    </div>
    <div style="padding: 8px 6px 0; display: flex; justify-content: space-between; font-size: 12px; color: #8A958F"><span>← левая половина: свайп вправо</span><span>правая: свайп влево →</span></div>

    <div style="padding: 18px 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Свайп вправо</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{leftOpts}}" as="o" hint-placeholder-count="6"><button onClick="{{o.tap}}" style="height: 74px; border-radius: 18px; background: {{o.bg}}; border: 1px solid {{o.border}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; transition: all .2s"><span style="width: 32px; height: 32px; border-radius: 16px; background: {{o.c}}; color: #fff; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 18px" aria-hidden="true">{{o.icon}}</span></span><span style="font-size: 12px; font-weight: 700">{{o.label}}</span></button></sc-for>
    </div>

    <div style="padding: 18px 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Свайп влево</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{rightOpts}}" as="o" hint-placeholder-count="6"><button onClick="{{o.tap}}" style="height: 74px; border-radius: 18px; background: {{o.bg}}; border: 1px solid {{o.border}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; transition: all .2s"><span style="width: 32px; height: 32px; border-radius: 16px; background: {{o.c}}; color: #fff; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 18px" aria-hidden="true">{{o.icon}}</span></span><span style="font-size: 12px; font-weight: 700">{{o.label}}</span></button></sc-for>
    </div>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 16px; right: 16px; bottom: 26px; height: 50px; padding: 0 8px 0 16px; border-radius: 18px; background: #1E2622; border: 1px solid rgba(143,211,172,.25); display: flex; align-items: center; gap: 10px; animation: kxToast 2.6s ease both">
      <span class="ms fill" style="color: #8FD3AC" aria-hidden="true">check_circle</span><span style="flex: 1; font-size: 14px">{{toastText}}</span>
      <button onClick="{{undo}}" style="height: 36px; padding: 0 12px; border-radius: 12px; color: #8FD3AC; font-size: 14px; font-weight: 700">Отменить</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const ACT = {
  read: ['mark_chat_read', 'Прочитано', '#3F9A6C'], pin: ['push_pin', 'Закрепить', '#2F6E9E'], mute: ['notifications_off', 'Без звука', '#7A5A2E'],
  archive: ['inventory_2', 'В архив', '#4B3F7A'], delete: ['delete', 'Удалить', '#C0443C'], folder: ['folder', 'В папку', '#3A6E7A']
};
const KEYS = ['read', 'pin', 'mute', 'archive', 'delete', 'folder'];
const CH = [
  { name: 'Анна', last: 'Возьмёшь мне капучино?', av: 'linear-gradient(140deg,#4B3F7A,#2A2240)', ink: '#DCD0FF', badge: 3 },
  { name: 'Курс английского', last: 'Марина: Тест в субботу', av: 'linear-gradient(140deg,#2F6E9E,#14243A)', ink: '#CFE6FF', badge: 12 },
  { name: 'Сергей', last: 'Ок, тогда до пятницы', av: 'linear-gradient(140deg,#3F7A5A,#1E3A2A)', ink: '#CFF2DD', badge: 0 }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { left: 'read', right: 'archive', swipe: [0, 0, 0], st: CH.map(c => ({ read: !c.badge, pin: false, mute: false })), gone: [], toast: 0, toastText: '', last: null, hinted: false }; }
componentDidMount() { this.ht = setTimeout(() => this.setState({ hinted: true }), 2200); }
componentWillUnmount() { clearTimeout(this.t); clearTimeout(this.tt); clearTimeout(this.ht); }
apply(i, dir) {
  const s = this.state;
  const key = dir < 0 ? s.left : s.right;
  const swipe = [0, 0, 0]; swipe[i] = dir < 0 ? 1 : -1;
  this.setState({ swipe, hinted: true });
  clearTimeout(this.t);
  this.t = setTimeout(() => {
    const st = this.state.st.map(x => ({ ...x }));
    const prev = { st: this.state.st, gone: this.state.gone };
    let text = '';
    if (key === 'read') { st[i].read = !st[i].read; text = st[i].read ? 'Отмечено прочитанным' : 'Отмечено непрочитанным'; }
    if (key === 'pin') { st[i].pin = !st[i].pin; text = st[i].pin ? 'Чат закреплён' : 'Чат откреплён'; }
    if (key === 'mute') { st[i].mute = !st[i].mute; text = st[i].mute ? 'Звук выключен' : 'Звук включён'; }
    if (key === 'archive') text = 'Чат в архиве';
    if (key === 'delete') text = 'Чат удалён';
    if (key === 'folder') text = 'Добавлен в папку «Личное»';
    const gone = key === 'archive' || key === 'delete' ? [...this.state.gone, i] : this.state.gone;
    clearTimeout(this.tt);
    this.setState({ st, gone, swipe: [0, 0, 0], toast: Date.now(), toastText: text, last: prev });
    this.tt = setTimeout(() => this.setState({ toast: 0 }), 2600);
  }, 450);
}
renderVals() {
  const s = this.state;
  const L = ACT[s.left], R = ACT[s.right];
  const rows = CH.map((c, i) => ({ c, i })).filter(x => !s.gone.includes(x.i)).map(({ c, i }) => {
    const st = s.st[i]; const sw = s.swipe[i];
    return {
      name: c.name, last: c.last, av: c.av, ink: c.ink, init: c.name[0], pinned: st.pin, muted: st.mute,
      unread: !st.read, badge: c.badge ? String(c.badge) : '1', badgeBg: st.mute ? '#5C6661' : '#8FD3AC',
      leftBg: L[2], leftIcon: L[0], rightBg: R[2], rightIcon: R[0], rightOp: sw < 0 || (!s.hinted && i === 1) ? '1' : '0',
      x: sw > 0 ? '96px' : sw < 0 ? '-96px' : '0px', iconAnim: sw > 0 ? 'kxIconPop .35s ease both' : 'none',
      hint: !s.hinted && i === 0 ? 'kxHintR 1.6s ease .4s both' : !s.hinted && i === 1 ? 'kxHintL 1.6s ease 1.1s both' : 'none',
      swL: () => this.apply(i, -1), swR: () => this.apply(i, 1)
    };
  });
  const opts = (side, cur) => KEYS.map(k => ({ icon: ACT[k][0], label: ACT[k][1], c: ACT[k][2], bg: k === cur ? 'rgba(143,211,172,.1)' : 'rgba(255,255,255,.045)', border: k === cur ? 'rgba(143,211,172,.45)' : 'transparent', tap: () => this.setState({ [side]: k, hinted: true }) }));
  return {
    rows, leftOpts: opts('left', s.left), rightOpts: opts('right', s.right),
    toast: !!s.toast, toastText: s.toastText,
    undo: () => { if (s.last) this.setState({ st: s.last.st, gone: s.last.gone, toast: 0, last: null }); }
  };
}
}
</script>
</body>
</html>
