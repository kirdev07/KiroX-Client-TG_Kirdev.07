<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Подсказки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
@keyframes kxPulse{0%{box-shadow:0 0 0 0 rgba(143,211,172,.7), 0 0 0 9999px rgba(0,0,0,.72)}100%{box-shadow:0 0 0 14px rgba(143,211,172,0), 0 0 0 9999px rgba(0,0,0,.72)}}
@keyframes kxTip{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes kxTip2{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes kxDone{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <!-- Underlying chat UI -->
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(135deg, #C0443C, #6A4C9C); display: flex; align-items: center; justify-content: center; font-weight: 800">А</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Анна</div><div style="font-size: 12px; color: #8FD3AC">в сети</div></div>
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">call</span></span>
  </header>
  <div style="flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end">
    <div style="align-self: flex-start; max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); font-size: 15px">Привет! Как тебе новый kiroX? 🙂</div>
    <div style="align-self: flex-end; max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 6px 18px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px">Пока разбираюсь, выглядит круто</div>
  </div>
  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06); display: flex; gap: 8px; align-items: center">
    <span style="width: 46px; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; color: #C9D2CC"><span class="ms" aria-hidden="true">add_circle</span></span>
    <div style="flex: 1; height: 48px; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,.07); display: flex; align-items: center; font-size: 15px; color: #8A958F">Сообщение</div>
    <span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center; color: #9AA59F"><span class="ms" aria-hidden="true">mic</span></span>
  </div>

  <!-- Spotlight -->
  <sc-if value="{{touring}}" hint-placeholder-val="{{true}}">
    <span style="position: absolute; left: {{sx}}; top: {{sy}}; width: {{sw}}; height: {{sh}}; border-radius: {{sr}}; border: 2px solid #8FD3AC; animation: kxPulse 1.6s ease-out infinite; transition: all .45s cubic-bezier(.2,.8,.2,1); pointer-events: none"></span>
    <div style="position: absolute; left: 16px; right: 16px; top: {{ty}}; padding: 16px; border-radius: 22px; background: linear-gradient(180deg, rgba(48,58,53,.98), rgba(24,29,27,.98)); border: 1px solid rgba(143,211,172,.35); box-shadow: 0 16px 40px rgba(0,0,0,.5); animation: {{tipAnim}}">
      <div style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; border-radius: 12px; background: rgba(143,211,172,.16); color: #8FD3AC; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 20px" aria-hidden="true">{{icon}}</span></span><span style="flex: 1; font-size: 16px; font-weight: 800">{{title}}</span><span style="font-size: 12px; color: #9AA59F">{{stepText}}</span></div>
      <div style="margin-top: 8px; font-size: 14px; line-height: 1.45; color: #C9D2CC">{{text}}</div>
      <div style="margin-top: 12px; display: flex; align-items: center; gap: 6px">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="width: {{d.w}}; height: 6px; border-radius: 3px; background: {{d.c}}; transition: all .3s"></span></sc-for>
        <span style="flex: 1"></span>
        <button onClick="{{skip}}" style="height: 36px; padding: 0 12px; border-radius: 18px; font-size: 13px; font-weight: 700; color: #9AA59F">Пропустить</button>
        <button onClick="{{next}}" style="height: 36px; padding: 0 16px; border-radius: 18px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 13px; font-weight: 800">{{nextText}}</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%); width: 280px; padding: 22px; border-radius: 26px; background: linear-gradient(180deg, rgba(48,58,53,.98), rgba(24,29,27,.98)); border: 1px solid rgba(143,211,172,.35); text-align: center; animation: kxDone .45s ease both">
      <span class="ms fill" style="font-size: 48px; color: #8FD3AC" aria-hidden="true">celebration</span>
      <div style="margin-top: 8px; font-size: 18px; font-weight: 800">Вы готовы!</div>
      <div style="margin-top: 4px; font-size: 13px; color: #9AA59F">Подсказки можно включить снова в «Помощи»</div>
      <button onClick="{{restart}}" style="outline: 1px dashed rgba(143,211,172,.5); outline-offset: 2px; margin-top: 14px; height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 700; color: #8FD3AC">Макет: показать снова</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const STEPS = [
  { x: '8px', y: '776px', w: '54px', h: '54px', r: '27px', ty: '590px', icon: 'add_circle', title: 'Вложения', text: 'Фото, файлы, место, опрос, список дел и сканер документов — всё здесь.' },
  { x: '327px', y: '777px', w: '54px', h: '54px', r: '27px', ty: '590px', icon: 'mic', title: 'Голос и кружки', text: 'Удерживайте для голосового. Нажмите один раз — переключится на видеокружок.' },
  { x: '150px', y: '714px', w: '232px', h: '48px', r: '18px', ty: '530px', icon: 'swipe_left', title: 'Ответ свайпом', text: 'Смахните сообщение влево, чтобы ответить. Двойное нажатие — реакция ❤️.' },
  { x: '330px', y: '6px', w: '52px', h: '52px', r: '26px', ty: '76px', icon: 'call', title: 'Звонки', text: 'Голос и видео со сквозным шифрованием. Прямо из чата.' }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0, done: false }; }
renderVals() {
  const s = this.state;
  const st = STEPS[s.i];
  const last = s.i === STEPS.length - 1;
  return {
    touring: !s.done, done: s.done,
    sx: st.x, sy: st.y, sw: st.w, sh: st.h, sr: st.r, ty: st.ty,
    icon: st.icon, title: st.title, text: st.text, stepText: (s.i + 1) + ' из ' + STEPS.length,
    tipAnim: (s.i % 2 ? 'kxTip2' : 'kxTip') + ' .35s ease both',
    dots: STEPS.map((_, k) => ({ w: k === s.i ? '18px' : '6px', c: k <= s.i ? '#8FD3AC' : 'rgba(255,255,255,.2)' })),
    nextText: last ? 'Понятно' : 'Дальше',
    next: () => last ? this.setState({ done: true }) : this.setState({ i: s.i + 1 }),
    skip: () => this.setState({ done: true }),
    restart: () => this.setState({ i: 0, done: false })
  };
}
}
</script>
</body>
</html>
