<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Стикер из фото</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxScan{0%{top:0%}100%{top:100%}}
@keyframes kxPop{0%{transform:scale(.85)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes kxSpark{0%{transform:scale(0) rotate(0);opacity:0}40%{transform:scale(1.2) rotate(45deg);opacity:1}100%{transform:scale(0) rotate(90deg);opacity:0}}
@keyframes kxFlyPack{0%{transform:none;opacity:1}100%{transform:translate(110px,330px) scale(.15);opacity:0}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">close</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 800">Стикер из фото</h1>
    <button onClick="{{reset}}" aria-label="Начать заново" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">undo</span></button>
  </header>

  <!-- Canvas -->
  <div style="margin: 4px 16px 0; height: 330px; position: relative; border-radius: 28px; overflow: hidden; background: {{canvasBg}}; background-size: 20px 20px; border: 1px solid rgba(255,255,255,.08); transition: background .4s">
    <!-- original photo background -->
    <div style="position: absolute; inset: 0; background: radial-gradient(70% 50% at 30% 20%, #E9C892, transparent 60%), linear-gradient(180deg, #8DA7B8 0%, #556B5A 60%, #3A4A3A 100%); opacity: {{photoOp}}; transition: opacity .6s"></div>
    <!-- subject: a cat -->
    <div style="position: absolute; left: 50%; top: 50%; width: 200px; height: 220px; margin: -110px 0 0 -100px; animation: {{subjAnim}}">
      <svg width="200" height="220" viewBox="0 0 200 220" style="overflow: visible; filter: {{outline}}; transition: filter .3s" aria-hidden="true">
        <path d="M50 70 L62 18 L92 56 Q100 54 108 56 L138 18 L150 70 Q172 98 166 140 Q160 196 100 200 Q40 196 34 140 Q28 98 50 70 Z" fill="#E8A657"></path>
        <path d="M70 120 Q100 112 130 120 Q132 170 100 176 Q68 170 70 120 Z" fill="#F7E3C4"></path>
        <ellipse cx="78" cy="104" rx="9" ry="11" fill="#1F2A22"></ellipse><ellipse cx="122" cy="104" rx="9" ry="11" fill="#1F2A22"></ellipse>
        <circle cx="81" cy="100" r="3" fill="#fff"></circle><circle cx="125" cy="100" r="3" fill="#fff"></circle>
        <path d="M94 128 L106 128 L100 135 Z" fill="#C0645A"></path>
        <path d="M100 135 Q92 146 84 140 M100 135 Q108 146 116 140" stroke="#5A3A2A" stroke-width="3" fill="none" stroke-linecap="round"></path>
        <path d="M58 80 L64 40 L80 66 Z M142 80 L136 40 L120 66 Z" fill="#C9844A"></path>
      </svg>
      <sc-if value="{{hasText}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%) rotate(-4deg); padding: 2px 12px; font-size: 26px; font-weight: 900; color: #fff; -webkit-text-stroke: 1.5px #06150D; paint-order: stroke; white-space: nowrap; animation: kxPop .3s ease both">{{text}}</div></sc-if>
    </div>
    <sc-if value="{{scanning}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; left: 0; right: 0; height: 60px; margin-top: -30px; background: linear-gradient(180deg, transparent, rgba(143,211,172,.45), transparent); animation: kxScan 1.1s ease-in-out both"></div>
    </sc-if>
    <sc-if value="{{cut}}" hint-placeholder-val="{{false}}">
      <span class="ms fill" style="position: absolute; left: 70px; top: 60px; font-size: 22px; color: #8FD3AC; animation: kxSpark .7s ease-out both" aria-hidden="true">auto_awesome</span>
      <span class="ms fill" style="position: absolute; right: 70px; top: 90px; font-size: 16px; color: #E8B04A; animation: kxSpark .7s ease-out .1s both" aria-hidden="true">auto_awesome</span>
      <span class="ms fill" style="position: absolute; right: 90px; bottom: 50px; font-size: 18px; color: #8FD3AC; animation: kxSpark .7s ease-out .2s both" aria-hidden="true">auto_awesome</span>
    </sc-if>
    <div style="position: absolute; left: 12px; top: 12px; padding: 6px 10px; border-radius: 12px; background: rgba(0,0,0,.45); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span class="ms" style="font-size: 16px; color: #8FD3AC" aria-hidden="true">{{stepIcon}}</span>{{stepText}}</div>
  </div>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px 16px 110px">
    <sc-if value="{{beforeCut}}" hint-placeholder-val="{{true}}">
      <button onClick="{{doCut}}" style="width: 100%; height: 56px; border-radius: 20px; background: linear-gradient(150deg, rgba(63,154,108,.22), rgba(255,255,255,.03)); border: 1px solid rgba(143,211,172,.35); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 800; color: #8FD3AC"><span class="ms" aria-hidden="true">content_cut</span>{{cutText}}</button>
      <div style="margin: 10px 6px 0; font-size: 12px; color: #8A958F; text-align: center">kiroX сам найдёт главное на фото и уберёт фон. Всё делается на телефоне.</div>
    </sc-if>
    <sc-if value="{{cut}}" hint-placeholder-val="{{false}}">
      <div style="animation: kxIn .25s ease both">
        <div style="font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Обводка</div>
        <div style="display: flex; gap: 8px">
          <sc-for list="{{strokes}}" as="o" hint-placeholder-count="4"><button onClick="{{o.tap}}" aria-label="{{o.label}}" aria-pressed="{{o.on}}" style="flex: 1; height: 46px; border-radius: 16px; background: {{o.bg}}; border: 1.5px solid {{o.bd}}; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 700"><span style="width: 16px; height: 16px; border-radius: 8px; background: {{o.c}}; border: 1px solid rgba(255,255,255,.3)"></span>{{o.label}}</button></sc-for>
        </div>
        <div style="margin-top: 14px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Подпись</div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{texts}}" as="t" hint-placeholder-count="5"><button onClick="{{t.tap}}" style="height: 34px; padding: 0 12px; border-radius: 17px; background: {{t.bg}}; color: {{t.ink}}; border: 1px solid {{t.bd}}; font-size: 13px; font-weight: 700; transition: all .2s">{{t.label}}</button></sc-for>
        </div>
        <div style="margin-top: 14px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Эмодзи для поиска</div>
        <div style="display: flex; gap: 6px">
          <sc-for list="{{emojis}}" as="e" hint-placeholder-count="6"><button onClick="{{e.tap}}" aria-pressed="{{e.on}}" style="flex: 1; height: 44px; border-radius: 14px; background: {{e.bg}}; border: 1.5px solid {{e.bd}}; font-size: 22px; text-align: center; transition: all .2s">{{e.ch}}</button></sc-for>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: linear-gradient(180deg, rgba(10,12,11,0), #0A0C0B 40%); display: flex; gap: 8px">
    <button onClick="{{send}}" style="height: 54px; padding: 0 18px; border-radius: 27px; background: rgba(255,255,255,.07); font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; opacity: {{actOp}}"><span class="ms" aria-hidden="true">send</span>Отправить</button>
    <button onClick="{{addPack}}" style="flex: 1; height: 54px; border-radius: 27px; background: {{packBg}}; color: {{packInk}}; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .25s"><span class="ms fill" aria-hidden="true">library_add</span>В мой набор</button>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 96px; padding: 12px 18px; border-radius: 18px; background: #232A26; border: 1px solid rgba(255,255,255,.16); font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2.4s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">{{toastIcon}}</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const STROKES = [['Нет', 'transparent', ''], ['Белая', '#FFFFFF', '#FFFFFF'], ['Чёрная', '#06150D', '#06150D'], ['Мятная', '#8FD3AC', '#8FD3AC']];
const TEXTS = ['Без подписи', 'Ну привет', 'Я занят', 'Мяу?', 'Пятница!'];
const EMO = ['😺', '😏', '🙈', '😴', '🥳', '😾'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { phase: 'photo', stroke: 1, text: 0, emo: { 0: true }, fly: 0, toast: 0, toastText: '', toastIcon: 'done' }; }
componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); clearTimeout(this.tt); }
toastMsg(text, icon) { clearTimeout(this.tt); this.setState({ toast: this.state.toast + 1, toastText: text, toastIcon: icon }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2400); }
renderVals() {
  const s = this.state;
  const cut = s.phase === 'cut';
  const sc = STROKES[s.stroke][2];
  const outline = cut && sc ? 'drop-shadow(0 0 0 ' + sc + ') drop-shadow(3px 0 0 ' + sc + ') drop-shadow(-3px 0 0 ' + sc + ') drop-shadow(0 3px 0 ' + sc + ') drop-shadow(0 -3px 0 ' + sc + ') drop-shadow(0 8px 14px rgba(0,0,0,.45))' : (cut ? 'drop-shadow(0 8px 14px rgba(0,0,0,.45))' : 'none');
  const nEmo = Object.values(s.emo).filter(Boolean).length;
  return {
    canvasBg: cut ? 'repeating-conic-gradient(#1A201D 0% 25%, #121614 0% 50%)' : '#121614',
    photoOp: cut ? '0' : '1',
    subjAnim: s.fly ? 'kxFlyPack .6s cubic-bezier(.5,0,.8,.4) both' : (cut ? 'kxPop .4s ease both' : 'none'),
    outline,
    hasText: cut && s.text > 0, text: TEXTS[s.text],
    scanning: s.phase === 'scan', cut, beforeCut: !cut,
    stepIcon: cut ? 'check_circle' : s.phase === 'scan' ? 'auto_fix_high' : 'image',
    stepText: cut ? 'Фон убран' : s.phase === 'scan' ? 'Ищем, что вырезать…' : 'Исходное фото',
    cutText: s.phase === 'scan' ? 'Вырезаем…' : 'Вырезать фон',
    doCut: () => { if (s.phase !== 'photo') return; this.setState({ phase: 'scan' }); clearTimeout(this.t1); this.t1 = setTimeout(() => this.setState({ phase: 'cut' }), 1150); },
    reset: () => { clearTimeout(this.t1); this.setState({ phase: 'photo', text: 0, fly: 0 }); },
    strokes: STROKES.map(([label, c], i) => ({ label, c, on: s.stroke === i, bg: s.stroke === i ? 'rgba(143,211,172,.12)' : 'rgba(255,255,255,.04)', bd: s.stroke === i ? '#8FD3AC' : 'rgba(255,255,255,.08)', tap: () => this.setState({ stroke: i }) })),
    texts: TEXTS.map((label, i) => ({ label, bg: s.text === i ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.05)', ink: s.text === i ? '#8FD3AC' : '#C9D2CC', bd: s.text === i ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.08)', tap: () => this.setState({ text: i }) })),
    emojis: EMO.map((ch, i) => { const on = !!s.emo[i]; return { ch, on, bg: on ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.04)', bd: on ? '#8FD3AC' : 'rgba(255,255,255,.06)', tap: () => this.setState({ emo: { ...s.emo, [i]: !on } }) }; }),
    actOp: cut ? '1' : '.4',
    packBg: cut ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : 'rgba(255,255,255,.07)', packInk: cut ? '#06150D' : '#5C6661',
    send: () => cut ? this.toastMsg('Стикер отправлен в чат', 'send') : this.toastMsg('Сначала вырежьте фон', 'content_cut'),
    addPack: () => {
      if (!cut) { this.toastMsg('Сначала вырежьте фон', 'content_cut'); return; }
      if (!nEmo) { this.toastMsg('Выберите хотя бы один эмодзи', 'mood'); return; }
      this.setState({ fly: 1 }); clearTimeout(this.t2);
      this.t2 = setTimeout(() => { this.setState({ fly: 0, phase: 'photo', text: 0 }); this.toastMsg('Добавлен в «Мои стикеры» · 13 шт.', 'library_add_check'); }, 650);
    },
    toast: s.toast > 0, toastText: s.toastText, toastIcon: s.toastIcon
  };
}
}
</script>
</body>
</html>
