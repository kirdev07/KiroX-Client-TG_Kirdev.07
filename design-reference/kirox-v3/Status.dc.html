<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Статус</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.9)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxPop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.35)}100%{transform:scale(1);opacity:1}}
@keyframes kxSpark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes kxGlow{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxToast{0%{opacity:0;transform:translateY(16px)}12%,85%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 22px; font-weight: 800">Статус</h1>
  </header>

  <!-- Preview -->
  <div style="position: relative; margin: 6px 16px 0; padding: 22px 16px 18px; border-radius: 26px; background: radial-gradient(80% 90% at 50% 0%, rgba(63,154,108,.25), rgba(255,255,255,.03) 70%); border: 1px solid rgba(143,211,172,.18); display: flex; flex-direction: column; align-items: center">
    <div aria-hidden="true" style="position: absolute; top: 6px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(143,211,172,.18), transparent 65%); animation: kxGlow 4s ease-in-out 2"></div>
    <span style="position: relative; width: 84px; height: 84px; border-radius: 42px; background: linear-gradient(140deg,#3F9A6C,#1F4D36); color: #DFF5E8; font-size: 30px; font-weight: 800; display: flex; align-items: center; justify-content: center">АМ</span>
    <div style="position: relative; margin-top: 12px; display: flex; align-items: center; gap: 6px; font-size: 21px; font-weight: 800">
      Алекс Миронов
      <span style="position: relative; display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center">
        <sc-if value="{{hasStatus}}" hint-placeholder-val="{{true}}"><span style="font-size: 24px; animation: kxPop .45s cubic-bezier(.34,1.45,.5,1) both" data-k="{{popKey}}">{{emoji}}</span></sc-if>
        <sc-if value="{{noStatus}}" hint-placeholder-val="{{false}}"><span class="ms fill" style="font-size: 22px; color: #8FD3AC" aria-hidden="true">verified</span></sc-if>
        <sc-if value="{{sparks}}" hint-placeholder-val="{{false}}"><sc-for list="{{bits}}" as="b" hint-placeholder-count="8"><span aria-hidden="true" style="position: absolute; left: 13px; top: 13px; width: 5px; height: 5px; border-radius: 3px; background: {{b.c}}; --dx: {{b.dx}}; --dy: {{b.dy}}; animation: kxSpark .7s ease-out both"></span></sc-for></sc-if>
      </span>
    </div>
    <div style="position: relative; margin-top: 4px; font-size: 13px; color: #9AA59F">{{until}}</div>
    <div style="position: relative; margin-top: 12px; width: 100%; padding: 10px 12px; border-radius: 16px; background: rgba(0,0,0,.25); display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: linear-gradient(140deg,#3F9A6C,#1F4D36); color: #DFF5E8; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">АМ</span>
      <span style="flex: 1; min-width: 0"><span style="display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700">Алекс <span style="font-size: 14px">{{emojiOrEmpty}}</span></span><span style="display: block; font-size: 12px; color: #8A958F">Так вас видят в списке чатов</span></span>
    </div>
  </div>

  <!-- Duration -->
  <div style="padding: 14px 16px 0; display: flex; gap: 6px; overflow-x: auto" class="scroll">
    <sc-for list="{{durs}}" as="d" hint-placeholder-count="5"><button onClick="{{d.tap}}" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 17px; background: {{d.bg}}; color: {{d.ink}}; border: 1px solid {{d.border}}; font-size: 13px; font-weight: 700; transition: all .2s">{{d.label}}</button></sc-for>
  </div>

  <!-- Grid -->
  <div class="scroll" style="flex: 1; min-height: 0; margin: 12px 0 0; padding: 0 12px 110px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="padding: 8px 6px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">{{g.title}}</div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{g.items}}" as="e" hint-placeholder-count="14"><button onClick="{{e.tap}}" aria-label="{{e.e}}" style="height: 46px; border-radius: 14px; background: {{e.bg}}; box-shadow: {{e.ring}}; font-size: 26px; display: flex; align-items: center; justify-content: center; transition: all .15s">{{e.e}}</button></sc-for>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; gap: 8px">
    <sc-if value="{{hasStatus}}" hint-placeholder-val="{{true}}"><button onClick="{{clear}}" style="flex: 1; height: 54px; border-radius: 18px; background: rgba(255,255,255,.08); font-size: 15px; font-weight: 700">Убрать</button></sc-if>
    <button onClick="{{save}}" style="flex: 2; height: 54px; border-radius: 18px; background: linear-gradient(100deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; font-weight: 800; box-shadow: 0 10px 28px rgba(63,154,108,.35)">Сохранить статус</button>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 11px; color: #8A958F">Эмодзи-статус работает с Telegram Premium</div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 24px; right: 24px; bottom: 96px; height: 46px; border-radius: 16px; background: #1E2622; border: 1px solid rgba(143,211,172,.25); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; animation: kxToast 2.2s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">check_circle</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const G = [
  ['Недавние', '🌿🎧💻☕🏔️✈️🔥'],
  ['Настроение', '😊😎🥳😴🤒🤯🥰🙂🤓😇🫡🤔😤🫠'],
  ['Занятия', '💼🎮📚🏋️🎨🎬🍳🚗🏖️🎵⚽🧘🛒🛠️'],
  ['Символы', '⭐💚💎🌙⚡🍀🌈❄️🎯🚀🌸🦊🐼🎉']
];
const D = [['Навсегда', 0], ['1 час', 1], ['8 часов', 8], ['До завтра', 24], ['Неделя', 168]];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { emoji: '🎧', dur: 2, pop: 0, toast: 0, toastText: '' }; }
componentWillUnmount() { clearTimeout(this.tt); }
say(t) { clearTimeout(this.tt); this.setState({ toast: Date.now(), toastText: t }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2200); }
renderVals() {
  const s = this.state;
  const split = str => Array.from(str.matchAll(/\p{Extended_Pictographic}(️|‍\p{Extended_Pictographic})*/gu)).map(m => m[0]);
  const h = D[s.dur][1];
  const until = !s.emoji ? 'Статус не выбран' : h === 0 ? 'Статус без срока' : h === 24 ? 'Статус до завтра, 09:00' : h === 168 ? 'Статус до 29 ноября' : 'Статус ещё ' + h + (h === 1 ? ' час' : ' часов');
  const colors = ['#8FD3AC', '#E8B04A', '#FF8A80', '#9FB7FF'];
  return {
    hasStatus: !!s.emoji, noStatus: !s.emoji, emoji: s.emoji, emojiOrEmpty: s.emoji, popKey: String(s.pop),
    sparks: !!s.pop && Date.now() - s.pop < 800,
    bits: Array.from({ length: 8 }, (_, i) => { const a = i / 8 * Math.PI * 2; return { c: colors[i % 4], dx: Math.round(Math.cos(a) * 26) + 'px', dy: Math.round(Math.sin(a) * 26) + 'px' }; }),
    until,
    durs: D.map(([label], i) => ({ label, bg: i === s.dur ? 'rgba(143,211,172,.14)' : 'rgba(255,255,255,.05)', ink: i === s.dur ? '#8FD3AC' : '#EEF3EF', border: i === s.dur ? 'rgba(143,211,172,.45)' : 'transparent', tap: () => this.setState({ dur: i }) })),
    groups: G.map(([title, str]) => ({ title, items: split(str).map(e => ({ e, bg: e === s.emoji ? 'rgba(143,211,172,.14)' : 'transparent', ring: e === s.emoji ? 'inset 0 0 0 2px #8FD3AC' : 'none', tap: () => this.setState({ emoji: e, pop: Date.now() }) })) })),
    clear: () => this.setState({ emoji: '' }),
    save: () => this.say(s.emoji ? 'Статус ' + s.emoji + ' сохранён' : 'Статус убран')
  };
}
}
</script>
</body>
</html>
