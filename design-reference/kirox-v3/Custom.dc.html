<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кастомизация</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
@keyframes kxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes kxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: -100px; top: -100px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, {{glow}}, rgba(0,0,0,0) 65%); transition: background .6s ease"></div>

  <header style="position: relative; padding: 10px 12px 4px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="margin: 0; font-size: 22px; font-weight: 800">Кастомизация</h1>
  </header>

  <div style="position: relative; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="position: relative; height: 230px; border-radius: 28px; overflow: hidden; background: {{previewBg}}; border: 1px solid rgba(255,255,255,.09); transition: background .6s ease; animation: kxRise .6s cubic-bezier(.2,.8,.2,1) both">
      <div style="position: absolute; left: 12px; right: 12px; top: 12px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; gap: 8px; padding: 0 6px">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: linear-gradient(140deg, #4B3F7A, #2A2240); color: #DCD0FF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">А</span>
        <span style="flex-grow: 1"><span style="display: block; font-size: 13px; font-weight: 700">Анна</span><span style="display: block; font-size: 11px; color: {{accent}}; transition: color .4s">в сети</span></span>
      </div>
      <div style="position: absolute; left: 12px; right: 12px; top: 68px; display: flex; flex-direction: column; gap: 5px">
        <div style="align-self: flex-start; padding: 7px 11px; border-radius: 16px 16px 16px 5px; background: rgba(255,255,255,.08); font-size: 13px">Как тебе новая тема?</div>
        <div style="align-self: flex-end; padding: 7px 11px; border-radius: {{bubbleRadius}}; background: {{bubble}}; color: {{onBubble}}; font-size: 13px; transition: background .5s ease, border-radius .3s ease; animation: kxFloat 4s ease-in-out 2">Цвет — огонь 🔥</div>
      </div>
      <div style="position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); height: 44px; padding: 0 5px; border-radius: 22px; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); display: flex; align-items: center; gap: 4px">
        <span style="width: 42px; height: 34px; border-radius: 17px; background: {{lens}}; border: 1px solid rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; transition: background .5s"><span class="ms fill" style="font-size: 18px" aria-hidden="true">chat</span></span>
        <span class="ms" style="width: 34px; text-align: center; font-size: 18px; color: #8A958F" aria-hidden="true">call</span>
        <span class="ms" style="width: 34px; text-align: center; font-size: 18px; color: #8A958F" aria-hidden="true">motion_photos_on</span>
        <span class="ms" style="width: 34px; text-align: center; font-size: 18px; color: #8A958F" aria-hidden="true">settings</span>
      </div>
    </div>

    <div style="animation: kxRise .6s cubic-bezier(.2,.8,.2,1) .06s both">
      <div style="display: flex; align-items: baseline; padding: 0 2px 10px"><span style="flex-grow: 1; font-size: 14px; font-weight: 700; color: #C9D2CC">Цвет · {{themeName}}</span><span style="font-size: 12px; color: #8A958F">Своих: 1</span></div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px 8px">
        <sc-for list="{{themes}}" as="t" hint-placeholder-count="12">
          <button aria-label="{{t.name}}" onClick="{{t.pick}}" style="aspect-ratio: 1; border-radius: 50%; position: relative; background: {{t.swatch}}; box-shadow: {{t.ring}}; transition: box-shadow .3s ease, transform .3s cubic-bezier(.34,1.5,.5,1); transform: {{t.scale}}; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><span class="ms" style="font-size: 18px; font-weight: 700; color: #06150D" aria-hidden="true">check</span></sc-if>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px; animation: kxRise .6s cubic-bezier(.2,.8,.2,1) .12s both">
      <button style="height: 58px; padding: 0 14px; border-radius: 22px 22px 6px 6px; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 14px"><span style="width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.07); color: {{accent}}; display: flex; align-items: center; justify-content: center; transition: color .4s"><span class="ms fill" style="font-size: 20px" aria-hidden="true">forum</span></span><span style="flex-grow: 1"><span style="display: block; font-size: 15px">Чаты</span><span style="display: block; font-size: 12px; color: #8A958F">Пузыри, обои, размер текста</span></span><span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">chevron_right</span></button>
      <button style="height: 58px; padding: 0 14px; border-radius: 6px; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 14px"><span style="width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.07); color: {{accent}}; display: flex; align-items: center; justify-content: center; transition: color .4s"><span class="ms fill" style="font-size: 20px" aria-hidden="true">auto_awesome</span></span><span style="flex-grow: 1"><span style="display: block; font-size: 15px">Анимации</span><span style="display: block; font-size: 12px; color: #8A958F">Сцена и скорость</span></span><span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">chevron_right</span></button>
      <button style="height: 58px; padding: 0 14px; border-radius: 6px; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 14px"><span style="width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.07); color: {{accent}}; display: flex; align-items: center; justify-content: center; transition: color .4s"><span class="ms fill" style="font-size: 20px" aria-hidden="true">wallpaper</span></span><span style="flex-grow: 1"><span style="display: block; font-size: 15px">Оформление отдельных чатов</span><span style="display: block; font-size: 12px; color: #8A958F">Своё у 2 чатов</span></span><span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">chevron_right</span></button>
      <button style="height: 58px; padding: 0 14px; border-radius: 6px 6px 22px 22px; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 14px"><span style="width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.07); color: {{accent}}; display: flex; align-items: center; justify-content: center; transition: color .4s"><span class="ms fill" style="font-size: 20px" aria-hidden="true">apps</span></span><span style="flex-grow: 1"><span style="display: block; font-size: 15px">Иконка приложения</span><span style="display: block; font-size: 12px; color: #8A958F">Как kiroX выглядит на экране</span></span><span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">chevron_right</span></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px; animation: kxRise .6s cubic-bezier(.2,.8,.2,1) .18s both">
      <div style="padding: 0 2px 8px; font-size: 14px; font-weight: 700; color: #C9D2CC">Нижняя панель</div>
      <sc-for list="{{toggles}}" as="g" hint-placeholder-count="2">
        <button role="switch" aria-checked="{{g.checked}}" onClick="{{g.flip}}" style="height: 54px; padding: 0 14px; border-radius: {{g.radius}}; background: rgba(255,255,255,.045); display: flex; align-items: center; gap: 12px">
          <span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">{{g.icon}}</span>
          <span style="flex-grow: 1; font-size: 15px">{{g.label}}</span>
          <span style="width: 50px; height: 30px; border-radius: 15px; background: {{g.track}}; box-shadow: inset 0 1px 0 rgba(255,255,255,.15); position: relative; transition: background .3s ease">
            <span style="position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .35s cubic-bezier(.34,1.5,.5,1); transform: {{g.knob}}"></span>
          </span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { theme: 0, calls: true, stories: true }; }
renderVals() {
  const T = [
    ['Тёмно-зелёная', '#8FD3AC', '#2E6B4B', '#1F4D36', 'rgba(70,160,110,.22)'],
    ['Мята', '#7FE0C4', '#1F6B5C', '#134A40', 'rgba(70,190,160,.22)'],
    ['Океан', '#7FC4F0', '#2A5A86', '#183C5C', 'rgba(70,140,210,.22)'],
    ['Индиго', '#A3A8FF', '#4A4FB0', '#2E3278', 'rgba(110,110,230,.22)'],
    ['Аметист', '#C9A6FF', '#6A48B8', '#432C7A', 'rgba(150,100,230,.22)'],
    ['Сакура', '#FF9CC8', '#A23F74', '#6B2550', 'rgba(230,100,170,.20)'],
    ['Рубин', '#FF8A96', '#A8323F', '#701E28', 'rgba(230,80,90,.20)'],
    ['Закат', '#FFAE80', '#B05A30', '#743818', 'rgba(240,140,80,.20)'],
    ['Янтарь', '#FFD27A', '#9A7020', '#644612', 'rgba(230,180,70,.18)'],
    ['Графит', '#C9D2CC', '#4A524E', '#2E3431', 'rgba(200,210,205,.12)'],
    ['AMOLED', '#8FD3AC', '#1E2A24', '#121915', 'rgba(70,160,110,.10)'],
    ['Своя', '#E6C3FF', '#2E6B4B', '#6A48B8', 'rgba(170,120,230,.2)']
  ];
  const cur = this.state.theme;
  const [name, accent, b1, b2, glow] = T[cur];
  const themes = T.map((t, i) => ({
    name: t[0], on: i === cur,
    swatch: i === 11 ? 'conic-gradient(#8FD3AC, #C9A6FF, #FFAE80, #7FC4F0, #8FD3AC)' : 'linear-gradient(140deg, ' + t[1] + ' 0%, ' + t[1] + ' 45%, ' + t[2] + ' 100%)',
    ring: i === cur ? '0 0 0 3px #0A0C0B, 0 0 0 5px ' + t[1] : 'inset 0 1px 0 rgba(255,255,255,.3)',
    scale: i === cur ? 'scale(1.06)' : 'scale(1)',
    pick: () => this.setState({ theme: i })
  }));
  const onBubble = cur === 9 ? '#0A0C0B' : '#F2FAF5';
  const toggles = [
    { key: 'calls', icon: 'call', label: 'Вкладка «Звонки»', radius: '22px 22px 6px 6px' },
    { key: 'stories', icon: 'motion_photos_on', label: 'Вкладка «Истории»', radius: '6px 6px 22px 22px' }
  ].map(g => {
    const on = this.state[g.key];
    return Object.assign({}, g, {
      checked: on ? 'true' : 'false',
      track: on ? accent : '#2A322E',
      knob: on ? 'translateX(20px)' : 'translateX(0)',
      flip: () => this.setState({ [g.key]: !on })
    });
  });
  return {
    themes, toggles, themeName: name, accent, glow,
    bubble: 'linear-gradient(160deg, ' + b1 + ', ' + b2 + ')',
    onBubble,
    bubbleRadius: '16px 16px 5px 16px',
    lens: 'linear-gradient(180deg, ' + accent + '88, ' + b1 + '66)',
    previewBg: 'radial-gradient(120% 80% at 100% 0%, ' + glow + ', rgba(0,0,0,0) 60%), #0E1210'
  };
}
}
</script>
</body>
</html>
