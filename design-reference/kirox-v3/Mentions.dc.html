<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Упоминания</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94)}
@keyframes kxFlash{0%{background:rgba(143,211,172,.35)}100%{background:rgba(143,211,172,0)}}
@keyframes kxFlash2{0%{background:rgba(143,211,172,.35)}100%{background:rgba(143,211,172,0)}}
@keyframes kxBadge{0%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kxPop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(135deg, #6FA9D8, #2F6E9E); display: flex; align-items: center; justify-content: center; font-weight: 800">K</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Kotlin-клуб</div><div style="font-size: 12px; color: #9AA59F">1 284 участника · 42 в сети</div></div>
  </header>

  <!-- Messages window -->
  <div style="flex: 1; min-height: 0; position: relative; overflow: hidden">
    <div style="position: absolute; left: 0; right: 0; top: {{scrollTop}}; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; transition: top .5s cubic-bezier(.2,.8,.2,1)">
      <sc-for list="{{msgs}}" as="m" hint-placeholder-count="12">
        <div style="display: flex; gap: 8px; align-items: flex-end; align-self: {{m.side}}; max-width: 86%; padding: 3px; border-radius: 20px; animation: {{m.flash}}">
          <sc-if value="{{m.other}}" hint-placeholder-val="{{true}}"><span style="width: 30px; height: 30px; border-radius: 15px; background: {{m.c}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex-shrink: 0">{{m.l}}</span></sc-if>
          <div style="padding: 8px 12px; border-radius: {{m.r}}; background: {{m.bg}}; color: {{m.ink}}; border: 1px solid {{m.bd}}">
            <sc-if value="{{m.other}}" hint-placeholder-val="{{true}}"><div style="font-size: 12px; font-weight: 800; color: {{m.c}}">{{m.name}}</div></sc-if>
            <div style="font-size: 14px; line-height: 1.35">{{m.pre}}<span style="color: {{m.atInk}}; font-weight: 700; background: {{m.atBg}}; padding: 0 3px; border-radius: 4px">{{m.at}}</span>{{m.post}}</div>
            <div style="margin-top: 2px; text-align: right; font-size: 11px; opacity: .6">{{m.time}}</div>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- Floating jump buttons -->
    <div style="position: absolute; right: 12px; bottom: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center">
      <sc-if value="{{hasReact}}" hint-placeholder-val="{{true}}">
        <button onClick="{{jumpReact}}" aria-label="К новым реакциям" style="position: relative; width: 48px; height: 48px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.07)); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; font-size: 22px; animation: kxPop .3s ease both">❤️<span style="position: absolute; right: -4px; top: -4px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #F07AA0; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{reactN}}</span></button>
      </sc-if>
      <sc-if value="{{hasAt}}" hint-placeholder-val="{{true}}">
        <button onClick="{{jumpAt}}" aria-label="К следующему упоминанию" style="position: relative; width: 48px; height: 48px; border-radius: 24px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(63,154,108,.4); animation: kxPop .3s ease both">@<span style="position: absolute; right: -4px; top: -4px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #EEF3EF; color: #06150D; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; animation: {{badgeAnim}}">{{atN}}</span></button>
      </sc-if>
      <button onClick="{{jumpDown}}" aria-label="Вниз к новым" style="position: relative; width: 48px; height: 48px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.07)); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">keyboard_arrow_down</span><sc-if value="{{hasUnread}}" hint-placeholder-val="{{true}}"><span style="position: absolute; right: -4px; top: -4px; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #3F9A6C; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{unread}}</span></sc-if></button>
    </div>

    <sc-if value="{{hint}}" hint-placeholder-val="{{true}}"><div style="position: absolute; left: 14px; bottom: 18px; max-width: 220px; padding: 10px 12px; border-radius: 16px; background: rgba(143,211,172,.12); border: 1px solid rgba(143,211,172,.3); font-size: 12px; color: #C9E8D5; animation: kxIn .3s ease both">{{hintText}}</div></sc-if>
  </div>

  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06); display: flex; gap: 8px; align-items: center">
    <div style="flex: 1; height: 48px; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,.07); display: flex; align-items: center; font-size: 15px; color: #8A958F">Сообщение</div>
    <span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center; color: #9AA59F"><span class="ms" aria-hidden="true">mic</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const ME = '@kirill_dev';
const M = [
  ['Олег', 'О', '#9AA59F', 'Всем привет, кто на митап?', '', '', '10:02'],
  ['Мария', 'М', '#E8B04A', 'Я буду, возьму ноутбук', '', '', '10:04'],
  ['Дмитрий', 'Д', '#6FA9D8', '', ME, ', глянешь PR про кэш? Там пара вопросов', '10:11', 'at'],
  ['Олег', 'О', '#9AA59F', 'Пицца будет?', '', '', '10:15'],
  ['me', '', '', 'Буду в 11, PR гляну сегодня', '', '', '10:20', 'react'],
  ['Мария', 'М', '#E8B04A', 'Ура, пицца за счёт клуба 🍕', '', '', '10:31'],
  ['Анна', 'А', '#F07AA0', 'Ребята, ', ME, ' сегодня покажет новый дизайн kiroX 😉', '10:40', 'at'],
  ['Дмитрий', 'Д', '#6FA9D8', 'О, интересно', '', '', '10:41'],
  ['Олег', 'О', '#9AA59F', 'Кто знает адрес коворкинга?', '', '', '10:50'],
  ['Мария', 'М', '#E8B04A', 'Абая 52, вход со двора', '', '', '10:52'],
  ['Админ', 'A', '#8FD3AC', 'Напоминаю: начало в 11:00. ', ME, ', ты ведущий второго доклада', '10:58', 'at'],
  ['Олег', 'О', '#9AA59F', 'Я уже тут 👋', '', '', '11:01']
];
const AT = M.map((m, i) => m[7] === 'at' ? i : -1).filter(i => i >= 0);
const ROW = 74;
class Component extends DCLogic {
constructor(props) { super(props); this.state = { pos: 0, seenAt: [], seenReact: false, flash: -1, f: 0, down: false }; }
go(i) { this.setState({ pos: i, flash: i, f: this.state.f + 1 }); }
renderVals() {
  const s = this.state;
  const leftAt = AT.filter(i => !s.seenAt.includes(i));
  const top = s.down ? -(M.length * ROW - 560) : -Math.max(0, s.pos * ROW - 120);
  return {
    scrollTop: top + 'px',
    msgs: M.map((m, i) => {
      const me = m[0] === 'me';
      const isAt = m[7] === 'at';
      return {
        other: !me, side: me ? 'flex-end' : 'flex-start', name: m[0], l: m[1], c: m[2], pre: m[3], at: m[4], post: m[5], time: m[6],
        r: me ? '16px 16px 6px 16px' : '16px 16px 16px 6px', bg: me ? 'linear-gradient(135deg, #6FC497, #3F9A6C)' : isAt ? 'rgba(143,211,172,.1)' : 'rgba(255,255,255,.07)',
        ink: me ? '#06150D' : '#EEF3EF', bd: isAt ? 'rgba(143,211,172,.35)' : 'transparent',
        atInk: '#8FD3AC', atBg: isAt ? 'rgba(143,211,172,.16)' : 'transparent',
        flash: s.flash === i ? (s.f % 2 ? 'kxFlash' : 'kxFlash2') + ' 1.4s ease both' : 'none'
      };
    }).map((m, i) => ({ ...m, time: M[i][7] === 'react' ? M[i][6] + ' · ❤️ 3' : m.time })),
    hasAt: leftAt.length > 0, atN: String(leftAt.length), badgeAnim: 'kxBadge .3s ease',
    jumpAt: () => { const i = leftAt[0]; this.setState({ seenAt: [...s.seenAt, i], down: false }); this.go(i); },
    hasReact: !s.seenReact, reactN: '3', jumpReact: () => { this.setState({ seenReact: true, down: false }); this.go(4); },
    hasUnread: !s.down, unread: '12', jumpDown: () => this.setState({ down: true, flash: -1 }),
    hint: leftAt.length === AT.length && !s.seenReact, hintText: 'Вас упомянули 3 раза. Нажмите @ — kiroX пролистает к каждому упоминанию по очереди'
  };
}
}
</script>
</body>
</html>
