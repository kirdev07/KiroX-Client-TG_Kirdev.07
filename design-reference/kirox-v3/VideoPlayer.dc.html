<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Видеоплеер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxPan{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes kxSkip{0%{opacity:0;transform:scale(.7)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
@keyframes kxSkip2{0%{opacity:0;transform:scale(.7)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
@keyframes kxIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #000; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px; display: flex; align-items: center; gap: 10px">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">close</span></span>
    <div style="flex: 1"><div style="font-size: 15px; font-weight: 800">Kotlin по-русски</div><div style="font-size: 12px; color: #9AA59F">21 ноября в 19:00</div></div>
    <button onClick="{{pip}}" aria-label="Картинка в картинке" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">picture_in_picture_alt</span></button>
  </header>

  <!-- Video -->
  <div style="position: relative; height: 230px; margin-top: 30px; background: linear-gradient(110deg, #0F3D2A, #1B2A3A, #3F9A6C, #0B1F17, #2F6E9E); background-size: 400% 100%; animation: kxPan 18s linear infinite alternate; animation-play-state: {{panState}}; overflow: hidden">
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; opacity: .85">
      <span style="font-size: 54px">{{sceneEmoji}}</span>
      <span style="padding: 4px 10px; border-radius: 10px; background: rgba(0,0,0,.4); font-size: 13px; font-weight: 700">{{sceneTitle}}</span>
    </div>
    <button onClick="{{back10}}" aria-label="Назад на 10 секунд" style="position: absolute; left: 0; top: 0; bottom: 0; width: 35%; display: flex; align-items: center; justify-content: center"><span style="width: 64px; height: 64px; border-radius: 32px; background: rgba(255,255,255,.18); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; animation: {{bAnim}}"><span class="ms" aria-hidden="true">fast_rewind</span><span style="font-size: 11px; font-weight: 800">10 с</span></span></button>
    <button onClick="{{fwd10}}" aria-label="Вперёд на 10 секунд" style="position: absolute; right: 0; top: 0; bottom: 0; width: 35%; display: flex; align-items: center; justify-content: center"><span style="width: 64px; height: 64px; border-radius: 32px; background: rgba(255,255,255,.18); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; animation: {{fAnim}}"><span class="ms" aria-hidden="true">fast_forward</span><span style="font-size: 11px; font-weight: 800">10 с</span></span></button>
    <button onClick="{{toggle}}" aria-label="{{playLabel}}" style="position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 32px; background: rgba(0,0,0,.45); backdrop-filter: blur(10px); display: {{bigShow}}; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 36px" aria-hidden="true">play_arrow</span></button>
  </div>

  <!-- Controls -->
  <div style="padding: 14px 16px 0">
    <div style="display: flex; align-items: center; font-size: 13px; font-weight: 700"><span style="flex: 1; color: #8FD3AC">{{chapterName}}</span><span style="font-variant-numeric: tabular-nums; color: #C9D2CC">{{cur}} / 12:40</span></div>
    <div style="margin-top: 10px; position: relative; height: 18px; display: flex; align-items: center; gap: 3px">
      <sc-for list="{{segs}}" as="g" hint-placeholder-count="5"><button onClick="{{g.tap}}" aria-label="{{g.aria}}" style="position: relative; height: 18px; flex: {{g.flex}}; display: flex; align-items: center"><span style="display: block; width: 100%; height: {{g.h}}; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; transition: height .15s"><span style="display: block; height: 100%; width: {{g.fill}}; background: #8FD3AC; transition: width .25s linear"></span></span></button></sc-for>
      <span style="position: absolute; top: 2px; left: {{knob}}; width: 14px; height: 14px; margin-left: -7px; border-radius: 7px; background: #EEF3EF; box-shadow: 0 0 0 4px rgba(143,211,172,.25); transition: left .25s linear; pointer-events: none"></span>
    </div>

    <div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between">
      <button onClick="{{prevCh}}" aria-label="Предыдущая глава" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">skip_previous</span></button>
      <button onClick="{{back10}}" aria-label="Назад на 10 секунд" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">replay_10</span></button>
      <button onClick="{{toggle}}" aria-label="{{playLabel}}" style="width: 64px; height: 64px; border-radius: 32px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 34px" aria-hidden="true">{{playIcon}}</span></button>
      <button onClick="{{fwd10}}" aria-label="Вперёд на 10 секунд" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">forward_10</span></button>
      <button onClick="{{nextCh}}" aria-label="Следующая глава" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true">skip_next</span></button>
    </div>

    <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px; border-radius: 16px; background: rgba(255,255,255,.06)">
      <sc-for list="{{speeds}}" as="sp" hint-placeholder-count="5"><button onClick="{{sp.tap}}" aria-pressed="{{sp.on}}" style="height: 32px; border-radius: 12px; background: {{sp.bg}}; color: {{sp.ink}}; font-size: 13px; font-weight: 800; text-align: center">{{sp.t}}</button></sc-for>
    </div>
  </div>

  <!-- Caption with timecodes -->
  <div class="scroll" style="flex: 1; min-height: 0; margin-top: 14px; padding: 12px 16px 18px; border-top: 1px solid rgba(255,255,255,.08); background: #0A0C0B">
    <div style="font-size: 14px; line-height: 1.45; color: #DDE5E0">Разбираем корутины на живом проекте. Главы:</div>
    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{chapters}}" as="c" hint-placeholder-count="5"><button onClick="{{c.tap}}" style="min-height: 40px; padding: 0 10px; border-radius: 12px; background: {{c.bg}}; display: flex; align-items: center; gap: 10px"><span style="font-size: 13px; font-weight: 800; color: #8FD3AC; font-variant-numeric: tabular-nums; text-decoration: underline; text-underline-offset: 3px">{{c.tc}}</span><span style="flex: 1; font-size: 14px; color: {{c.ink}}; font-weight: {{c.fw}}">{{c.t}}</span><span class="ms fill" style="font-size: 16px; color: #8FD3AC; display: {{c.nowShow}}" aria-hidden="true">graphic_eq</span></button></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TOTAL = 760;
const CH = [[0, 'Вступление', '👋'], [95, 'Зачем нужны корутины', '🤔'], [240, 'launch и async', '🚀'], [430, 'Отмена и таймауты', '⏱'], [610, 'Тесты и итоги', '✅']];
const SP = [0.5, 1, 1.25, 1.5, 2];
const mmss = (n) => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(Math.floor(n % 60)).padStart(2, '0');
class Component extends DCLogic {
constructor(props) { super(props); this.state = { t: 262, play: true, sp: 1, bk: 0, fk: 0 }; }
componentDidMount() { this.iv = setInterval(() => { const s = this.state; if (s.play) this.setState({ t: Math.min(TOTAL, s.t + SP[s.sp] * 0.25) }); }, 250); }
componentWillUnmount() { clearInterval(this.iv); }
renderVals() {
  const s = this.state;
  let ci = 0; CH.forEach((c, i) => { if (s.t >= c[0]) ci = i; });
  const seek = (t) => this.setState({ t: Math.max(0, Math.min(TOTAL, t)) });
  return {
    panState: s.play ? 'running' : 'paused',
    sceneEmoji: CH[ci][2], sceneTitle: CH[ci][1],
    chapterName: 'Глава ' + (ci + 1) + ' · ' + CH[ci][1],
    cur: mmss(s.t),
    segs: CH.map((c, i) => { const start = c[0], end = i < CH.length - 1 ? CH[i + 1][0] : TOTAL; const f = s.t >= end ? 100 : s.t <= start ? 0 : (s.t - start) / (end - start) * 100; return { flex: String(end - start), fill: f + '%', h: i === ci ? '7px' : '4px', aria: 'Глава ' + (i + 1) + ': ' + c[1], tap: () => seek(start) }; }),
    knob: (s.t / TOTAL * 100) + '%',
    toggle: () => this.setState({ play: !s.play }), playIcon: s.play ? 'pause' : 'play_arrow', playLabel: s.play ? 'Пауза' : 'Смотреть', bigShow: s.play ? 'none' : 'flex',
    back10: () => { seek(s.t - 10); this.setState({ bk: s.bk + 1 }); }, fwd10: () => { seek(s.t + 10); this.setState({ fk: s.fk + 1 }); },
    bAnim: s.bk ? (s.bk % 2 ? 'kxSkip2' : 'kxSkip') + ' .6s ease both' : 'none', fAnim: s.fk ? (s.fk % 2 ? 'kxSkip2' : 'kxSkip') + ' .6s ease both' : 'none',
    prevCh: () => seek(s.t - CH[ci][0] > 3 ? CH[ci][0] : CH[Math.max(0, ci - 1)][0]),
    nextCh: () => seek(ci < CH.length - 1 ? CH[ci + 1][0] : TOTAL),
    speeds: SP.map((v, i) => { const on = s.sp === i; return { t: (v + '').replace('.', ',') + '×', on: on ? 'true' : 'false', bg: on ? 'rgba(143,211,172,.2)' : 'transparent', ink: on ? '#8FD3AC' : '#9AA59F', tap: () => this.setState({ sp: i }) }; }),
    chapters: CH.map((c, i) => ({ tc: mmss(c[0]), t: c[1], bg: i === ci ? 'rgba(143,211,172,.08)' : 'transparent', ink: i === ci ? '#EEF3EF' : '#C9D2CC', fw: i === ci ? 800 : 500, nowShow: i === ci ? 'inline-block' : 'none', tap: () => seek(c[0]) })),
    pip: () => {}
  };
}
}
</script>
</body>
</html>
