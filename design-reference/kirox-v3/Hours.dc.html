<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Часы работы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxDot{0%,100%{box-shadow:0 0 0 0 rgba(143,211,172,.6)}50%{box-shadow:0 0 0 6px rgba(143,211,172,0)}}
@keyframes kxPin{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes kxToast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 800">Часы и адрес</h1><span style="height: 20px; padding: 0 8px; border-radius: 10px; background: rgba(201,160,224,.18); color: #C9A0E0; font-size: 11px; font-weight: 800; line-height: 20px; flex: none">PREMIUM</span>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 4px 16px 110px">
    <!-- Profile preview -->
    <div style="padding: 14px; border-radius: 24px; background: radial-gradient(100% 90% at 100% 0%, rgba(63,154,108,.28), transparent 60%), rgba(255,255,255,.04); border: 1px solid rgba(143,211,172,.2)">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 50px; height: 50px; border-radius: 25px; background: linear-gradient(135deg, #B07A2E, #6A4C9C); display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0"><span class="ms fill" aria-hidden="true">local_cafe</span></span>
        <div style="flex: 1; min-width: 0"><div style="font-size: 16px; font-weight: 800">Кофейня «Зерно»</div><div style="margin-top: 3px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: {{statusInk}}"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{statusInk}}; animation: {{dotAnim}}"></span>{{status}}</div></div>
      </div>
      <div style="margin-top: 10px; font-size: 12px; color: #8A958F">Так видят ваш профиль. Сейчас воскресенье, 18:00</div>
    </div>

    <!-- Quick presets -->
    <div style="margin-top: 14px; display: flex; gap: 6px">
      <sc-for list="{{presets}}" as="p" hint-placeholder-count="3"><button onClick="{{p.tap}}" style="flex: 1; height: 36px; border-radius: 18px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); font-size: 12px; font-weight: 700; color: #C9D2CC; text-align: center">{{p.label}}</button></sc-for>
    </div>

    <!-- Week -->
    <div style="margin-top: 12px; border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); overflow: hidden">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.05); background: {{d.rowBg}}">
          <span style="width: 30px; font-size: 14px; font-weight: 800; color: {{d.dayInk}}">{{d.wd}}</span>
          <sc-if value="{{d.open}}" hint-placeholder-val="{{true}}">
            <span style="flex: 1; display: flex; align-items: center; gap: 4px">
              <button onClick="{{d.fromMinus}}" aria-label="{{d.fromLabel}}" style="width: 26px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 16px" aria-hidden="true">remove</span></button>
              <span style="min-width: 46px; text-align: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{d.from}}</span>
              <span style="color: #8A958F">—</span>
              <span style="min-width: 46px; text-align: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{d.to}}</span>
              <button onClick="{{d.toPlus}}" aria-label="{{d.toLabel}}" style="width: 26px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 16px" aria-hidden="true">add</span></button>
            </span>
          </sc-if>
          <sc-if value="{{d.closed}}" hint-placeholder-val="{{false}}"><span style="flex: 1; font-size: 14px; color: #8A958F">Выходной</span></sc-if>
          <button onClick="{{d.toggle}}" aria-pressed="{{d.open}}" aria-label="{{d.toggleLabel}}" style="width: 44px; height: 26px; border-radius: 13px; background: {{d.track}}; position: relative; transition: background .2s; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{d.knob}}; width: 20px; height: 20px; border-radius: 10px; background: {{d.knobBg}}; transition: left .2s"></span></button>
        </div>
      </sc-for>
    </div>

    <!-- Address -->
    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Адрес</div>
    <div style="border-radius: 22px; overflow: hidden; border: 1px solid rgba(255,255,255,.08)">
      <div style="position: relative; height: 120px; background: #142019; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 22px 22px">
        <span style="position: absolute; left: 0; right: 0; top: 54px; height: 10px; background: rgba(255,255,255,.08)"></span>
        <span style="position: absolute; top: 0; bottom: 0; left: 150px; width: 10px; background: rgba(255,255,255,.08)"></span>
        <span style="position: absolute; left: 40px; top: 14px; width: 60px; height: 30px; border-radius: 8px; background: rgba(63,154,108,.25)"></span>
        <span class="ms fill" style="position: absolute; left: 160px; top: 22px; font-size: 38px; color: #8FD3AC; animation: kxPin 2s ease-in-out 2" aria-hidden="true">location_on</span>
      </div>
      <div style="padding: 12px 14px; background: rgba(255,255,255,.04); display: flex; align-items: center; gap: 10px">
        <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 700">ул. Абая, 52</span><span style="display: block; font-size: 12px; color: #8A958F">Алматы · вход со двора</span></span>
        <button onClick="{{editAddr}}" style="height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,255,255,.07); font-size: 12px; font-weight: 700">Изменить</button>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: linear-gradient(180deg, rgba(10,12,11,0), #0A0C0B 40%)">
    <button onClick="{{save}}" style="width: 100%; height: 54px; border-radius: 27px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px"><span class="ms fill" aria-hidden="true">storefront</span>Сохранить</button>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; bottom: 96px; padding: 12px 18px; border-radius: 18px; background: #232A26; border: 1px solid rgba(255,255,255,.16); font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; animation: kxToast 2.4s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">{{toastIcon}}</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const WDL = ['понедельник', 'вторник', 'среду', 'четверг', 'пятницу', 'субботу', 'воскресенье'];
const hm = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const TODAY = 6, NOW = 18 * 60;
class Component extends DCLogic {
constructor(props) {
  super(props);
  const days = WD.map((_, i) => ({ open: true, from: i < 5 ? 480 : 600, to: i < 5 ? 1260 : 1140 }));
  this.state = { days, toast: 0, toastText: '', toastIcon: 'done' };
}
componentWillUnmount() { clearTimeout(this.tt); }
toastMsg(text, icon) { clearTimeout(this.tt); this.setState({ toast: this.state.toast + 1, toastText: text, toastIcon: icon }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2400); }
renderVals() {
  const s = this.state;
  const t = s.days[TODAY];
  const openNow = t.open && NOW >= t.from && NOW < t.to;
  let status;
  if (openNow) status = t.to - NOW <= 60 ? 'Скоро закроется · до ' + hm(t.to) : 'Открыто до ' + hm(t.to);
  else {
    let k = 0, nd = null;
    if (t.open && NOW < t.from) nd = { i: TODAY, d: t };
    while (!nd && k < 7) { k++; const i = (TODAY + k) % 7; if (s.days[i].open) nd = { i, d: s.days[i] }; }
    status = nd ? 'Закрыто · откроется ' + (nd.i === TODAY ? 'сегодня' : k === 1 ? 'завтра' : 'в ' + WDL[nd.i]) + ' в ' + hm(nd.d.from) : 'Закрыто';
  }
  const upd = (i, patch) => this.setState({ days: s.days.map((d, k) => k === i ? { ...d, ...patch } : d) });
  return {
    status, statusInk: openNow ? '#8FD3AC' : '#FF8A80', dotAnim: openNow ? 'kxDot 1.6s ease-in-out infinite' : 'none',
    presets: [
      { label: 'Будни 9–18', tap: () => this.setState({ days: WD.map((_, i) => ({ open: i < 5, from: 540, to: 1080 })) }) },
      { label: 'Каждый день', tap: () => this.setState({ days: WD.map(() => ({ open: true, from: 540, to: 1260 })) }) },
      { label: 'Круглосуточно', tap: () => this.setState({ days: WD.map(() => ({ open: true, from: 0, to: 1440 })) }) }
    ],
    days: s.days.map((d, i) => {
      const today = i === TODAY;
      return {
        wd: WD[i], open: d.open, closed: !d.open, from: hm(d.from), to: d.to === 1440 ? '24:00' : hm(d.to),
        rowBg: today ? 'rgba(143,211,172,.06)' : 'transparent', dayInk: today ? '#8FD3AC' : '#EEF3EF',
        fromMinus: () => upd(i, { from: Math.max(0, d.from - 30) }), toPlus: () => upd(i, { to: Math.min(1440, d.to + 30) }),
        fromLabel: WD[i] + ': открываться на полчаса раньше', toLabel: WD[i] + ': закрываться на полчаса позже',
        toggle: () => upd(i, { open: !d.open }), toggleLabel: WD[i] + (d.open ? ': рабочий день' : ': выходной'),
        track: d.open ? '#3F9A6C' : 'rgba(255,255,255,.14)', knob: d.open ? '21px' : '3px', knobBg: d.open ? '#EEF3EF' : '#9AA59F'
      };
    }),
    editAddr: () => this.toastMsg('Откроется карта', 'map'),
    save: () => this.toastMsg('Часы и адрес сохранены', 'storefront'),
    toast: s.toast > 0, toastText: s.toastText, toastIcon: s.toastIcon
  };
}
}
</script>
</body>
</html>
