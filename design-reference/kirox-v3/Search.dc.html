<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поиск</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input::placeholder{color:#7C8781}
mark{background:rgba(143,211,172,.28);color:#EEF3EF;border-radius:4px;padding:0 2px}
@keyframes kxRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes kxCaret{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: -90px; top: -110px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(70,160,110,.16), rgba(70,160,110,0) 65%)"></div>

  <header style="position: relative; padding: 10px 12px 4px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <label style="flex-grow: 1; height: 48px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05)); border: 1px solid {{fieldBorder}}; box-shadow: inset 0 1px 0 rgba(255,255,255,.2); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; transition: border-color .3s">
      <span class="ms" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">search</span>
      <input aria-label="Поиск" placeholder="Чаты, сообщения, люди" value="{{query}}" onChange="{{onQuery}}" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #EEF3EF; font: inherit; font-size: 16px">
      <sc-if value="{{hasQuery}}" hint-placeholder-val="{{false}}"><button aria-label="Очистить" onClick="{{clearQ}}" style="width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px" aria-hidden="true">close</span></button></sc-if>
    </label>
  </header>

  <div style="position: relative; padding: 8px 16px 0; display: flex; gap: 6px; overflow: hidden">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
      <button onClick="{{t.pick}}" style="flex-shrink: 0; height: 32px; padding: 0 12px; border-radius: 16px; background: {{t.bg}}; color: {{t.color}}; font-size: 12px; font-weight: 700; transition: background .25s, color .25s">{{t.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
    <div style="position: relative; padding: 16px 16px 0">
      <div style="display: flex; align-items: center; margin-bottom: 10px"><span style="flex-grow: 1; font-size: 14px; font-weight: 800">Часто пишете</span></div>
      <div style="display: flex; gap: 12px">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
          <button onClick="{{p.pick}}" style="width: 58px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center"><span style="width: 54px; height: 54px; border-radius: 27px; background: {{p.avatar}}; color: {{p.ink}}; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.letter}}</span><span style="font-size: 11px">{{p.first}}</span></button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; margin: 20px 0 6px"><span style="flex-grow: 1; font-size: 14px; font-weight: 800">Недавние запросы</span><button style="font-size: 12px; color: #8FD3AC; font-weight: 700">Очистить</button></div>
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
        <button onClick="{{r.pick}}" style="width: 100%; height: 46px; display: flex; align-items: center; gap: 12px; color: #C9D2CC"><span class="ms" style="font-size: 20px; color: #8A958F" aria-hidden="true">history</span><span style="flex-grow: 1; font-size: 15px">{{r.q}}</span><span class="ms" style="font-size: 18px; color: #8A958F" aria-hidden="true">north_west</span></button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{hasQuery}}" hint-placeholder-val="{{false}}">
    <div style="position: relative; padding: 12px 12px 0">
      <sc-if value="{{showChats}}" hint-placeholder-val="{{true}}">
        <div style="padding: 0 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Чаты и люди · {{chatCount}}</div>
        <sc-for list="{{chatHits}}" as="c" hint-placeholder-count="2">
          <div style="height: 58px; padding: 0 4px; display: flex; align-items: center; gap: 12px; animation: kxRise .3s ease both">
            <span style="width: 44px; height: 44px; border-radius: 22px; background: {{c.avatar}}; color: {{c.ink}}; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.letter}}</span>
            <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600">{{c.pre}}<mark>{{c.hit}}</mark>{{c.post}}</span><span style="display: block; font-size: 12px; color: #8A958F">{{c.sub}}</span></span>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{showMsgs}}" hint-placeholder-val="{{true}}">
        <div style="padding: 10px 4px 6px; font-size: 13px; font-weight: 800; color: #8FD3AC">Сообщения · {{msgCount}}</div>
        <sc-for list="{{msgHits}}" as="m" hint-placeholder-count="3">
          <div style="padding: 8px 4px; display: flex; gap: 12px; animation: kxRise .3s ease both">
            <span style="width: 44px; height: 44px; border-radius: 22px; background: {{m.avatar}}; color: {{m.ink}}; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{m.letter}}</span>
            <span style="flex-grow: 1; min-width: 0"><span style="display: flex; font-size: 14px; font-weight: 600"><span style="flex-grow: 1">{{m.chat}}</span><span style="font-size: 11px; font-weight: 500; color: #8A958F">{{m.when}}</span></span><span style="display: block; font-size: 13px; color: #C9D2CC; line-height: 18px">{{m.pre}}<mark>{{m.hit}}</mark>{{m.post}}</span></span>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{nothing}}" hint-placeholder-val="{{false}}">
        <div style="padding: 50px 20px; text-align: center; color: #8A958F"><span class="ms" style="display: block; font-size: 44px; color: #3A4540; margin-bottom: 8px" aria-hidden="true">search_off</span>По запросу «{{query}}» ничего нет</div>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { query: '', tab: 0 }; }
split(text, q) {
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return null;
  const from = Math.max(0, i - 28);
  return { pre: (from > 0 ? '…' : '') + text.slice(from, i), hit: text.slice(i, i + q.length), post: text.slice(i + q.length) };
}
renderVals() {
  const s = this.state, q = s.query.trim().toLowerCase();
  const tabNames = ['Всё', 'Чаты', 'Сообщения', 'Медиа', 'Ссылки', 'Файлы'];
  const tabs = tabNames.map((label, i) => ({ label, bg: i === s.tab ? '#8FD3AC' : 'rgba(255,255,255,.06)', color: i === s.tab ? '#06150D' : '#C9D2CC', pick: () => this.setState({ tab: i }) }));
  const P = {
    anna: { letter: 'А', avatar: 'linear-gradient(140deg,#4B3F7A,#2A2240)', ink: '#DCD0FF' },
    max: { letter: 'М', avatar: 'linear-gradient(140deg,#2D4E73,#1A2A40)', ink: '#C6DBF5' },
    team: { letter: 'K', avatar: 'linear-gradient(140deg,#2E6B66,#18403C)', ink: '#BDEDE8' },
    ilya: { letter: 'И', avatar: 'linear-gradient(140deg,#D08A3C,#7A4A16)', ink: '#FFE9C9' },
    sveta: { letter: 'С', avatar: 'linear-gradient(140deg,#3C7BD0,#1A3A6A)', ink: '#D6E6FF' }
  };
  const chats = [
    { name: 'Анна Ким', who: 'anna', sub: '@anna · в сети' },
    { name: 'Команда kiroX', who: 'team', sub: 'Группа · 128 участников' },
    { name: 'Кино по пятницам', who: 'sveta', sub: 'Канал · 2,4 тыс. подписчиков' },
    { name: 'Максим Ли', who: 'max', sub: '@max · был(а) недавно' }
  ];
  const msgs = [
    { chat: 'Анна Ким', who: 'anna', when: '19:10', text: 'Новый фильм в «Октябре», пойдём в кино?' },
    { chat: 'Команда kiroX', who: 'team', when: 'вчера', text: 'Максим: сборка прошла, проверяйте APK на телефоне' },
    { chat: 'Илья Петров', who: 'ilya', when: 'пн', text: 'Фото с гор скинул архивом, там и кино с дрона' },
    { chat: 'Света Орлова', who: 'sveta', when: '12 нояб.', text: 'Билеты в кино на субботу уже купила' }
  ];
  const chatHits = q ? chats.map(c => { const sp = this.split(c.name, q); return sp && Object.assign({}, P[c.who], sp, { sub: c.sub }); }).filter(Boolean) : [];
  const msgHits = q ? msgs.map(m => { const sp = this.split(m.text, q); return sp && Object.assign({}, P[m.who], sp, { chat: m.chat, when: m.when }); }).filter(Boolean) : [];
  const showChats = (s.tab === 0 || s.tab === 1) && chatHits.length > 0;
  const showMsgs = (s.tab === 0 || s.tab === 2) && msgHits.length > 0;
  const people = ['anna', 'max', 'team', 'ilya', 'sveta'].map((k, i) => Object.assign({}, P[k], { first: ['Анна', 'Максим', 'kiroX', 'Илья', 'Света'][i], pick: () => this.setState({ query: ['Анна', 'Максим', 'kiroX', 'Илья', 'Света'][i] }) }));
  const recent = ['кино', 'сборка', 'билеты', 'фото с гор'].map(r => ({ q: r, pick: () => this.setState({ query: r }) }));
  return {
    tabs, people, recent, chatHits, msgHits, showChats, showMsgs,
    chatCount: chatHits.length, msgCount: msgHits.length,
    query: s.query, hasQuery: !!q, idle: !q,
    nothing: !!q && !showChats && !showMsgs,
    fieldBorder: q ? 'rgba(143,211,172,.45)' : 'rgba(255,255,255,.16)',
    onQuery: (e) => this.setState({ query: e.target.value }),
    clearQ: () => this.setState({ query: '' })
  };
}
}
</script>
</body>
</html>
