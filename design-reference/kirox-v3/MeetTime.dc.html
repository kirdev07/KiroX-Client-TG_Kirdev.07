<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Когда встречаемся</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxPop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes kxCrown{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-3px) rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Выпускники 2018</div><div style="font-size: 12px; color: #9AA59F">12 участников</div></div>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px">
    <div style="padding: 14px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); border: 1px solid rgba(255,255,255,.1)">
      <div style="display: flex; align-items: center; gap: 8px"><span class="ms fill" style="color: #8FD3AC" aria-hidden="true">event_available</span><span style="flex: 1; font-size: 16px; font-weight: 800">Встреча выпускников</span></div>
      <div style="margin-top: 2px; font-size: 12px; color: #9AA59F">Опрос Telegram · Олег · отметьте все удобные дни</div>

      <!-- Grid -->
      <div style="margin-top: 14px; display: grid; grid-template-columns: 52px repeat(4, 1fr); gap: 4px; align-items: center">
        <span></span>
        <sc-for list="{{days}}" as="d" hint-placeholder-count="4"><span style="text-align: center; font-size: 11px; color: #9AA59F; line-height: 1.2"><b style="display: block; font-size: 13px; color: #EEF3EF">{{d.n}}</b>{{d.w}}</span></sc-for>
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="20">
          <button onClick="{{c.tap}}" aria-label="{{c.aria}}" style="position: relative; height: 46px; border-radius: 12px; background: {{c.bg}}; border: 2px solid {{c.bd}}; color: {{c.ink}}; font-size: {{c.fs}}; font-weight: {{c.fw}}; display: flex; align-items: center; justify-content: {{c.jc}}; transition: background .2s, border-color .2s; animation: {{c.anim}}">{{c.n}}<span class="ms fill" style="position: absolute; top: -9px; right: -5px; font-size: 16px; color: #E8B04A; opacity: {{c.bestOp}}; animation: kxCrown 2s ease-in-out 2" aria-hidden="true">workspace_premium</span></button>
        </sc-for>
      </div>
      <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #8A958F">
        <span style="width: 14px; height: 14px; border-radius: 4px; border: 2px solid #8FD3AC"></span>Вы
        <span style="margin-left: 8px; width: 14px; height: 14px; border-radius: 4px; background: rgba(143,211,172,.15)"></span>
        <span style="width: 14px; height: 14px; border-radius: 4px; background: rgba(143,211,172,.45)"></span>
        <span style="width: 14px; height: 14px; border-radius: 4px; background: rgba(143,211,172,.8)"></span>больше людей
      </div>
    </div>

    <!-- Best -->
    <div style="margin-top: 12px; padding: 14px; border-radius: 22px; background: linear-gradient(150deg, rgba(232,176,74,.16), rgba(255,255,255,.03)); border: 1px solid rgba(232,176,74,.3); display: flex; align-items: center; gap: 12px; animation: kxIn .3s ease both">
      <span class="ms fill" style="font-size: 32px; color: #E8B04A" aria-hidden="true">workspace_premium</span>
      <span style="flex: 1"><span style="display: block; font-size: 12px; color: #E4D3B0">Удобнее всего</span><span style="display: block; font-size: 16px; font-weight: 800">{{bestText}}</span><span style="display: block; font-size: 12px; color: #9AA59F">{{bestWho}}</span></span>
    </div>
    <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px">
      <span style="display: flex">
        <sc-for list="{{voted}}" as="v" hint-placeholder-count="6"><span style="width: 28px; height: 28px; border-radius: 14px; margin-left: {{v.ml}}; background: {{v.c}}; border: 2px solid #0A0C0B; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{v.l}}</span></sc-for>
      </span>
      <span style="font-size: 13px; color: #C9D2CC">{{votedText}}</span>
    </div>
  </div>

  <div style="padding: 10px 16px 20px; display: flex; gap: 8px">
    <button onClick="{{clear}}" style="height: 52px; padding: 0 16px; border-radius: 26px; background: rgba(255,255,255,.07); font-size: 14px; font-weight: 700">Сбросить</button>
    <button onClick="{{fix}}" style="flex: 1; height: 52px; border-radius: 26px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms fill" style="font-size: 20px" aria-hidden="true">event</span>{{fixText}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const DAYS = [['Пт', '27'], ['Сб', '28'], ['Вс', '29'], ['Пт', '4 дек']];
const TIMES = ['12:00', '15:00', '18:00', '20:00'];
// base votes from others [time][day]
const BASE = [[0, 4, 3, 0], [1, 6, 5, 1], [3, 8, 4, 2], [5, 5, 2, 4]];
const PEOPLE = [['О', '#9AA59F'], ['М', '#E8B04A'], ['А', '#F07AA0'], ['Д', '#6FA9D8'], ['Е', '#B39DDB'], ['Л', '#C0443C']];
const DLONG = ['пятницу, 27 ноября', 'субботу, 28 ноября', 'воскресенье, 29 ноября', 'пятницу, 4 декабря'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mine: { '2-1': true }, fixed: false, pop: '' }; }
renderVals() {
  const s = this.state;
  const cnt = (t, d) => BASE[t][d] + (s.mine[t + '-' + d] ? 1 : 0);
  let best = [0, 0], bv = -1;
  TIMES.forEach((_, t) => DAYS.forEach((__, d) => { const v = cnt(t, d); if (v > bv) { bv = v; best = [t, d]; } }));
  const cells = [];
  TIMES.forEach((time, t) => {
    cells.push({ n: time, bg: 'transparent', bd: 'transparent', ink: '#9AA59F', fs: '12px', fw: '500', jc: 'flex-start', bestOp: '0', anim: 'none', aria: time, tap: () => {} });
    DAYS.forEach((_, d) => {
      const k = t + '-' + d, v = cnt(t, d), mine = !!s.mine[k];
      const a = v === 0 ? 0 : Math.min(.85, .12 + v * .08);
      cells.push({
        n: v ? String(v) : '', fs: '12px', fw: '800', jc: 'center',
        bg: v ? 'rgba(143,211,172,' + a.toFixed(2) + ')' : 'rgba(255,255,255,.04)', bd: mine ? '#8FD3AC' : 'transparent', ink: a > .5 ? '#06150D' : '#EEF3EF',
        bestOp: t === best[0] && d === best[1] && bv > 0 ? '1' : '0',
        anim: s.pop === k ? 'kxPop .25s ease both' : 'none',
        aria: DAYS[d][0] + ' ' + DAYS[d][1] + ', ' + time + ': ' + v + (mine ? ', вы отметили' : ''),
        tap: () => this.setState({ mine: { ...s.mine, [k]: !mine }, pop: k, fixed: false })
      });
    });
  });
  const myN = Object.values(s.mine).filter(Boolean).length;
  return {
    days: DAYS.map(([w, n]) => ({ w, n })),
    cells,
    bestText: 'В ' + DLONG[best[1]] + ', ' + TIMES[best[0]], bestWho: 'Могут ' + bv + ' из 12' + (s.mine[best.join('-')] ? ', и вы тоже' : ''),
    voted: PEOPLE.map(([l, c], i) => ({ l, c, ml: i ? '-8px' : '0' })),
    votedText: (myN ? 9 : 8) + ' из 12 уже ответили',
    clear: () => this.setState({ mine: {}, fixed: false }),
    fixText: s.fixed ? 'Встреча назначена ✓' : 'Назначить на ' + DAYS[best[1]][0].toLowerCase() + ' ' + DAYS[best[1]][1] + ', ' + TIMES[best[0]],
    fix: () => this.setState({ fixed: true })
  };
}
}
</script>
</body>
</html>
