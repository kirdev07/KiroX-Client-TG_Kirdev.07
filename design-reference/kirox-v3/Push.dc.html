<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Уведомления</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
input::placeholder{color:#8A958F}
@keyframes kxDrop{from{transform:translateY(-130%)}to{transform:none}}
@keyframes kxIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes kxOut{to{opacity:0;transform:translateX(120%);height:0;margin:0;padding:0}}
@keyframes kxToast{0%{opacity:0;transform:translateY(16px)}12%,85%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: linear-gradient(170deg, #1B2E25 0%, #0D1411 55%, #070908 100%); color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <!-- status bar + clock -->
  <div style="padding: 14px 20px 0; display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #C9D2CC"><span>15:42</span><span style="display: flex; gap: 6px; align-items: center"><span class="ms fill" style="font-size: 16px" aria-hidden="true">signal_cellular_alt</span><span class="ms fill" style="font-size: 16px" aria-hidden="true">wifi</span><span class="ms fill" style="font-size: 16px" aria-hidden="true">battery_5_bar</span></span></div>
  <div style="padding: 18px 20px 6px">
    <div style="font-size: 56px; font-weight: 300; line-height: 1; letter-spacing: -1px">15:42</div>
    <div style="margin-top: 6px; font-size: 15px; color: #C9D2CC">Воскресенье, 22 ноября</div>
  </div>

  <!-- Notifications -->
  <div style="padding: 14px 12px 0; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="border-radius: 26px; background: rgba(22,28,25,.82); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); border: 1px solid rgba(255,255,255,.08); overflow: hidden; animation: {{g.anim}}">
        <button onClick="{{g.toggle}}" style="width: 100%; padding: 12px 14px 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9AA59F">
          <span style="width: 18px; height: 18px; border-radius: 6px; background: linear-gradient(140deg, #6FC497, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 12px" aria-hidden="true">chat_bubble</span></span>
          <span style="font-weight: 700; color: #C9D2CC">kiroX</span><span>·</span><span>{{g.time}}</span>
          <span style="flex: 1"></span>
          <span class="ms" style="font-size: 20px; transform: rotate({{g.rot}}); transition: transform .25s" aria-hidden="true">expand_more</span>
        </button>
        <div style="padding: 8px 14px 12px; display: flex; gap: 12px">
          <span style="width: 42px; height: 42px; border-radius: {{g.shape}}; background: {{g.av}}; color: {{g.ink}}; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{g.init}}</span>
          <div style="flex: 1; min-width: 0">
            <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 15px; font-weight: 800">{{g.title}}</span><sc-if value="{{g.hasCount}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #8FD3AC; font-weight: 700">{{g.count}}</span></sc-if></div>
            <sc-if value="{{g.collapsed}}" hint-placeholder-val="{{true}}"><div style="margin-top: 2px; font-size: 14px; color: #C9D2CC; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{g.last}}</div></sc-if>
            <sc-if value="{{g.open}}" hint-placeholder-val="{{false}}">
              <div style="margin-top: 4px; display: flex; flex-direction: column; gap: 4px">
                <sc-for list="{{g.lines}}" as="l" hint-placeholder-count="3"><div style="font-size: 14px; line-height: 19px; color: #C9D2CC; animation: kxIn .25s ease both"><sc-if value="{{l.hasWho}}" hint-placeholder-val="{{false}}"><b style="color: #EEF3EF">{{l.who}}: </b></sc-if>{{l.text}}</div></sc-for>
              </div>
            </sc-if>
          </div>
        </div>
        <sc-if value="{{g.open}}" hint-placeholder-val="{{false}}">
          <div style="padding: 0 10px 12px">
            <sc-if value="{{g.replying}}" hint-placeholder-val="{{false}}">
              <div style="height: 44px; border-radius: 22px; background: rgba(255,255,255,.08); display: flex; align-items: center; padding: 0 4px 0 14px; animation: kxIn .2s ease both">
                <input aria-label="Ответ" placeholder="{{g.replyHint}}" value="{{g.draft}}" onInput="{{g.onDraft}}" style="flex: 1; font-size: 14px">
                <button onClick="{{g.send}}" aria-label="Отправить" style="width: 36px; height: 36px; border-radius: 18px; background: #8FD3AC; color: #06150D; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 18px" aria-hidden="true">send</span></button>
              </div>
            </sc-if>
            <sc-if value="{{g.actions}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; gap: 6px">
                <button onClick="{{g.reply}}" style="flex: 1; height: 38px; border-radius: 19px; background: rgba(143,211,172,.14); color: #8FD3AC; font-size: 13px; font-weight: 700; text-align: center">Ответить</button>
                <button onClick="{{g.read}}" style="flex: 1; height: 38px; border-radius: 19px; background: rgba(255,255,255,.07); font-size: 13px; font-weight: 700; text-align: center">Прочитано</button>
                <button onClick="{{g.mute}}" style="flex: 1; height: 38px; border-radius: 19px; background: rgba(255,255,255,.07); font-size: 13px; font-weight: 700; text-align: center">Без звука</button>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 40px; text-align: center; font-size: 14px; color: #8A958F; animation: kxIn .3s ease both">Новых уведомлений нет<br><button onClick="{{reset}}" style="margin-top: 14px; height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 700; color: #EEF3EF">Прислать ещё</button></div>
    </sc-if>
  </div>

  <!-- in-app banner demo -->
  <sc-if value="{{banner}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 10px; right: 10px; top: 10px; padding: 10px 12px; border-radius: 22px; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,.18); box-shadow: 0 16px 40px rgba(0,0,0,.5); display: flex; align-items: center; gap: 10px; animation: kxDrop .4s cubic-bezier(.2,.9,.3,1) both">
      <span style="width: 38px; height: 38px; border-radius: 19px; background: linear-gradient(140deg,#3A6E7A,#14303A); color: #CFF4FF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">А</span>
      <div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 800">Алина</div><div style="font-size: 13px; color: #C9D2CC; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">Ты сегодня на уроке будешь?</div></div>
      <button onClick="{{hideBanner}}" aria-label="Скрыть" style="width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #9AA59F"><span class="ms" style="font-size: 18px" aria-hidden="true">close</span></button>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center">
    <button onClick="{{showBanner}}" style="height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span class="ms" style="font-size: 18px" aria-hidden="true">notifications_active</span>Баннер внутри приложения</button>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 24px; right: 24px; bottom: 82px; height: 44px; border-radius: 16px; background: #1E2622; border: 1px solid rgba(143,211,172,.25); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; animation: kxToast 2.2s ease both"><span class="ms fill" style="font-size: 20px; color: #8FD3AC" aria-hidden="true">check_circle</span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const G = [
  { id: 'anna', title: 'Анна', init: 'А', av: 'linear-gradient(140deg,#4B3F7A,#2A2240)', ink: '#DCD0FF', shape: '21px', time: 'сейчас', lines: [{ text: 'Ты где? 🙂' }, { text: 'Мы уже у кофейни' }, { text: 'Возьмёшь мне капучино?' }] },
  { id: 'course', title: 'Курс английского', init: 'К', av: 'linear-gradient(140deg,#2F6E9E,#14243A)', ink: '#CFE6FF', shape: '14px', time: '5 мин', lines: [{ who: 'Марина', text: 'Напоминаю про тест в субботу' }, { who: 'Олег', text: 'А можно перенести?' }] }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { open: 'anna', reply: '', draft: '', gone: [], leaving: '', banner: false, toast: 0, toastText: '' }; }
componentWillUnmount() { clearTimeout(this.t); clearTimeout(this.tt); clearTimeout(this.bt); }
say(t) { clearTimeout(this.tt); this.setState({ toast: Date.now(), toastText: t }); this.tt = setTimeout(() => this.setState({ toast: 0 }), 2200); }
dismiss(id, text) {
  this.setState({ leaving: id });
  clearTimeout(this.t);
  this.t = setTimeout(() => this.setState({ gone: [...this.state.gone, id], leaving: '', reply: '', draft: '' }), 350);
  this.say(text);
}
renderVals() {
  const s = this.state;
  const groups = G.filter(g => !s.gone.includes(g.id)).map(g => {
    const open = s.open === g.id;
    const replying = s.reply === g.id;
    return {
      ...g, open, collapsed: !open, rot: open ? '180deg' : '0deg',
      last: g.lines[g.lines.length - 1].text, hasCount: g.lines.length > 1, count: g.lines.length + ' новых',
      lines: g.lines.map(l => ({ who: l.who || '', hasWho: !!l.who, text: l.text })),
      anim: s.leaving === g.id ? 'kxOut .35s ease forwards' : 'kxIn .3s ease both',
      toggle: () => this.setState({ open: open ? '' : g.id, reply: '' }),
      replying, actions: !replying, replyHint: 'Ответ: ' + g.title,
      draft: s.draft, onDraft: e => this.setState({ draft: e.target.value }),
      reply: () => this.setState({ reply: g.id, draft: '' }),
      send: () => { if (s.draft.trim()) this.dismiss(g.id, 'Ответ отправлен: ' + g.title); },
      read: () => this.dismiss(g.id, 'Отмечено как прочитанное'),
      mute: () => this.dismiss(g.id, 'Без звука на 1 час')
    };
  });
  return {
    groups, empty: groups.length === 0,
    reset: () => this.setState({ gone: [], open: 'anna' }),
    banner: s.banner,
    showBanner: () => { clearTimeout(this.bt); this.setState({ banner: true }); this.bt = setTimeout(() => this.setState({ banner: false }), 3500); },
    hideBanner: () => this.setState({ banner: false }),
    toast: !!s.toast, toastText: s.toastText
  };
}
}
</script>
</body>
</html>
