<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Уведомления чата</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes kxSlash{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@keyframes kxRing{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
@keyframes kxDrop{0%{transform:translateY(-70px);opacity:0}20%{transform:translateY(0);opacity:1}80%{transform:translateY(0);opacity:1}100%{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <div style="flex: 1; min-width: 0"><h1 style="margin: 0; font-size: 20px; font-weight: 800">Уведомления</h1><div style="font-size: 12px; color: #9AA59F">Kotlin-клуб · 1 284 участника</div></div>
  </header>

  <!-- Live push preview -->
  <div style="margin: 4px 16px 0; height: 132px; position: relative; border-radius: 24px; overflow: hidden; background: radial-gradient(90% 80% at 50% 0%, rgba(63,154,108,.2), transparent 70%), #101413; border: 1px solid rgba(255,255,255,.08)">
    <div style="position: absolute; left: 0; right: 0; top: 10px; text-align: center; font-size: 11px; color: #8A958F">Экран блокировки</div>
    <sc-if value="{{showPush}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: 12px; right: 12px; top: 34px; padding: 10px 12px; border-radius: 18px; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.07)); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,.16); display: flex; gap: 10px; animation: kxDrop 3.2s ease-in-out 2">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6FC497, #3F9A6C); display: flex; align-items: center; justify-content: center; color: #06150D; font-size: 13px; font-weight: 900; flex-shrink: 0">kX</span>
        <span style="flex: 1; min-width: 0">
          <span style="display: flex; align-items: center; gap: 6px"><span style="flex: 1; font-size: 13px; font-weight: 800; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{pushTitle}}</span><span style="font-size: 11px; color: #9AA59F">сейчас</span></span>
          <span style="display: block; margin-top: 2px; font-size: 13px; color: #C9D2CC; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{pushText}}</span>
        </span>
      </div>
    </sc-if>
    <sc-if value="{{silent}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; inset: 34px 0 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #8A958F; font-size: 13px">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 6a9 9 0 0 1 9 9v6l3 5H8l3-5v-6a9 9 0 0 1 9-9z M16 30a4 4 0 0 0 8 0" fill="none" stroke="#8A958F" stroke-width="2.4" stroke-linejoin="round"></path><line x1="7" y1="7" x2="33" y2="33" stroke="#FF8A80" stroke-width="2.6" stroke-linecap="round" style="stroke-dasharray: 40; animation: kxSlash .4s ease both"></line></svg>
        {{silentText}}
      </div>
    </sc-if>
  </div>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 14px 16px 30px">
    <!-- Mute -->
    <div style="font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Без звука</div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px">
      <sc-for list="{{mutes}}" as="m" hint-placeholder-count="6"><button onClick="{{m.tap}}" aria-pressed="{{m.on}}" style="height: 46px; border-radius: 16px; background: {{m.bg}}; color: {{m.ink}}; border: 1px solid {{m.bd}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; transition: all .2s"><span class="ms" style="font-size: 17px" aria-hidden="true">{{m.icon}}</span>{{m.label}}</button></sc-for>
    </div>

    <!-- What -->
    <div style="margin-top: 16px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">О чём сообщать</div>
    <div style="padding: 4px; border-radius: 20px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; opacity: {{whatOp}}; transition: opacity .3s">
      <sc-for list="{{whats}}" as="w" hint-placeholder-count="2"><button onClick="{{w.tap}}" aria-pressed="{{w.on}}" style="padding: 10px; border-radius: 16px; background: {{w.bg}}; text-align: center; transition: all .2s"><span style="display: block; font-size: 14px; font-weight: 700; color: {{w.ink}}">{{w.label}}</span><span style="display: block; font-size: 11px; color: #8A958F">{{w.sub}}</span></button></sc-for>
    </div>

    <!-- Toggles -->
    <div style="margin-top: 14px; border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); overflow: hidden; opacity: {{whatOp}}; transition: opacity .3s">
      <button onClick="{{openSound}}" style="width: 100%; padding: 13px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.05)">
        <span class="ms" style="color: #9AA59F; animation: {{bellAnim}}; transform-origin: 50% 15%" aria-hidden="true">music_note</span>
        <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Звук</span><span style="display: block; margin-top: 2px; font-size: 12px; color: #8A958F">{{soundName}}</span></span>
        <span class="ms" style="color: #8A958F" aria-hidden="true">chevron_right</span>
      </button>
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
        <button onClick="{{o.tap}}" aria-pressed="{{o.on}}" style="width: 100%; padding: 13px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.05)">
          <span class="ms" style="color: #9AA59F" aria-hidden="true">{{o.icon}}</span>
          <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">{{o.label}}</span><span style="display: block; margin-top: 2px; font-size: 12px; color: #8A958F">{{o.sub}}</span></span>
          <span style="width: 48px; height: 28px; border-radius: 14px; background: {{o.track}}; position: relative; transition: background .2s; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{o.knob}}; width: 22px; height: 22px; border-radius: 11px; background: {{o.knobBg}}; transition: left .2s"></span></span>
        </button>
      </sc-for>
    </div>
    <button onClick="{{reset}}" style="margin-top: 12px; width: 100%; height: 46px; border-radius: 18px; font-size: 14px; font-weight: 700; color: #9AA59F; text-align: center">Как в общих настройках для групп</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const MUTES = [['Включены', 'notifications_active', 0], ['1 час', 'schedule', 1], ['8 часов', 'bedtime', 2], ['2 дня', 'date_range', 3], ['Неделю', 'calendar_month', 4], ['Навсегда', 'notifications_off', 5]];
const UNTIL = ['', 'до 19:20', 'до 02:20 ночи', 'до вторника', 'до 29 ноября', 'пока не включите'];
const SOUNDS = ['Капля', 'Стекло', 'Росток', 'Колокольчик'];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mute: 0, what: 0, preview: true, vibro: true, pinned: true, sound: 2 }; }
renderVals() {
  const s = this.state;
  const sw = v => ({ track: v ? '#3F9A6C' : 'rgba(255,255,255,.14)', knob: v ? '23px' : '3px', knobBg: v ? '#EEF3EF' : '#9AA59F' });
  const muted = s.mute > 0;
  const mention = s.what === 1;
  return {
    showPush: !muted, silent: muted, silentText: 'Без звука ' + UNTIL[s.mute],
    pushTitle: s.preview ? 'Kotlin-клуб · Дмитрий' : 'kiroX',
    pushText: !s.preview ? 'Новое сообщение' : mention ? '@kirill_dev, глянешь PR?' : 'Собираемся в субботу в 11:00',
    mutes: MUTES.map(([label, icon, i]) => { const on = s.mute === i; const red = on && i > 0; return { label, icon, on, bg: on ? (red ? 'rgba(229,83,75,.12)' : 'rgba(143,211,172,.14)') : 'rgba(255,255,255,.04)', ink: on ? (red ? '#FF8A80' : '#8FD3AC') : '#C9D2CC', bd: on ? (red ? 'rgba(229,83,75,.4)' : 'rgba(143,211,172,.45)') : 'rgba(255,255,255,.08)', tap: () => this.setState({ mute: i }) }; }),
    whatOp: muted ? '.4' : '1',
    whats: [['Все сообщения', 'Как обычно'], ['Только упоминания', '@вы и ответы вам']].map(([label, sub], i) => ({ label, sub, on: s.what === i, bg: s.what === i ? 'rgba(143,211,172,.16)' : 'transparent', ink: s.what === i ? '#8FD3AC' : '#C9D2CC', tap: () => this.setState({ what: i }) })),
    openSound: () => this.setState({ sound: (s.sound + 1) % SOUNDS.length }), soundName: SOUNDS[s.sound] + ' · нажмите, чтобы сменить',
    bellAnim: !muted ? 'kxRing 1.6s ease-in-out infinite' : 'none',
    opts: [
      { icon: 'visibility', label: 'Показывать текст', sub: 'Иначе только «Новое сообщение»', k: 'preview' },
      { icon: 'vibration', label: 'Вибрация', sub: 'Короткая, два раза', k: 'vibro' },
      { icon: 'push_pin', label: 'Закреплённые сообщения', sub: 'Сообщать, даже если звук выключен', k: 'pinned' }
    ].map(o => { const w = sw(s[o.k]); return { ...o, on: s[o.k], track: w.track, knob: w.knob, knobBg: w.knobBg, tap: () => this.setState({ [o.k]: !s[o.k] }) }; }),
    reset: () => this.setState({ mute: 0, what: 0, preview: true, vibro: true, pinned: true, sound: 2 })
  };
}
}
</script>
</body>
</html>
