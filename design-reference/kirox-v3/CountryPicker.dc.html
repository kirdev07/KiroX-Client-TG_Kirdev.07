<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выбор страны</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes kxIn2{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes kxFlash{0%{background:rgba(143,211,172,.25)}100%{background:transparent}}
@keyframes kxFlash2{0%{background:rgba(143,211,172,.25)}100%{background:transparent}}
@keyframes kxCaret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes kxBubble{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
  <!-- Login (back) -->
  <sc-if value="{{login}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; padding: 70px 24px 0; display: flex; flex-direction: column; align-items: center; animation: kxIn .3s ease both">
      <span style="width: 76px; height: 76px; border-radius: 26px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 38px" aria-hidden="true">call</span></span>
      <div style="margin-top: 16px; font-size: 22px; font-weight: 800">Ваш номер телефона</div>
      <div style="margin-top: 6px; font-size: 14px; color: #9AA59F; text-align: center">Проверьте код страны и введите номер</div>
      <button onClick="{{openList}}" style="margin-top: 26px; width: 100%; height: 58px; padding: 0 16px; border-radius: 20px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 12px; animation: {{fieldAnim}}"><span style="font-size: 26px">{{flag}}</span><span style="flex: 1"><span style="display: block; font-size: 11px; color: #8A958F">Страна</span><span style="display: block; font-size: 16px; font-weight: 700">{{country}}</span></span><span class="ms" style="color: #9AA59F" aria-hidden="true">expand_more</span></button>
      <div style="margin-top: 10px; width: 100%; height: 58px; padding: 0 16px; box-sizing: border-box; border-radius: 20px; background: rgba(255,255,255,.07); border: 1px solid rgba(143,211,172,.4); display: flex; align-items: center; gap: 10px; font-size: 18px; font-variant-numeric: tabular-nums"><span style="font-weight: 800; color: #8FD3AC">{{code}}</span><span style="width: 1px; height: 24px; background: rgba(255,255,255,.15)"></span><span style="color: #8A958F; letter-spacing: 1px">{{mask}}</span><span style="display: inline-block; width: 2px; height: 20px; background: #8FD3AC; animation: kxCaret 1s step-end infinite"></span></div>
    </div>
  </sc-if>

  <!-- Picker -->
  <sc-if value="{{list}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; animation: {{listAnim}}">
      <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
        <button onClick="{{closeList}}" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
        <div style="flex: 1; height: 46px; padding: 0 14px; border-radius: 23px; background: rgba(255,255,255,.08); border: 1px solid rgba(143,211,172,.35); display: flex; align-items: center; gap: 8px"><span class="ms" style="color: #8FD3AC" aria-hidden="true">search</span><span style="flex: 1; font-size: 15px; color: {{qInk}}">{{qText}}</span><span style="display: inline-block; width: 2px; height: 18px; background: #8FD3AC; animation: kxCaret 1s step-end infinite"></span></div>
      </header>
      <div class="scroll" style="padding: 2px 12px 6px; display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0">
        <sc-for list="{{tries}}" as="t" hint-placeholder-count="4"><button onClick="{{t.tap}}" style="flex-shrink: 0; height: 30px; padding: 0 12px; border-radius: 15px; background: {{t.bg}}; color: {{t.ink}}; font-size: 12px; font-weight: 700">{{t.t}}</button></sc-for>
      </div>
      <div style="flex: 1; min-height: 0; display: flex">
        <div class="scroll" style="flex: 1; min-height: 0; padding: 0 4px 16px 12px">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
            <div style="display: {{r.hShow}}; padding: 12px 6px 4px; font-size: 12px; font-weight: 800; color: {{r.hInk}}">{{r.h}}</div>
            <button onClick="{{r.tap}}" style="display: {{r.rowShow}}; width: 100%; min-height: 52px; padding: 0 8px; border-radius: 14px; align-items: center; gap: 12px; background: {{r.bg}}; animation: {{r.anim}}"><span style="font-size: 26px">{{r.f}}</span><span style="flex: 1; font-size: 15px; font-weight: {{r.fw}}">{{r.n}}</span><span style="font-size: 14px; color: #9AA59F; font-variant-numeric: tabular-nums">{{r.c}}</span><span class="ms fill" style="font-size: 20px; color: #8FD3AC; display: {{r.tick}}" aria-hidden="true">check_circle</span></button>
          </sc-for>
          <sc-if value="{{none}}" hint-placeholder-val="{{false}}"><div style="padding: 50px 20px; text-align: center; color: #9AA59F; font-size: 14px">Такой страны не нашли</div></sc-if>
        </div>
        <div style="width: 26px; padding: 6px 0; display: {{idxShow}}; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <sc-for list="{{letters}}" as="l" hint-placeholder-count="10"><button onClick="{{l.tap}}" aria-label="{{l.aria}}" style="width: 24px; height: 22px; border-radius: 11px; background: {{l.bg}}; color: {{l.ink}}; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{l.t}}</button></sc-for>
        </div>
      </div>
      <sc-if value="{{bubble}}" hint-placeholder-val="{{false}}"><div style="position: absolute; right: 44px; top: 50%; margin-top: -32px; width: 64px; height: 64px; border-radius: 32px 32px 6px 32px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center; animation: kxBubble .2s ease both">{{bubbleL}}</div></sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const C = [
  ['🇦🇿', 'Азербайджан', '+994', '•• ••• •• ••'], ['🇦🇲', 'Армения', '+374', '•• ••• •••'], ['🇧🇾', 'Беларусь', '+375', '•• ••• •• ••'], ['🇬🇧', 'Великобритания', '+44', '•••• ••••••'], ['🇩🇪', 'Германия', '+49', '••• ••••••••'], ['🇬🇪', 'Грузия', '+995', '••• •• •• ••'],
  ['🇪🇬', 'Египет', '+20', '•• •••• ••••'], ['🇮🇹', 'Италия', '+39', '••• ••• ••••'], ['🇰🇿', 'Казахстан', '+7', '••• ••• •• ••'], ['🇨🇳', 'Китай', '+86', '••• •••• ••••'], ['🇰🇬', 'Кыргызстан', '+996', '••• ••• •••'],
  ['🇲🇩', 'Молдова', '+373', '•••• ••••'], ['🇦🇪', 'ОАЭ', '+971', '•• ••• ••••'], ['🇷🇺', 'Россия', '+7', '••• ••• •• ••'], ['🇺🇸', 'США', '+1', '••• ••• ••••'], ['🇹🇯', 'Таджикистан', '+992', '•• ••• ••••'],
  ['🇹🇷', 'Турция', '+90', '••• ••• ••••'], ['🇺🇿', 'Узбекистан', '+998', '•• ••• •• ••'], ['🇺🇦', 'Украина', '+380', '•• ••• ••••'], ['🇫🇷', 'Франция', '+33', '• •• •• •• ••'], ['🇯🇵', 'Япония', '+81', '•• •••• ••••']
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sel: 'Казахстан', q: '', screen: 'list', jump: '', jk: 0, k: 0, bubble: '' }; }
componentWillUnmount() { clearTimeout(this.tb); }
renderVals() {
  const s = this.state;
  const q = s.q.toLowerCase();
  const filtered = C.filter(c => !q || c[1].toLowerCase().startsWith(q) || c[2].includes(q));
  const cur = C.find(c => c[1] === s.sel);
  const rows = [];
  if (!q) rows.push({ hShow: 'block', h: 'Определено по SIM-карте', hInk: '#8FD3AC', rowShow: 'flex', f: cur[0], n: cur[1], c: cur[2], fw: 800, bg: 'rgba(143,211,172,.06)', tick: 'inline-block', anim: 'none', tap: () => this.setState({ screen: 'login', k: s.k + 1 }) });
  let last = '';
  filtered.forEach(c => { const L = c[1][0]; const head = L !== last; last = L; const on = c[1] === s.sel;
    rows.push({ hShow: head ? 'block' : 'none', h: L, hInk: '#8A958F', rowShow: 'flex', f: c[0], n: c[1], c: c[2], fw: on ? 800 : 500, bg: 'transparent', tick: on ? 'inline-block' : 'none',
      anim: s.jump === L && head ? (s.jk % 2 ? 'kxFlash2' : 'kxFlash') + ' 1s ease both' : 'none',
      tap: () => this.setState({ sel: c[1], screen: 'login', k: s.k + 1 }) }); });
  const letters = [...new Set(C.map(c => c[1][0]))];
  return {
    login: s.screen === 'login', list: s.screen === 'list',
    listAnim: (s.k % 2 ? 'kxIn2' : 'kxIn') + ' .3s ease both', fieldAnim: s.k ? 'kxFlash 1s ease both' : 'none',
    flag: cur[0], country: cur[1], code: cur[2], mask: cur[3],
    openList: () => this.setState({ screen: 'list', q: '', k: s.k + 1 }), closeList: () => this.setState({ screen: 'login', k: s.k + 1 }),
    qText: s.q || 'Страна или код', qInk: s.q ? '#EEF3EF' : '#8A958F',
    tries: [['', 'Все'], ['ка', 'ка'], ['у', 'у'], ['+9', '+9'], ['+7', '+7']].map(([v, t]) => { const on = s.q === v; return { t, bg: on ? 'rgba(143,211,172,.16)' : 'rgba(255,255,255,.05)', ink: on ? '#8FD3AC' : '#C9D2CC', tap: () => this.setState({ q: v }) }; }),
    rows, none: !filtered.length,
    idxShow: q ? 'none' : 'flex',
    letters: letters.map(L => ({ t: L, aria: 'Перейти к ' + L, bg: s.jump === L ? 'rgba(143,211,172,.2)' : 'transparent', ink: s.jump === L ? '#8FD3AC' : '#9AA59F', tap: () => { clearTimeout(this.tb); this.setState({ jump: L, jk: s.jk + 1, bubble: L }); this.tb = setTimeout(() => this.setState({ bubble: '' }), 700); } })),
    bubble: !!s.bubble, bubbleL: s.bubble
  };
}
}
</script>
</body>
</html>
