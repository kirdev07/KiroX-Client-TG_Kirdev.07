<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обновление</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kxRise{0%{transform:translateY(20px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
@keyframes kxFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes kxShine{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@keyframes kxPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">close</span></button>
    <span style="flex: 1"></span>
  </header>

  <div class="scroll" style="flex: 1; min-height: 0; padding: 0 20px 120px">
    <!-- Hero -->
    <div style="position: relative; height: 200px; display: flex; align-items: center; justify-content: center" aria-hidden="true">
      <span style="position: absolute; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(111,196,151,.35), transparent 70%)"></span>
      <sc-for list="{{sparks}}" as="p" hint-placeholder-count="6"><span class="ms fill" style="position: absolute; left: {{p.x}}; bottom: 40px; font-size: {{p.s}}; color: {{p.c}}; animation: kxRise 2.6s ease-out {{p.d}} 2">{{p.i}}</span></sc-for>
      <span style="position: relative; width: 104px; height: 104px; border-radius: 32px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 38px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 50px rgba(63,154,108,.45); overflow: hidden; animation: kxFloat 4s ease-in-out 2">kX<span style="position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: kxShine 2.8s ease-in-out 2"></span></span>
    </div>
    <div style="text-align: center">
      <div style="font-size: 24px; font-weight: 800">{{title}}</div>
      <div style="margin-top: 6px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #9AA59F"><span>1.0.0-rc.1</span><span class="ms" style="font-size: 18px; color: #8FD3AC" aria-hidden="true">arrow_forward</span><span style="color: #8FD3AC; font-weight: 800">1.0.0</span></div>
      <div style="margin-top: 4px; font-size: 12px; color: #8A958F">28,4 МБ · релиз</div>
    </div>

    <!-- Progress -->
    <sc-if value="{{busy}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 18px; animation: kxIn .25s ease both">
        <div style="height: 10px; border-radius: 5px; background: rgba(255,255,255,.08); overflow: hidden"><div style="height: 100%; width: {{pct}}; border-radius: 5px; background: linear-gradient(90deg, #6FC497, #3F9A6C); transition: width .2s linear"></div></div>
        <div style="margin-top: 6px; display: flex; font-size: 12px; color: #8A958F; font-variant-numeric: tabular-nums"><span style="flex: 1">{{progText}}</span><span>{{pctText}}</span></div>
      </div>
    </sc-if>

    <!-- Changes -->
    <div style="margin-top: 20px; font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 8px">Что нового</div>
    <div style="border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); padding: 6px 14px">
      <sc-for list="{{changes}}" as="c" hint-placeholder-count="5"><div style="display: flex; gap: 12px; padding: 9px 0; align-items: flex-start"><span class="ms fill" style="font-size: 20px; color: {{c.c}}" aria-hidden="true">{{c.i}}</span><span style="flex: 1; font-size: 14px; color: #E2E9E4; line-height: 1.4">{{c.t}}</span></div></sc-for>
    </div>

    <button onClick="{{toggleAuto}}" style="margin-top: 12px; width: 100%; padding: 13px 16px; border-radius: 20px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 12px">
      <span class="ms" style="color: #9AA59F" aria-hidden="true">wifi</span>
      <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Скачивать сам по Wi-Fi</span><span style="display: block; font-size: 12px; color: #8A958F">Установить всё равно спросит вас</span></span>
      <span style="width: 48px; height: 28px; border-radius: 14px; background: {{autoTrack}}; position: relative; transition: background .2s; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{autoKnob}}; width: 22px; height: 22px; border-radius: 11px; background: {{autoKnobBg}}; transition: left .2s"></span></span>
    </button>
    <p style="margin: 12px 4px 0; font-size: 12px; line-height: 1.45; color: #8A958F">Чаты, вход и настройки сохранятся. Файл подписан тем же ключом, что и установленная версия.</p>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: linear-gradient(180deg, rgba(10,12,11,0), #0A0C0B 40%); display: flex; gap: 8px">
    <sc-if value="{{canLater}}" hint-placeholder-val="{{true}}"><button onClick="{{later}}" style="height: 54px; padding: 0 18px; border-radius: 27px; background: rgba(255,255,255,.07); font-size: 15px; font-weight: 700">Позже</button></sc-if>
    <button onClick="{{main}}" style="flex: 1; height: 54px; border-radius: 27px; background: {{mainBg}}; color: {{mainInk}}; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .25s"><span class="ms fill" aria-hidden="true">{{mainIcon}}</span>{{mainText}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CHANGES = [['palette', '#8FD3AC', 'Новый дизайн: тёмный с мягким зелёным и стеклом'], ['bolt', '#E8B04A', 'Чаты открываются быстрее, списки листаются плавнее'], ['translate', '#6FA9D8', 'Перевод сообщений и голосовые текстом'], ['shield_person', '#B39DDB', 'Инструменты для админов групп и каналов'], ['bug_report', '#FF8A80', 'Исправлены вылеты при открытии файлов']];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { phase: 'ready', prog: 0, auto: true }; }
componentWillUnmount() { clearInterval(this.iv); }
download() {
  this.setState({ phase: 'dl', prog: 0 });
  clearInterval(this.iv);
  this.iv = setInterval(() => { const p = Math.min(100, this.state.prog + 3 + Math.random() * 6); if (p >= 100) { clearInterval(this.iv); this.setState({ prog: 100, phase: 'done' }); } else this.setState({ prog: p }); }, 150);
}
renderVals() {
  const s = this.state;
  const dl = s.phase === 'dl', done = s.phase === 'done', inst = s.phase === 'inst';
  return {
    sparks: [['auto_awesome', '30%', '20px', '#8FD3AC', '0s'], ['star', '62%', '14px', '#E8B04A', '.6s'], ['auto_awesome', '45%', '16px', '#6FA9D8', '1.2s'], ['star', '70%', '18px', '#8FD3AC', '1.8s'], ['auto_awesome', '36%', '12px', '#F07AA0', '2.2s'], ['star', '55%', '12px', '#EEF3EF', '.3s']].map(([i, x, sz, c, d]) => ({ i, x, s: sz, c, d })),
    title: inst ? 'Устанавливаем…' : done ? 'Готово к установке' : dl ? 'Скачиваем обновление' : 'Вышла новая версия',
    busy: dl || done || inst, pct: s.prog + '%', pctText: Math.round(s.prog) + '%',
    progText: done || inst ? '28,4 из 28,4 МБ' : (28.4 * s.prog / 100).toFixed(1).replace('.', ',') + ' из 28,4 МБ',
    changes: CHANGES.map(([i, c, t]) => ({ i, c, t })),
    toggleAuto: () => this.setState({ auto: !s.auto }),
    autoTrack: s.auto ? '#3F9A6C' : 'rgba(255,255,255,.14)', autoKnob: s.auto ? '23px' : '3px', autoKnobBg: s.auto ? '#EEF3EF' : '#9AA59F',
    canLater: !dl && !inst, later: () => { clearInterval(this.iv); this.setState({ phase: 'ready', prog: 0 }); },
    mainText: inst ? 'Android откроет установщик' : done ? 'Установить' : dl ? 'Отменить' : 'Скачать · 28,4 МБ',
    mainIcon: done ? 'install_mobile' : dl ? 'close' : inst ? 'hourglass_top' : 'download',
    mainBg: dl || inst ? 'rgba(255,255,255,.07)' : 'linear-gradient(135deg, #6FC497, #3F9A6C)', mainInk: dl || inst ? '#C9D2CC' : '#06150D',
    main: () => { if (s.phase === 'ready') this.download(); else if (dl) { clearInterval(this.iv); this.setState({ phase: 'ready', prog: 0 }); } else if (done) this.setState({ phase: 'inst' }); else if (inst) this.setState({ phase: 'ready', prog: 0 }); }
  };
}
}
</script>
</body>
</html>
