<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Когда прочитано</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
@keyframes kxSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kxDim{from{opacity:0}to{opacity:1}}
@keyframes kxStep{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes kxLine{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes kxLift{from{transform:none}to{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06)">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: #C0443C; display: flex; align-items: center; justify-content: center; font-weight: 800">А</span>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Анна</div><div style="font-size: 12px; color: #9AA59F">в сети недавно</div></div>
  </header>

  <div style="flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
    <div style="align-self: flex-start; max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.07); font-size: 15px">Скинь адрес, где встречаемся<span style="font-size: 11px; opacity: .6; margin-left: 8px">19:31</span></div>
    <button onClick="{{open}}" aria-label="Сведения о сообщении" style="align-self: flex-end; max-width: 80%; padding: 8px 12px; border-radius: 18px 18px 6px 18px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; font-size: 15px; position: relative; z-index: 3; animation: {{lift}}">Кофейня «Зерно», Абая 52. Буду к семи ☕<span style="font-size: 11px; opacity: .7; margin-left: 8px">изм. 19:40</span><span class="ms" style="font-size: 15px; margin-left: 3px; vertical-align: -3px" aria-hidden="true">done_all</span></button>
    <div style="align-self: flex-end; font-size: 11px; color: #8A958F; display: {{hintShow}}">нажмите на сообщение</div>
  </div>
  <div style="padding: 8px 12px 16px; border-top: 1px solid rgba(255,255,255,.06)"><div style="height: 48px; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,.07); display: flex; align-items: center; font-size: 15px; color: #8A958F">Сообщение</div></div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{true}}">
    <button onClick="{{close}}" aria-label="Закрыть" style="position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: kxDim .2s ease both; z-index: 2"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 12px 18px 24px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, rgba(40,48,44,.99), rgba(18,22,20,1)); border-top: 1px solid rgba(255,255,255,.16); animation: kxSheet .35s cubic-bezier(.2,.8,.2,1) both">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 0 auto 14px"></div>
      <div style="font-size: 18px; font-weight: 800">Сведения о сообщении</div>

      <div style="margin-top: 14px; display: flex; flex-direction: column">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <div style="display: flex; gap: 12px; animation: kxStep .3s ease {{s.d}} both">
            <div style="display: flex; flex-direction: column; align-items: center; width: 32px">
              <span style="width: 32px; height: 32px; border-radius: 16px; background: {{s.bg}}; color: {{s.c}}; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 18px" aria-hidden="true">{{s.i}}</span></span>
              <span style="flex: 1; width: 2px; min-height: 14px; background: {{s.line}}; transform-origin: top; animation: kxLine .3s ease {{s.d}} both"></span>
            </div>
            <div style="flex: 1; padding: 4px 0 14px"><div style="display: flex"><span style="flex: 1; font-size: 15px; font-weight: 700; color: {{s.tink}}">{{s.t}}</span><span style="font-size: 14px; font-weight: 700; color: {{s.vink}}; font-variant-numeric: tabular-nums">{{s.v}}</span></div><div style="font-size: 12px; color: #9AA59F; display: {{s.subShow}}">{{s.sub}}</div></div>
          </div>
        </sc-for>
      </div>

      <div style="margin-top: 2px; padding: 12px 14px; border-radius: 18px; background: {{noteBg}}; border: 1px solid {{noteBd}}; display: flex; gap: 10px">
        <span class="ms" style="font-size: 20px; color: {{noteIc}}" aria-hidden="true">{{noteIcon}}</span>
        <div style="flex: 1; font-size: 13px; line-height: 1.4; color: #C9D2CC">{{note}}</div>
      </div>
      <button onClick="{{toggleMine}}" role="switch" aria-checked="{{mineOn}}" style="margin-top: 8px; width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px"><span class="ms" style="color: #9AA59F" aria-hidden="true">schedule</span><span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 700">Показывать моё время прочтения</span><span style="display: block; font-size: 12px; color: #9AA59F">Без этого вы не увидите его у других</span></span><span style="width: 46px; height: 28px; border-radius: 14px; background: {{trk}}; position: relative; transition: background .2s; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{knx}}; width: 22px; height: 22px; border-radius: 11px; background: {{knc}}; transition: left .2s"></span></span></button>
      <button onClick="{{toggleTheirs}}" style="margin-top: 2px; height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,255,255,.06); font-size: 12px; font-weight: 700; color: #9AA59F">{{theirsText}}</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sheet: true, mine: true, theirs: true };
}
renderVals() {
  const s = this.state;
  const showRead = s.mine && s.theirs;
  const green = ['rgba(143,211,172,.16)', '#8FD3AC'];
  const grey = ['rgba(255,255,255,.07)', '#9AA59F'];
  const steps = [
    { i: 'send', t: 'Отправлено', v: '19:36', col: green },
    { i: 'edit', t: 'Изменено', v: '19:40', sub: 'Было: «…Абая 50…»', col: grey },
    { i: 'done_all', t: 'Прочитано', v: showRead ? '19:42' : 'скрыто', sub: showRead ? 'через 2 минуты после правки' : (s.mine ? 'Анна скрывает время прочтения' : 'Включите показ своего времени'), col: showRead ? green : grey }
  ];
  return {
    open: () => this.setState({ sheet: true }), close: () => this.setState({ sheet: false }), sheet: s.sheet,
    lift: s.sheet ? 'kxLift .25s ease both' : 'none', hintShow: s.sheet ? 'none' : 'block',
    steps: steps.map((x, k) => ({ i: x.i, t: x.t, v: x.v, sub: x.sub || '', subShow: x.sub ? 'block' : 'none', bg: x.col[0], c: x.col[1], tink: '#EEF3EF', vink: x.v === 'скрыто' ? '#8A958F' : '#EEF3EF', line: k < steps.length - 1 ? 'rgba(255,255,255,.1)' : 'transparent', d: (k * 0.08) + 's' })),
    note: showRead ? 'Время прочтения видно в личных чатах в течение недели, если оба собеседника его показывают.' : s.mine ? 'Собеседник скрывает время прочтения — видны только две галочки.' : 'Вы скрыли своё время прочтения, поэтому не видите его и у собеседника.',
    noteIcon: showRead ? 'info' : 'visibility_off', noteIc: showRead ? '#7FB8E0' : '#E8B04A',
    noteBg: showRead ? 'rgba(127,184,224,.06)' : 'rgba(232,176,74,.06)', noteBd: showRead ? 'rgba(127,184,224,.18)' : 'rgba(232,176,74,.22)',
    toggleMine: () => this.setState({ mine: !s.mine }), toggleTheirs: () => this.setState({ theirs: !s.theirs }), theirsText: s.theirs ? 'Макет: Анна скрывает время' : 'Макет: Анна показывает время', mineOn: s.mine ? 'true' : 'false',
    trk: s.mine ? '#3F9A6C' : 'rgba(255,255,255,.14)', knc: s.mine ? '#EEF3EF' : '#9AA59F', knx: s.mine ? '21px' : '3px'
  };
}
}
</script>
</body>
</html>
