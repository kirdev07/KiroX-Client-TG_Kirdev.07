<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Слушать вместе</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.fill{font-variation-settings:'FILL' 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94)}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes kxSpin{to{transform:rotate(360deg)}}
@keyframes kxEq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes kxFloat{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-200px) scale(1.2);opacity:0}}
@keyframes kxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kxGlow{0%,100%{opacity:.5}50%{opacity:.9}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
button{position:relative}button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(100% 50% at 50% 20%, {{glow}}, transparent 70%), #0A0C0B; color: #EEF3EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column; transition: background .6s">
  <header style="padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Свернуть" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">keyboard_arrow_down</span></button>
    <div style="flex: 1; text-align: center"><div style="font-size: 12px; color: #8FD3AC; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #8FD3AC; animation: kxGlow 1.4s ease-in-out 2"></span>Слушаем вместе</div><div style="font-size: 14px; font-weight: 800">Семья</div></div>
    <button aria-label="Пригласить" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">person_add</span></button>
  </header>
  <div role="note" style="margin: 0 12px 6px; padding: 10px 12px; border-radius: 14px; background: rgba(232,176,74,.1); border: 1px solid rgba(232,176,74,.35); display: flex; gap: 8px; font-size: 12px; line-height: 17px; color: #F2D9A6"><span class="ms" style="font-size: 18px; color: #E8B04A" aria-hidden="true">construction</span><span>Идея, не решено. В Telegram нет протокола «слушать синхронно», нужен свой сервер kiroX. Без него — только «поделиться треком».</span></div>

  <!-- Vinyl -->
  <div style="position: relative; display: flex; justify-content: center; padding-top: 14px">
    <div style="position: relative; width: 230px; height: 230px">
      <span style="position: absolute; inset: 0; border-radius: 50%; background: repeating-radial-gradient(circle, #141816 0 2px, #0B0E0C 2px 4px); box-shadow: 0 20px 50px rgba(0,0,0,.6); animation: kxSpin 4s linear infinite; animation-play-state: {{spin}}" aria-hidden="true"></span>
      <span style="position: absolute; left: 50%; top: 50%; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: {{cover}}; display: flex; align-items: center; justify-content: center; animation: kxSpin 4s linear infinite; animation-play-state: {{spin}}" aria-hidden="true"><span class="ms fill" style="font-size: 40px; color: rgba(255,255,255,.85)">{{coverIcon}}</span></span>
      <span style="position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 6px; background: #0A0C0B" aria-hidden="true"></span>
      <sc-for list="{{floats}}" as="f" hint-placeholder-count="4"><span style="position: absolute; left: {{f.x}}; bottom: 10px; font-size: 26px; animation: kxFloat 2.2s ease-out both; pointer-events: none" data-k="{{f.k}}">{{f.e}}</span></sc-for>
    </div>
  </div>

  <div style="padding: 18px 24px 0; text-align: center">
    <div style="font-size: 20px; font-weight: 800">{{title}}</div>
    <div style="margin-top: 2px; font-size: 14px; color: #9AA59F">{{artist}}</div>
  </div>
  <div style="padding: 14px 24px 0">
    <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,.15)"><div style="height: 100%; width: {{prog}}; border-radius: 2px; background: #8FD3AC; transition: width 1s linear"></div></div>
    <div style="margin-top: 6px; display: flex; font-size: 11px; color: #8A958F; font-variant-numeric: tabular-nums"><span style="flex: 1">{{cur}}</span><span>{{dur}}</span></div>
  </div>
  <div style="padding: 6px 24px 0; display: flex; align-items: center; justify-content: center; gap: 24px">
    <button onClick="{{prev}}" aria-label="Предыдущий трек" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 30px" aria-hidden="true">skip_previous</span></button>
    <button onClick="{{toggle}}" aria-label="{{playLabel}}" style="width: 68px; height: 68px; border-radius: 34px; background: linear-gradient(135deg, #6FC497, #3F9A6C); color: #06150D; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(63,154,108,.4)"><span class="ms fill" style="font-size: 38px" aria-hidden="true">{{playIcon}}</span></button>
    <button onClick="{{next}}" aria-label="Следующий трек" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 30px" aria-hidden="true">skip_next</span></button>
  </div>

  <!-- Listeners -->
  <div style="margin: 12px 16px 0; padding: 10px 12px; border-radius: 18px; background: rgba(255,255,255,.05); display: flex; align-items: center; gap: 10px">
    <span style="display: flex">
      <sc-for list="{{listeners}}" as="l" hint-placeholder-count="4"><span style="position: relative; width: 32px; height: 32px; border-radius: 16px; margin-left: {{l.ml}}; background: {{l.c}}; border: 2px solid #121614; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{l.l}}</span></sc-for>
    </span>
    <span style="flex: 1; font-size: 13px; color: #C9D2CC">{{listenText}}</span>
    <span style="display: flex; align-items: flex-end; gap: 2px; height: 16px" aria-hidden="true"><span style="width: 3px; height: 16px; border-radius: 2px; background: #8FD3AC; transform-origin: bottom; animation: kxEq .8s ease-in-out infinite; animation-play-state: {{spin}}"></span><span style="width: 3px; height: 16px; border-radius: 2px; background: #8FD3AC; transform-origin: bottom; animation: kxEq .8s ease-in-out .2s infinite; animation-play-state: {{spin}}"></span><span style="width: 3px; height: 16px; border-radius: 2px; background: #8FD3AC; transform-origin: bottom; animation: kxEq .8s ease-in-out .4s infinite; animation-play-state: {{spin}}"></span></span>
  </div>

  <!-- Reactions -->
  <div style="margin: 10px 16px 0; display: flex; gap: 6px; justify-content: center">
    <sc-for list="{{reacts}}" as="r" hint-placeholder-count="5"><button onClick="{{r.tap}}" aria-label="{{r.label}}" style="width: 52px; height: 44px; border-radius: 16px; background: rgba(255,255,255,.06); font-size: 22px; text-align: center">{{r.e}}</button></sc-for>
  </div>

  <!-- Queue -->
  <div class="scroll" style="flex: 1; min-height: 0; margin-top: 12px; padding: 0 16px 20px">
    <div style="font-size: 13px; font-weight: 700; color: #8FD3AC; padding: 0 4px 6px">Дальше в очереди</div>
    <sc-for list="{{queue}}" as="q" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 6px 4px; animation: kxIn .25s ease both">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: {{q.cover}}; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 20px; color: rgba(255,255,255,.8)" aria-hidden="true">{{q.icon}}</span></span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 700">{{q.t}}</span><span style="display: block; font-size: 12px; color: #8A958F">{{q.a}} · {{q.by}}</span></span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TRACKS = [
  { t: 'Летний вечер', a: 'Лунный кот', d: 214, cover: 'linear-gradient(135deg, #F2B866, #C0443C)', icon: 'wb_twilight', glow: 'rgba(242,184,102,.25)', by: 'Лиза' },
  { t: 'Горы зовут', a: 'Эхо Медеу', d: 186, cover: 'linear-gradient(135deg, #6FA9D8, #2F6E9E)', icon: 'landscape', glow: 'rgba(111,169,216,.25)', by: 'Папа' },
  { t: 'Дачный джаз', a: 'Трио «Сад»', d: 245, cover: 'linear-gradient(135deg, #8FD3AC, #3F9A6C)', icon: 'piano', glow: 'rgba(143,211,172,.28)', by: 'Мама' },
  { t: 'Ночной трамвай', a: 'Город спит', d: 198, cover: 'linear-gradient(135deg, #B39DDB, #6A4C9C)', icon: 'tram', glow: 'rgba(179,157,219,.25)', by: 'Вы' }
];
const L = [['Я', '#3F9A6C'], ['М', '#B07A2E'], ['П', '#2F6E9E'], ['Л', '#C0443C']];
const R = [['❤️', 'Нравится'], ['🔥', 'Огонь'], ['💃', 'Танцую'], ['😂', 'Смешно'], ['🎶', 'Подпеваю']];
const mmss = t => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0, t: 42, playing: true, floats: [], n: 0 }; }
componentDidMount() {
  this.iv = setInterval(() => { const s = this.state; if (!s.playing) return; const tr = TRACKS[s.i]; if (s.t + 1 >= tr.d) this.setState({ i: (s.i + 1) % TRACKS.length, t: 0 }); else this.setState({ t: s.t + 1 }); }, 1000);
  this.ir = setInterval(() => { if (this.state.playing && Math.random() < .5) this.react(R[Math.floor(Math.random() * R.length)][0], false); }, 2600);
}
componentWillUnmount() { clearInterval(this.iv); clearInterval(this.ir); }
react(e) { const n = this.state.n + 1; const f = { e, k: n, x: (30 + Math.random() * 150) + 'px' }; this.setState({ n, floats: this.state.floats.length > 40 ? [f] : [...this.state.floats, f] }); }
renderVals() {
  const s = this.state;
  const tr = TRACKS[s.i];
  return {
    glow: tr.glow, cover: tr.cover, coverIcon: tr.icon, title: tr.t, artist: tr.a,
    spin: s.playing ? 'running' : 'paused',
    floats: s.floats.map(f => ({ e: f.e, k: String(f.k), x: f.x })),
    prog: (s.t / tr.d * 100) + '%', cur: mmss(s.t), dur: mmss(tr.d),
    toggle: () => this.setState({ playing: !s.playing }), playIcon: s.playing ? 'pause' : 'play_arrow', playLabel: s.playing ? 'Пауза для всех' : 'Играть для всех',
    prev: () => this.setState({ i: (s.i + TRACKS.length - 1) % TRACKS.length, t: 0 }),
    next: () => this.setState({ i: (s.i + 1) % TRACKS.length, t: 0 }),
    listeners: L.map(([l, c], k) => ({ l, c, ml: k ? '-8px' : '0' })),
    listenText: s.playing ? 'Слушают 4 · звук синхронно' : 'Пауза — у всех сразу',
    reacts: R.map(([e, label]) => ({ e, label, tap: () => this.react(e) })),
    queue: [1, 2, 3].map(k => TRACKS[(s.i + k) % TRACKS.length]).map(q => ({ t: q.t, a: q.a, cover: q.cover, icon: q.icon, by: q.by === 'Вы' ? 'добавили вы' : 'в очередь: ' + q.by }))
  };
}
}
</script>
</body>
</html>
